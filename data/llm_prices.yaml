# Model prices for the AI usage log's cost numbers (scripts/pilot_report.py).
#
# !! ENTERED FROM MEMORY on 2026-10-03, not checked against the providers'
# !! pricing pages. Verify every number here before quoting a cost in the pitch.
#
# Prices are US dollars per 1 million tokens. A model is matched by the longest
# key its name contains, so "gemini/gemini-2.5-flash-lite" is flash-lite, not
# flash. A model not listed (free models through OmniRoute, say) has no actual
# cost; the report also shows what every call would have cost on
# `reference_model`, the paid key the user plans to buy.

usd_to_inr: 88
reference_model: gemini-2.5-flash

models:
  gemini-2.5-flash: { input: 0.30, output: 2.50 }
  gemini-2.5-flash-lite: { input: 0.10, output: 0.40 }
  gemini-2.5-pro: { input: 1.25, output: 10.00 }
