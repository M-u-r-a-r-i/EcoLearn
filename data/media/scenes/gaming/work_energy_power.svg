<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A gaming desk at night: a monitor shows a side-view physics sandbox in which a compressed spring launcher fires a ball along the ground, a kart runs upside down around the top of a loop with its velocity along the track and the track push and weight both pointing to the centre, and a crate is dragged by a rope at an angle; a force-feedback racing wheel stands beside the monitor and a controller lies on the desk</title>
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2a4d"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#room)"/>
  <ellipse cx="320" cy="180" rx="360" ry="180" fill="url(#glow)"/>

  <!-- monitor -->
  <rect x="60" y="36" width="520" height="290" rx="8" fill="#020617" stroke="#475569" stroke-width="4"/>
  <rect x="72" y="48" width="496" height="266" fill="url(#sky)"/>

  <!-- ground -->
  <rect x="72" y="272" width="496" height="42" fill="#1f2937"/>
  <rect x="72" y="272" width="496" height="3" fill="#22c55e"/>

  <!-- HUD -->
  <rect x="86" y="58" width="136" height="44" rx="5" fill="#020617" opacity="0.85"/>
  <text x="96" y="76" font-size="13" fill="#fbbf24" font-weight="700" font-family="Consolas, monospace">PHYSICS SANDBOX</text>
  <text x="96" y="94" font-size="13" fill="#4ade80" font-weight="700" font-family="Consolas, monospace">60 FPS</text>
  <rect x="430" y="58" width="122" height="36" rx="5" fill="#020617" opacity="0.85"/>
  <text x="440" y="74" font-size="11" fill="#e2e8f0" font-weight="700" font-family="Consolas, monospace">ENERGY</text>
  <rect x="440" y="80" width="102" height="8" rx="4" fill="#1e293b"/>
  <rect x="440" y="80" width="68" height="8" rx="4" fill="#38bdf8"/>

  <!-- spring launcher -->
  <rect x="84" y="240" width="10" height="34" fill="#94a3b8"/>
  <polyline points="94,257 100,246 108,268 116,246 124,268 130,257" fill="none" stroke="#a78bfa" stroke-width="4"/>
  <rect x="130" y="242" width="8" height="30" fill="#94a3b8"/>
  <circle cx="150" cy="257" r="9" fill="#fbbf24" stroke="#fde68a" stroke-width="2"/>
  <line x1="164" y1="257" x2="196" y2="257" stroke="#2563eb" stroke-width="4"/>
  <polygon points="196,250 210,257 196,264" fill="#2563eb"/>
  <text x="188" y="246" font-size="12" fill="#bfdbfe" font-weight="700" text-anchor="middle">v</text>
  <text x="140" y="300" font-size="11" fill="#e2e8f0" text-anchor="middle">spring: stored energy</text>

  <!-- loop, centre (300, 222), radius 50, bottom on the ground -->
  <circle cx="300" cy="222" r="50" fill="none" stroke="#64748b" stroke-width="9"/>
  <circle cx="300" cy="222" r="3" fill="#e2e8f0"/>
  <!-- kart upside down at the top of the loop -->
  <rect x="287" y="181" width="26" height="12" rx="3" fill="#dc2626" stroke="#fecaca" stroke-width="1.5"/>
  <circle cx="293" cy="177" r="3.5" fill="#0f172a"/>
  <circle cx="307" cy="177" r="3.5" fill="#0f172a"/>
  <!-- velocity at the top, pointing left -->
  <line x1="283" y1="156" x2="251" y2="156" stroke="#2563eb" stroke-width="4"/>
  <polygon points="251,149 237,156 251,163" fill="#2563eb"/>
  <text x="262" y="146" font-size="12" fill="#bfdbfe" font-weight="700" text-anchor="middle">v</text>
  <!-- track push and weight at the top, both towards the centre -->
  <line x1="300" y1="197" x2="300" y2="212" stroke="#dc2626" stroke-width="4"/>
  <polygon points="293,212 300,222 307,212" fill="#dc2626"/>
  <rect x="310" y="200" width="52" height="16" rx="3" fill="#020617" opacity="0.85"/>
  <text x="314" y="212" font-size="11" fill="#fecaca" font-weight="700">N + mg</text>
  <text x="300" y="300" font-size="11" fill="#e2e8f0" text-anchor="middle">loop: speed traded for height</text>

  <!-- crate dragged by a rope -->
  <rect x="420" y="246" width="46" height="26" fill="#b45309" stroke="#fbbf24" stroke-width="2"/>
  <line x1="420" y1="246" x2="466" y2="272" stroke="#fbbf24" stroke-width="1.2"/>
  <line x1="466" y1="246" x2="420" y2="272" stroke="#fbbf24" stroke-width="1.2"/>
  <line x1="466" y1="248" x2="508" y2="222" stroke="#dc2626" stroke-width="4"/>
  <polygon points="508,215 520,218 512,229" fill="#dc2626"/>
  <text x="528" y="218" font-size="12" fill="#fecaca" font-weight="700">F</text>
  <line x1="420" y1="286" x2="504" y2="286" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="504,282 514,286 504,290" fill="#e2e8f0"/>
  <text x="462" y="281" font-size="11" fill="#e2e8f0" text-anchor="middle">d</text>
  <text x="480" y="300" font-size="11" fill="#e2e8f0" text-anchor="middle">rope: work done</text>

  <!-- stand -->
  <rect x="300" y="326" width="40" height="24" fill="#334155"/>
  <rect x="252" y="348" width="136" height="10" rx="4" fill="#334155"/>

  <!-- force-feedback racing wheel -->
  <circle cx="686" cy="180" r="52" fill="none" stroke="#111827" stroke-width="16"/>
  <circle cx="686" cy="180" r="52" fill="none" stroke="#4b5563" stroke-width="2"/>
  <line x1="642" y1="164" x2="730" y2="164" stroke="#374151" stroke-width="10"/>
  <circle cx="686" cy="180" r="14" fill="#374151"/>
  <rect x="676" y="228" width="20" height="112" fill="#334155"/>
  <rect x="634" y="332" width="104" height="14" rx="5" fill="#334155"/>
  <text x="686" y="268" font-size="12" fill="#c7d2fe" text-anchor="middle" font-weight="600">force feedback</text>

  <!-- desk -->
  <rect x="0" y="346" width="800" height="104" fill="#3f2a1d"/>
  <rect x="0" y="346" width="800" height="8" fill="#5b3b28"/>

  <!-- controller -->
  <path d="M 96 416 Q 102 376 136 380 L 200 380 Q 234 376 240 416 Q 230 428 212 418 L 124 418 Q 106 428 96 416 z" fill="#1f2937"/>
  <circle cx="136" cy="396" r="8" fill="#475569"/>
  <circle cx="184" cy="404" r="8" fill="#475569"/>
  <g fill="#38bdf8"><circle cx="212" cy="388" r="4"/><circle cx="221" cy="397" r="4"/><circle cx="203" cy="397" r="4"/><circle cx="212" cy="406" r="4"/></g>

  <!-- notebook with a K + U sketch -->
  <rect x="380" y="374" width="150" height="58" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="396" y1="420" x2="396" y2="386" stroke="#334155" stroke-width="2"/>
  <line x1="396" y1="420" x2="514" y2="420" stroke="#334155" stroke-width="2"/>
  <line x1="396" y1="392" x2="514" y2="392" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="396" y1="416" x2="514" y2="398" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="396" y1="398" x2="514" y2="416" stroke="#16a34a" stroke-width="2.5"/>
  <text x="430" y="387" font-size="10" fill="#0f172a">K + U constant</text>
</svg>
