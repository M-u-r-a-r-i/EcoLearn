<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A night-time gaming room shown as three stages of the same physics: on the left a retro CRT cabinet cut away, with a glowing hot filament, a blue electron beam crossing the tube and a green phosphor screen; in the middle a flat monitor running a game, its light leaving the right edge drawn first as a wave and then as separate packets; on the right a camera sensor module that the packets fall on, with electrons flowing down a wire to a meter reading a few microamps; a keyboard and a wireless controller sit on the desk below</title>
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#room)"/>
  <ellipse cx="405" cy="150" rx="290" ry="160" fill="url(#glow)"/>

  <!-- ===== left: retro CRT cabinet, cut away ===== -->
  <rect x="20" y="90" width="240" height="196" rx="8" fill="#0f172a" stroke="#475569" stroke-width="3"/>
  <rect x="32" y="102" width="216" height="172" fill="#101828"/>

  <!-- tube neck and funnel -->
  <rect x="44" y="176" width="46" height="28" fill="#0b1224" stroke="#64748b" stroke-width="2"/>
  <polygon points="90,176 200,128 200,252 90,204" fill="#0b1224" stroke="#64748b" stroke-width="2"/>

  <!-- phosphor screen face -->
  <rect x="196" y="126" width="12" height="126" fill="#22c55e" opacity="0.35"/>
  <circle cx="202" cy="190" r="7" fill="#86efac"/>

  <!-- hot filament -->
  <circle cx="60" cy="190" r="14" fill="url(#hot)"/>
  <path d="M 52 190 l 4 -6 l 4 12 l 4 -12 l 4 6" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  <text x="60" y="164" font-size="9" fill="#fcd34d" text-anchor="middle">hot filament</text>

  <!-- electron beam -->
  <line x1="92" y1="190" x2="184" y2="190" stroke="#38bdf8" stroke-width="3"/>
  <polygon points="182,184 196,190 182,196" fill="#38bdf8"/>
  <text x="138" y="178" font-size="9" fill="#bae6fd" text-anchor="middle">electron beam</text>
  <text x="224" y="266" font-size="9" fill="#bbf7d0" text-anchor="middle">screen</text>

  <text x="140" y="306" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="600">retro CRT, cut away</text>
  <text x="140" y="324" font-size="11" fill="#cbd5e1" text-anchor="middle">heat frees electrons from the metal</text>

  <!-- ===== middle: flat monitor ===== -->
  <rect x="290" y="70" width="230" height="160" rx="6" fill="#020617" stroke="#475569" stroke-width="4"/>
  <rect x="300" y="80" width="210" height="140" fill="#060c1c"/>

  <text x="310" y="98" font-size="12" fill="#4ade80" font-weight="700" font-family="Consolas, monospace">60 FPS</text>
  <text x="310" y="113" font-size="10" fill="#86efac" font-family="Consolas, monospace">16.7 ms / frame</text>

  <!-- a small space scene inside the game -->
  <g fill="#e2e8f0">
    <circle cx="340" cy="150" r="1.6"/><circle cx="378" cy="176" r="1.6"/>
    <circle cx="430" cy="140" r="1.6"/><circle cx="470" cy="190" r="1.6"/>
    <circle cx="492" cy="132" r="1.6"/><circle cx="356" cy="204" r="1.6"/>
  </g>
  <polygon points="404,150 436,166 404,182" fill="#93c5fd"/>
  <rect x="386" y="152" width="18" height="28" rx="3" fill="#2563eb"/>

  <!-- stand -->
  <rect x="391" y="230" width="28" height="64" fill="#334155"/>
  <rect x="355" y="294" width="100" height="10" rx="4" fill="#334155"/>
  <text x="405" y="330" font-size="11" fill="#bfdbfe" text-anchor="middle">the screen's light leaves as photons</text>

  <!-- ===== the beam: wave on one side, packets on the other ===== -->
  <path d="M 522 150 q 6 -11 12 0 q 6 11 12 0 q 6 -11 12 0 q 6 11 12 0" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
  <g fill="#fbbf24">
    <circle cx="580" cy="150" r="4"/>
    <circle cx="592" cy="150" r="4"/>
    <circle cx="604" cy="150" r="4"/>
  </g>
  <polygon points="612,145 624,150 612,155" fill="#fbbf24"/>
  <text x="570" y="128" font-size="10" fill="#fde68a" text-anchor="middle">wave, then packets</text>

  <!-- ===== right: camera sensor and meter ===== -->
  <rect x="628" y="110" width="152" height="82" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <circle cx="650" cy="151" r="14" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="650" cy="151" r="6" fill="#334155"/>
  <rect x="678" y="133" width="90" height="36" rx="3" fill="#1f2937" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="723" y="156" font-size="12" fill="#e2e8f0" text-anchor="middle">sensor</text>
  <text x="704" y="102" font-size="11" fill="#bfdbfe" text-anchor="middle" font-weight="600">camera sensor</text>

  <!-- electrons leaving the sensor as a current -->
  <line x1="723" y1="192" x2="723" y2="238" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="717,214 729,214 723,228" fill="#2563eb"/>
  <rect x="658" y="238" width="130" height="58" rx="5" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <rect x="668" y="248" width="110" height="38" rx="3" fill="#052e2b"/>
  <text x="723" y="274" font-size="15" fill="#34d399" text-anchor="middle" font-family="Consolas, monospace">4.0 µA</text>
  <text x="712" y="318" font-size="11" fill="#bfdbfe" text-anchor="middle">photons in, electrons out</text>

  <!-- ===== desk ===== -->
  <rect x="0" y="352" width="800" height="98" fill="#3b2a1f"/>
  <rect x="0" y="352" width="800" height="8" fill="#5b3f2c"/>

  <!-- keyboard -->
  <rect x="48" y="376" width="248" height="56" rx="6" fill="#1f2937" stroke="#94a3b8" stroke-width="2"/>
  <g fill="#475569">
    <rect x="60" y="386" width="18" height="12" rx="2"/><rect x="84" y="386" width="18" height="12" rx="2"/>
    <rect x="108" y="386" width="18" height="12" rx="2"/><rect x="132" y="386" width="18" height="12" rx="2"/>
    <rect x="156" y="386" width="18" height="12" rx="2"/><rect x="180" y="386" width="18" height="12" rx="2"/>
    <rect x="204" y="386" width="18" height="12" rx="2"/><rect x="228" y="386" width="18" height="12" rx="2"/>
    <rect x="252" y="386" width="18" height="12" rx="2"/>
    <rect x="60" y="406" width="42" height="12" rx="2"/><rect x="108" y="406" width="110" height="12" rx="2"/>
    <rect x="224" y="406" width="46" height="12" rx="2"/>
  </g>

  <!-- wireless controller -->
  <g transform="translate(160,22)">
    <path d="M 214 368 q 40 -18 92 0 q 26 8 22 34 q -4 22 -26 16 q -20 -6 -42 -6 q -22 0 -42 6 q -22 6 -26 -16 q -4 -26 22 -34 z" fill="#1f2937" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="242" cy="386" r="9" fill="#374151" stroke="#9ca3af" stroke-width="1.5"/>
    <circle cx="242" cy="386" r="3" fill="#cbd5e1"/>
    <circle cx="300" cy="386" r="9" fill="#374151" stroke="#9ca3af" stroke-width="1.5"/>
    <circle cx="300" cy="386" r="3" fill="#cbd5e1"/>
    <circle cx="274" cy="404" r="6" fill="#4b5563"/>
  </g>

  <text x="660" y="394" font-size="12" fill="#e2e8f0" text-anchor="middle">light out of a screen,</text>
  <text x="660" y="414" font-size="12" fill="#e2e8f0" text-anchor="middle">electrons out of a sensor</text>
</svg>
