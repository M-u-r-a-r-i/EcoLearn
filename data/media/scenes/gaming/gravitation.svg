<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A gaming desk at night: the monitor runs an orbit simulator where a ship travels an ellipse with a planet at one focus, marked with one dot per equal slice of time, the dots spread out near the planet and bunched at the far end, with a blue velocity arrow along the path and a red pull arrow towards the planet; a tablet beside it shows a satellite holding station above one point on a planet, with a dish aimed at it; a controller and mouse rest on the desk</title>
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#2e1065"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="world" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#room)"/>
  <ellipse cx="320" cy="170" rx="350" ry="175" fill="url(#glow)"/>

  <!-- monitor: orbit simulator -->
  <rect x="80" y="40" width="440" height="252" rx="8" fill="#020617" stroke="#475569" stroke-width="4"/>
  <rect x="92" y="52" width="416" height="228" fill="#050914"/>
  <!-- stars -->
  <g fill="#e2e8f0">
    <circle cx="120" cy="210" r="1.5"/><circle cx="480" cy="80" r="1.5"/><circle cx="470" cy="264" r="1.2"/>
    <circle cx="150" cy="120" r="1.2"/><circle cx="345" cy="62" r="1.5"/><circle cx="118" cy="268" r="1.5"/>
    <circle cx="492" cy="180" r="1.2"/><circle cx="250" cy="66" r="1.2"/>
  </g>

  <!-- the orbit: ellipse centred (300,160), rx 130, ry 90; planet at the left focus (206,160) -->
  <ellipse cx="300" cy="160" rx="130" ry="90" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- planet at one focus -->
  <circle cx="206" cy="160" r="22" fill="url(#world)" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="206" y="196" font-size="11" fill="#bfdbfe" text-anchor="middle" font-weight="600">planet (at a focus)</text>

  <!-- one dot per equal slice of time: spread out near the planet, bunched at the far end -->
  <g fill="#fbbf24">
    <circle cx="430" cy="160" r="3.5"/>
    <circle cx="426" cy="182" r="3.5"/>
    <circle cx="410" cy="208" r="3.5"/>
    <circle cx="369" cy="236" r="3.5"/>
    <circle cx="300" cy="250" r="3.5"/>
    <circle cx="216" cy="229" r="3.5"/>
    <circle cx="170" cy="160" r="3.5"/>
    <circle cx="216" cy="91" r="3.5"/>
    <circle cx="369" cy="84" r="3.5"/>
    <circle cx="410" cy="112" r="3.5"/>
    <circle cx="426" cy="138" r="3.5"/>
  </g>

  <!-- the ship, at the top of the ellipse, moving to the right -->
  <polygon points="288,62 312,70 288,78 294,70" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- velocity, tangent to the path (blue) -->
  <line x1="314" y1="70" x2="352" y2="70" stroke="#2563eb" stroke-width="4"/>
  <polygon points="352,63 368,70 352,77" fill="#2563eb"/>
  <text x="340" y="59" font-size="13" fill="#bfdbfe" font-weight="700" text-anchor="middle">v</text>
  <!-- gravity, pointing at the planet's centre (red) -->
  <line x1="294" y1="79" x2="266" y2="106" stroke="#dc2626" stroke-width="4"/>
  <polygon points="257,114 264,98 271,111" fill="#dc2626"/>
  <text x="250" y="92" font-size="12" fill="#fecaca" font-weight="700" text-anchor="middle">pull</text>

  <!-- labels for the two ends -->
  <text x="150" y="141" font-size="10" fill="#fde68a" text-anchor="middle">fast here</text>
  <text x="452" y="141" font-size="10" fill="#fde68a" text-anchor="middle">slow here</text>
  <text x="300" y="272" font-size="11" fill="#fef9c3" text-anchor="middle" font-weight="600">one dot per equal slice of time</text>

  <!-- HUD -->
  <rect x="100" y="58" width="100" height="40" rx="5" fill="#020617" opacity="0.85"/>
  <text x="108" y="75" font-size="12" fill="#fbbf24" font-weight="700" font-family="Consolas, monospace">ORBIT SIM</text>
  <text x="108" y="92" font-size="12" fill="#4ade80" font-weight="700" font-family="Consolas, monospace">60 FPS</text>

  <!-- stand -->
  <rect x="285" y="292" width="30" height="34" fill="#334155"/>
  <rect x="235" y="324" width="130" height="10" rx="4" fill="#334155"/>

  <!-- tablet: a satellite holding station over one point -->
  <rect x="560" y="96" width="210" height="160" rx="12" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
  <rect x="572" y="108" width="186" height="136" rx="4" fill="#050914"/>
  <g fill="#e2e8f0">
    <circle cx="588" cy="128" r="1.4"/><circle cx="742" cy="140" r="1.4"/><circle cx="600" cy="232" r="1.2"/><circle cx="730" cy="226" r="1.2"/>
  </g>
  <text x="580" y="124" font-size="11" fill="#c4b5fd" font-weight="700" font-family="Consolas, monospace">SAT LINK</text>
  <!-- planet and its rotation -->
  <circle cx="655" cy="195" r="25" fill="url(#world)" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="655" y1="160" x2="655" y2="230" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- the orbit, in the plane of the equator -->
  <circle cx="655" cy="195" r="45" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- satellite -->
  <rect x="649" y="144" width="12" height="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <rect x="634" y="147" width="13" height="6" fill="#38bdf8"/>
  <rect x="663" y="147" width="13" height="6" fill="#38bdf8"/>
  <!-- ground station dish, aimed at the satellite -->
  <path d="M 649 170 A 8 8 0 0 1 661 170 z" fill="#facc15"/>
  <line x1="655" y1="176" x2="655" y2="170" stroke="#facc15" stroke-width="2"/>
  <line x1="655" y1="166" x2="655" y2="158" stroke="#facc15" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="655" y="253" font-size="10" fill="#fef9c3" text-anchor="middle">always over the same spot</text>
  <!-- tablet stand -->
  <rect x="646" y="326" width="28" height="40" fill="#334155"/>
  <path d="M 640 256 L 680 256 L 666 330 L 654 330 z" fill="#334155"/>

  <!-- desk -->
  <rect x="0" y="334" width="800" height="116" fill="#3f2a1d"/>
  <rect x="0" y="334" width="800" height="8" fill="#5b3b28"/>

  <!-- controller -->
  <path d="M 90 406 Q 96 366 130 370 L 194 370 Q 228 366 234 406 Q 224 418 206 408 L 118 408 Q 100 418 90 406 z" fill="#1f2937"/>
  <circle cx="130" cy="386" r="8" fill="#475569"/>
  <circle cx="178" cy="394" r="8" fill="#475569"/>
  <g fill="#a78bfa"><circle cx="206" cy="378" r="4"/><circle cx="215" cy="387" r="4"/><circle cx="197" cy="387" r="4"/><circle cx="206" cy="396" r="4"/></g>
  <path d="M 234 396 Q 280 400 300 340" fill="none" stroke="#94a3b8" stroke-width="3"/>

  <!-- mouse on a mouse pad -->
  <rect x="420" y="360" width="150" height="72" rx="8" fill="#111827"/>
  <ellipse cx="495" cy="394" rx="18" ry="25" fill="#e5e7eb"/>
  <line x1="495" y1="371" x2="495" y2="386" stroke="#64748b" stroke-width="2"/>
  <path d="M 495 369 Q 486 352 470 350" fill="none" stroke="#94a3b8" stroke-width="3"/>
</svg>
