<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A gaming desk lit by its screens: a monitor showing a ray-traced puzzle in which a laser beam reflects off a concave mirror to a bright focus; a clear water-cooling reservoir in which a tube appears snapped at the coolant line; a cut-away VR headset showing its display panel, a convex lens and rays reaching an eye; a glass prism on the desk fanning a white beam into colours; a glowing optical cable; a hand lens held over a controller circuit board; and a convex dome mirror high on the wall showing the whole room shrunk</title>
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde047" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fde047" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#room)"/>
  <ellipse cx="180" cy="150" rx="300" ry="170" fill="url(#glow)"/>

  <!-- ===== convex dome mirror high on the wall ===== -->
  <circle cx="706" cy="62" r="36" fill="#1e293b" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="706" cy="62" r="29" fill="#0f172a"/>
  <g fill="#475569">
    <rect x="688" y="60" width="10" height="7"/>
    <rect x="702" y="58" width="10" height="9"/>
    <rect x="716" y="61" width="9" height="6"/>
  </g>
  <rect x="686" y="70" width="41" height="3" fill="#334155"/>
  <text x="706" y="118" font-size="11" fill="#bfdbfe" text-anchor="middle" font-weight="600">convex dome mirror</text>
  <text x="706" y="133" font-size="10" fill="#93c5fd" text-anchor="middle">the whole room, shrunk</text>

  <!-- ===== monitor ===== -->
  <rect x="24" y="56" width="262" height="190" rx="8" fill="#020617" stroke="#475569" stroke-width="4"/>
  <rect x="34" y="66" width="242" height="170" fill="#06101f"/>

  <text x="46" y="86" font-size="12" fill="#4ade80" font-family="Consolas, monospace" font-weight="700">60 FPS</text>

  <!-- in-game concave mirror and laser rays -->
  <rect x="44" y="120" width="14" height="66" rx="2" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 236 100 Q 200 153 236 206" fill="none" stroke="#93c5fd" stroke-width="5" stroke-linecap="round"/>
  <g stroke="#f87171" stroke-width="2.5" fill="none">
    <path d="M 58 126 L 219 126 L 150 153"/>
    <path d="M 58 180 L 219 180 L 150 153"/>
  </g>
  <circle cx="150" cy="153" r="16" fill="url(#hot)"/>
  <circle cx="150" cy="153" r="4" fill="#fef08a"/>
  <text x="152" y="226" font-size="10" fill="#cbd5e1" text-anchor="middle">a curved mirror gathers the beam to one point</text>

  <!-- monitor stand -->
  <rect x="142" y="246" width="26" height="70" fill="#334155"/>
  <rect x="106" y="316" width="98" height="12" rx="4" fill="#334155"/>

  <!-- ===== desk ===== -->
  <rect x="0" y="330" width="800" height="120" fill="#3b2a1f"/>
  <rect x="0" y="330" width="800" height="7" fill="#5b3f2c"/>

  <!-- ===== water-cooling reservoir ===== -->
  <rect x="248" y="250" width="52" height="80" rx="5" fill="#0b1220" stroke="#67e8f9" stroke-width="2"/>
  <rect x="250" y="282" width="48" height="46" fill="#0ea5e9" opacity="0.35"/>
  <line x1="250" y1="282" x2="298" y2="282" stroke="#7dd3fc" stroke-width="2"/>
  <line x1="276" y1="254" x2="276" y2="282" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <line x1="265" y1="282" x2="265" y2="324" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <text x="274" y="348" font-size="10" fill="#7dd3fc" text-anchor="middle">the tube looks snapped at the coolant line</text>

  <!-- ===== VR headset, cut away ===== -->
  <rect x="316" y="90" width="132" height="108" rx="16" fill="#111827" stroke="#94a3b8" stroke-width="3"/>
  <rect x="326" y="104" width="9" height="80" rx="2" fill="#22d3ee"/>
  <path d="M 386 110 Q 404 144 386 178 Q 368 144 386 110 z" fill="#bfdbfe" opacity="0.55" stroke="#60a5fa" stroke-width="2"/>
  <g stroke="#fde047" stroke-width="2" fill="none">
    <path d="M 335 112 L 382 125 L 424 141"/>
    <path d="M 335 176 L 382 163 L 424 147"/>
  </g>
  <ellipse cx="434" cy="144" rx="10" ry="7" fill="#e2e8f0"/>
  <circle cx="434" cy="144" r="3.5" fill="#0f172a"/>
  <text x="420" y="220" font-size="11" fill="#bfdbfe" text-anchor="middle" font-weight="600">VR lens</text>
  <text x="420" y="235" font-size="10" fill="#93c5fd" text-anchor="middle">a screen a few cm away looks far and huge</text>

  <!-- ===== glass prism on the desk ===== -->
  <line x1="14" y1="386" x2="74" y2="394" stroke="#f8fafc" stroke-width="3"/>
  <path d="M 60 420 L 120 420 L 90 368 z" fill="#e0f2fe" opacity="0.5" stroke="#bae6fd" stroke-width="2"/>
  <g stroke-width="2.5" fill="none">
    <line x1="108" y1="402" x2="188" y2="382" stroke="#ef4444"/>
    <line x1="108" y1="403" x2="188" y2="390" stroke="#f59e0b"/>
    <line x1="108" y1="404" x2="188" y2="398" stroke="#22c55e"/>
    <line x1="108" y1="405" x2="188" y2="406" stroke="#3b82f6"/>
    <line x1="108" y1="406" x2="188" y2="414" stroke="#8b5cf6"/>
  </g>
  <text x="100" y="440" font-size="10" fill="#e9d5ff" text-anchor="middle">a prism fans white light into colours</text>

  <!-- ===== optical cable ===== -->
  <path d="M 316 434 C 372 410, 452 446, 516 418" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <circle cx="518" cy="417" r="11" fill="url(#hot)"/>
  <circle cx="518" cy="417" r="4" fill="#f87171"/>
  <text x="420" y="396" font-size="10" fill="#fecaca" text-anchor="middle">light trapped inside a glass thread</text>

  <!-- ===== hand lens over a controller board ===== -->
  <rect x="596" y="336" width="120" height="28" rx="3" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <g fill="#86efac">
    <rect x="606" y="344" width="10" height="6"/>
    <rect x="624" y="344" width="6" height="6"/>
    <rect x="640" y="344" width="12" height="5"/>
    <rect x="662" y="345" width="7" height="6"/>
    <rect x="680" y="344" width="11" height="6"/>
  </g>
  <g stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 5">
    <line x1="602" y1="334" x2="620" y2="296"/>
    <line x1="710" y1="334" x2="692" y2="296"/>
  </g>
  <line x1="687" y1="231" x2="728" y2="192" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
  <circle cx="656" cy="262" r="44" fill="#dbeafe" opacity="0.30" stroke="#93c5fd" stroke-width="4"/>
  <g fill="#bbf7d0">
    <rect x="626" y="254" width="30" height="16"/>
    <rect x="666" y="254" width="18" height="16"/>
  </g>
  <text x="656" y="390" font-size="10" fill="#bbf7d0" text-anchor="middle">a hand lens only gets you so far</text>
</svg>
