<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A gaming desk at night: the monitor shows an artillery game where a cannon on a hill fires a shell along a dotted curved arc towards a flag, with a launch-angle and speed readout; beside it a tablet shows a top-down minimap of a circular kart track with the kart's velocity and acceleration arrows</title>
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#room)"/>
  <ellipse cx="320" cy="170" rx="340" ry="170" fill="url(#glow)"/>

  <!-- monitor -->
  <rect x="80" y="40" width="440" height="252" rx="8" fill="#020617" stroke="#475569" stroke-width="4"/>
  <rect x="92" y="52" width="416" height="228" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#e0e7ff" opacity="0.8">
    <circle cx="260" cy="70" r="1.5"/><circle cx="330" cy="88" r="1.5"/><circle cx="400" cy="66" r="1.5"/>
    <circle cx="470" cy="96" r="1.5"/><circle cx="210" cy="96" r="1.5"/>
  </g>
  <!-- ground and hills -->
  <path d="M 92 236 Q 120 222 160 236 L 420 244 Q 460 226 508 238 L 508 280 L 92 280 z" fill="#166534"/>
  <path d="M 92 236 Q 120 222 160 236 L 420 244 Q 460 226 508 238" fill="none" stroke="#4ade80" stroke-width="4"/>
  <!-- trajectory: launched at 45 degrees from (140,228) to (460,228) -->
  <path d="M 140 228 Q 300 68 460 228" fill="none" stroke="#fde68a" stroke-width="3" stroke-dasharray="7 7"/>
  <!-- shell near the top of its arc -->
  <circle cx="300" cy="148" r="7" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <!-- cannon -->
  <g transform="translate(132 230) rotate(-45)">
    <rect x="0" y="-6" width="32" height="12" rx="3" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>
  </g>
  <circle cx="132" cy="232" r="11" fill="#475569" stroke="#0f172a" stroke-width="2"/>
  <!-- launch velocity arrow (blue) -->
  <line x1="160" y1="206" x2="192" y2="174" stroke="#2563eb" stroke-width="4"/>
  <polygon points="187,166 200,166 200,179" fill="#2563eb"/>
  <text x="168" y="178" font-size="14" fill="#bfdbfe" font-weight="700" font-style="italic">u</text>
  <!-- target flag -->
  <line x1="462" y1="196" x2="462" y2="232" stroke="#e2e8f0" stroke-width="3"/>
  <polygon points="464,197 490,204 464,211" fill="#dc2626"/>
  <!-- HUD -->
  <rect x="100" y="60" width="140" height="48" rx="5" fill="#020617" opacity="0.85"/>
  <text x="110" y="80" font-size="14" fill="#fbbf24" font-weight="700" font-family="Consolas, monospace">angle 45°</text>
  <text x="110" y="99" font-size="14" fill="#93c5fd" font-weight="700" font-family="Consolas, monospace">u = 20 m/s</text>
  <rect x="420" y="60" width="80" height="26" rx="4" fill="#020617" opacity="0.85"/>
  <text x="428" y="79" font-size="14" fill="#4ade80" font-weight="700" font-family="Consolas, monospace">60 FPS</text>
  <!-- stand -->
  <rect x="285" y="292" width="30" height="34" fill="#334155"/>
  <rect x="235" y="324" width="130" height="10" rx="4" fill="#334155"/>

  <!-- tablet with a top-down minimap of a circular track -->
  <rect x="560" y="80" width="210" height="190" rx="12" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
  <rect x="572" y="92" width="186" height="166" rx="4" fill="#f8fafc"/>
  <text x="582" y="110" font-size="12" fill="#0f172a" font-weight="700">MINIMAP: top view</text>
  <circle cx="665" cy="182" r="52" fill="none" stroke="#94a3b8" stroke-width="14"/>
  <circle cx="665" cy="182" r="52" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="665" cy="182" r="3" fill="#334155"/>
  <!-- kart at the top of the circle -->
  <rect x="656" y="124" width="18" height="12" rx="3" fill="#dc2626"/>
  <!-- velocity (blue), tangent -->
  <line x1="676" y1="130" x2="718" y2="130" stroke="#2563eb" stroke-width="3.5"/>
  <polygon points="716,124 728,130 716,136" fill="#2563eb"/>
  <text x="704" y="122" font-size="13" fill="#1d4ed8" font-weight="700" font-style="italic">v</text>
  <!-- acceleration (green), towards the centre -->
  <line x1="665" y1="138" x2="665" y2="164" stroke="#16a34a" stroke-width="3.5"/>
  <polygon points="659,162 665,174 671,162" fill="#16a34a"/>
  <text x="672" y="160" font-size="13" fill="#15803d" font-weight="700" font-style="italic">a</text>
  <rect x="646" y="310" width="28" height="24" fill="#334155"/>
  <path d="M 640 270 L 680 270 L 666 314 L 654 314 z" fill="#334155"/>

  <!-- desk -->
  <rect x="0" y="334" width="800" height="116" fill="#3f2a1d"/>
  <rect x="0" y="334" width="800" height="8" fill="#5b3b28"/>

  <!-- controller -->
  <path d="M 90 406 Q 96 366 130 370 L 194 370 Q 228 366 234 406 Q 224 418 206 408 L 118 408 Q 100 418 90 406 z" fill="#1f2937"/>
  <circle cx="130" cy="386" r="8" fill="#475569"/>
  <circle cx="178" cy="394" r="8" fill="#475569"/>
  <g fill="#38bdf8"><circle cx="206" cy="378" r="4"/><circle cx="215" cy="387" r="4"/><circle cx="197" cy="387" r="4"/><circle cx="206" cy="396" r="4"/></g>
  <path d="M 234 396 Q 280 400 300 340" fill="none" stroke="#94a3b8" stroke-width="3"/>

  <!-- mouse -->
  <rect x="420" y="360" width="150" height="72" rx="8" fill="#111827"/>
  <ellipse cx="495" cy="394" rx="18" ry="25" fill="#e5e7eb"/>
  <line x1="495" y1="371" x2="495" y2="386" stroke="#64748b" stroke-width="2"/>
  <path d="M 495 369 Q 486 352 470 350" fill="none" stroke="#94a3b8" stroke-width="3"/>
</svg>
