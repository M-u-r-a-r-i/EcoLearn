<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A gaming desk at night during a PC build: the monitor runs a field sandbox showing a positive and a negative charge with orange field arrows curving from one to the other, with dust clinging to the lower corner of the screen; a plasma globe on the desk sends glowing filaments out to the glass, one of them bending towards a reaching finger; on the desk a silver antistatic bag is being peeled open and a small yellow spark crackles to a fingertip; on the right an open PC case shows a graphics card being lowered into its slot by a hand wearing an antistatic wrist strap whose coiled lead is clipped to the metal chassis</title>
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ball" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3b0764" stop-opacity="0.15"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#room)"/>
  <ellipse cx="220" cy="150" rx="320" ry="170" fill="url(#glow)"/>

  <!-- monitor: a field sandbox -->
  <rect x="40" y="40" width="340" height="230" rx="8" fill="#020617" stroke="#475569" stroke-width="4"/>
  <rect x="52" y="52" width="316" height="206" fill="#050914"/>
  <text x="62" y="72" font-size="12" fill="#fbbf24" font-weight="700" font-family="Consolas, monospace">FIELD SANDBOX</text>

  <!-- the two charges -->
  <circle cx="150" cy="160" r="15" fill="#dc2626" stroke="#fecaca" stroke-width="1.5"/>
  <text x="150" y="166" font-size="17" fill="#fff5f5" text-anchor="middle" font-weight="700">+</text>
  <circle cx="285" cy="160" r="15" fill="#2563eb" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="285" y="166" font-size="19" fill="#eff6ff" text-anchor="middle" font-weight="700">−</text>

  <!-- field arrows, running from the positive charge to the negative one -->
  <g stroke="#f59e0b" stroke-width="3" fill="#f59e0b">
    <line x1="172" y1="160" x2="200" y2="160"/><polygon points="200,154 212,160 200,166"/>
    <line x1="230" y1="160" x2="252" y2="160"/><polygon points="252,154 264,160 252,166"/>
    <line x1="166" y1="132" x2="190" y2="120"/><polygon points="188,114 200,116 192,126"/>
    <line x1="238" y1="120" x2="260" y2="132"/><polygon points="256,124 268,138 252,136"/>
    <line x1="166" y1="188" x2="190" y2="200"/><polygon points="188,206 200,204 192,194"/>
    <line x1="238" y1="200" x2="260" y2="188"/><polygon points="256,196 268,182 252,184"/>
  </g>
  <text x="205" y="232" font-size="11" fill="#e9d5ff" text-anchor="middle">an arrow at every point: the field</text>

  <!-- dust clinging to the screen -->
  <g fill="#9ca3af">
    <circle cx="326" cy="196" r="2"/><circle cx="338" cy="206" r="1.6"/><circle cx="318" cy="210" r="1.4"/>
    <circle cx="344" cy="190" r="1.4"/><circle cx="332" cy="218" r="2"/><circle cx="350" cy="212" r="1.6"/>
  </g>
  <text x="330" y="250" font-size="10" fill="#cbd5e1" text-anchor="middle">dust clings</text>

  <!-- monitor stand -->
  <rect x="195" y="270" width="30" height="60" fill="#334155"/>
  <rect x="150" y="330" width="120" height="10" rx="4" fill="#334155"/>

  <!-- desk -->
  <rect x="0" y="340" width="800" height="110" fill="#3f2a1d"/>
  <rect x="0" y="340" width="800" height="8" fill="#5b3b28"/>

  <!-- plasma globe -->
  <circle cx="470" cy="290" r="42" fill="url(#ball)" stroke="#94a3b8" stroke-width="2"/>
  <g stroke="#c084fc" stroke-width="2" fill="none">
    <polyline points="470,290 452,270 440,256"/>
    <polyline points="470,290 472,262 478,250"/>
    <polyline points="470,290 494,274 506,264"/>
    <polyline points="470,290 496,304 508,310"/>
    <polyline points="470,290 462,316 456,330"/>
  </g>
  <polyline points="470,290 448,286 430,292" stroke="#f0abfc" stroke-width="3.5" fill="none"/>
  <circle cx="470" cy="290" r="6" fill="#fde68a"/>
  <path d="M 440 330 L 500 330 L 508 342 L 432 342 z" fill="#334155"/>
  <text x="470" y="366" font-size="11" fill="#ede9fe" text-anchor="middle">plasma globe</text>
  <text x="470" y="382" font-size="10" fill="#c4b5fd" text-anchor="middle">the filaments bend to a finger</text>

  <!-- the reaching hand -->
  <ellipse cx="368" cy="292" rx="26" ry="16" fill="#d9a066" stroke="#a16207" stroke-width="1.5"/>
  <path d="M 388 286 L 424 289 L 424 297 L 388 300 z" fill="#d9a066" stroke="#a16207" stroke-width="1.5"/>

  <!-- antistatic bag being peeled open, with a spark -->
  <path d="M 170 414 L 186 376 L 314 376 L 298 414 z" fill="#9ca3af" stroke="#6b7280" stroke-width="1.5"/>
  <path d="M 186 376 L 246 360 L 326 364 L 314 376 z" fill="#cbd5e1" stroke="#6b7280" stroke-width="1.5"/>
  <g fill="#e5e7eb">
    <circle cx="258" cy="371" r="1.6"/><circle cx="276" cy="368" r="1.4"/><circle cx="296" cy="372" r="1.6"/>
  </g>
  <polyline points="330,364 337,357 342,364 350,355" fill="none" stroke="#fde68a" stroke-width="2.5"/>
  <ellipse cx="392" cy="352" rx="22" ry="14" fill="#d9a066" stroke="#a16207" stroke-width="1.5"/>
  <path d="M 376 347 L 354 350 L 354 358 L 376 359 z" fill="#d9a066" stroke="#a16207" stroke-width="1.5"/>
  <text x="352" y="336" font-size="11" fill="#fde68a">crackle</text>
  <text x="240" y="434" font-size="11" fill="#e5e7eb" text-anchor="middle">antistatic bag</text>

  <!-- PC case, side panel off -->
  <text x="680" y="84" font-size="11" fill="#bfdbfe" text-anchor="middle" font-weight="600">wrist strap → metal case</text>
  <rect x="590" y="96" width="180" height="244" rx="6" fill="#0f172a" stroke="#475569" stroke-width="3"/>
  <rect x="602" y="108" width="156" height="220" fill="#111827"/>
  <rect x="608" y="170" width="76" height="110" rx="3" fill="#14532d" stroke="#166534" stroke-width="1.5"/>
  <g fill="#1f2937">
    <rect x="616" y="180" width="30" height="24" rx="2"/><rect x="654" y="180" width="22" height="16" rx="2"/>
    <rect x="616" y="216" width="16" height="34" rx="2"/><rect x="640" y="216" width="16" height="34" rx="2"/>
  </g>
  <rect x="608" y="306" width="140" height="6" rx="3" fill="#7c3aed" opacity="0.8"/>

  <!-- graphics card being lowered into its slot -->
  <rect x="620" y="290" width="120" height="8" rx="2" fill="#b45309"/>
  <rect x="622" y="248" width="120" height="28" rx="3" fill="#1f2937" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="652" cy="262" r="9" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="700" cy="262" r="9" fill="#334155" stroke="#94a3b8" stroke-width="1"/>

  <!-- the hand lowering it, wearing the strap; the coiled lead is clipped to the chassis -->
  <path d="M 700 100 L 744 100 L 744 214 L 700 214 z" fill="#d9a066" stroke="#a16207" stroke-width="1.5"/>
  <rect x="696" y="120" width="52" height="16" fill="#1f2937"/>
  <rect x="700" y="122" width="12" height="12" rx="2" fill="#cbd5e1"/>
  <ellipse cx="722" cy="228" rx="24" ry="16" fill="#d9a066" stroke="#a16207" stroke-width="1.5"/>
  <path d="M 700 240 L 716 236 M 722 244 L 736 238" stroke="#a16207" stroke-width="3" fill="none"/>
  <path d="M 696 130 q -18 16 -30 0 q -12 -16 -28 0 q -10 10 -22 2" fill="none" stroke="#9ca3af" stroke-width="2.5"/>
  <rect x="608" y="126" width="14" height="11" rx="2" fill="#94a3b8"/>
</svg>
