<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A gaming desk at night: a monitor showing a racing game with a speed readout and frame counter, a tape measure across the screen, a mouse beside a ruler, a controller on a kitchen scale and a phone running a reaction test</title>
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="0.45" stop-color="#7c3aed"/>
      <stop offset="0.46" stop-color="#334155"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#room)"/>
  <ellipse cx="300" cy="170" rx="330" ry="170" fill="url(#glow)"/>

  <!-- monitor -->
  <rect x="80" y="40" width="440" height="252" rx="8" fill="#020617" stroke="#475569" stroke-width="4"/>
  <rect x="92" y="52" width="416" height="228" fill="url(#road)"/>
  <!-- road perspective -->
  <polygon points="300,156 310,156 470,280 140,280" fill="#475569"/>
  <g stroke="#f8fafc" stroke-width="4">
    <line x1="305" y1="165" x2="305" y2="180"/>
    <line x1="305" y1="196" x2="305" y2="216"/>
    <line x1="305" y1="236" x2="305" y2="266"/>
  </g>
  <!-- race car (rear view) -->
  <rect x="262" y="226" width="86" height="30" rx="6" fill="#dc2626"/>
  <rect x="276" y="212" width="58" height="18" rx="5" fill="#991b1b"/>
  <rect x="250" y="210" width="110" height="8" rx="2" fill="#111827"/>
  <rect x="256" y="248" width="20" height="18" rx="3" fill="#111827"/>
  <rect x="334" y="248" width="20" height="18" rx="3" fill="#111827"/>
  <!-- HUD -->
  <rect x="400" y="60" width="98" height="26" rx="4" fill="#020617" opacity="0.8"/>
  <text x="408" y="79" font-size="15" fill="#4ade80" font-weight="700" font-family="Consolas, monospace">144 FPS</text>
  <rect x="100" y="228" width="116" height="44" rx="6" fill="#020617" opacity="0.8"/>
  <text x="108" y="258" font-size="24" fill="#fbbf24" font-weight="700" font-family="Consolas, monospace">216</text>
  <text x="160" y="258" font-size="15" fill="#fbbf24" font-weight="600">km/h</text>
  <!-- stand -->
  <rect x="285" y="292" width="30" height="34" fill="#334155"/>
  <rect x="235" y="324" width="130" height="10" rx="4" fill="#334155"/>

  <!-- tape measure along the top of the monitor -->
  <rect x="80" y="18" width="440" height="16" fill="#facc15"/>
  <g stroke="#78350f" stroke-width="1.5">
    <line x1="100" y1="18" x2="100" y2="28"/><line x1="140" y1="18" x2="140" y2="24"/>
    <line x1="180" y1="18" x2="180" y2="28"/><line x1="220" y1="18" x2="220" y2="24"/>
    <line x1="260" y1="18" x2="260" y2="28"/><line x1="300" y1="18" x2="300" y2="24"/>
    <line x1="340" y1="18" x2="340" y2="28"/><line x1="380" y1="18" x2="380" y2="24"/>
    <line x1="420" y1="18" x2="420" y2="28"/><line x1="460" y1="18" x2="460" y2="24"/>
    <line x1="500" y1="18" x2="500" y2="28"/>
  </g>
  <rect x="524" y="12" width="30" height="28" rx="5" fill="#ca8a04"/>
  <text x="566" y="32" font-size="14" fill="#fef9c3" font-weight="600">tape: screen width</text>

  <!-- desk -->
  <rect x="0" y="334" width="800" height="116" fill="#3f2a1d"/>
  <rect x="0" y="334" width="800" height="8" fill="#5b3b28"/>

  <!-- mousepad, mouse and ruler -->
  <rect x="400" y="350" width="170" height="80" rx="8" fill="#111827"/>
  <rect x="408" y="410" width="154" height="14" fill="#e2e8f0"/>
  <g stroke="#334155" stroke-width="1.2">
    <line x1="414" y1="410" x2="414" y2="418"/><line x1="428" y1="410" x2="428" y2="415"/>
    <line x1="442" y1="410" x2="442" y2="418"/><line x1="456" y1="410" x2="456" y2="415"/>
    <line x1="470" y1="410" x2="470" y2="418"/><line x1="484" y1="410" x2="484" y2="415"/>
    <line x1="498" y1="410" x2="498" y2="418"/><line x1="512" y1="410" x2="512" y2="415"/>
    <line x1="526" y1="410" x2="526" y2="418"/><line x1="540" y1="410" x2="540" y2="415"/>
    <line x1="554" y1="410" x2="554" y2="418"/>
  </g>
  <ellipse cx="470" cy="378" rx="18" ry="26" fill="#e5e7eb"/>
  <line x1="470" y1="354" x2="470" y2="370" stroke="#64748b" stroke-width="2"/>
  <path d="M 470 352 Q 460 340 445 342" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <text x="412" y="446" font-size="13" fill="#fef9c3" font-weight="600">ruler under the mouse</text>

  <!-- kitchen scale with a controller -->
  <rect x="60" y="392" width="170" height="36" rx="8" fill="#e2e8f0"/>
  <rect x="120" y="402" width="64" height="18" rx="3" fill="#0f172a"/>
  <text x="126" y="416" font-size="13" fill="#34d399" font-weight="700" font-family="Consolas, monospace">0.270kg</text>
  <path d="M 82 386 Q 88 352 118 356 L 172 356 Q 202 352 208 386 Q 200 396 184 388 L 106 388 Q 90 396 82 386 z" fill="#1f2937"/>
  <circle cx="118" cy="370" r="7" fill="#475569"/>
  <circle cx="160" cy="376" r="7" fill="#475569"/>
  <g fill="#38bdf8"><circle cx="182" cy="364" r="3.5"/><circle cx="190" cy="372" r="3.5"/><circle cx="174" cy="372" r="3.5"/><circle cx="182" cy="380" r="3.5"/></g>

  <!-- phone with a reaction test -->
  <rect x="640" y="300" width="70" height="130" rx="10" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
  <rect x="648" y="314" width="54" height="100" rx="3" fill="#16a34a"/>
  <text x="675" y="346" font-size="11" fill="#f0fdf4" text-anchor="middle" font-weight="600">CLICK!</text>
  <text x="675" y="376" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Consolas, monospace">0.25 s</text>
  <text x="675" y="398" font-size="10" fill="#f0fdf4" text-anchor="middle">reaction</text>
  <text x="600" y="290" font-size="14" fill="#fef9c3" font-weight="600">reaction-time test</text>

  <!-- USB cable from the controller -->
  <path d="M 208 380 Q 280 380 300 340" fill="none" stroke="#94a3b8" stroke-width="3"/>
</svg>
