<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A gaming desk at night: a monitor shows a racing game with a temperature overlay reading GPU 78 degrees and CPU 65 degrees, a tower PC beside it has a heat sink, a graphics card with two fans and a power supply behind a glass panel, with blue arrows for cool air drawn in at the bottom and red arrows for hot air leaving the top; a can of compressed-air duster stands on the desk, a mini fridge with a warm grille sits underneath, a thermometer on the wall reads 27 degrees, and a backup generator stands outside the window</title>
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#2e1065"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rgb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#room)"/>
  <ellipse cx="300" cy="160" rx="330" ry="170" fill="url(#glow)"/>

  <!-- wall thermometer: the room's own temperature -->
  <rect x="10" y="120" width="20" height="70" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <rect x="17" y="158" width="6" height="34" fill="#dc2626"/>
  <circle cx="20" cy="196" r="9" fill="#dc2626"/>
  <line x1="32" y1="140" x2="38" y2="140" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="32" y1="158" x2="38" y2="158" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="32" y1="176" x2="38" y2="176" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="22" y="220" font-size="11" fill="#fca5a5" text-anchor="middle" font-weight="600">27 °C</text>

  <!-- monitor -->
  <rect x="40" y="40" width="360" height="240" rx="8" fill="#020617" stroke="#475569" stroke-width="4"/>
  <rect x="52" y="52" width="336" height="216" fill="#0f172a"/>
  <!-- night sky and horizon inside the game -->
  <rect x="52" y="52" width="336" height="108" fill="#111827"/>
  <g fill="#cbd5e1">
    <circle cx="300" cy="80" r="1.4"/><circle cx="342" cy="104" r="1.2"/><circle cx="262" cy="70" r="1.2"/>
  </g>
  <rect x="52" y="160" width="336" height="108" fill="#0b1220"/>
  <!-- the road, in perspective -->
  <polygon points="118,268 196,160 246,160 332,268" fill="#1f2937"/>
  <g fill="#fbbf24">
    <rect x="218" y="164" width="4" height="8"/>
    <rect x="217" y="186" width="6" height="12"/>
    <rect x="215" y="216" width="9" height="16"/>
    <rect x="213" y="250" width="12" height="18"/>
  </g>
  <!-- the player's car -->
  <rect x="196" y="226" width="56" height="22" rx="6" fill="#ef4444"/>
  <rect x="208" y="214" width="32" height="14" rx="5" fill="#7f1d1d"/>
  <circle cx="208" cy="250" r="6" fill="#0f172a"/>
  <circle cx="240" cy="250" r="6" fill="#0f172a"/>
  <!-- the temperature overlay -->
  <rect x="64" y="64" width="126" height="70" rx="5" fill="#020617" opacity="0.88"/>
  <text x="74" y="84" font-size="12" fill="#fbbf24" font-weight="700" font-family="Consolas, monospace">GPU  78 °C</text>
  <text x="74" y="104" font-size="12" fill="#fbbf24" font-weight="700" font-family="Consolas, monospace">CPU  65 °C</text>
  <text x="74" y="124" font-size="12" fill="#4ade80" font-weight="700" font-family="Consolas, monospace">60 FPS</text>
  <!-- stand -->
  <rect x="205" y="280" width="30" height="28" fill="#334155"/>
  <rect x="160" y="308" width="120" height="10" rx="4" fill="#334155"/>

  <!-- tower PC -->
  <ellipse cx="515" cy="200" rx="110" ry="150" fill="url(#rgb)"/>
  <rect x="440" y="48" width="150" height="270" rx="6" fill="#111827" stroke="#374151" stroke-width="3"/>
  <rect x="452" y="60" width="126" height="246" fill="#0b1220" stroke="#1f2937" stroke-width="2"/>
  <!-- heat sink -->
  <g stroke="#94a3b8" stroke-width="3">
    <line x1="470" y1="80" x2="470" y2="128"/><line x1="480" y1="80" x2="480" y2="128"/>
    <line x1="490" y1="80" x2="490" y2="128"/><line x1="500" y1="80" x2="500" y2="128"/>
    <line x1="510" y1="80" x2="510" y2="128"/><line x1="520" y1="80" x2="520" y2="128"/>
    <line x1="530" y1="80" x2="530" y2="128"/><line x1="540" y1="80" x2="540" y2="128"/>
    <line x1="550" y1="80" x2="550" y2="128"/>
  </g>
  <rect x="464" y="128" width="92" height="12" fill="#64748b"/>
  <text x="510" y="156" font-size="10" fill="#cbd5e1" text-anchor="middle">heat sink</text>
  <!-- graphics card with two fans -->
  <rect x="462" y="172" width="110" height="46" rx="4" fill="#1f2937" stroke="#475569" stroke-width="2"/>
  <circle cx="490" cy="195" r="15" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="544" cy="195" r="15" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <g stroke="#7dd3fc" stroke-width="1.5">
    <line x1="490" y1="195" x2="490" y2="182"/><line x1="490" y1="195" x2="501" y2="201"/><line x1="490" y1="195" x2="479" y2="201"/>
    <line x1="544" y1="195" x2="544" y2="182"/><line x1="544" y1="195" x2="555" y2="201"/><line x1="544" y1="195" x2="533" y2="201"/>
  </g>
  <text x="517" y="234" font-size="10" fill="#cbd5e1" text-anchor="middle">graphics card + fans</text>
  <!-- power supply -->
  <rect x="462" y="250" width="110" height="46" rx="4" fill="#0f172a" stroke="#374151" stroke-width="2"/>
  <text x="517" y="278" font-size="10" fill="#94a3b8" text-anchor="middle">power supply</text>

  <!-- hot air leaving the top (red) -->
  <g stroke="#dc2626" stroke-width="4">
    <line x1="480" y1="44" x2="480" y2="26"/>
    <line x1="540" y1="44" x2="540" y2="26"/>
  </g>
  <polygon points="472,26 480,12 488,26" fill="#dc2626"/>
  <polygon points="532,26 540,12 548,26" fill="#dc2626"/>
  <text x="560" y="26" font-size="11" fill="#fca5a5" font-weight="600">hot air out</text>

  <!-- cool air drawn in at the bottom (blue) -->
  <line x1="398" y1="300" x2="428" y2="300" stroke="#2563eb" stroke-width="4"/>
  <polygon points="428,292 442,300 428,308" fill="#2563eb"/>
  <text x="394" y="292" font-size="11" fill="#bfdbfe" font-weight="600" text-anchor="end">cool air in</text>

  <!-- can of compressed-air duster -->
  <rect x="592" y="272" width="26" height="46" rx="5" fill="#38bdf8" stroke="#0369a1" stroke-width="2"/>
  <rect x="600" y="262" width="10" height="10" fill="#94a3b8"/>
  <rect x="610" y="264" width="12" height="4" fill="#94a3b8"/>
  <text x="605" y="300" font-size="9" fill="#082f49" text-anchor="middle" font-weight="700">AIR</text>
  <text x="640" y="284" font-size="10" fill="#bae6fd">duster can</text>

  <!-- window, with the building's backup generator outside -->
  <rect x="612" y="40" width="176" height="150" rx="3" fill="#050914" stroke="#64748b" stroke-width="4"/>
  <g fill="#e2e8f0">
    <circle cx="646" cy="70" r="1.4"/><circle cx="742" cy="62" r="1.4"/><circle cx="700" cy="88" r="1.2"/>
  </g>
  <line x1="614" y1="160" x2="786" y2="160" stroke="#475569" stroke-width="3"/>
  <rect x="656" y="130" width="76" height="30" rx="3" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
  <rect x="736" y="118" width="8" height="18" fill="#94a3b8"/>
  <path d="M 744 116 q 8 -8 0 -16 q -8 -8 0 -16" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <path d="M 756 118 q 8 -8 0 -16 q -8 -8 0 -16" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <text x="694" y="178" font-size="10" fill="#fca5a5" text-anchor="middle">backup generator</text>
  <rect x="606" y="190" width="188" height="8" fill="#475569"/>

  <!-- desk -->
  <rect x="0" y="318" width="800" height="14" fill="#5b3b28"/>
  <rect x="0" y="332" width="800" height="10" fill="#3f2a1d"/>
  <rect x="0" y="342" width="800" height="108" fill="#1a1433"/>

  <!-- controller on the desk -->
  <g transform="translate(-16,13) scale(0.73)">
    <path d="M 90 406 Q 96 366 130 370 L 194 370 Q 228 366 234 406 Q 224 418 206 408 L 118 408 Q 100 418 90 406 z" fill="#1f2937"/>
    <circle cx="130" cy="386" r="8" fill="#475569"/>
    <circle cx="178" cy="394" r="8" fill="#475569"/>
    <g fill="#a78bfa"><circle cx="206" cy="378" r="4"/><circle cx="215" cy="387" r="4"/><circle cx="197" cy="387" r="4"/><circle cx="206" cy="396" r="4"/></g>
  </g>

  <!-- mini fridge under the desk -->
  <rect x="620" y="346" width="150" height="90" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="628" y="354" width="86" height="74" rx="3" fill="#1e293b"/>
  <rect x="640" y="382" width="14" height="34" rx="3" fill="#38bdf8"/>
  <rect x="660" y="382" width="14" height="34" rx="3" fill="#38bdf8"/>
  <rect x="680" y="382" width="14" height="34" rx="3" fill="#38bdf8"/>
  <text x="671" y="372" font-size="11" fill="#7dd3fc" text-anchor="middle" font-weight="700">4 °C inside</text>
  <g stroke="#64748b" stroke-width="2">
    <line x1="726" y1="356" x2="726" y2="426"/><line x1="734" y1="356" x2="734" y2="426"/>
    <line x1="742" y1="356" x2="742" y2="426"/><line x1="750" y1="356" x2="750" y2="426"/>
    <line x1="758" y1="356" x2="758" y2="426"/>
  </g>
  <g stroke="#dc2626" stroke-width="3">
    <line x1="770" y1="372" x2="784" y2="372"/>
    <line x1="770" y1="391" x2="784" y2="391"/>
    <line x1="770" y1="410" x2="784" y2="410"/>
  </g>
  <polygon points="784,366 796,372 784,378" fill="#dc2626"/>
  <polygon points="784,385 796,391 784,397" fill="#dc2626"/>
  <polygon points="784,404 796,410 784,416" fill="#dc2626"/>
  <text x="600" y="400" font-size="11" fill="#fca5a5" text-anchor="end">grille at the back: warm</text>
  <line x1="606" y1="396" x2="722" y2="390" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="4 3"/>
</svg>
