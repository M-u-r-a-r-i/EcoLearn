<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">An evening street: a phone in the foreground shows a live-tracking map of a delivery scooter coming along a straight road, while on the real road the scooter rides past kilometre markers and a phone slides off a café table</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#sky)"/>

  <!-- distant buildings -->
  <g fill="#334155">
    <rect x="270" y="150" width="70" height="170"/>
    <rect x="350" y="110" width="60" height="210"/>
    <rect x="420" y="170" width="80" height="150"/>
    <rect x="600" y="130" width="70" height="190"/>
    <rect x="680" y="160" width="110" height="160"/>
  </g>
  <g fill="#fde68a" opacity="0.7">
    <rect x="285" y="170" width="10" height="12"/><rect x="315" y="200" width="10" height="12"/>
    <rect x="365" y="130" width="10" height="12"/><rect x="385" y="180" width="10" height="12"/>
    <rect x="440" y="190" width="10" height="12"/><rect x="470" y="230" width="10" height="12"/>
    <rect x="615" y="150" width="10" height="12"/><rect x="645" y="210" width="10" height="12"/>
    <rect x="700" y="180" width="10" height="12"/><rect x="740" y="220" width="10" height="12"/>
  </g>

  <!-- the straight road -->
  <rect x="0" y="320" width="800" height="80" fill="#1f2937"/>
  <rect x="0" y="316" width="800" height="6" fill="#94a3b8"/>
  <rect x="0" y="398" width="800" height="52" fill="#57534e"/>
  <g stroke="#f8fafc" stroke-width="4" stroke-dasharray="26 22">
    <line x1="0" y1="360" x2="800" y2="360"/>
  </g>

  <!-- kilometre markers on the pavement -->
  <g font-size="11" font-weight="700" text-anchor="middle">
    <path d="M 296 432 L 296 408 Q 306 398 316 408 L 316 432 Z" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="306" y="426" fill="#0f172a">2</text>
    <path d="M 516 432 L 516 408 Q 526 398 536 408 L 536 432 Z" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="526" y="426" fill="#0f172a">3</text>
    <path d="M 736 432 L 736 408 Q 746 398 756 408 L 756 432 Z" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="746" y="426" fill="#0f172a">4</text>
  </g>

  <!-- delivery scooter riding to the right -->
  <g>
    <circle cx="400" cy="378" r="14" fill="#0f172a" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="468" cy="378" r="14" fill="#0f172a" stroke="#cbd5e1" stroke-width="3"/>
    <path d="M 392 364 L 420 364 L 440 352 L 470 352 L 476 366 L 392 368 Z" fill="#f97316"/>
    <rect x="382" y="328" width="34" height="28" rx="3" fill="#dc2626"/>
    <line x1="462" y1="352" x2="470" y2="322" stroke="#cbd5e1" stroke-width="4"/>
    <line x1="462" y1="322" x2="478" y2="322" stroke="#cbd5e1" stroke-width="4"/>
    <!-- rider -->
    <path d="M 432 350 L 440 318 L 454 318 L 458 350 Z" fill="#0e7490"/>
    <circle cx="446" cy="306" r="11" fill="#fbbf24"/>
    <line x1="452" y1="324" x2="468" y2="324" stroke="#0e7490" stroke-width="5"/>
    <!-- phone on handlebar -->
    <rect x="470" y="310" width="9" height="14" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  </g>
  <line x1="490" y1="340" x2="560" y2="340" stroke="#2563eb" stroke-width="5"/>
  <polygon points="572,340 556,332 556,348" fill="#2563eb"/>
  <text x="530" y="330" font-size="13" fill="#bfdbfe" text-anchor="middle" font-weight="600">v</text>

  <!-- café table with a phone sliding off -->
  <rect x="640" y="250" width="120" height="8" rx="2" fill="#a16207"/>
  <rect x="696" y="258" width="8" height="58" fill="#78350f"/>
  <rect x="676" y="312" width="48" height="6" rx="2" fill="#78350f"/>
  <rect x="720" y="238" width="22" height="12" rx="3" fill="#f8fafc"/>
  <rect x="742" y="242" width="6" height="5" rx="2" fill="none" stroke="#f8fafc" stroke-width="2"/>
  <!-- ghost positions of the falling phone -->
  <rect x="624" y="236" width="26" height="12" rx="3" fill="#0f172a" opacity="0.35" transform="rotate(-10 637 242)"/>
  <rect x="606" y="262" width="26" height="12" rx="3" fill="#0f172a" opacity="0.55" transform="rotate(-30 619 268)"/>
  <rect x="598" y="292" width="12" height="26" rx="3" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5" transform="rotate(20 604 305)"/>
  <line x1="580" y1="248" x2="580" y2="300" stroke="#16a34a" stroke-width="4"/>
  <polygon points="580,312 572,296 588,296" fill="#16a34a"/>
  <text x="568" y="244" font-size="13" fill="#bbf7d0" text-anchor="end" font-weight="600">g</text>

  <!-- phone in the foreground, held up, showing the live-tracking map -->
  <g>
    <rect x="30" y="40" width="200" height="390" rx="26" fill="#0f172a" stroke="#94a3b8" stroke-width="3"/>
    <rect x="42" y="64" width="176" height="344" rx="8" fill="#e2e8f0"/>
    <rect x="104" y="48" width="52" height="8" rx="4" fill="#334155"/>
    <!-- map: a straight road -->
    <rect x="42" y="64" width="176" height="250" fill="#d1fae5"/>
    <rect x="118" y="64" width="24" height="250" fill="#f8fafc"/>
    <line x1="130" y1="68" x2="130" y2="310" stroke="#2563eb" stroke-width="4" stroke-dasharray="8 6"/>
    <!-- you pin -->
    <path d="M 130 106 C 118 96 118 80 130 78 C 142 80 142 96 130 106 Z" fill="#dc2626"/>
    <circle cx="130" cy="88" r="4" fill="#f8fafc"/>
    <text x="150" y="92" font-size="12" fill="#0f172a" font-weight="700">You</text>
    <!-- rider dot -->
    <circle cx="130" cy="258" r="9" fill="#f97316" stroke="#f8fafc" stroke-width="3"/>
    <text x="146" y="262" font-size="12" fill="#0f172a" font-weight="700">Rider</text>
    <!-- info card -->
    <rect x="50" y="322" width="160" height="78" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="62" y="346" font-size="14" fill="#0f172a" font-weight="700">600 m away</text>
    <text x="62" y="366" font-size="12" fill="#475569">arriving in 2 min</text>
    <text x="62" y="386" font-size="12" fill="#0e7490" font-weight="600">28 km/h</text>
  </g>
</svg>
