<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A desk by a sunny window: a solar power bank tilted towards the sun on the windowsill, an opened phone box with foam beads clinging to the new phone, a protective film being peeled off a screen with dust jumping up to it, and a phone on a stand running a field-line simulator app</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#wall)"/>

  <!-- window with sun -->
  <rect x="40" y="40" width="200" height="150" rx="4" fill="url(#sky)" stroke="#64748b" stroke-width="4"/>
  <line x1="140" y1="40" x2="140" y2="190" stroke="#64748b" stroke-width="3"/>
  <circle cx="84" cy="80" r="20" fill="#fde047"/>
  <g stroke="#fde047" stroke-width="3" opacity="0.8">
    <line x1="104" y1="96" x2="150" y2="150"/>
    <line x1="96" y1="104" x2="138" y2="160"/>
  </g>
  <!-- windowsill -->
  <rect x="30" y="190" width="220" height="12" rx="2" fill="#94a3b8"/>
  <!-- solar power bank, tilted to face the sun -->
  <g transform="rotate(-35 170 178)">
    <rect x="140" y="170" width="64" height="14" rx="3" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/>
    <line x1="156" y1="170" x2="156" y2="184" stroke="#93c5fd" stroke-width="1"/>
    <line x1="172" y1="170" x2="172" y2="184" stroke="#93c5fd" stroke-width="1"/>
    <line x1="188" y1="170" x2="188" y2="184" stroke="#93c5fd" stroke-width="1"/>
  </g>
  <rect x="168" y="182" width="6" height="10" fill="#475569"/>

  <!-- tiled floor -->
  <rect x="0" y="390" width="800" height="60" fill="#a8a29e"/>
  <g stroke="#78716c" stroke-width="2">
    <line x1="0" y1="390" x2="800" y2="390"/>
    <line x1="0" y1="420" x2="800" y2="420"/>
    <line x1="90" y1="390" x2="70" y2="450"/><line x1="200" y1="390" x2="190" y2="450"/>
    <line x1="310" y1="390" x2="310" y2="450"/><line x1="420" y1="390" x2="430" y2="450"/>
    <line x1="530" y1="390" x2="550" y2="450"/><line x1="640" y1="390" x2="670" y2="450"/>
    <line x1="750" y1="390" x2="790" y2="450"/>
  </g>

  <!-- desk -->
  <rect x="270" y="300" width="510" height="12" rx="2" fill="#b45309"/>
  <rect x="282" y="312" width="10" height="78" fill="#78350f"/>
  <rect x="758" y="312" width="10" height="78" fill="#78350f"/>

  <!-- LEFT on desk: opened phone box with foam beads -->
  <rect x="290" y="262" width="92" height="38" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <polygon points="290,262 300,236 392,236 382,262" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
  <g fill="#ffffff" stroke="#94a3b8" stroke-width="1">
    <circle cx="304" cy="258" r="4"/><circle cx="318" cy="254" r="4"/><circle cx="332" cy="258" r="4"/>
    <circle cx="346" cy="254" r="4"/><circle cx="360" cy="258" r="4"/><circle cx="372" cy="254" r="4"/>
  </g>
  <!-- new phone leaning on the box, beads clinging to its side -->
  <rect x="396" y="222" width="26" height="78" rx="5" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5" transform="rotate(8 409 261)"/>
  <g fill="#ffffff" stroke="#94a3b8" stroke-width="1">
    <circle cx="428" cy="236" r="4"/><circle cx="431" cy="252" r="4"/><circle cx="430" cy="270" r="4"/>
    <circle cx="398" cy="244" r="4"/>
  </g>
  <text x="365" y="222" font-size="12" fill="#e2e8f0" font-weight="600" text-anchor="middle">foam beads cling</text>

  <!-- MIDDLE on desk: phone flat, film half peeled, dust jumping -->
  <rect x="470" y="288" width="110" height="12" rx="3" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 530 288 Q 560 270 575 244" fill="none" stroke="#bae6fd" stroke-width="3" opacity="0.9"/>
  <rect x="566" y="236" width="14" height="10" rx="2" fill="#bae6fd" opacity="0.9" transform="rotate(-50 573 241)"/>
  <!-- crackle -->
  <polyline points="548,270 554,262 550,262 557,252" fill="none" stroke="#fde047" stroke-width="2.5"/>
  <!-- dust specks rising to the film -->
  <g fill="#d6d3d1">
    <circle cx="560" cy="282" r="2.5"/><circle cx="568" cy="272" r="2.5"/><circle cx="584" cy="262" r="2.5"/>
    <circle cx="592" cy="280" r="2.5"/>
  </g>
  <g stroke="#d6d3d1" stroke-width="1.5" stroke-dasharray="3 3">
    <line x1="560" y1="296" x2="560" y2="286"/><line x1="592" y1="296" x2="592" y2="284"/>
  </g>
  <text x="525" y="328" font-size="12" fill="#fef3c7" font-weight="600" text-anchor="middle">peeling the film</text>

  <!-- RIGHT on desk: phone on a stand running a field-line app -->
  <polygon points="650,300 700,300 690,286 660,286" fill="#475569"/>
  <rect x="640" y="150" width="70" height="136" rx="8" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
  <rect x="646" y="160" width="58" height="116" rx="3" fill="#f8fafc"/>
  <!-- simulated field lines between + and - -->
  <g fill="none" stroke="#2563eb" stroke-width="1.5">
    <line x1="667" y1="218" x2="683" y2="218"/>
    <path d="M 663 212 Q 675 192 687 212"/>
    <path d="M 663 224 Q 675 244 687 224"/>
    <path d="M 661 208 Q 675 172 689 208"/>
    <path d="M 661 228 Q 675 264 689 228"/>
  </g>
  <circle cx="660" cy="218" r="6" fill="#dc2626"/>
  <text x="660" y="222" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">+</text>
  <circle cx="690" cy="218" r="6" fill="#1d4ed8"/>
  <text x="690" y="222" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">−</text>
  <text x="675" y="140" font-size="12" fill="#e2e8f0" font-weight="600" text-anchor="middle">field-line app</text>

  <!-- wall shelf label for window -->
  <text x="140" y="222" font-size="12" fill="#e2e8f0" font-weight="600" text-anchor="middle">solar power bank</text>
</svg>
