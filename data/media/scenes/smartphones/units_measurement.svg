<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A study desk in the evening: a phone on a digital kitchen scale, a phone held in the jaws of a digital caliper, a charger with a USB power meter showing volts and amps, and a phone hanging from a shelf on a string, swinging</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#wall)"/>
  <ellipse cx="330" cy="250" rx="360" ry="190" fill="url(#lamp)"/>

  <!-- shelf with a hanging phone (pendulum) -->
  <rect x="560" y="40" width="220" height="14" rx="3" fill="#92400e"/>
  <rect x="572" y="54" width="8" height="26" fill="#78350f"/>
  <rect x="760" y="54" width="8" height="26" fill="#78350f"/>
  <circle cx="670" cy="58" r="4" fill="#e2e8f0"/>
  <line x1="670" y1="58" x2="700" y2="196" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="670" y1="58" x2="670" y2="206" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.5"/>
  <g transform="rotate(-12 700 196)">
    <rect x="684" y="194" width="32" height="60" rx="6" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
    <rect x="688" y="200" width="24" height="46" rx="2" fill="#0e7490"/>
    <polyline points="690,224 694,214 698,232 702,214 706,232 710,222" fill="none" stroke="#a5f3fc" stroke-width="1.6"/>
  </g>
  <path d="M 628 238 Q 670 262 712 238" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="6 5"/>
  <polygon points="712,238 700,240 707,231" fill="#fbbf24"/>
  <polygon points="628,238 640,240 633,231" fill="#fbbf24"/>
  <text x="560" y="190" font-size="14" fill="#fef3c7" font-weight="600">swing time?</text>

  <!-- desk -->
  <rect x="0" y="330" width="800" height="120" fill="#a16207"/>
  <rect x="0" y="322" width="800" height="12" fill="#ca8a04"/>

  <!-- kitchen scale with a phone -->
  <rect x="40" y="290" width="170" height="36" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="92" y="300" width="66" height="18" rx="3" fill="#0f172a"/>
  <text x="125" y="314" font-size="14" fill="#4ade80" text-anchor="middle" font-family="Consolas, monospace" font-weight="700">185 g</text>
  <rect x="60" y="270" width="130" height="18" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <rect x="68" y="274" width="114" height="10" rx="2" fill="#1d4ed8"/>
  <text x="125" y="356" font-size="14" fill="#fef3c7" text-anchor="middle" font-weight="600">mass</text>

  <!-- digital caliper gripping a phone's edge -->
  <rect x="250" y="226" width="250" height="18" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <g stroke="#64748b" stroke-width="0.8">
    <line x1="340" y1="226" x2="340" y2="234"/><line x1="360" y1="226" x2="360" y2="234"/>
    <line x1="380" y1="226" x2="380" y2="234"/><line x1="400" y1="226" x2="400" y2="234"/>
    <line x1="420" y1="226" x2="420" y2="234"/><line x1="440" y1="226" x2="440" y2="234"/>
    <line x1="460" y1="226" x2="460" y2="234"/><line x1="480" y1="226" x2="480" y2="234"/>
  </g>
  <polygon points="256,244 272,244 272,312 262,312 256,300" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <rect x="288" y="214" width="84" height="44" rx="5" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
  <rect x="296" y="222" width="68" height="22" rx="2" fill="#0f172a"/>
  <text x="330" y="239" font-size="14" fill="#4ade80" text-anchor="middle" font-family="Consolas, monospace" font-weight="700">7.92 mm</text>
  <polygon points="288,258 298,258 298,312 288,312" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <!-- the phone, edge-on, standing between the jaws -->
  <rect x="273" y="262" width="14" height="60" rx="3" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="330" y="356" font-size="14" fill="#fef3c7" text-anchor="middle" font-weight="600">thickness</text>

  <!-- charger, USB power meter and cable -->
  <rect x="560" y="268" width="56" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="588" y="293" font-size="11" fill="#475569" text-anchor="middle" font-weight="600">5 V</text>
  <text x="588" y="308" font-size="11" fill="#475569" text-anchor="middle" font-weight="600">2 A</text>
  <rect x="616" y="290" width="12" height="14" fill="#94a3b8"/>
  <rect x="628" y="280" width="76" height="36" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="666" y="296" font-size="12" fill="#38bdf8" text-anchor="middle" font-family="Consolas, monospace" font-weight="700">5.01 V</text>
  <text x="666" y="310" font-size="12" fill="#f472b6" text-anchor="middle" font-family="Consolas, monospace" font-weight="700">1.80 A</text>
  <path d="M 704 298 Q 740 300 760 318 L 770 322" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
  <text x="640" y="356" font-size="14" fill="#fef3c7" text-anchor="middle" font-weight="600">volts and amps</text>

  <!-- notebook with units -->
  <rect x="400" y="370" width="200" height="60" rx="4" fill="#f8fafc" transform="rotate(-3 500 400)"/>
  <text x="418" y="397" font-size="15" fill="#1e3a8a" transform="rotate(-3 500 400)" font-style="italic">kg · m · s · A …</text>
  <text x="418" y="419" font-size="13" fill="#475569" transform="rotate(-3 500 400)" font-style="italic">W = J/s ?   mAh ?   GHz ?</text>
</svg>
