<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">An evening terrace: a phone in the foreground shows a map with a winding walking route and a straight arrow from start to end, a small camera drone flies at a slant over the rooftops, and an earbud case skids off a table edge along a curved path</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#sky)"/>

  <!-- distant rooftops -->
  <g fill="#334155">
    <rect x="260" y="200" width="80" height="140"/>
    <rect x="345" y="170" width="60" height="170"/>
    <rect x="410" y="215" width="90" height="125"/>
    <rect x="505" y="185" width="70" height="155"/>
    <rect x="580" y="225" width="100" height="115"/>
    <rect x="685" y="195" width="115" height="145"/>
  </g>
  <g fill="#fde68a" opacity="0.7">
    <rect x="275" y="220" width="10" height="12"/><rect x="310" y="260" width="10" height="12"/>
    <rect x="360" y="190" width="10" height="12"/><rect x="380" y="240" width="10" height="12"/>
    <rect x="430" y="235" width="10" height="12"/><rect x="470" y="270" width="10" height="12"/>
    <rect x="520" y="205" width="10" height="12"/><rect x="550" y="250" width="10" height="12"/>
    <rect x="600" y="245" width="10" height="12"/><rect x="705" y="215" width="10" height="12"/>
    <rect x="750" y="260" width="10" height="12"/>
  </g>

  <!-- terrace floor and parapet -->
  <rect x="0" y="340" width="800" height="110" fill="#57534e"/>
  <rect x="0" y="332" width="800" height="10" fill="#a8a29e"/>

  <!-- camera drone flying up and to the right -->
  <g>
    <line x1="360" y1="96" x2="420" y2="96" stroke="#cbd5e1" stroke-width="4"/>
    <ellipse cx="360" cy="90" rx="20" ry="4" fill="#94a3b8" opacity="0.8"/>
    <ellipse cx="420" cy="90" rx="20" ry="4" fill="#94a3b8" opacity="0.8"/>
    <line x1="360" y1="96" x2="360" y2="90" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="420" y1="96" x2="420" y2="90" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="374" y="92" width="32" height="16" rx="5" fill="#f8fafc"/>
    <circle cx="390" cy="112" r="5" fill="#0f172a" stroke="#f8fafc" stroke-width="2"/>
  </g>
  <line x1="432" y1="110" x2="494" y2="72" stroke="#2563eb" stroke-width="5"/>
  <polygon points="506,65 488,66 496,80" fill="#2563eb"/>
  <text x="484" y="104" font-size="14" fill="#bfdbfe" font-weight="600">v</text>

  <!-- table with an earbud case skidding off the edge -->
  <rect x="560" y="262" width="150" height="8" rx="2" fill="#a16207"/>
  <rect x="631" y="270" width="8" height="120" fill="#78350f"/>
  <rect x="605" y="386" width="60" height="6" rx="2" fill="#78350f"/>
  <!-- phone lying on the table -->
  <rect x="640" y="255" width="44" height="7" rx="2" fill="#0f172a" stroke="#94a3b8" stroke-width="1"/>
  <!-- the case at the edge, moving left -->
  <rect x="549" y="250" width="22" height="12" rx="6" fill="#f8fafc"/>
  <line x1="544" y1="240" x2="512" y2="240" stroke="#2563eb" stroke-width="4"/>
  <polygon points="502,240 516,233 516,247" fill="#2563eb"/>
  <text x="526" y="230" font-size="13" fill="#bfdbfe" font-weight="600" text-anchor="middle">v</text>
  <!-- dashed curved path to the floor, with ghost positions -->
  <path d="M 560 256 Q 515 256 470 380" fill="none" stroke="#f8fafc" stroke-width="2" stroke-dasharray="6 5" opacity="0.8"/>
  <rect x="519" y="264" width="22" height="12" rx="6" fill="#f8fafc" opacity="0.35"/>
  <rect x="489" y="305" width="22" height="12" rx="6" fill="#f8fafc" opacity="0.55"/>
  <rect x="459" y="374" width="22" height="12" rx="6" fill="#f8fafc" opacity="0.8"/>
  <line x1="600" y1="300" x2="600" y2="344" stroke="#16a34a" stroke-width="4"/>
  <polygon points="600,356 592,340 608,340" fill="#16a34a"/>
  <text x="612" y="316" font-size="13" fill="#bbf7d0" font-weight="600">g</text>

  <!-- phone in the foreground: a map with a winding walk and the straight start-to-end arrow -->
  <g>
    <rect x="30" y="40" width="200" height="390" rx="26" fill="#0f172a" stroke="#94a3b8" stroke-width="3"/>
    <rect x="42" y="64" width="176" height="344" rx="8" fill="#e2e8f0"/>
    <rect x="104" y="48" width="52" height="8" rx="4" fill="#334155"/>
    <rect x="42" y="64" width="176" height="260" fill="#d1fae5"/>
    <!-- winding route walked -->
    <path d="M 70 290 C 70 230 180 250 170 200 C 160 150 70 170 80 120 C 86 96 150 92 180 100" fill="none" stroke="#f97316" stroke-width="4" stroke-dasharray="7 5"/>
    <!-- start and end markers -->
    <circle cx="70" cy="290" r="7" fill="#16a34a" stroke="#f8fafc" stroke-width="2"/>
    <path d="M 180 108 C 170 98 170 82 180 80 C 190 82 190 98 180 108 Z" fill="#dc2626"/>
    <circle cx="180" cy="90" r="3.5" fill="#f8fafc"/>
    <!-- straight arrow start to end -->
    <line x1="76" y1="284" x2="168" y2="118" stroke="#0f172a" stroke-width="3"/>
    <polygon points="174,108 162,118 172,124" fill="#0f172a"/>
    <!-- info card -->
    <rect x="50" y="332" width="160" height="68" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="62" y="356" font-size="13" fill="#0f172a" font-weight="700">Walked: 1.2 km</text>
    <text x="62" y="378" font-size="12" fill="#475569">Straight line: ?</text>
    <text x="62" y="394" font-size="11" fill="#0e7490" font-weight="600">start to end</text>
  </g>
</svg>
