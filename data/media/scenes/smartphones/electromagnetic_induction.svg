<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A desk at night: a hand-crank charger, a shake torch with a magnet inside a coil, a phone lying on a wireless charging pad with a coin beside it, and a pair of wired earphones</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef9c3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fef9c3" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="800" height="450" fill="url(#wall)"/>

  <!-- window with moon -->
  <rect x="560" y="40" width="170" height="110" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
  <line x1="645" y1="40" x2="645" y2="150" stroke="#64748b" stroke-width="3"/>
  <circle cx="700" cy="75" r="14" fill="#e2e8f0"/>
  <circle cx="706" cy="71" r="12" fill="#0f172a"/>

  <!-- table -->
  <rect x="30" y="310" width="740" height="14" rx="3" fill="#b45309"/>
  <rect x="50" y="324" width="12" height="96" fill="#78350f"/>
  <rect x="738" y="324" width="12" height="96" fill="#78350f"/>
  <rect x="0" y="420" width="800" height="30" fill="#57534e"/>

  <!-- hand-crank charger -->
  <rect x="70" y="262" width="90" height="48" rx="8" fill="#f97316" stroke="#fed7aa" stroke-width="2"/>
  <circle cx="115" cy="286" r="12" fill="#7c2d12" stroke="#fed7aa" stroke-width="2"/>
  <line x1="115" y1="286" x2="140" y2="246" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/>
  <circle cx="140" cy="246" r="6" fill="#e2e8f0"/>
  <path d="M 88 250 A 34 34 0 0 1 128 226" fill="none" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="150" y="280" width="10" height="8" fill="#cbd5e1"/>
  <text x="115" y="345" font-size="13" fill="#fef3c7" font-weight="600" text-anchor="middle">crank charger</text>

  <!-- shake torch: tube, coil windings, magnet inside -->
  <circle cx="330" cy="286" r="26" fill="url(#glow)"/>
  <rect x="200" y="276" width="120" height="24" rx="11" fill="#e0f2fe" fill-opacity="0.35" stroke="#bae6fd" stroke-width="2"/>
  <rect x="316" y="274" width="12" height="28" rx="4" fill="#fde047" stroke="#ca8a04" stroke-width="1.5"/>
  <g stroke="#d97706" stroke-width="2.5">
    <line x1="252" y1="274" x2="252" y2="302"/>
    <line x1="258" y1="274" x2="258" y2="302"/>
    <line x1="264" y1="274" x2="264" y2="302"/>
    <line x1="270" y1="274" x2="270" y2="302"/>
    <line x1="276" y1="274" x2="276" y2="302"/>
  </g>
  <rect x="214" y="281" width="22" height="14" fill="#dc2626"/>
  <rect x="225" y="281" width="11" height="14" fill="#94a3b8"/>
  <line x1="208" y1="262" x2="306" y2="262" stroke="#fbbf24" stroke-width="2.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="262" y="345" font-size="13" fill="#fef3c7" font-weight="600" text-anchor="middle">shake torch</text>

  <!-- wireless pad with phone lying flat -->
  <ellipse cx="450" cy="304" rx="70" ry="9" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <g fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="5 4">
    <path d="M 430 300 C 424 250, 476 250, 470 300"/>
    <path d="M 418 300 C 404 222, 496 222, 482 300"/>
    <path d="M 406 300 C 384 196, 516 196, 494 300"/>
  </g>
  <rect x="396" y="282" width="108" height="16" rx="5" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
  <rect x="404" y="286" width="92" height="8" rx="2" fill="#1e3a8a"/>
  <polyline points="453,284 449,290 453,290 449,296" fill="none" stroke="#fde047" stroke-width="1.5"/>
  <circle cx="512" cy="304" r="3" fill="#4ade80"/>
  <text x="450" y="345" font-size="13" fill="#fef3c7" font-weight="600" text-anchor="middle">wireless pad</text>

  <!-- coin beside the pad -->
  <ellipse cx="552" cy="306" rx="13" ry="4" fill="#a8a29e" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="556" y="345" font-size="13" fill="#fef3c7" font-weight="600" text-anchor="middle">coin</text>

  <!-- wired earphones -->
  <path d="M 612 298 C 640 250, 700 250, 730 298" fill="none" stroke="#f1f5f9" stroke-width="3"/>
  <path d="M 671 262 C 672 285, 676 300, 700 308" fill="none" stroke="#f1f5f9" stroke-width="3"/>
  <circle cx="612" cy="298" r="11" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="612" cy="298" r="5" fill="#475569"/>
  <circle cx="730" cy="298" r="11" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="730" cy="298" r="5" fill="#475569"/>
  <rect x="696" y="303" width="18" height="7" rx="2" fill="#cbd5e1"/>
  <text x="671" y="345" font-size="13" fill="#fef3c7" font-weight="600" text-anchor="middle">wired earphones</text>

  <text x="400" y="400" font-size="15" fill="#e2e8f0" text-anchor="middle">In every gadget here, a changing magnetic field induces a voltage</text>
</svg>
