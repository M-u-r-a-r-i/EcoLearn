<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A city rooftop at night: a satellite TV dish fixed on the parapet points at a still satellite high in the sky, navigation satellites move along curved paths, a weather balloon carries a phone upwards, and on a table one phone shows a sky plot of satellites while a tablet shows a weather satellite's view of the Earth</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#e2e8f0" opacity="0.7">
    <circle cx="40" cy="30" r="1.5"/><circle cx="120" cy="70" r="1.2"/><circle cx="210" cy="24" r="1.5"/>
    <circle cx="300" cy="90" r="1.2"/><circle cx="380" cy="30" r="1.4"/><circle cx="470" cy="80" r="1.2"/>
    <circle cx="560" cy="20" r="1.5"/><circle cx="650" cy="60" r="1.2"/><circle cx="760" cy="36" r="1.5"/>
    <circle cx="90" cy="150" r="1.2"/><circle cx="700" cy="140" r="1.2"/><circle cx="520" cy="150" r="1.2"/>
  </g>

  <!-- Moon -->
  <circle cx="690" cy="80" r="26" fill="#f1f5f9"/>
  <circle cx="682" cy="72" r="5" fill="#cbd5e1"/>
  <circle cx="700" cy="90" r="4" fill="#cbd5e1"/>

  <!-- moving navigation satellites on curved dashed paths -->
  <path d="M 20 170 Q 200 40 420 60" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-dasharray="6 6" opacity="0.7"/>
  <g transform="translate(250 58)">
    <rect x="-7" y="-5" width="14" height="10" fill="#e2e8f0"/>
    <rect x="-27" y="-3" width="18" height="6" fill="#38bdf8"/>
    <rect x="9" y="-3" width="18" height="6" fill="#38bdf8"/>
  </g>
  <line x1="274" y1="72" x2="310" y2="66" stroke="#2563eb" stroke-width="3"/>
  <polygon points="322,64 308,59 310,72" fill="#2563eb"/>

  <path d="M 440 190 Q 560 110 790 120" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-dasharray="6 6" opacity="0.7"/>
  <g transform="translate(600 118)">
    <rect x="-7" y="-5" width="14" height="10" fill="#e2e8f0"/>
    <rect x="-27" y="-3" width="18" height="6" fill="#38bdf8"/>
    <rect x="9" y="-3" width="18" height="6" fill="#38bdf8"/>
  </g>

  <!-- the still satellite the dish points at -->
  <g transform="translate(560 30)">
    <rect x="-8" y="-6" width="16" height="12" fill="#fde68a"/>
    <rect x="-30" y="-3" width="20" height="6" fill="#f59e0b"/>
    <rect x="10" y="-3" width="20" height="6" fill="#f59e0b"/>
  </g>
  <text x="596" y="34" font-size="12" fill="#fde68a" font-weight="600">stays put</text>

  <!-- weather balloon carrying a phone -->
  <ellipse cx="120" cy="230" rx="30" ry="36" fill="#f8fafc" opacity="0.9"/>
  <line x1="120" y1="266" x2="120" y2="300" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="112" y="300" width="16" height="24" rx="3" fill="#f97316"/>
  <line x1="160" y1="300" x2="160" y2="250" stroke="#2563eb" stroke-width="3"/>
  <polygon points="160,238 153,252 167,252" fill="#2563eb"/>

  <!-- city skyline -->
  <g fill="#0f172a">
    <rect x="0" y="300" width="70" height="80"/><rect x="200" y="280" width="60" height="100"/>
    <rect x="270" y="310" width="50" height="70"/><rect x="740" y="290" width="60" height="90"/>
  </g>
  <g fill="#fde68a" opacity="0.55">
    <rect x="12" y="316" width="7" height="9"/><rect x="40" y="330" width="7" height="9"/>
    <rect x="214" y="296" width="7" height="9"/><rect x="236" y="320" width="7" height="9"/>
    <rect x="284" y="326" width="7" height="9"/><rect x="756" y="306" width="7" height="9"/>
  </g>

  <!-- rooftop parapet and floor -->
  <rect x="0" y="380" width="800" height="70" fill="#57534e"/>
  <rect x="330" y="330" width="470" height="50" fill="#78716c"/>
  <line x1="330" y1="330" x2="800" y2="330" stroke="#a8a29e" stroke-width="3"/>

  <!-- satellite TV dish on the parapet, pointing up towards the still satellite -->
  <rect x="712" y="300" width="8" height="30" fill="#94a3b8"/>
  <g transform="rotate(-35 716 290)">
    <path d="M 686 290 Q 716 330 746 290 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <line x1="716" y1="300" x2="716" y2="262" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="716" cy="260" r="4" fill="#475569"/>
  </g>
  <line x1="700" y1="270" x2="580" y2="46" stroke="#fde68a" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6"/>

  <!-- table with phone and tablet -->
  <rect x="380" y="300" width="250" height="10" rx="2" fill="#b45309"/>
  <rect x="392" y="310" width="8" height="70" fill="#78350f"/>
  <rect x="610" y="310" width="8" height="70" fill="#78350f"/>

  <!-- phone standing on a small stand: sky plot of satellites -->
  <polygon points="410,300 420,284 432,300" fill="#475569"/>
  <rect x="402" y="214" width="44" height="80" rx="6" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="424" cy="254" r="17" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="424" cy="254" r="8" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.7"/>
  <line x1="407" y1="254" x2="441" y2="254" stroke="#38bdf8" stroke-width="0.8" opacity="0.6"/>
  <line x1="424" y1="237" x2="424" y2="271" stroke="#38bdf8" stroke-width="0.8" opacity="0.6"/>
  <g fill="#4ade80">
    <circle cx="416" cy="246" r="2.5"/><circle cx="433" cy="250" r="2.5"/>
    <circle cx="428" cy="264" r="2.5"/><circle cx="414" cy="260" r="2.5"/>
  </g>

  <!-- tablet: weather satellite image of the Earth -->
  <rect x="470" y="226" width="120" height="74" rx="6" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="530" cy="263" r="30" fill="#1d4ed8"/>
  <path d="M 512 250 Q 522 240 534 248 Q 540 256 530 262 Q 520 270 514 262 Z" fill="#16a34a"/>
  <g fill="#f8fafc" opacity="0.85">
    <ellipse cx="540" cy="244" rx="12" ry="4"/>
    <ellipse cx="520" cy="276" rx="14" ry="4"/>
    <ellipse cx="546" cy="268" rx="8" ry="3"/>
  </g>

  <!-- caption labels -->
  <text x="424" y="206" font-size="12" fill="#bae6fd" font-weight="600" text-anchor="middle">sky plot</text>
  <text x="530" y="218" font-size="12" fill="#bae6fd" font-weight="600" text-anchor="middle">weather view</text>
</svg>
