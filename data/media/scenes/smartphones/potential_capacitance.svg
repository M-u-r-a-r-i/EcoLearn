<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A desk by a rainy window: a phone with raindrops on its screen being tapped by a finger, a metal biscuit tin with its lid off, a breadboard with two supercapacitor cells wired in a chain, a stylus and a fitness band with a small display</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748b"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="tin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset="0.5" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#wall)"/>

  <!-- rainy window -->
  <rect x="40" y="40" width="220" height="160" rx="4" fill="url(#sky)" stroke="#475569" stroke-width="4"/>
  <line x1="150" y1="40" x2="150" y2="200" stroke="#475569" stroke-width="3"/>
  <ellipse cx="100" cy="72" rx="46" ry="16" fill="#475569"/>
  <ellipse cx="205" cy="66" rx="40" ry="14" fill="#475569"/>
  <g stroke="#e0f2fe" stroke-width="2" opacity="0.8">
    <line x1="60" y1="100" x2="54" y2="116"/><line x1="86" y1="120" x2="80" y2="136"/>
    <line x1="112" y1="96" x2="106" y2="112"/><line x1="130" y1="150" x2="124" y2="166"/>
    <line x1="70" y1="160" x2="64" y2="176"/><line x1="172" y1="104" x2="166" y2="120"/>
    <line x1="198" y1="140" x2="192" y2="156"/><line x1="228" y1="100" x2="222" y2="116"/>
    <line x1="240" y1="160" x2="234" y2="176"/><line x1="182" y1="176" x2="176" y2="192"/>
  </g>
  <rect x="30" y="200" width="240" height="12" rx="2" fill="#94a3b8"/>

  <!-- tiled floor -->
  <rect x="0" y="390" width="800" height="60" fill="#a8a29e"/>
  <g stroke="#78716c" stroke-width="2">
    <line x1="0" y1="390" x2="800" y2="390"/>
    <line x1="0" y1="420" x2="800" y2="420"/>
    <line x1="90" y1="390" x2="70" y2="450"/><line x1="200" y1="390" x2="190" y2="450"/>
    <line x1="310" y1="390" x2="310" y2="450"/><line x1="420" y1="390" x2="430" y2="450"/>
    <line x1="530" y1="390" x2="550" y2="450"/><line x1="640" y1="390" x2="670" y2="450"/>
    <line x1="750" y1="390" x2="790" y2="450"/>
  </g>

  <!-- desk -->
  <rect x="40" y="300" width="740" height="12" rx="2" fill="#b45309"/>
  <rect x="52" y="312" width="10" height="78" fill="#78350f"/>
  <rect x="758" y="312" width="10" height="78" fill="#78350f"/>

  <!-- LEFT: biscuit tin with lid leaning beside it -->
  <rect x="70" y="236" width="90" height="64" rx="4" fill="url(#tin)" stroke="#64748b" stroke-width="2"/>
  <ellipse cx="115" cy="236" rx="45" ry="8" fill="#475569" stroke="#64748b" stroke-width="2"/>
  <rect x="164" y="232" width="14" height="68" rx="4" fill="url(#tin)" stroke="#64748b" stroke-width="2" transform="rotate(8 171 266)"/>
  <text x="120" y="330" font-size="12" fill="#fef3c7" font-weight="600" text-anchor="middle">steel tin</text>

  <!-- MIDDLE-LEFT: phone on a stand with raindrops, finger tapping -->
  <g transform="rotate(-12 290 260)">
    <rect x="262" y="178" width="60" height="118" rx="9" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
    <rect x="268" y="188" width="48" height="98" rx="4" fill="#38bdf8"/>
    <g fill="#e0f2fe" stroke="#ffffff" stroke-width="1" opacity="0.95">
      <ellipse cx="280" cy="206" rx="4" ry="5"/><ellipse cx="302" cy="224" rx="5" ry="6"/>
      <ellipse cx="284" cy="250" rx="3.5" ry="4.5"/><ellipse cx="306" cy="266" rx="4" ry="5"/>
    </g>
  </g>
  <rect x="270" y="292" width="54" height="8" rx="2" fill="#475569"/>
  <!-- finger coming in from the right -->
  <path d="M 380 214 L 324 232 Q 314 236 318 244 Q 322 250 332 246 L 384 234 Z" fill="#d6a67a" stroke="#92400e" stroke-width="1.5"/>
  <ellipse cx="322" cy="240" rx="4" ry="3" fill="#f5d0b0"/>
  <text x="300" y="330" font-size="12" fill="#fef3c7" font-weight="600" text-anchor="middle">drops on a touchscreen</text>

  <!-- MIDDLE-RIGHT: breadboard with two supercapacitors in series -->
  <rect x="420" y="272" width="150" height="28" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <g fill="#94a3b8">
    <circle cx="432" cy="280" r="1.5"/><circle cx="444" cy="280" r="1.5"/><circle cx="456" cy="280" r="1.5"/>
    <circle cx="468" cy="280" r="1.5"/><circle cx="480" cy="280" r="1.5"/><circle cx="492" cy="280" r="1.5"/>
    <circle cx="504" cy="280" r="1.5"/><circle cx="516" cy="280" r="1.5"/><circle cx="528" cy="280" r="1.5"/>
    <circle cx="540" cy="280" r="1.5"/><circle cx="552" cy="280" r="1.5"/><circle cx="564" cy="280" r="1.5"/>
    <circle cx="432" cy="292" r="1.5"/><circle cx="444" cy="292" r="1.5"/><circle cx="456" cy="292" r="1.5"/>
    <circle cx="468" cy="292" r="1.5"/><circle cx="480" cy="292" r="1.5"/><circle cx="492" cy="292" r="1.5"/>
    <circle cx="504" cy="292" r="1.5"/><circle cx="516" cy="292" r="1.5"/><circle cx="528" cy="292" r="1.5"/>
    <circle cx="540" cy="292" r="1.5"/><circle cx="552" cy="292" r="1.5"/><circle cx="564" cy="292" r="1.5"/>
  </g>
  <!-- two cylinders -->
  <rect x="446" y="226" width="30" height="46" rx="5" fill="#1d4ed8" stroke="#93c5fd" stroke-width="1.5"/>
  <ellipse cx="461" cy="226" rx="15" ry="4" fill="#60a5fa"/>
  <rect x="512" y="226" width="30" height="46" rx="5" fill="#1d4ed8" stroke="#93c5fd" stroke-width="1.5"/>
  <ellipse cx="527" cy="226" rx="15" ry="4" fill="#60a5fa"/>
  <!-- chain wiring: in, between, out -->
  <path d="M 420 262 L 452 262" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <path d="M 470 262 Q 494 246 518 262" fill="none" stroke="#facc15" stroke-width="2.5"/>
  <path d="M 536 262 L 572 262" fill="none" stroke="#0f172a" stroke-width="2.5"/>
  <text x="495" y="330" font-size="12" fill="#fef3c7" font-weight="600" text-anchor="middle">supercapacitors in a chain</text>

  <!-- RIGHT: stylus and fitness band -->
  <g transform="rotate(-6 630 294) translate(-25 0)">
    <rect x="600" y="288" width="100" height="8" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon points="700,288 714,292 700,296" fill="#475569"/>
  </g>
  <text x="630" y="330" font-size="12" fill="#fef3c7" font-weight="600" text-anchor="middle">stylus</text>
  <!-- fitness band -->
  <ellipse cx="738" cy="286" rx="30" ry="12" fill="none" stroke="#0f766e" stroke-width="8"/>
  <rect x="718" y="275" width="40" height="22" rx="4" fill="#1f2937" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="722" y="279" width="32" height="14" rx="2" fill="#cbd5e1"/>
  <g fill="#334155" transform="translate(13 53)">
    <rect x="713" y="228" width="3" height="10"/><rect x="719" y="228" width="8" height="2"/>
    <rect x="725" y="228" width="2" height="10"/><rect x="719" y="236" width="8" height="2"/>
    <rect x="731" y="228" width="6" height="2"/><rect x="735" y="228" width="2" height="10"/>
  </g>
  <text x="738" y="330" font-size="12" fill="#fef3c7" font-weight="600" text-anchor="middle">fitness band</text>
</svg>
