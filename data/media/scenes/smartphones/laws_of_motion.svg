<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A study room at night: a camera drone hovers pushing air down, a phone tumbles off a shelf towards a tiled floor, and on the desk a power bank has slipped over the edge and hangs by its cable, dragging the phone towards the edge</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#wall)"/>

  <!-- window with night city -->
  <rect x="300" y="40" width="200" height="140" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="4"/>
  <line x1="400" y1="40" x2="400" y2="180" stroke="#64748b" stroke-width="3"/>
  <g fill="#fde68a" opacity="0.6">
    <rect x="320" y="120" width="8" height="10"/><rect x="345" y="100" width="8" height="10"/>
    <rect x="420" y="130" width="8" height="10"/><rect x="455" y="110" width="8" height="10"/>
    <rect x="470" y="140" width="8" height="10"/>
  </g>
  <circle cx="460" cy="70" r="12" fill="#e2e8f0" opacity="0.8"/>

  <!-- tiled floor -->
  <rect x="0" y="380" width="800" height="70" fill="#a8a29e"/>
  <g stroke="#78716c" stroke-width="2">
    <line x1="0" y1="380" x2="800" y2="380"/>
    <line x1="0" y1="414" x2="800" y2="414"/>
    <line x1="80" y1="380" x2="60" y2="450"/><line x1="180" y1="380" x2="170" y2="450"/>
    <line x1="280" y1="380" x2="280" y2="450"/><line x1="380" y1="380" x2="390" y2="450"/>
    <line x1="480" y1="380" x2="500" y2="450"/><line x1="580" y1="380" x2="610" y2="450"/>
    <line x1="680" y1="380" x2="720" y2="450"/>
  </g>

  <!-- LEFT: camera drone hovering -->
  <g>
    <rect x="70" y="108" width="120" height="20" rx="8" fill="#e2e8f0"/>
    <line x1="80" y1="112" x2="52" y2="96" stroke="#cbd5e1" stroke-width="6"/>
    <line x1="180" y1="112" x2="208" y2="96" stroke="#cbd5e1" stroke-width="6"/>
    <ellipse cx="46" cy="92" rx="34" ry="5" fill="#94a3b8" opacity="0.8"/>
    <ellipse cx="214" cy="92" rx="34" ry="5" fill="#94a3b8" opacity="0.8"/>
    <rect x="118" y="128" width="24" height="14" rx="3" fill="#0f172a"/>
    <circle cx="130" cy="136" r="4" fill="#38bdf8"/>
  </g>
  <!-- downwash of air -->
  <g stroke="#7dd3fc" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.8">
    <line x1="30" y1="104" x2="26" y2="180"/><line x1="48" y1="104" x2="48" y2="190"/><line x1="66" y1="104" x2="70" y2="180"/>
    <line x1="196" y1="104" x2="192" y2="180"/><line x1="214" y1="104" x2="214" y2="190"/><line x1="232" y1="104" x2="236" y2="180"/>
  </g>
  <g fill="#7dd3fc">
    <polygon points="48,202 42,188 54,188"/>
    <polygon points="214,202 208,188 220,188"/>
  </g>
  <!-- thrust on drone (force, red) -->
  <line x1="130" y1="104" x2="130" y2="58" stroke="#dc2626" stroke-width="5"/>
  <polygon points="130,44 122,60 138,60" fill="#dc2626"/>
  <text x="140" y="60" font-size="13" fill="#fecaca" font-weight="600">air pushes up</text>
  <text x="130" y="222" font-size="13" fill="#bae6fd" font-weight="600" text-anchor="middle">drone pushes air down</text>

  <!-- MIDDLE: shelf and a phone tumbling towards the tiles -->
  <rect x="250" y="220" width="110" height="10" rx="2" fill="#a16207"/>
  <rect x="262" y="230" width="6" height="18" fill="#78350f"/>
  <rect x="340" y="230" width="6" height="18" fill="#78350f"/>
  <rect x="352" y="244" width="14" height="28" rx="3" fill="#0f172a" opacity="0.3" transform="rotate(20 359 258)"/>
  <rect x="362" y="286" width="14" height="28" rx="3" fill="#0f172a" opacity="0.55" transform="rotate(50 369 300)"/>
  <rect x="368" y="330" width="16" height="30" rx="3" fill="#0f172a" stroke="#f472b6" stroke-width="3" transform="rotate(80 376 345)"/>
  <line x1="410" y1="262" x2="410" y2="322" stroke="#2563eb" stroke-width="4"/>
  <polygon points="410,336 402,320 418,320" fill="#2563eb"/>
  <text x="420" y="300" font-size="13" fill="#bfdbfe" font-weight="600">v</text>
  <text x="376" y="398" font-size="12" fill="#292524" text-anchor="middle" font-weight="600">hard tiles</text>

  <!-- RIGHT: desk with phone dragged by a dangling power bank -->
  <rect x="500" y="250" width="240" height="12" rx="2" fill="#b45309"/>
  <rect x="510" y="262" width="10" height="118" fill="#78350f"/>
  <rect x="712" y="262" width="10" height="118" fill="#78350f"/>
  <!-- laptop on the desk -->
  <rect x="515" y="226" width="80" height="24" rx="2" fill="#475569"/>
  <polygon points="515,226 540,172 612,172 595,226" fill="#64748b"/>
  <polygon points="545,178 606,178 590,220 528,220" fill="#1e3a8a" opacity="0.7"/>
  <!-- phone on the desk -->
  <rect x="632" y="240" width="46" height="10" rx="3" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- cable from phone over the edge -->
  <path d="M 678 245 L 738 248 Q 746 250 746 262 L 746 300" fill="none" stroke="#f8fafc" stroke-width="3"/>
  <!-- dangling power bank -->
  <rect x="734" y="300" width="24" height="46" rx="5" fill="#16a34a" stroke="#bbf7d0" stroke-width="1.5"/>
  <circle cx="746" cy="310" r="2.5" fill="#bbf7d0"/>
  <!-- motion arrows (velocity, blue) -->
  <line x1="640" y1="228" x2="690" y2="228" stroke="#2563eb" stroke-width="4"/>
  <polygon points="702,228 688,221 688,235" fill="#2563eb"/>
  <line x1="774" y1="304" x2="774" y2="342" stroke="#2563eb" stroke-width="4"/>
  <polygon points="774,354 767,340 781,340" fill="#2563eb"/>
</svg>
