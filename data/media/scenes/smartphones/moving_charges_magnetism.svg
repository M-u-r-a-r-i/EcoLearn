<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A desk with a phone lying on a charging cable showing a swung compass arrow, a wireless charging pad with its coil exposed, a flip-cover case with a small magnet in its flap, and a speaker and a small cylinder-shaped vibration motor taken apart</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3412"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#wall)"/>

  <!-- shelf with lamp glow -->
  <rect x="600" y="40" width="120" height="8" rx="2" fill="#64748b"/>
  <path d="M640 40 L660 12 L680 40 Z" fill="#fbbf24"/>

  <!-- desk top (seen from above-ish) -->
  <polygon points="40,190 760,190 800,420 0,420" fill="url(#top)"/>
  <rect x="0" y="420" width="800" height="30" fill="#7c2d12"/>

  <!-- ===== charging cable running across the desk ===== -->
  <path d="M60 330 C160 330 200 300 300 300 L520 300 C600 300 640 330 740 336" fill="none" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round"/>
  <rect x="728" y="328" width="34" height="18" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>

  <!-- ===== LEFT: wireless charging pad with coil exposed ===== -->
  <ellipse cx="150" cy="248" rx="92" ry="34" fill="#0f172a"/>
  <ellipse cx="150" cy="242" rx="92" ry="34" fill="#1f2937" stroke="#475569" stroke-width="2"/>
  <g fill="none" stroke="#f59e0b" stroke-width="3">
    <ellipse cx="150" cy="242" rx="62" ry="22"/>
    <ellipse cx="150" cy="242" rx="52" ry="18"/>
    <ellipse cx="150" cy="242" rx="42" ry="14.5"/>
    <ellipse cx="150" cy="242" rx="32" ry="11"/>
    <ellipse cx="150" cy="242" rx="22" ry="7.5"/>
  </g>
  <!-- field lines looping up from the coil (circular-loop field shape) -->
  <g fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 5" opacity="0.9">
    <path d="M150 238 L150 150"/>
    <path d="M138 238 C130 180 90 160 70 200 C62 220 80 240 100 244"/>
    <path d="M162 238 C170 180 210 160 230 200 C238 220 220 240 200 244"/>
  </g>
  <polygon points="150,146 144,160 156,160" fill="#38bdf8"/>

  <!-- ===== CENTRE: phone lying on the cable, compass app ===== -->
  <g transform="rotate(-6 400 270)">
    <rect x="352" y="206" width="96" height="150" rx="14" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
    <rect x="360" y="218" width="80" height="126" rx="8" fill="#111827"/>
    <circle cx="400" cy="282" r="32" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <text x="400" y="244" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="600">N</text>
    <!-- needle swung well away from north -->
    <g transform="rotate(62 400 282)">
      <polygon points="400,254 394,282 406,282" fill="#ef4444"/>
      <polygon points="400,310 394,282 406,282" fill="#e2e8f0"/>
    </g>
    <circle cx="400" cy="282" r="3" fill="#0f172a"/>
  </g>
  <!-- little current arrow on the cable -->
  <g stroke="#2563eb" stroke-width="3" fill="#2563eb">
    <line x1="476" y1="288" x2="508" y2="288"/>
    <polygon points="514,288 504,282 504,294" stroke="none"/>
  </g>
  <text x="494" y="280" font-size="14" fill="#bfdbfe" font-style="italic" text-anchor="middle">I</text>

  <!-- ===== RIGHT: flip cover case, flap half open, magnet disc ===== -->
  <rect x="560" y="196" width="72" height="116" rx="10" fill="#1e3a8a" stroke="#93c5fd" stroke-width="2"/>
  <rect x="570" y="206" width="52" height="96" rx="6" fill="#0f172a"/>
  <polygon points="632,200 704,178 704,290 632,312" fill="#2563eb" stroke="#93c5fd" stroke-width="2"/>
  <rect x="650" y="210" width="36" height="46" rx="4" fill="#bfdbfe" opacity="0.35"/>
  <!-- magnet disc in the flap corner -->
  <circle cx="690" cy="276" r="9" fill="#dc2626"/>
  <path d="M681 276 A9 9 0 0 0 699 276 Z" fill="#94a3b8"/>
  <!-- sensor spot inside phone -->
  <rect x="604" y="282" width="10" height="8" fill="#22c55e"/>
  <path d="M680 272 C660 258 630 262 614 282" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- ===== BOTTOM LEFT: speaker taken apart ===== -->
  <!-- ring magnet -->
  <ellipse cx="250" cy="380" rx="34" ry="12" fill="#475569"/>
  <ellipse cx="250" cy="376" rx="34" ry="12" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  <ellipse cx="250" cy="376" rx="14" ry="5" fill="#334155"/>
  <!-- voice coil -->
  <rect x="302" y="356" width="24" height="22" fill="#b45309"/>
  <g stroke="#f59e0b" stroke-width="1.5">
    <line x1="302" y1="360" x2="326" y2="360"/><line x1="302" y1="364" x2="326" y2="364"/>
    <line x1="302" y1="368" x2="326" y2="368"/><line x1="302" y1="372" x2="326" y2="372"/>
  </g>
  <ellipse cx="314" cy="356" rx="12" ry="4" fill="#fde68a" stroke="#b45309" stroke-width="1"/>
  <!-- membrane -->
  <ellipse cx="370" cy="376" rx="26" ry="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <ellipse cx="370" cy="376" rx="10" ry="4" fill="#cbd5e1"/>

  <!-- ===== BOTTOM RIGHT: cylinder vibration motor with off-centre weight ===== -->
  <rect x="470" y="364" width="60" height="26" rx="6" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <line x1="530" y1="377" x2="552" y2="377" stroke="#64748b" stroke-width="3"/>
  <path d="M552 366 L552 388 A14 14 0 0 0 552 366 Z" fill="#d97706" stroke="#92400e" stroke-width="1.5"/>
  <g fill="none" stroke="#fde68a" stroke-width="2" opacity="0.9">
    <path d="M574 362 A22 22 0 0 1 574 392"/>
    <path d="M584 356 A30 30 0 0 1 584 398"/>
  </g>
  <line x1="480" y1="390" x2="476" y2="404" stroke="#dc2626" stroke-width="2"/>
  <line x1="490" y1="390" x2="494" y2="404" stroke="#0f172a" stroke-width="2"/>
</svg>
