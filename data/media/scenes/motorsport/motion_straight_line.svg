<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A long straight at a race circuit: a car accelerates away from a timing beam at the start line, distance boards marked 0 m, 100 m and 200 m stand along the grass verge, and an arrow below them marks the positive direction of travel</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#sky)"/>

  <!-- distant hills -->
  <path d="M0,196 Q150,150 320,188 T800,178 L800,232 L0,232 z" fill="#86efac"/>

  <!-- grandstand -->
  <rect x="60" y="150" width="270" height="72" fill="#64748b"/>
  <polygon points="50,150 340,150 322,128 68,128" fill="#334155"/>
  <g fill="#cbd5e1">
    <rect x="72" y="162" width="246" height="6"/>
    <rect x="72" y="178" width="246" height="6"/>
    <rect x="72" y="194" width="246" height="6"/>
  </g>

  <!-- speed-trap board on a pole -->
  <rect x="612" y="196" width="10" height="40" fill="#334155"/>
  <rect x="540" y="130" width="230" height="70" rx="8" fill="#020617" stroke="#475569" stroke-width="4"/>
  <text x="556" y="156" font-size="13" fill="#94a3b8" font-weight="600">SPEED TRAP</text>
  <text x="556" y="188" font-size="28" fill="#34d399" font-weight="700" font-family="Consolas, monospace">144</text>
  <text x="626" y="188" font-size="14" fill="#34d399" font-weight="600">km/h</text>

  <!-- track -->
  <rect x="0" y="232" width="800" height="10" fill="#e5e7eb"/>
  <rect x="0" y="242" width="800" height="108" fill="#475569"/>
  <g fill="#dc2626">
    <rect x="0" y="236" width="40" height="6"/><rect x="80" y="236" width="40" height="6"/>
    <rect x="160" y="236" width="40" height="6"/><rect x="240" y="236" width="40" height="6"/>
    <rect x="320" y="236" width="40" height="6"/><rect x="400" y="236" width="40" height="6"/>
    <rect x="480" y="236" width="40" height="6"/><rect x="560" y="236" width="40" height="6"/>
    <rect x="640" y="236" width="40" height="6"/><rect x="720" y="236" width="40" height="6"/>
  </g>

  <!-- timing beam across the track at the start line -->
  <rect x="112" y="228" width="12" height="26" fill="#0f172a"/>
  <rect x="112" y="342" width="12" height="24" fill="#0f172a"/>
  <line x1="118" y1="248" x2="118" y2="348" stroke="#f97316" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="132" y="262" font-size="13" fill="#e2e8f0" font-weight="600">timing beam at the start line</text>

  <!-- race car (generic, no markings), accelerating to the right -->
  <g>
    <rect x="322" y="288" width="44" height="11" rx="2" fill="#0f172a"/>
    <rect x="548" y="292" width="19" height="31" rx="2" fill="#0f172a"/>
    <path d="M340,302 L396,291 L480,289 L548,300 L562,313 L548,322 L480,326 L396,324 L340,318 z" fill="#dc2626"/>
    <path d="M442,291 Q456,276 478,283 L480,292 z" fill="#1e293b"/>
    <circle cx="462" cy="286" r="6" fill="#facc15"/>
    <rect x="364" y="279" width="38" height="17" rx="6" fill="#111827"/>
    <rect x="364" y="315" width="38" height="17" rx="6" fill="#111827"/>
    <rect x="500" y="280" width="34" height="15" rx="6" fill="#111827"/>
    <rect x="500" y="317" width="34" height="15" rx="6" fill="#111827"/>
    <g stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" opacity="0.85">
      <line x1="232" y1="294" x2="312" y2="294"/>
      <line x1="208" y1="307" x2="312" y2="307"/>
      <line x1="244" y1="320" x2="312" y2="320"/>
    </g>
  </g>

  <!-- grass verge -->
  <rect x="0" y="350" width="800" height="100" fill="#16a34a"/>

  <!-- distance boards along the verge -->
  <g>
    <rect x="115" y="384" width="6" height="22" fill="#334155"/>
    <rect x="92" y="356" width="52" height="28" rx="3" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
    <text x="118" y="376" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">0</text>
  </g>
  <g>
    <rect x="377" y="384" width="6" height="22" fill="#334155"/>
    <rect x="354" y="356" width="52" height="28" rx="3" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
    <text x="380" y="376" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">100</text>
  </g>
  <g>
    <rect x="637" y="384" width="6" height="22" fill="#334155"/>
    <rect x="614" y="356" width="52" height="28" rx="3" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
    <text x="640" y="376" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">200</text>
  </g>

  <!-- the measuring line: origin, ticks and positive direction -->
  <line x1="96" y1="420" x2="742" y2="420" stroke="#2563eb" stroke-width="4"/>
  <polygon points="742,412 766,420 742,428" fill="#2563eb"/>
  <g stroke="#2563eb" stroke-width="4">
    <line x1="118" y1="412" x2="118" y2="428"/>
    <line x1="380" y1="412" x2="380" y2="428"/>
    <line x1="640" y1="412" x2="640" y2="428"/>
  </g>
  <text x="118" y="444" font-size="13" fill="#f0fdf4" font-weight="600" text-anchor="middle">origin</text>
  <text x="380" y="444" font-size="13" fill="#f0fdf4" font-weight="600" text-anchor="middle">100 m</text>
  <text x="640" y="444" font-size="13" fill="#f0fdf4" font-weight="600" text-anchor="middle">200 m</text>
  <text x="700" y="409" font-size="15" fill="#f0fdf4" font-weight="700" text-anchor="middle">positive direction</text>
</svg>
