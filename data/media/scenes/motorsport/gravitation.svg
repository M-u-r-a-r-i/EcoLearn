<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A hill-climb paddock: a team truck with an uplink dish on its roof aimed at a geostationary satellite, a race car standing on a weighbridge with a navigation aerial on its engine cover receiving a moving satellite, a drop-test rig with a falling mass, and the hairpin road climbing the hill behind</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="#ffffff"/>
  <rect width="800" height="256" fill="url(#sky)"/>

  <!-- the hill the course climbs, with its switchback road -->
  <path d="M0,150 Q100,96 200,140 T400,180 L800,200 L800,256 L0,256 z" fill="#86efac"/>
  <path d="M14,206 L76,194 L20,182 L84,170 L28,158 L80,150" fill="none" stroke="#f1f5f9" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="192" y="186" font-size="12.5" fill="#14532d" font-weight="700">hill-climb road</text>

  <!-- navigation satellite: moving, a few hours per orbit -->
  <text x="300" y="42" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="middle">navigation satellite (moving)</text>
  <rect x="264" y="59" width="24" height="10" fill="#1d4ed8"/>
  <rect x="312" y="59" width="24" height="10" fill="#1d4ed8"/>
  <rect x="290" y="56" width="20" height="16" rx="2" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>

  <!-- geostationary satellite: fixed above the equator -->
  <rect x="596" y="54" width="28" height="12" fill="#1d4ed8"/>
  <rect x="656" y="54" width="28" height="12" fill="#1d4ed8"/>
  <rect x="628" y="50" width="24" height="20" rx="2" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>
  <text x="792" y="94" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="end">geostationary satellite</text>
  <text x="792" y="110" font-size="12.5" fill="#0f172a" text-anchor="end">(never moves in the sky)</text>

  <!-- tarmac paddock -->
  <rect x="0" y="256" width="800" height="194" fill="#4b5563"/>
  <rect x="0" y="262" width="800" height="4" fill="#f8fafc"/>

  <!-- signal paths down to the ground -->
  <line x1="630" y1="71" x2="158" y2="158" stroke="#f59e0b" stroke-width="2" stroke-dasharray="7 5"/>
  <line x1="300" y1="84" x2="428" y2="322" stroke="#f59e0b" stroke-width="2" stroke-dasharray="7 5"/>

  <!-- team truck with the uplink dish on its roof -->
  <rect x="44" y="196" width="176" height="64" rx="4" fill="#1e40af"/>
  <rect x="220" y="214" width="50" height="46" rx="4" fill="#1d4ed8"/>
  <rect x="228" y="220" width="34" height="16" rx="2" fill="#bfdbfe"/>
  <circle cx="84" cy="262" r="14" fill="#111827"/>
  <circle cx="176" cy="262" r="14" fill="#111827"/>
  <circle cx="242" cy="262" r="14" fill="#111827"/>
  <rect x="146" y="180" width="7" height="18" fill="#334155"/>
  <g transform="rotate(-28 150 170)">
    <ellipse cx="150" cy="170" rx="27" ry="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  </g>
  <line x1="150" y1="170" x2="169" y2="155" stroke="#64748b" stroke-width="3"/>
  <circle cx="169" cy="155" r="3.5" fill="#334155"/>
  <text x="40" y="300" font-size="12.5" fill="#f8fafc" font-weight="600">uplink dish: aimed once, never moved again</text>

  <!-- race car standing on the weighbridge -->
  <text x="500" y="290" font-size="12.5" fill="#f8fafc" font-weight="600">navigation aerial</text>
  <line x1="496" y1="294" x2="440" y2="318" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="320" y="330" width="42" height="7" fill="#0f172a"/>
  <rect x="320" y="330" width="6" height="18" fill="#0f172a"/>
  <rect x="342" y="337" width="6" height="20" fill="#0f172a"/>
  <path d="M330,361 L352,343 L410,334 L478,331 L540,341 L578,354 L578,361 z" fill="#0891b2"/>
  <rect x="570" y="356" width="34" height="6" fill="#0f172a"/>
  <rect x="418" y="322" width="20" height="9" rx="2" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <circle cx="462" cy="326" r="10" fill="#facc15"/>
  <rect x="464" y="322" width="10" height="6" rx="2" fill="#1e293b"/>
  <circle cx="370" cy="361" r="19" fill="#111827"/>
  <circle cx="370" cy="361" r="8" fill="#64748b"/>
  <circle cx="530" cy="361" r="19" fill="#111827"/>
  <circle cx="530" cy="361" r="8" fill="#64748b"/>

  <rect x="300" y="380" width="300" height="14" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="316" y="394" width="12" height="14" fill="#64748b"/>
  <rect x="572" y="394" width="12" height="14" fill="#64748b"/>
  <text x="450" y="430" font-size="12.5" fill="#f8fafc" font-weight="600" text-anchor="middle">weighbridge: the scale reads mass, not weight</text>

  <!-- drop-test rig beside the scrutineering bay -->
  <rect x="650" y="242" width="116" height="10" fill="#475569"/>
  <rect x="656" y="250" width="8" height="142" fill="#334155"/>
  <rect x="752" y="250" width="8" height="142" fill="#334155"/>
  <rect x="640" y="392" width="140" height="8" fill="#334155"/>
  <line x1="708" y1="252" x2="708" y2="300" stroke="#94a3b8" stroke-width="2"/>
  <rect x="692" y="300" width="32" height="26" rx="3" fill="#0f172a"/>
  <rect x="676" y="376" width="64" height="10" fill="#94a3b8"/>
  <line x1="744" y1="306" x2="744" y2="362" stroke="#16a34a" stroke-width="3"/>
  <polygon points="738,362 750,362 744,374" fill="#16a34a"/>
  <text x="756" y="340" font-size="14" fill="#16a34a" font-weight="700">g</text>
  <text x="710" y="422" font-size="12.5" fill="#f0fdf4" font-weight="600" text-anchor="middle">drop test</text>
</svg>
