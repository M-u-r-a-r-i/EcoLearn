<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A race circuit seen from above: cars on the straights and one sweeping through a curved corner with a blue velocity arrow along the tangent, and a trackside replay screen showing a car arcing over a crest</title>

  <!-- grass / infield -->
  <rect width="800" height="450" fill="#86efac"/>
  <rect y="330" width="800" height="120" fill="#6ee7b7" opacity="0.45"/>

  <!-- paddock strip along the top edge, seen from above -->
  <rect width="800" height="58" fill="#cbd5e1"/>
  <g fill="#94a3b8">
    <rect x="30" y="8" width="90" height="34" rx="4"/>
    <rect x="140" y="8" width="90" height="34" rx="4"/>
    <rect x="250" y="8" width="90" height="34" rx="4"/>
    <rect x="360" y="8" width="90" height="34" rx="4"/>
  </g>
  <g fill="#e2e8f0">
    <rect x="500" y="10" width="120" height="30" rx="3"/>
    <rect x="640" y="10" width="120" height="30" rx="3"/>
  </g>
  <text x="18" y="52" font-size="12" fill="#475569" font-weight="600">paddock</text>

  <!-- track: white edge lines, then tarmac -->
  <path d="M -20,392 L 380,392 C 580,392 680,320 680,236 C 680,152 596,104 496,104 L 60,104"
        fill="none" stroke="#f1f5f9" stroke-width="80"/>
  <path d="M -20,392 L 380,392 C 580,392 680,320 680,236 C 680,152 596,104 496,104 L 60,104"
        fill="none" stroke="#475569" stroke-width="70"/>

  <!-- red-and-white kerb along the inside of the corner -->
  <path d="M 380,357 C 556,357 645,318 645,236 C 645,170 585,139 496,139"
        fill="none" stroke="#f8fafc" stroke-width="11"/>
  <path d="M 380,357 C 556,357 645,318 645,236 C 645,170 585,139 496,139"
        fill="none" stroke="#dc2626" stroke-width="11" stroke-dasharray="20 20"/>

  <!-- the line the cars follow, dashed down the middle of the tarmac -->
  <path d="M -20,392 L 380,392 C 580,392 680,320 680,236 C 680,152 596,104 496,104 L 60,104"
        fill="none" stroke="#f8fafc" stroke-width="3" stroke-dasharray="18 16" opacity="0.8"/>

  <!-- start-finish line across the bottom straight -->
  <g>
    <rect x="150" y="357" width="20" height="70" fill="#f8fafc"/>
    <g fill="#0f172a">
      <rect x="150" y="357" width="10" height="10"/><rect x="160" y="367" width="10" height="10"/>
      <rect x="150" y="377" width="10" height="10"/><rect x="160" y="387" width="10" height="10"/>
      <rect x="150" y="397" width="10" height="10"/><rect x="160" y="407" width="10" height="10"/>
      <rect x="150" y="417" width="10" height="10"/>
    </g>
  </g>

  <!-- car on the bottom straight, seen from above, heading right -->
  <g transform="translate(270,392)">
    <rect x="-34" y="-14" width="7" height="28" rx="2" fill="#0f172a"/>
    <rect x="-26" y="-19" width="13" height="9" rx="3" fill="#111827"/>
    <rect x="-26" y="10" width="13" height="9" rx="3" fill="#111827"/>
    <rect x="13" y="-19" width="13" height="9" rx="3" fill="#111827"/>
    <rect x="13" y="10" width="13" height="9" rx="3" fill="#111827"/>
    <rect x="-28" y="-10" width="56" height="20" rx="7" fill="#dc2626"/>
    <rect x="26" y="-13" width="7" height="26" rx="2" fill="#0f172a"/>
    <circle cx="0" cy="0" r="5" fill="#111827"/>
  </g>

  <!-- car sweeping through the corner, with its velocity along the tangent -->
  <g transform="translate(605,345) rotate(-30)">
    <rect x="-34" y="-14" width="7" height="28" rx="2" fill="#0f172a"/>
    <rect x="-26" y="-19" width="13" height="9" rx="3" fill="#111827"/>
    <rect x="-26" y="10" width="13" height="9" rx="3" fill="#111827"/>
    <rect x="13" y="-19" width="13" height="9" rx="3" fill="#111827"/>
    <rect x="13" y="10" width="13" height="9" rx="3" fill="#111827"/>
    <rect x="-28" y="-10" width="56" height="20" rx="7" fill="#0ea5e9"/>
    <rect x="26" y="-13" width="7" height="26" rx="2" fill="#0f172a"/>
    <circle cx="0" cy="0" r="5" fill="#111827"/>
  </g>
  <defs>
    <marker id="vhead" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12"
            refX="15" refY="6" orient="auto">
      <path d="M0,0 L16,6 L0,12 z" fill="#2563eb"/>
    </marker>
  </defs>
  <line x1="638" y1="326" x2="688" y2="297" stroke="#2563eb" stroke-width="5"
        marker-end="url(#vhead)" stroke-linecap="round"/>
  <text x="692" y="283" font-size="17" fill="#bfdbfe" font-weight="700">v</text>
  <text x="14" y="445" font-size="13" fill="#065f46" font-weight="700">the velocity points along the track, never across it</text>

  <!-- car on the top straight, heading left -->
  <g transform="translate(300,104) rotate(180)">
    <rect x="-34" y="-14" width="7" height="28" rx="2" fill="#0f172a"/>
    <rect x="-26" y="-19" width="13" height="9" rx="3" fill="#111827"/>
    <rect x="-26" y="10" width="13" height="9" rx="3" fill="#111827"/>
    <rect x="13" y="-19" width="13" height="9" rx="3" fill="#111827"/>
    <rect x="13" y="10" width="13" height="9" rx="3" fill="#111827"/>
    <rect x="-28" y="-10" width="56" height="20" rx="7" fill="#facc15"/>
    <rect x="26" y="-13" width="7" height="26" rx="2" fill="#0f172a"/>
    <circle cx="0" cy="0" r="5" fill="#111827"/>
  </g>

  <!-- trackside replay screen in the infield -->
  <rect x="198" y="300" width="10" height="40" fill="#334155"/>
  <rect x="312" y="300" width="10" height="40" fill="#334155"/>
  <rect x="120" y="152" width="282" height="152" rx="8" fill="#020617" stroke="#475569" stroke-width="4"/>
  <text x="134" y="176" font-size="12" fill="#94a3b8" font-weight="700">REPLAY</text>
  <text x="226" y="176" font-size="12" fill="#64748b">over the crest</text>
  <!-- take-off ramp and landing inside the screen -->
  <polygon points="132,280 132,260 204,260 256,232 268,232 268,280" fill="#334155"/>
  <polygon points="330,280 330,256 392,256 392,280" fill="#334155"/>
  <path d="M 268,230 Q 302,200 336,254" fill="none" stroke="#fbbf24" stroke-width="3"
        stroke-dasharray="7 7"/>
  <g transform="translate(300,208) rotate(-6)">
    <rect x="-20" y="-6" width="40" height="11" rx="3" fill="#dc2626"/>
    <path d="M-8,-6 L-2,-13 L9,-13 L13,-6 z" fill="#1e293b"/>
    <circle cx="-12" cy="6" r="4.5" fill="#111827"/>
    <circle cx="12" cy="6" r="4.5" fill="#111827"/>
  </g>
  <text x="134" y="297" font-size="11" fill="#94a3b8">the car leaves the crest and follows an arc</text>

  <!-- marshal post -->
  <rect x="694" y="392" width="46" height="30" rx="4" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="717" y="412" font-size="12" fill="#0f172a" font-weight="700" text-anchor="middle">POST</text>
  <rect x="746" y="386" width="5" height="36" fill="#334155"/>
  <polygon points="751,386 782,394 751,402" fill="#facc15"/>
</svg>
