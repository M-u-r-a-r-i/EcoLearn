<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A pit lane in the afternoon sun: a stack of tyres in electric tyre blankets with a probe thermometer, a race car in its pit box with a front brake disc glowing orange and heat shimmering from its exhaust, and a tall compressed-air bottle feeding a wheel gun</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="0.5" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="#ffffff"/>
  <rect width="800" height="256" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="730" cy="52" r="28" fill="#facc15"/>
  <g stroke="#facc15" stroke-width="4" stroke-linecap="round">
    <line x1="730" y1="8" x2="730" y2="16"/>
    <line x1="686" y1="52" x2="694" y2="52"/>
    <line x1="699" y1="21" x2="705" y2="27"/>
    <line x1="761" y1="21" x2="755" y2="27"/>
    <line x1="699" y1="83" x2="705" y2="77"/>
  </g>

  <!-- pit garages along the back -->
  <rect x="0" y="118" width="660" height="138" fill="#e2e8f0"/>
  <rect x="0" y="110" width="660" height="12" fill="#64748b"/>
  <rect x="30" y="150" width="170" height="106" fill="#334155"/>
  <rect x="240" y="150" width="170" height="106" fill="#334155"/>
  <rect x="450" y="150" width="170" height="106" fill="#334155"/>
  <text x="330" y="140" font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle">pit garages</text>

  <!-- pit-lane tarmac -->
  <rect x="0" y="256" width="800" height="194" fill="#4b5563"/>
  <rect x="0" y="262" width="800" height="4" fill="#f8fafc"/>
  <rect x="300" y="404" width="320" height="4" fill="#facc15"/>

  <!-- stack of tyres in electric blankets, with a probe thermometer -->
  <g>
    <rect x="50" y="366" width="130" height="34" rx="10" fill="#dc2626"/>
    <rect x="50" y="330" width="130" height="34" rx="10" fill="#ef4444"/>
    <rect x="50" y="294" width="130" height="34" rx="10" fill="#dc2626"/>
    <ellipse cx="115" cy="294" rx="65" ry="10" fill="#111827"/>
    <ellipse cx="115" cy="294" rx="30" ry="5" fill="#64748b"/>
    <g stroke="#fecaca" stroke-width="2">
      <line x1="60" y1="347" x2="170" y2="347"/>
      <line x1="60" y1="383" x2="170" y2="383"/>
      <line x1="60" y1="311" x2="170" y2="311"/>
    </g>
    <path d="M180,380 Q210,392 214,420" fill="none" stroke="#0f172a" stroke-width="3"/>
    <rect x="206" y="418" width="16" height="10" rx="2" fill="#0f172a"/>
    <!-- probe -->
    <line x1="186" y1="300" x2="226" y2="276" stroke="#94a3b8" stroke-width="3"/>
    <rect x="222" y="252" width="44" height="30" rx="4" fill="#fde047" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="228" y="258" width="32" height="12" rx="2" fill="#0f172a"/>
    <rect x="232" y="262" width="20" height="4" fill="#4ade80"/>
  </g>
  <text x="18" y="440" font-size="12.5" fill="#f8fafc" font-weight="600">tyre blankets and a probe thermometer</text>

  <!-- race car in its pit box, nose to the right -->
  <g transform="translate(-10,0)">
    <rect x="320" y="330" width="42" height="7" fill="#0f172a"/>
    <rect x="320" y="330" width="6" height="18" fill="#0f172a"/>
    <rect x="342" y="337" width="6" height="20" fill="#0f172a"/>
    <path d="M330,361 L352,343 L410,334 L478,331 L540,341 L578,354 L578,361 z" fill="#0d9488"/>
    <rect x="570" y="356" width="34" height="6" fill="#0f172a"/>
    <path d="M430,334 Q445,318 468,326 L470,334 z" fill="#1e293b"/>
    <circle cx="452" cy="326" r="8" fill="#facc15"/>
    <!-- exhaust and its heat shimmer -->
    <rect x="352" y="344" width="12" height="6" rx="2" fill="#475569"/>
    <g fill="none" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round">
      <path d="M352,338 q-6,-8 0,-16 q6,-8 0,-16"/>
      <path d="M340,340 q-6,-8 0,-16 q6,-8 0,-16"/>
      <path d="M364,334 q-6,-8 0,-16 q6,-8 0,-16"/>
    </g>
    <!-- rear wheel -->
    <circle cx="370" cy="361" r="19" fill="#111827"/>
    <circle cx="370" cy="361" r="8" fill="#64748b"/>
    <!-- front wheel with the brake disc glowing -->
    <circle cx="530" cy="361" r="30" fill="url(#glow)"/>
    <circle cx="530" cy="361" r="19" fill="#111827"/>
    <circle cx="530" cy="361" r="11" fill="#f97316"/>
    <circle cx="530" cy="361" r="4" fill="#fef08a"/>
  </g>
  <text x="330" y="296" font-size="12.5" fill="#f8fafc" font-weight="600" text-anchor="middle">hot exhaust</text>
  <text x="560" y="428" font-size="12.5" fill="#f8fafc" font-weight="600" text-anchor="middle">brake disc glowing hot</text>
  <line x1="540" y1="416" x2="524" y2="392" stroke="#f8fafc" stroke-width="1.5"/>

  <!-- compressed-air bottle feeding a wheel gun -->
  <rect x="690" y="272" width="46" height="126" rx="20" fill="#2563eb"/>
  <rect x="704" y="258" width="18" height="16" fill="#94a3b8"/>
  <circle cx="713" cy="252" r="8" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <line x1="713" y1="252" x2="718" y2="247" stroke="#dc2626" stroke-width="1.5"/>
  <path d="M705,258 Q650,250 660,330 Q664,360 640,372" fill="none" stroke="#0f172a" stroke-width="4"/>
  <rect x="612" y="366" width="34" height="14" rx="3" fill="#475569"/>
  <rect x="630" y="378" width="10" height="20" rx="2" fill="#1e293b"/>
  <text x="792" y="428" font-size="12.5" fill="#f8fafc" font-weight="600" text-anchor="end">air bottle</text>
  <text x="792" y="444" font-size="12.5" fill="#f8fafc" font-weight="600" text-anchor="end">for the wheel gun</text>
</svg>
