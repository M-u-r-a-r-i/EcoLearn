<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A training ground on a hot day: a board reading 36 degrees Celsius, a closed ice box of drinks, a player inflating a ball with a hand pump, and a petrol mower with a hot exhaust</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <!-- hazy hot sky -->
  <rect width="800" height="450" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.55">
    <ellipse cx="300" cy="66" rx="58" ry="16"/>
    <ellipse cx="350" cy="58" rx="40" ry="13"/>
    <ellipse cx="520" cy="120" rx="46" ry="12"/>
  </g>

  <!-- sun -->
  <g stroke="#facc15" stroke-width="5" stroke-linecap="round">
    <line x1="700" y1="8" x2="700" y2="26"/>
    <line x1="700" y1="94" x2="700" y2="112"/>
    <line x1="642" y1="60" x2="660" y2="60"/>
    <line x1="740" y1="60" x2="758" y2="60"/>
    <line x1="659" y1="19" x2="672" y2="32"/>
    <line x1="728" y1="88" x2="741" y2="101"/>
    <line x1="741" y1="19" x2="728" y2="32"/>
    <line x1="672" y1="88" x2="659" y2="101"/>
  </g>
  <circle cx="700" cy="60" r="30" fill="#fde047" stroke="#facc15" stroke-width="3"/>

  <!-- temperature board on two posts -->
  <rect x="66" y="132" width="8" height="128" fill="#64748b"/>
  <rect x="156" y="132" width="8" height="128" fill="#64748b"/>
  <rect x="38" y="64" width="154" height="70" rx="5" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <text x="115" y="112" font-size="36" text-anchor="middle" fill="#fde047">36 °C</text>

  <!-- distant fence and trees -->
  <line x1="0" y1="250" x2="800" y2="250" stroke="#94a3b8" stroke-width="3"/>
  <g stroke="#cbd5e1" stroke-width="2">
    <line x1="60" y1="236" x2="60" y2="250"/><line x1="220" y1="236" x2="220" y2="250"/>
    <line x1="380" y1="236" x2="380" y2="250"/><line x1="540" y1="236" x2="540" y2="250"/>
    <line x1="760" y1="236" x2="760" y2="250"/>
  </g>
  <g fill="#15803d">
    <circle cx="280" cy="228" r="20"/><circle cx="308" cy="234" r="15"/>
    <circle cx="470" cy="230" r="17"/><circle cx="628" cy="232" r="14"/>
  </g>

  <!-- striped grass -->
  <rect x="0" y="250" width="800" height="200" fill="#22c55e"/>
  <rect x="0" y="272" width="800" height="22" fill="#16a34a"/>
  <rect x="0" y="322" width="800" height="28" fill="#16a34a"/>
  <rect x="0" y="384" width="800" height="34" fill="#16a34a"/>
  <line x1="0" y1="264" x2="800" y2="264" stroke="#ffffff" stroke-width="3"/>

  <!-- ice box with cold drinks -->
  <g opacity="0.7" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M80,336 q6,-12 12,0 q6,12 12,0"/>
    <path d="M124,330 q6,-12 12,0 q6,12 12,0"/>
  </g>
  <rect x="46" y="356" width="150" height="62" rx="6" fill="#38bdf8" stroke="#0369a1" stroke-width="2"/>
  <rect x="42" y="344" width="158" height="16" rx="5" fill="#bae6fd" stroke="#0369a1" stroke-width="2"/>
  <rect x="100" y="334" width="40" height="8" rx="4" fill="#0369a1"/>
  <rect x="46" y="384" width="150" height="6" fill="#0ea5e9"/>
  <g fill="#f8fafc" stroke="#0369a1" stroke-width="1.5">
    <rect x="210" y="368" width="16" height="42" rx="4"/>
    <rect x="232" y="374" width="16" height="36" rx="4"/>
  </g>
  <rect x="214" y="360" width="8" height="10" rx="2" fill="#0369a1"/>
  <rect x="236" y="366" width="8" height="10" rx="2" fill="#0369a1"/>

  <!-- player inflating a ball with a hand pump -->
  <g stroke-linecap="round">
    <line x1="380" y1="372" x2="366" y2="410" stroke="#334155" stroke-width="14"/>
    <line x1="380" y1="372" x2="366" y2="410" stroke="#1e293b" stroke-width="10"/>
    <line x1="380" y1="372" x2="396" y2="410" stroke="#334155" stroke-width="14"/>
    <line x1="380" y1="372" x2="396" y2="410" stroke="#1e293b" stroke-width="10"/>
    <line x1="380" y1="374" x2="378" y2="328" stroke="#334155" stroke-width="22"/>
    <line x1="380" y1="374" x2="378" y2="328" stroke="#ef4444" stroke-width="18"/>
    <line x1="378" y1="334" x2="424" y2="324" stroke="#334155" stroke-width="9"/>
    <line x1="378" y1="334" x2="424" y2="324" stroke="#ef4444" stroke-width="5"/>
    <line x1="378" y1="340" x2="424" y2="330" stroke="#334155" stroke-width="9"/>
    <line x1="378" y1="340" x2="424" y2="330" stroke="#ef4444" stroke-width="5"/>
  </g>
  <circle cx="374" cy="312" r="12" fill="#78350f" stroke="#334155" stroke-width="2"/>
  <rect x="358" y="408" width="17" height="7" rx="3" fill="#0f172a"/>
  <rect x="390" y="408" width="17" height="7" rx="3" fill="#0f172a"/>

  <!-- hand pump: handle pressed down, barrel, hose to the ball -->
  <rect x="418" y="318" width="44" height="12" rx="4" fill="#0f172a"/>
  <line x1="440" y1="330" x2="440" y2="346" stroke="#64748b" stroke-width="5"/>
  <rect x="430" y="346" width="20" height="56" rx="4" fill="#475569" stroke="#1e293b" stroke-width="2"/>
  <path d="M440,402 q26,16 48,4" fill="none" stroke="#1e293b" stroke-width="4"/>
  <circle cx="500" cy="396" r="15" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <polygon points="500,388 507,393 504,401 496,401 493,393" fill="#0f172a"/>
  <line x1="488" y1="404" x2="490" y2="399" stroke="#0f172a" stroke-width="2"/>

  <!-- petrol mower with a hot exhaust -->
  <g stroke="#475569" stroke-width="5" stroke-linecap="round">
    <line x1="586" y1="374" x2="520" y2="308"/>
    <line x1="602" y1="374" x2="536" y2="308"/>
    <line x1="518" y1="306" x2="538" y2="306"/>
  </g>
  <rect x="580" y="372" width="130" height="26" rx="5" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
  <rect x="616" y="340" width="54" height="34" rx="4" fill="#374151" stroke="#1f2937" stroke-width="2"/>
  <rect x="626" y="330" width="18" height="12" rx="3" fill="#6b7280"/>
  <rect x="668" y="352" width="28" height="9" rx="3" fill="#4b5563"/>
  <g fill="#94a3b8" opacity="0.75">
    <circle cx="708" cy="352" r="8"/>
    <circle cx="726" cy="340" r="10"/>
    <circle cx="748" cy="324" r="13"/>
  </g>
  <g stroke="#fb923c" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M624,324 q5,-10 10,0 q5,10 10,0"/>
    <path d="M648,318 q5,-10 10,0 q5,10 10,0"/>
  </g>
  <circle cx="598" cy="402" r="13" fill="#1f2937"/><circle cx="598" cy="402" r="5" fill="#94a3b8"/>
  <circle cx="694" cy="402" r="13" fill="#1f2937"/><circle cx="694" cy="402" r="5" fill="#94a3b8"/>
  <text x="716" y="300" font-size="15" text-anchor="middle" fill="#064e3b">hot exhaust</text>
</svg>
