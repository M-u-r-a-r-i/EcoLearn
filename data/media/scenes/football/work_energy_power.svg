<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A football training ground by day: a player drags a weighted sled on a strap, a striker lofts the ball in a high arc, and the goalkeeper dives to catch it</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <marker id="vb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- daytime sky, clouds and a low stand -->
  <rect width="800" height="450" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="150" cy="70" rx="60" ry="16"/><ellipse cx="190" cy="60" rx="40" ry="14"/>
    <ellipse cx="560" cy="90" rx="70" ry="15"/><ellipse cx="610" cy="80" rx="38" ry="12"/>
  </g>
  <rect x="0" y="200" width="800" height="50" fill="#64748b"/>
  <g fill="#94a3b8">
    <rect x="0" y="210" width="800" height="6"/><rect x="0" y="226" width="800" height="6"/>
  </g>
  <rect x="0" y="242" width="800" height="12" fill="#334155"/>

  <!-- striped grass -->
  <rect x="0" y="254" width="800" height="196" fill="#22c55e"/>
  <rect x="0" y="278" width="800" height="30" fill="#16a34a"/>
  <rect x="0" y="344" width="800" height="36" fill="#16a34a"/>
  <rect x="0" y="420" width="800" height="30" fill="#16a34a"/>

  <!-- goal, side view, at the right -->
  <line x1="600" y1="398" x2="800" y2="398" stroke="#ffffff" stroke-width="3"/>
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.85">
    <line x1="708" y1="290" x2="770" y2="398"/>
    <line x1="722" y1="290" x2="778" y2="372"/>
    <line x1="736" y1="290" x2="784" y2="348"/>
    <line x1="690" y1="322" x2="760" y2="322"/>
    <line x1="690" y1="356" x2="772" y2="356"/>
  </g>
  <path d="M690,398 L690,290 L744,290 L790,398" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- weighted sled on the left, with a strap to the player's waist -->
  <rect x="34" y="392" width="84" height="6" rx="3" fill="#475569"/>
  <rect x="44" y="374" width="64" height="18" rx="3" fill="#0f172a"/>
  <circle cx="62" cy="366" r="12" fill="#334155" stroke="#0f172a" stroke-width="2"/>
  <circle cx="90" cy="366" r="12" fill="#334155" stroke="#0f172a" stroke-width="2"/>
  <line x1="108" y1="380" x2="186" y2="340" stroke="#0f172a" stroke-width="3"/>

  <!-- sled puller (orange), leaning forwards -->
  <g stroke-linecap="round">
    <line x1="188" y1="340" x2="166" y2="394" stroke="#334155" stroke-width="14"/>
    <line x1="188" y1="340" x2="166" y2="394" stroke="#1e293b" stroke-width="10"/>
    <line x1="188" y1="340" x2="222" y2="388" stroke="#334155" stroke-width="14"/>
    <line x1="188" y1="340" x2="222" y2="388" stroke="#1e293b" stroke-width="10"/>
    <line x1="188" y1="342" x2="220" y2="302" stroke="#334155" stroke-width="22"/>
    <line x1="188" y1="342" x2="220" y2="302" stroke="#f97316" stroke-width="18"/>
    <line x1="214" y1="310" x2="236" y2="336" stroke="#334155" stroke-width="9"/>
    <line x1="214" y1="310" x2="236" y2="336" stroke="#92400e" stroke-width="5"/>
    <line x1="210" y1="312" x2="190" y2="326" stroke="#334155" stroke-width="9"/>
    <line x1="210" y1="312" x2="190" y2="326" stroke="#92400e" stroke-width="5"/>
  </g>
  <circle cx="232" cy="288" r="12" fill="#92400e" stroke="#334155" stroke-width="2"/>
  <rect x="158" y="392" width="16" height="7" rx="3" fill="#0f172a"/>
  <rect x="216" y="386" width="16" height="7" rx="3" fill="#0f172a"/>

  <!-- striker (purple), follow-through after a lofted kick -->
  <g stroke-linecap="round">
    <line x1="340" y1="344" x2="330" y2="396" stroke="#334155" stroke-width="14"/>
    <line x1="340" y1="344" x2="330" y2="396" stroke="#f8fafc" stroke-width="10"/>
    <line x1="340" y1="344" x2="388" y2="314" stroke="#334155" stroke-width="14"/>
    <line x1="340" y1="344" x2="388" y2="314" stroke="#f8fafc" stroke-width="10"/>
    <line x1="340" y1="346" x2="332" y2="302" stroke="#334155" stroke-width="22"/>
    <line x1="340" y1="346" x2="332" y2="302" stroke="#7c3aed" stroke-width="18"/>
    <line x1="332" y1="310" x2="302" y2="294" stroke="#334155" stroke-width="9"/>
    <line x1="332" y1="310" x2="302" y2="294" stroke="#78350f" stroke-width="5"/>
    <line x1="334" y1="310" x2="362" y2="328" stroke="#334155" stroke-width="9"/>
    <line x1="334" y1="310" x2="362" y2="328" stroke="#78350f" stroke-width="5"/>
  </g>
  <circle cx="328" cy="284" r="12" fill="#78350f" stroke="#334155" stroke-width="2"/>
  <rect x="322" y="394" width="16" height="7" rx="3" fill="#0f172a"/>
  <rect x="386" y="306" width="16" height="7" rx="3" fill="#0f172a" transform="rotate(-32 394 310)"/>

  <!-- the ball's high arc, with faint earlier positions -->
  <path d="M400,300 Q480,120 585,232" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 6" opacity="0.7"/>
  <g fill="#ffffff" opacity="0.4">
    <circle cx="418" cy="258" r="9"/><circle cx="446" cy="211" r="9"/><circle cx="482" cy="186" r="9"/><circle cx="522" cy="186" r="9"/>
  </g>
  <circle cx="560" cy="206" r="10" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <polygon points="560,202 564,205 562,210 558,210 556,205" fill="#0f172a"/>
  <rect x="520" y="140" width="80" height="26" rx="13" fill="#ffffff" opacity="0.9"/>
  <line x1="530" y1="148" x2="586" y2="162" stroke="#2563eb" stroke-width="5" marker-end="url(#vb)"/>

  <!-- goalkeeper (yellow), diving up and sideways towards the ball -->
  <g stroke-linecap="round">
    <line x1="656" y1="318" x2="690" y2="354" stroke="#334155" stroke-width="14"/>
    <line x1="656" y1="318" x2="690" y2="354" stroke="#1e293b" stroke-width="10"/>
    <line x1="656" y1="318" x2="684" y2="370" stroke="#334155" stroke-width="14"/>
    <line x1="656" y1="318" x2="684" y2="370" stroke="#1e293b" stroke-width="10"/>
    <line x1="658" y1="320" x2="624" y2="284" stroke="#334155" stroke-width="22"/>
    <line x1="658" y1="320" x2="624" y2="284" stroke="#facc15" stroke-width="18"/>
    <line x1="626" y1="284" x2="590" y2="232" stroke="#334155" stroke-width="9"/>
    <line x1="626" y1="284" x2="590" y2="232" stroke="#facc15" stroke-width="5"/>
    <line x1="630" y1="290" x2="600" y2="240" stroke="#334155" stroke-width="9"/>
    <line x1="630" y1="290" x2="600" y2="240" stroke="#facc15" stroke-width="5"/>
  </g>
  <circle cx="589" cy="229" r="5" fill="#16a34a"/>
  <circle cx="600" cy="237" r="5" fill="#16a34a"/>
  <circle cx="610" cy="270" r="12" fill="#92400e" stroke="#334155" stroke-width="2"/>
  <rect x="686" y="350" width="16" height="7" rx="3" fill="#0f172a" transform="rotate(40 694 354)"/>
  <rect x="680" y="368" width="16" height="7" rx="3" fill="#0f172a" transform="rotate(55 688 372)"/>
</svg>
