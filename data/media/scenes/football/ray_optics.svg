<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A football ground in afternoon sun: a convex dome mirror on a post at the mouth of the players' tunnel, a broadcast camera with a long lens on a tripod, a pitch-side box feeding an optical-fibre cable, a sprinkler throwing spray with a small rainbow in it, and a goal at the far end</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfdbfe"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde047" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fde047" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#sky)"/>

  <!-- sun and its rays -->
  <circle cx="712" cy="58" r="62" fill="url(#sunGlow)"/>
  <circle cx="712" cy="58" r="26" fill="#fbbf24"/>
  <g stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="712" y1="14" x2="712" y2="2"/>
    <line x1="756" y1="58" x2="772" y2="58"/>
    <line x1="744" y1="26" x2="756" y2="14"/>
    <line x1="680" y1="26" x2="668" y2="14"/>
    <line x1="744" y1="90" x2="756" y2="102"/>
  </g>
  <!-- a slanting sunbeam falling across the ground -->
  <line x1="694" y1="92" x2="548" y2="352" stroke="#fde68a" stroke-width="10" opacity="0.5" stroke-linecap="round"/>

  <!-- stand -->
  <path d="M0,208 L800,208 L800,276 L0,276 z" fill="#475569"/>
  <path d="M0,232 L800,232 L800,276 L0,276 z" fill="#64748b"/>
  <g fill="#e2e8f0" opacity="0.35">
    <circle cx="250" cy="246" r="4"/><circle cx="300" cy="242" r="4"/><circle cx="350" cy="248" r="4"/>
    <circle cx="430" cy="244" r="4"/><circle cx="480" cy="248" r="4"/><circle cx="530" cy="242" r="4"/>
    <circle cx="610" cy="246" r="4"/><circle cx="660" cy="244" r="4"/><circle cx="710" cy="248" r="4"/>
  </g>

  <!-- players' tunnel mouth -->
  <path d="M30,276 L30,224 Q76,196 122,224 L122,276 z" fill="#1e293b"/>
  <path d="M44,276 L44,232 Q76,212 108,232 L108,276 z" fill="#0f172a"/>

  <!-- convex dome mirror on a post beside the tunnel -->
  <rect x="172" y="238" width="7" height="46" fill="#334155"/>
  <line x1="158" y1="232" x2="176" y2="240" stroke="#334155" stroke-width="5"/>
  <circle cx="150" cy="228" r="24" fill="#cbd5e1" stroke="#334155" stroke-width="3"/>
  <path d="M132,216 Q150,206 168,216" fill="none" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>

  <!-- pitch -->
  <rect x="0" y="276" width="800" height="174" fill="#15803d"/>
  <rect x="0" y="292" width="800" height="26" fill="#166534"/>
  <rect x="0" y="348" width="800" height="28" fill="#166534"/>
  <rect x="0" y="412" width="800" height="26" fill="#166534"/>
  <line x1="0" y1="284" x2="800" y2="284" stroke="#f8fafc" stroke-width="2" opacity="0.5"/>

  <!-- label for the dome mirror, drawn over the grass -->
  <text x="150" y="304" font-size="13" fill="#f1f5f9" text-anchor="middle">convex mirror</text>
  <text x="150" y="321" font-size="12" fill="#dcfce7" text-anchor="middle">the whole corridor, shrunk</text>

  <!-- goal, far right, seen at an angle -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.65">
    <line x1="680" y1="300" x2="712" y2="348"/>
    <line x1="712" y1="300" x2="744" y2="348"/>
    <line x1="686" y1="318" x2="766" y2="318"/>
    <line x1="694" y1="336" x2="772" y2="336"/>
  </g>
  <path d="M668,352 L668,296 L772,296 L772,352" fill="none" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- broadcast camera with a long lens, on a tripod -->
  <g>
    <line x1="292" y1="366" x2="264" y2="418" stroke="#1f2937" stroke-width="6" stroke-linecap="round"/>
    <line x1="292" y1="366" x2="320" y2="418" stroke="#1f2937" stroke-width="6" stroke-linecap="round"/>
    <line x1="292" y1="366" x2="292" y2="418" stroke="#374151" stroke-width="5" stroke-linecap="round"/>
    <rect x="256" y="326" width="72" height="42" rx="5" fill="#1f2937" stroke="#0f172a" stroke-width="2"/>
    <rect x="266" y="316" width="26" height="12" rx="3" fill="#374151"/>
    <rect x="328" y="334" width="72" height="26" rx="4" fill="#374151" stroke="#0f172a" stroke-width="2"/>
    <ellipse cx="402" cy="347" rx="8" ry="15" fill="#93c5fd" stroke="#0f172a" stroke-width="2"/>
  </g>
  <text x="330" y="442" font-size="13" fill="#f1f5f9" text-anchor="middle">long lens</text>

  <!-- optical-fibre cable from the camera to a pitch-side box -->
  <path d="M262,352 C 200,368 140,372 104,384" fill="none" stroke="#fbbf24" stroke-width="4"/>
  <rect x="26" y="366" width="78" height="40" rx="4" fill="#94a3b8" stroke="#475569" stroke-width="3"/>
  <circle cx="46" cy="386" r="6" fill="#dc2626"/>
  <circle cx="66" cy="386" r="6" fill="#16a34a"/>
  <rect x="78" y="380" width="18" height="12" rx="2" fill="#475569"/>
  <text x="65" y="424" font-size="13" fill="#f1f5f9" text-anchor="middle">optical fibre</text>

  <!-- sprinkler and the rainbow in its spray -->
  <g fill="none" stroke-width="7" opacity="0.75">
    <path d="M482,416 A 66 66 0 0 1 614,416" stroke="#dc2626"/>
    <path d="M492,416 A 56 56 0 0 1 604,416" stroke="#f59e0b"/>
    <path d="M502,416 A 46 46 0 0 1 594,416" stroke="#16a34a"/>
    <path d="M512,416 A 36 36 0 0 1 584,416" stroke="#2563eb"/>
  </g>
  <g stroke="#bae6fd" stroke-width="2" opacity="0.8" stroke-linecap="round">
    <line x1="548" y1="412" x2="524" y2="388"/>
    <line x1="548" y1="412" x2="548" y2="382"/>
    <line x1="548" y1="412" x2="572" y2="388"/>
  </g>
  <rect x="540" y="412" width="16" height="10" rx="3" fill="#334155"/>
  <text x="560" y="442" font-size="13" fill="#f1f5f9" text-anchor="middle">a rainbow in the spray</text>

  <!-- ball -->
  <circle cx="206" cy="344" r="11" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
  <polygon points="206,339 211,343 209,349 203,349 201,343" fill="#0f172a"/>
</svg>
