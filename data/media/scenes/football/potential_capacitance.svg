<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A training ground at dusk: a floodlight pylon, an electric fence with its energiser box along the far side, a coach holding a touchscreen tablet, a water bowser with a level gauge, an AED cabinet on a post, and a goal</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#6b7a90"/>
    </linearGradient>
  </defs>

  <!-- dusk sky -->
  <rect width="800" height="450" fill="url(#sky)"/>
  <g fill="#94a3b8" opacity="0.25">
    <ellipse cx="520" cy="80" rx="90" ry="24"/>
    <ellipse cx="620" cy="100" rx="70" ry="18"/>
    <ellipse cx="240" cy="70" rx="70" ry="18"/>
  </g>

  <!-- floodlight pylon -->
  <rect x="40" y="64" width="9" height="206" fill="#64748b"/>
  <rect x="18" y="44" width="54" height="22" rx="3" fill="#334155"/>
  <g fill="#fef9c3"><circle cx="29" cy="55" r="5"/><circle cx="45" cy="55" r="5"/><circle cx="61" cy="55" r="5"/></g>

  <!-- goal, front view, far side of the pitch -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.45">
    <line x1="574" y1="212" x2="574" y2="268"/><line x1="604" y1="208" x2="604" y2="268"/>
    <line x1="634" y1="206" x2="634" y2="268"/><line x1="664" y1="206" x2="664" y2="268"/>
    <line x1="694" y1="208" x2="694" y2="268"/><line x1="724" y1="212" x2="724" y2="268"/>
    <line x1="558" y1="228" x2="744" y2="228"/><line x1="558" y1="248" x2="744" y2="248"/>
  </g>
  <path d="M558,268 L558,204 L744,204 L744,268" fill="none" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- grass -->
  <rect x="0" y="270" width="800" height="180" fill="#15803d"/>
  <rect x="0" y="292" width="800" height="26" fill="#166534"/>
  <rect x="0" y="356" width="800" height="30" fill="#166534"/>
  <rect x="0" y="422" width="800" height="28" fill="#166534"/>
  <line x1="0" y1="278" x2="800" y2="278" stroke="#e2e8f0" stroke-width="2" opacity="0.45"/>

  <!-- electric fence along the far touchline -->
  <g stroke="#cbd5e1" stroke-width="2">
    <line x1="150" y1="234" x2="150" y2="272"/>
    <line x1="250" y1="234" x2="250" y2="272"/>
    <line x1="350" y1="234" x2="350" y2="272"/>
    <line x1="450" y1="234" x2="450" y2="272"/>
  </g>
  <g stroke="#fbbf24" stroke-width="2.5">
    <line x1="120" y1="240" x2="470" y2="240"/>
    <line x1="120" y1="256" x2="470" y2="256"/>
  </g>
  <!-- energiser box on the first post -->
  <rect x="96" y="192" width="46" height="36" rx="4" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="119" cy="210" r="5" fill="#f87171"/>
  <line x1="119" y1="228" x2="119" y2="272" stroke="#cbd5e1" stroke-width="3"/>
  <line x1="119" y1="240" x2="142" y2="240" stroke="#fbbf24" stroke-width="2.5"/>
  <text x="119" y="184" font-size="13" fill="#fde68a" text-anchor="middle">fence energiser</text>

  <!-- water bowser with a level gauge -->
  <rect x="312" y="296" width="150" height="46" rx="21" fill="#94a3b8" stroke="#64748b" stroke-width="2"/>
  <rect x="326" y="306" width="10" height="28" rx="4" fill="#38bdf8" stroke="#0369a1" stroke-width="1.5"/>
  <rect x="432" y="302" width="22" height="14" rx="3" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="356" y="342" width="70" height="8" fill="#64748b"/>
  <circle cx="344" cy="350" r="12" fill="#1f2937" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="438" cy="350" r="12" fill="#1f2937" stroke="#94a3b8" stroke-width="2"/>
  <text x="387" y="380" font-size="13" fill="#e2e8f0" text-anchor="middle">water bowser, level gauge</text>

  <!-- AED cabinet on a post -->
  <rect x="694" y="336" width="12" height="86" fill="#64748b"/>
  <rect x="660" y="286" width="80" height="62" rx="6" fill="#16a34a" stroke="#065f46" stroke-width="2"/>
  <g fill="#f8fafc">
    <rect x="694" y="298" width="12" height="38"/>
    <rect x="681" y="311" width="38" height="12"/>
  </g>
  <text x="700" y="372" font-size="14" fill="#e2e8f0" text-anchor="middle">AED cabinet</text>

  <!-- ball on the grass -->
  <circle cx="530" cy="404" r="12" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
  <polygon points="530,398 536,403 533,410 527,410 524,403" fill="#0f172a"/>

  <!-- coach with a touchscreen tablet -->
  <g stroke-linecap="round">
    <line x1="168" y1="366" x2="154" y2="418" stroke="#0f172a" stroke-width="15"/>
    <line x1="168" y1="366" x2="154" y2="418" stroke="#1e293b" stroke-width="11"/>
    <line x1="168" y1="366" x2="186" y2="418" stroke="#0f172a" stroke-width="15"/>
    <line x1="168" y1="366" x2="186" y2="418" stroke="#1e293b" stroke-width="11"/>
    <line x1="168" y1="368" x2="168" y2="320" stroke="#0f172a" stroke-width="24"/>
    <line x1="168" y1="368" x2="168" y2="320" stroke="#0ea5e9" stroke-width="20"/>
    <line x1="158" y1="326" x2="140" y2="352" stroke="#0f172a" stroke-width="10"/>
    <line x1="158" y1="326" x2="140" y2="352" stroke="#78350f" stroke-width="6"/>
    <line x1="178" y1="326" x2="196" y2="352" stroke="#0f172a" stroke-width="10"/>
    <line x1="178" y1="326" x2="196" y2="352" stroke="#78350f" stroke-width="6"/>
  </g>
  <circle cx="168" cy="302" r="13" fill="#78350f" stroke="#0f172a" stroke-width="2"/>
  <rect x="146" y="416" width="18" height="7" rx="3" fill="#0f172a"/>
  <rect x="176" y="416" width="18" height="7" rx="3" fill="#0f172a"/>
  <!-- the tablet held between both hands -->
  <rect x="136" y="342" width="64" height="44" rx="5" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="142" y="348" width="52" height="32" rx="2" fill="#38bdf8" opacity="0.8"/>
  <text x="168" y="440" font-size="13" fill="#e2e8f0" text-anchor="middle">touchscreen tablet</text>
</svg>
