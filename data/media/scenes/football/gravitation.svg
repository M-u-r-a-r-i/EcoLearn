<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A night match: the goalkeeper's long kick at the top of its arc, the Moon and a satellite overhead, and a dish on the stand roof aimed at the satellite</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <marker id="vb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- night sky with stars -->
  <rect width="800" height="450" fill="url(#sky)"/>
  <g fill="#f8fafc" opacity="0.8">
    <circle cx="230" cy="40" r="1.5"/><circle cx="300" cy="75" r="1.2"/><circle cx="360" cy="30" r="1.5"/>
    <circle cx="480" cy="55" r="1.2"/><circle cx="540" cy="25" r="1.5"/><circle cx="700" cy="30" r="1.2"/>
    <circle cx="90" cy="150" r="1.2"/><circle cx="250" cy="120" r="1.2"/><circle cx="600" cy="140" r="1.2"/>
    <circle cx="720" cy="120" r="1.5"/><circle cx="440" cy="95" r="1"/><circle cx="170" cy="30" r="1"/>
  </g>

  <!-- crescent Moon -->
  <path d="M130,52 A28,28 0 1,0 130,108 A20,28 0 1,1 130,52 z" fill="#f8fafc"/>

  <!-- satellite -->
  <g>
    <rect x="600" y="66" width="28" height="10" fill="#0f766e" stroke="#99f6e4" stroke-width="1"/>
    <rect x="652" y="66" width="28" height="10" fill="#0f766e" stroke="#99f6e4" stroke-width="1"/>
    <line x1="628" y1="71" x2="652" y2="71" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="633" y="62" width="14" height="18" rx="2" fill="#e2e8f0"/>
  </g>

  <!-- stands -->
  <path d="M0,215 Q400,150 800,215 L800,262 L0,262 z" fill="#1e3a8a"/>
  <path d="M0,232 Q400,172 800,232 L800,262 L0,262 z" fill="#3b5bdb"/>
  <g fill="#f8fafc" opacity="0.5">
    <circle cx="90" cy="222" r="3"/><circle cx="160" cy="214" r="3"/><circle cx="250" cy="205" r="3"/>
    <circle cx="330" cy="199" r="3"/><circle cx="420" cy="197" r="3"/><circle cx="520" cy="202" r="3"/>
    <circle cx="610" cy="208" r="3"/><circle cx="700" cy="216" r="3"/>
  </g>

  <!-- dish on the stand roof, aimed at the satellite -->
  <line x1="570" y1="190" x2="570" y2="166" stroke="#94a3b8" stroke-width="4"/>
  <line x1="578" y1="152" x2="636" y2="84" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.6"/>
  <g transform="translate(570,160) rotate(40)">
    <path d="M-15,0 A15,8 0 0,0 15,0 z" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="-13" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="0" cy="-13" r="2.5" fill="#cbd5e1"/>
  </g>

  <!-- floodlights -->
  <rect x="36" y="70" width="8" height="150" fill="#64748b"/>
  <rect x="14" y="52" width="52" height="24" rx="3" fill="#334155"/>
  <g fill="#fef9c3"><circle cx="24" cy="64" r="5"/><circle cx="40" cy="64" r="5"/><circle cx="56" cy="64" r="5"/></g>
  <rect x="756" y="70" width="8" height="150" fill="#64748b"/>
  <rect x="734" y="52" width="52" height="24" rx="3" fill="#334155"/>
  <g fill="#fef9c3"><circle cx="744" cy="64" r="5"/><circle cx="760" cy="64" r="5"/><circle cx="776" cy="64" r="5"/></g>

  <!-- striped grass -->
  <rect x="0" y="262" width="800" height="188" fill="#22c55e"/>
  <rect x="0" y="286" width="800" height="30" fill="#16a34a"/>
  <rect x="0" y="352" width="800" height="40" fill="#16a34a"/>
  <rect x="0" y="428" width="800" height="22" fill="#16a34a"/>

  <!-- goal at the left, side view -->
  <line x1="0" y1="398" x2="210" y2="398" stroke="#ffffff" stroke-width="3"/>
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.85">
    <line x1="82" y1="290" x2="20" y2="398"/>
    <line x1="68" y1="290" x2="12" y2="372"/>
    <line x1="30" y1="322" x2="100" y2="322"/>
    <line x1="18" y1="356" x2="100" y2="356"/>
  </g>
  <path d="M100,398 L100,290 L46,290 L6,398" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- path of the long kick -->
  <path d="M200,352 Q420,-120 640,352" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-dasharray="5 6" opacity="0.45"/>
  <g fill="#ffffff" opacity="0.35">
    <circle cx="250" cy="227" r="8"/><circle cx="320" cy="159" r="8"/>
  </g>
  <circle cx="420" cy="116" r="10" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <polygon points="420,112 424,115 422,120 418,120 416,115" fill="#0f172a"/>
  <line x1="434" y1="116" x2="492" y2="116" stroke="#2563eb" stroke-width="4" marker-end="url(#vb)"/>
  <line x1="420" y1="130" x2="420" y2="170" stroke="#16a34a" stroke-width="4" marker-end="url(#ag)"/>
  <text x="428" y="166" font-size="16" font-style="italic" fill="#bbf7d0">g</text>

  <!-- goalkeeper (yellow), follow-through after the kick -->
  <g stroke-linecap="round">
    <line x1="170" y1="332" x2="160" y2="390" stroke="#334155" stroke-width="14"/>
    <line x1="170" y1="332" x2="160" y2="390" stroke="#1e293b" stroke-width="10"/>
    <line x1="170" y1="332" x2="218" y2="300" stroke="#334155" stroke-width="14"/>
    <line x1="170" y1="332" x2="218" y2="300" stroke="#1e293b" stroke-width="10"/>
    <line x1="170" y1="334" x2="162" y2="290" stroke="#334155" stroke-width="22"/>
    <line x1="170" y1="334" x2="162" y2="290" stroke="#facc15" stroke-width="18"/>
    <line x1="162" y1="298" x2="132" y2="278" stroke="#334155" stroke-width="9"/>
    <line x1="162" y1="298" x2="132" y2="278" stroke="#facc15" stroke-width="5"/>
    <line x1="164" y1="298" x2="192" y2="318" stroke="#334155" stroke-width="9"/>
    <line x1="164" y1="298" x2="192" y2="318" stroke="#facc15" stroke-width="5"/>
  </g>
  <circle cx="132" cy="277" r="5" fill="#16a34a"/>
  <circle cx="193" cy="319" r="5" fill="#16a34a"/>
  <circle cx="158" cy="272" r="12" fill="#92400e" stroke="#334155" stroke-width="2"/>
  <rect x="152" y="388" width="16" height="7" rx="3" fill="#0f172a"/>
  <rect x="214" y="292" width="16" height="7" rx="3" fill="#0f172a" transform="rotate(-34 222 296)"/>

  <!-- midfielder (sky blue), looking up and waiting for the ball -->
  <g stroke-linecap="round">
    <line x1="660" y1="344" x2="646" y2="396" stroke="#334155" stroke-width="14"/>
    <line x1="660" y1="344" x2="646" y2="396" stroke="#f8fafc" stroke-width="10"/>
    <line x1="660" y1="344" x2="676" y2="396" stroke="#334155" stroke-width="14"/>
    <line x1="660" y1="344" x2="676" y2="396" stroke="#f8fafc" stroke-width="10"/>
    <line x1="660" y1="346" x2="660" y2="302" stroke="#334155" stroke-width="22"/>
    <line x1="660" y1="346" x2="660" y2="302" stroke="#0ea5e9" stroke-width="18"/>
    <line x1="654" y1="308" x2="630" y2="286" stroke="#334155" stroke-width="9"/>
    <line x1="654" y1="308" x2="630" y2="286" stroke="#78350f" stroke-width="5"/>
    <line x1="666" y1="308" x2="690" y2="286" stroke="#334155" stroke-width="9"/>
    <line x1="666" y1="308" x2="690" y2="286" stroke="#78350f" stroke-width="5"/>
  </g>
  <circle cx="657" cy="283" r="12" fill="#78350f" stroke="#334155" stroke-width="2"/>
  <rect x="636" y="394" width="16" height="7" rx="3" fill="#0f172a"/>
  <rect x="670" y="394" width="16" height="7" rx="3" fill="#0f172a"/>
</svg>
