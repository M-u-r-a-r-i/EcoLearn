<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A floodlit ground as a storm arrives: lightning above the stand, rain falling, a player peeling off a crackling nylon bib, and two players heading for the metal-roofed dugout</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#3f4a5c"/>
    </linearGradient>
  </defs>

  <!-- storm sky -->
  <rect width="800" height="450" fill="url(#sky)"/>

  <!-- storm cloud -->
  <g fill="#475569">
    <circle cx="200" cy="96" r="44"/>
    <circle cx="256" cy="72" r="56"/>
    <circle cx="318" cy="88" r="46"/>
    <circle cx="368" cy="104" r="34"/>
    <rect x="196" y="96" width="176" height="36" rx="16"/>
  </g>
  <g fill="#64748b" opacity="0.85">
    <circle cx="238" cy="60" r="34"/>
    <circle cx="296" cy="64" r="28"/>
  </g>

  <!-- lightning bolt from the cloud base -->
  <polygon points="294,126 252,198 282,192 256,258 322,172 292,178 316,126" fill="#fde047" stroke="#fef9c3" stroke-width="1.5"/>

  <!-- rain -->
  <g stroke="#cbd5e1" stroke-width="1.2" opacity="0.35">
    <line x1="120" y1="140" x2="112" y2="172"/><line x1="160" y1="170" x2="152" y2="202"/>
    <line x1="196" y1="146" x2="188" y2="178"/><line x1="342" y1="150" x2="334" y2="182"/>
    <line x1="392" y1="130" x2="384" y2="162"/><line x1="430" y1="166" x2="422" y2="198"/>
    <line x1="470" y1="120" x2="462" y2="152"/><line x1="512" y1="158" x2="504" y2="190"/>
    <line x1="560" y1="132" x2="552" y2="164"/><line x1="604" y1="172" x2="596" y2="204"/>
    <line x1="648" y1="140" x2="640" y2="172"/><line x1="690" y1="176" x2="682" y2="208"/>
    <line x1="264" y1="286" x2="256" y2="314"/><line x1="430" y1="300" x2="422" y2="328"/>
    <line x1="520" y1="272" x2="512" y2="300"/><line x1="128" y1="318" x2="120" y2="346"/>
  </g>

  <!-- floodlight pylons -->
  <rect x="44" y="76" width="8" height="148" fill="#64748b"/>
  <rect x="22" y="58" width="52" height="22" rx="3" fill="#334155"/>
  <g fill="#fef9c3"><circle cx="32" cy="69" r="5"/><circle cx="48" cy="69" r="5"/><circle cx="64" cy="69" r="5"/></g>
  <rect x="748" y="76" width="8" height="148" fill="#64748b"/>
  <rect x="726" y="58" width="52" height="22" rx="3" fill="#334155"/>
  <g fill="#fef9c3"><circle cx="736" cy="69" r="5"/><circle cx="752" cy="69" r="5"/><circle cx="768" cy="69" r="5"/></g>

  <!-- stand -->
  <path d="M0,214 Q400,182 800,214 L800,262 L0,262 z" fill="#1e293b"/>
  <path d="M0,230 Q400,200 800,230 L800,262 L0,262 z" fill="#334155"/>
  <g fill="#e2e8f0" opacity="0.35">
    <circle cx="80" cy="224" r="3"/><circle cx="150" cy="220" r="3"/><circle cx="230" cy="214" r="3"/>
    <circle cx="470" cy="212" r="3"/><circle cx="560" cy="216" r="3"/><circle cx="650" cy="222" r="3"/>
  </g>

  <!-- pitch -->
  <rect x="0" y="262" width="800" height="188" fill="#15803d"/>
  <rect x="0" y="286" width="800" height="28" fill="#166534"/>
  <rect x="0" y="348" width="800" height="36" fill="#166534"/>
  <rect x="0" y="424" width="800" height="26" fill="#166534"/>
  <line x1="0" y1="278" x2="800" y2="278" stroke="#e2e8f0" stroke-width="2" opacity="0.5"/>

  <!-- goal, left, side view -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.7">
    <line x1="86" y1="300" x2="30" y2="376"/>
    <line x1="66" y1="300" x2="16" y2="368"/>
    <line x1="26" y1="330" x2="100" y2="330"/>
    <line x1="18" y1="354" x2="100" y2="354"/>
  </g>
  <path d="M104,378 L104,296 L52,296 L14,378" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ball on the grass -->
  <circle cx="176" cy="392" r="11" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
  <polygon points="176,387 181,391 179,397 173,397 171,391" fill="#0f172a"/>

  <!-- player pulling a nylon bib over her head, foreground -->
  <g stroke-linecap="round">
    <line x1="318" y1="380" x2="304" y2="432" stroke="#0f172a" stroke-width="15"/>
    <line x1="318" y1="380" x2="304" y2="432" stroke="#1e293b" stroke-width="11"/>
    <line x1="318" y1="380" x2="336" y2="432" stroke="#0f172a" stroke-width="15"/>
    <line x1="318" y1="380" x2="336" y2="432" stroke="#1e293b" stroke-width="11"/>
    <line x1="318" y1="382" x2="318" y2="334" stroke="#0f172a" stroke-width="24"/>
    <line x1="318" y1="382" x2="318" y2="334" stroke="#e11d48" stroke-width="20"/>
    <line x1="310" y1="338" x2="296" y2="300" stroke="#0f172a" stroke-width="10"/>
    <line x1="310" y1="338" x2="296" y2="300" stroke="#78350f" stroke-width="6"/>
    <line x1="326" y1="338" x2="340" y2="300" stroke="#0f172a" stroke-width="10"/>
    <line x1="326" y1="338" x2="340" y2="300" stroke="#78350f" stroke-width="6"/>
  </g>
  <circle cx="318" cy="316" r="12" fill="#78350f" stroke="#0f172a" stroke-width="2"/>
  <rect x="296" y="430" width="17" height="7" rx="3" fill="#0f172a"/>
  <rect x="330" y="430" width="17" height="7" rx="3" fill="#0f172a"/>
  <!-- the bib, lifted clear of her head -->
  <path d="M292,296 L344,296 L352,268 L284,268 z" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
  <!-- tiny static sparks between bib and shirt -->
  <g stroke="#fef08a" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M300,300 l6,5 l-5,3 l7,5"/>
    <path d="M336,300 l-6,5 l5,3 l-7,5"/>
  </g>
  <text x="318" y="258" font-size="13" fill="#fde68a" text-anchor="middle">bib crackles as it comes off</text>

  <!-- two players walking to the dugout -->
  <g stroke-linecap="round">
    <line x1="500" y1="366" x2="490" y2="406" stroke="#0f172a" stroke-width="12"/>
    <line x1="500" y1="366" x2="490" y2="406" stroke="#1e293b" stroke-width="8"/>
    <line x1="500" y1="366" x2="514" y2="406" stroke="#0f172a" stroke-width="12"/>
    <line x1="500" y1="366" x2="514" y2="406" stroke="#1e293b" stroke-width="8"/>
    <line x1="500" y1="368" x2="502" y2="330" stroke="#0f172a" stroke-width="19"/>
    <line x1="500" y1="368" x2="502" y2="330" stroke="#e11d48" stroke-width="15"/>
    <line x1="506" y1="336" x2="524" y2="352" stroke="#0f172a" stroke-width="8"/>
    <line x1="506" y1="336" x2="524" y2="352" stroke="#78350f" stroke-width="5"/>
  </g>
  <circle cx="503" cy="316" r="10" fill="#78350f" stroke="#0f172a" stroke-width="2"/>
  <rect x="482" y="404" width="15" height="6" rx="3" fill="#0f172a"/>
  <rect x="510" y="404" width="15" height="6" rx="3" fill="#0f172a"/>

  <g stroke-linecap="round">
    <line x1="548" y1="362" x2="538" y2="400" stroke="#0f172a" stroke-width="12"/>
    <line x1="548" y1="362" x2="538" y2="400" stroke="#1e293b" stroke-width="8"/>
    <line x1="548" y1="362" x2="562" y2="400" stroke="#0f172a" stroke-width="12"/>
    <line x1="548" y1="362" x2="562" y2="400" stroke="#1e293b" stroke-width="8"/>
    <line x1="548" y1="364" x2="550" y2="328" stroke="#0f172a" stroke-width="19"/>
    <line x1="548" y1="364" x2="550" y2="328" stroke="#0ea5e9" stroke-width="15"/>
    <line x1="554" y1="334" x2="572" y2="348" stroke="#0f172a" stroke-width="8"/>
    <line x1="554" y1="334" x2="572" y2="348" stroke="#78350f" stroke-width="5"/>
  </g>
  <circle cx="551" cy="314" r="10" fill="#78350f" stroke="#0f172a" stroke-width="2"/>
  <rect x="530" y="398" width="15" height="6" rx="3" fill="#0f172a"/>
  <rect x="556" y="398" width="15" height="6" rx="3" fill="#0f172a"/>

  <!-- dugout with a metal roof -->
  <rect x="600" y="336" width="176" height="76" fill="#1f2937" opacity="0.55"/>
  <path d="M592,336 L784,336 L784,322 L592,322 z" fill="#94a3b8" stroke="#64748b" stroke-width="2"/>
  <path d="M592,322 L616,300 L760,300 L784,322 z" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <rect x="600" y="336" width="8" height="76" fill="#64748b"/>
  <rect x="768" y="336" width="8" height="76" fill="#64748b"/>
  <rect x="620" y="372" width="140" height="10" rx="3" fill="#e2e8f0"/>
  <g>
    <circle cx="656" cy="352" r="9" fill="#78350f"/>
    <rect x="647" y="362" width="18" height="16" rx="4" fill="#0ea5e9"/>
    <circle cx="710" cy="352" r="9" fill="#78350f"/>
    <rect x="701" y="362" width="18" height="16" rx="4" fill="#e11d48"/>
  </g>
  <text x="688" y="432" font-size="13" fill="#e2e8f0" text-anchor="middle">dugout: metal roof and frame</text>
</svg>
