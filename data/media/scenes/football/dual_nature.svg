<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A floodlit football ground at night: a lit pylon pouring a beam onto the pitch, an inset panel showing the same beam drawn once as a wave and once as a stream of photons, a goal-line camera on a pole, a goalkeeper and a ball in front of the goal</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#27374d"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fef9c3" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fef9c3" stop-opacity="0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="800" height="450" fill="url(#sky)"/>

  <!-- floodlight beam -->
  <polygon points="70,96 262,290 18,290" fill="url(#beam)"/>

  <!-- floodlight pylon -->
  <rect x="64" y="96" width="10" height="166" fill="#64748b"/>
  <rect x="52" y="262" width="34" height="8" rx="2" fill="#475569"/>
  <rect x="38" y="66" width="62" height="28" rx="3" fill="#334155" stroke="#1e293b" stroke-width="2"/>
  <g fill="#fef08a"><circle cx="52" cy="80" r="6"/><circle cx="69" cy="80" r="6"/><circle cx="86" cy="80" r="6"/></g>
  <text x="140" y="318" font-size="13" fill="#e2e8f0" text-anchor="middle">floodlight</text>

  <!-- inset panel: the same beam, two descriptions -->
  <rect x="300" y="52" width="380" height="152" rx="8" fill="#111827" stroke="#475569" stroke-width="3"/>
  <text x="490" y="76" font-size="14" fill="#e2e8f0" text-anchor="middle">one beam, two pictures</text>

  <path d="M322,116 q14,-20 28,0 t28,0 t28,0 t28,0 t28,0 t28,0 t28,0 t28,0"
        fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <text x="586" y="121" font-size="13" fill="#fbbf24">a wave</text>

  <line x1="322" y1="164" x2="560" y2="164" stroke="#475569" stroke-width="1" stroke-dasharray="4 4"/>
  <g fill="#fbbf24">
    <circle cx="326" cy="164" r="5"/><circle cx="360" cy="164" r="5"/><circle cx="394" cy="164" r="5"/>
    <circle cx="428" cy="164" r="5"/><circle cx="462" cy="164" r="5"/><circle cx="496" cy="164" r="5"/>
    <circle cx="530" cy="164" r="5"/>
  </g>
  <line x1="540" y1="164" x2="566" y2="164" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="586" y="169" font-size="13" fill="#fbbf24">packets</text>
  <text x="490" y="192" font-size="12" fill="#94a3b8" text-anchor="middle">the pitch is lit the same either way — the sensors are not</text>

  <!-- stand -->
  <path d="M0,238 Q400,216 800,238 L800,276 L0,276 z" fill="#1e293b"/>
  <path d="M0,252 Q400,230 800,252 L800,276 L0,276 z" fill="#334155"/>
  <g fill="#e2e8f0" opacity="0.3">
    <circle cx="70" cy="248" r="3"/><circle cx="140" cy="244" r="3"/><circle cx="210" cy="241" r="3"/>
    <circle cx="600" cy="241" r="3"/><circle cx="670" cy="244" r="3"/><circle cx="740" cy="248" r="3"/>
  </g>

  <!-- pitch -->
  <rect x="0" y="276" width="800" height="174" fill="#15803d"/>
  <rect x="0" y="296" width="800" height="26" fill="#166534"/>
  <rect x="0" y="356" width="800" height="32" fill="#166534"/>
  <rect x="0" y="424" width="800" height="26" fill="#166534"/>
  <line x1="0" y1="288" x2="800" y2="288" stroke="#e2e8f0" stroke-width="2" opacity="0.45"/>

  <!-- goal, right, seen from the side -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.6">
    <line x1="700" y1="312" x2="756" y2="382"/>
    <line x1="720" y1="312" x2="772" y2="376"/>
    <line x1="766" y1="340" x2="692" y2="340"/>
    <line x1="774" y1="362" x2="692" y2="362"/>
  </g>
  <path d="M688,384 L688,308 L738,308 L774,384" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- goalkeeper -->
  <g stroke-linecap="round">
    <line x1="648" y1="372" x2="638" y2="416" stroke="#0f172a" stroke-width="13"/>
    <line x1="648" y1="372" x2="660" y2="416" stroke="#0f172a" stroke-width="13"/>
    <line x1="648" y1="374" x2="648" y2="332" stroke="#0f172a" stroke-width="21"/>
    <line x1="640" y1="336" x2="614" y2="314" stroke="#0f172a" stroke-width="10"/>
    <line x1="640" y1="336" x2="614" y2="314" stroke="#78350f" stroke-width="6"/>
    <line x1="656" y1="336" x2="682" y2="314" stroke="#0f172a" stroke-width="10"/>
    <line x1="656" y1="336" x2="682" y2="314" stroke="#78350f" stroke-width="6"/>
  </g>
  <circle cx="648" cy="316" r="12" fill="#78350f" stroke="#0f172a" stroke-width="2"/>
  <rect x="628" y="414" width="18" height="7" rx="3" fill="#0f172a"/>
  <rect x="652" y="414" width="18" height="7" rx="3" fill="#0f172a"/>

  <!-- ball -->
  <circle cx="548" cy="404" r="11" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
  <polygon points="548,399 553,403 551,409 545,409 543,403" fill="#0f172a"/>

  <!-- goal-line camera on a pole, aimed at the goal -->
  <rect x="352" y="260" width="8" height="74" fill="#475569"/>
  <rect x="340" y="334" width="32" height="7" rx="2" fill="#334155"/>
  <rect x="330" y="230" width="52" height="28" rx="4" fill="#1f2937" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="382" cy="244" r="7" fill="#0b1220" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="392" y1="244" x2="470" y2="268" stroke="#fef08a" stroke-width="2" stroke-dasharray="5 5" opacity="0.8"/>
  <text x="356" y="360" font-size="13" fill="#e2e8f0" text-anchor="middle">goal-line camera</text>
  <text x="356" y="376" font-size="12" fill="#94a3b8" text-anchor="middle">light in, electrons out</text>
</svg>
