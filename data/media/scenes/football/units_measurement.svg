<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A groundsman measures the width of a football goal with a tape while a match ball sits on a scale beside a pressure gauge and a match clock shows the time</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <!-- sky and stands -->
  <rect width="800" height="450" fill="url(#sky)"/>
  <path d="M0,215 Q400,150 800,215 L800,262 L0,262 z" fill="#1e3a8a"/>
  <path d="M0,232 Q400,172 800,232 L800,262 L0,262 z" fill="#3b5bdb"/>
  <g fill="#f8fafc" opacity="0.55">
    <circle cx="480" cy="200" r="3"/><circle cx="530" cy="203" r="3"/><circle cx="560" cy="206" r="3"/>
    <circle cx="620" cy="212" r="3"/><circle cx="700" cy="220" r="3"/><circle cx="760" cy="226" r="3"/>
  </g>

  <!-- floodlight, left -->
  <rect x="36" y="70" width="8" height="150" fill="#64748b"/>
  <rect x="14" y="52" width="52" height="24" rx="3" fill="#334155"/>
  <g fill="#fef9c3"><circle cx="24" cy="64" r="5"/><circle cx="40" cy="64" r="5"/><circle cx="56" cy="64" r="5"/></g>

  <!-- match clock, right -->
  <rect x="618" y="118" width="8" height="100" fill="#64748b"/>
  <rect x="734" y="118" width="8" height="100" fill="#64748b"/>
  <rect x="590" y="36" width="180" height="86" rx="6" fill="#0f172a"/>
  <text x="680" y="62" font-size="14" fill="#94a3b8" text-anchor="middle" letter-spacing="2">MATCH CLOCK</text>
  <text x="680" y="104" font-size="32" font-weight="700" fill="#fbbf24" text-anchor="middle">45:00</text>

  <!-- striped grass -->
  <rect x="0" y="262" width="800" height="188" fill="#22c55e"/>
  <rect x="0" y="286" width="800" height="30" fill="#16a34a"/>
  <rect x="0" y="352" width="800" height="40" fill="#16a34a"/>
  <rect x="0" y="428" width="800" height="22" fill="#16a34a"/>

  <!-- goal net and frame -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.8">
    <line x1="175" y1="240" x2="175" y2="340"/><line x1="200" y1="240" x2="200" y2="340"/>
    <line x1="225" y1="240" x2="225" y2="340"/><line x1="250" y1="240" x2="250" y2="340"/>
    <line x1="275" y1="240" x2="275" y2="340"/><line x1="300" y1="240" x2="300" y2="340"/>
    <line x1="325" y1="240" x2="325" y2="340"/><line x1="350" y1="240" x2="350" y2="340"/>
    <line x1="375" y1="240" x2="375" y2="340"/><line x1="400" y1="240" x2="400" y2="340"/>
    <line x1="425" y1="240" x2="425" y2="340"/>
    <line x1="150" y1="265" x2="450" y2="265"/><line x1="150" y1="290" x2="450" y2="290"/>
    <line x1="150" y1="315" x2="450" y2="315"/>
  </g>
  <line x1="60" y1="340" x2="560" y2="340" stroke="#ffffff" stroke-width="3"/>
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M150,340 L150,240 L450,240 L450,340"/>
  </g>

  <!-- dimension lines: width and height of the goal -->
  <g stroke="#ffffff" stroke-width="2">
    <line x1="150" y1="220" x2="250" y2="220"/>
    <line x1="350" y1="220" x2="450" y2="220"/>
    <line x1="150" y1="213" x2="150" y2="227"/>
    <line x1="450" y1="213" x2="450" y2="227"/>
    <line x1="126" y1="240" x2="126" y2="278"/>
    <line x1="126" y1="302" x2="126" y2="340"/>
    <line x1="119" y1="240" x2="133" y2="240"/>
    <line x1="119" y1="340" x2="133" y2="340"/>
  </g>
  <rect x="250" y="207" width="100" height="26" rx="5" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="300" y="226" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">7.32 m</text>
  <rect x="76" y="278" width="68" height="24" rx="5" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="110" y="296" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">2.44 m</text>

  <!-- measuring tape along the goal line, post to post -->
  <line x1="150" y1="347" x2="456" y2="347" stroke="#facc15" stroke-width="5"/>
  <g stroke="#78350f" stroke-width="1.5">
    <line x1="180" y1="344" x2="180" y2="350"/><line x1="210" y1="344" x2="210" y2="350"/>
    <line x1="240" y1="344" x2="240" y2="350"/><line x1="270" y1="344" x2="270" y2="350"/>
    <line x1="300" y1="344" x2="300" y2="350"/><line x1="330" y1="344" x2="330" y2="350"/>
    <line x1="360" y1="344" x2="360" y2="350"/><line x1="390" y1="344" x2="390" y2="350"/>
    <line x1="420" y1="344" x2="420" y2="350"/>
  </g>
  <circle cx="466" cy="347" r="10" fill="#334155" stroke="#0f172a" stroke-width="2"/>
  <circle cx="466" cy="347" r="3" fill="#facc15"/>

  <!-- groundsman holding the tape reel -->
  <g stroke-linecap="round">
    <line x1="512" y1="330" x2="500" y2="398" stroke="#334155" stroke-width="15"/>
    <line x1="512" y1="330" x2="500" y2="398" stroke="#1e40af" stroke-width="11"/>
    <line x1="514" y1="330" x2="528" y2="398" stroke="#334155" stroke-width="15"/>
    <line x1="514" y1="330" x2="528" y2="398" stroke="#1e40af" stroke-width="11"/>
    <line x1="513" y1="330" x2="510" y2="282" stroke="#334155" stroke-width="24"/>
    <line x1="513" y1="330" x2="510" y2="282" stroke="#f97316" stroke-width="20"/>
    <line x1="506" y1="292" x2="476" y2="340" stroke="#334155" stroke-width="10"/>
    <line x1="506" y1="292" x2="476" y2="340" stroke="#a16207" stroke-width="6"/>
  </g>
  <circle cx="510" cy="262" r="12" fill="#a16207" stroke="#334155" stroke-width="2"/>
  <path d="M 497 258 Q 510 244 523 258 z" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <rect x="492" y="394" width="14" height="7" rx="3" fill="#0f172a"/>
  <rect x="524" y="394" width="14" height="7" rx="3" fill="#0f172a"/>

  <!-- table with a digital scale, a match ball and a pressure gauge -->
  <rect x="566" y="392" width="214" height="10" rx="2" fill="#92400e"/>
  <rect x="576" y="402" width="8" height="40" fill="#78350f"/>
  <rect x="762" y="402" width="8" height="40" fill="#78350f"/>
  <rect x="586" y="366" width="96" height="26" rx="4" fill="#475569"/>
  <rect x="600" y="371" width="68" height="16" rx="2" fill="#bbf7d0"/>
  <text x="634" y="384" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">430 g</text>
  <rect x="609" y="359" width="50" height="6" rx="2" fill="#94a3b8"/>
  <circle cx="634" cy="340" r="18" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <polygon points="634,333 641,338 638,346 630,346 627,338" fill="#0f172a"/>
  <g stroke="#0f172a" stroke-width="1.2">
    <line x1="634" y1="333" x2="634" y2="322"/><line x1="641" y1="338" x2="651" y2="334"/>
    <line x1="627" y1="338" x2="617" y2="334"/><line x1="638" y1="346" x2="644" y2="355"/>
    <line x1="630" y1="346" x2="624" y2="355"/>
  </g>
  <rect x="729" y="380" width="14" height="12" fill="#475569"/>
  <circle cx="736" cy="352" r="28" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
  <path d="M 716 364 A 22 22 0 1 1 756 364" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <line x1="736" y1="352" x2="748" y2="336" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="736" cy="352" r="3" fill="#334155"/>
  <text x="736" y="373" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">0.9 atm</text>
</svg>
