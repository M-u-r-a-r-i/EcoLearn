<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Under floodlights, a striker follows through after a shot; the ball flies towards goal and the goalkeeper stretches to catch it</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <marker id="vb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- evening sky and stands -->
  <rect width="800" height="450" fill="url(#sky)"/>
  <path d="M0,215 Q400,150 800,215 L800,262 L0,262 z" fill="#1e3a8a"/>
  <path d="M0,232 Q400,172 800,232 L800,262 L0,262 z" fill="#3b5bdb"/>
  <g fill="#f8fafc" opacity="0.5">
    <circle cx="90" cy="222" r="3"/><circle cx="160" cy="214" r="3"/><circle cx="250" cy="205" r="3"/>
    <circle cx="330" cy="199" r="3"/><circle cx="420" cy="197" r="3"/><circle cx="520" cy="202" r="3"/>
    <circle cx="610" cy="208" r="3"/><circle cx="700" cy="216" r="3"/>
  </g>

  <!-- floodlights -->
  <rect x="36" y="70" width="8" height="150" fill="#64748b"/>
  <rect x="14" y="52" width="52" height="24" rx="3" fill="#334155"/>
  <g fill="#fef9c3"><circle cx="24" cy="64" r="5"/><circle cx="40" cy="64" r="5"/><circle cx="56" cy="64" r="5"/></g>
  <rect x="756" y="70" width="8" height="150" fill="#64748b"/>
  <rect x="734" y="52" width="52" height="24" rx="3" fill="#334155"/>
  <g fill="#fef9c3"><circle cx="744" cy="64" r="5"/><circle cx="760" cy="64" r="5"/><circle cx="776" cy="64" r="5"/></g>

  <!-- striped grass -->
  <rect x="0" y="262" width="800" height="188" fill="#22c55e"/>
  <rect x="0" y="286" width="800" height="30" fill="#16a34a"/>
  <rect x="0" y="352" width="800" height="40" fill="#16a34a"/>
  <rect x="0" y="428" width="800" height="22" fill="#16a34a"/>

  <!-- goal line and goal, side view, at the right -->
  <line x1="600" y1="398" x2="800" y2="398" stroke="#ffffff" stroke-width="3"/>
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.85">
    <line x1="708" y1="290" x2="770" y2="398"/>
    <line x1="722" y1="290" x2="778" y2="372"/>
    <line x1="736" y1="290" x2="784" y2="348"/>
    <line x1="690" y1="322" x2="760" y2="322"/>
    <line x1="690" y1="356" x2="772" y2="356"/>
  </g>
  <path d="M690,398 L690,290 L744,290 L790,398" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- striker (orange), follow-through after the shot -->
  <g stroke-linecap="round">
    <line x1="170" y1="332" x2="160" y2="390" stroke="#334155" stroke-width="14"/>
    <line x1="170" y1="332" x2="160" y2="390" stroke="#f8fafc" stroke-width="10"/>
    <line x1="170" y1="332" x2="222" y2="306" stroke="#334155" stroke-width="14"/>
    <line x1="170" y1="332" x2="222" y2="306" stroke="#f8fafc" stroke-width="10"/>
    <line x1="170" y1="334" x2="160" y2="290" stroke="#334155" stroke-width="22"/>
    <line x1="170" y1="334" x2="160" y2="290" stroke="#f97316" stroke-width="18"/>
    <line x1="160" y1="298" x2="130" y2="282" stroke="#334155" stroke-width="9"/>
    <line x1="160" y1="298" x2="130" y2="282" stroke="#a16207" stroke-width="5"/>
    <line x1="162" y1="298" x2="190" y2="316" stroke="#334155" stroke-width="9"/>
    <line x1="162" y1="298" x2="190" y2="316" stroke="#a16207" stroke-width="5"/>
  </g>
  <circle cx="156" cy="272" r="12" fill="#a16207" stroke="#334155" stroke-width="2"/>
  <rect x="152" y="388" width="16" height="7" rx="3" fill="#0f172a"/>
  <rect x="220" y="298" width="16" height="7" rx="3" fill="#0f172a" transform="rotate(-28 228 302)"/>

  <!-- defender (purple), turning to watch -->
  <g stroke-linecap="round">
    <line x1="370" y1="342" x2="356" y2="394" stroke="#334155" stroke-width="14"/>
    <line x1="370" y1="342" x2="356" y2="394" stroke="#1e293b" stroke-width="10"/>
    <line x1="370" y1="342" x2="386" y2="394" stroke="#334155" stroke-width="14"/>
    <line x1="370" y1="342" x2="386" y2="394" stroke="#1e293b" stroke-width="10"/>
    <line x1="370" y1="344" x2="370" y2="300" stroke="#334155" stroke-width="22"/>
    <line x1="370" y1="344" x2="370" y2="300" stroke="#7c3aed" stroke-width="18"/>
    <line x1="366" y1="306" x2="348" y2="330" stroke="#334155" stroke-width="9"/>
    <line x1="366" y1="306" x2="348" y2="330" stroke="#78350f" stroke-width="5"/>
    <line x1="374" y1="306" x2="392" y2="330" stroke="#334155" stroke-width="9"/>
    <line x1="374" y1="306" x2="392" y2="330" stroke="#78350f" stroke-width="5"/>
  </g>
  <circle cx="370" cy="282" r="12" fill="#78350f" stroke="#334155" stroke-width="2"/>
  <rect x="346" y="392" width="16" height="7" rx="3" fill="#0f172a"/>
  <rect x="380" y="392" width="16" height="7" rx="3" fill="#0f172a"/>

  <!-- ball in flight, with faint earlier positions -->
  <g fill="#ffffff" opacity="0.35">
    <circle cx="262" cy="300" r="9"/><circle cx="330" cy="262" r="9"/><circle cx="400" cy="240" r="9"/>
  </g>
  <circle cx="470" cy="232" r="10" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <polygon points="470,228 474,231 472,236 468,236 466,231" fill="#0f172a"/>
  <rect x="488" y="212" width="86" height="26" rx="13" fill="#ffffff" opacity="0.9"/>
  <line x1="496" y1="225" x2="562" y2="228" stroke="#2563eb" stroke-width="5" marker-end="url(#vb)"/>

  <!-- goalkeeper (yellow), stretching up towards the ball -->
  <g stroke-linecap="round">
    <line x1="640" y1="346" x2="626" y2="396" stroke="#334155" stroke-width="14"/>
    <line x1="640" y1="346" x2="626" y2="396" stroke="#1e293b" stroke-width="10"/>
    <line x1="640" y1="346" x2="660" y2="394" stroke="#334155" stroke-width="14"/>
    <line x1="640" y1="346" x2="660" y2="394" stroke="#1e293b" stroke-width="10"/>
    <line x1="640" y1="348" x2="632" y2="302" stroke="#334155" stroke-width="22"/>
    <line x1="640" y1="348" x2="632" y2="302" stroke="#facc15" stroke-width="18"/>
    <line x1="628" y1="306" x2="606" y2="264" stroke="#334155" stroke-width="9"/>
    <line x1="628" y1="306" x2="606" y2="264" stroke="#facc15" stroke-width="5"/>
    <line x1="636" y1="306" x2="620" y2="258" stroke="#334155" stroke-width="9"/>
    <line x1="636" y1="306" x2="620" y2="258" stroke="#facc15" stroke-width="5"/>
  </g>
  <circle cx="606" cy="262" r="5" fill="#16a34a"/>
  <circle cx="620" cy="256" r="5" fill="#16a34a"/>
  <circle cx="628" cy="284" r="12" fill="#92400e" stroke="#334155" stroke-width="2"/>
  <rect x="618" y="394" width="16" height="7" rx="3" fill="#0f172a"/>
  <rect x="654" y="392" width="16" height="7" rx="3" fill="#0f172a"/>
</svg>
