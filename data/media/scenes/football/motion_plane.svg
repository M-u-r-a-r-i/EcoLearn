<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A player lofts the ball in a curved arc over the goalkeeper towards the goal, while a teammate jogs round the centre circle; the ball carries a blue velocity arrow along its path and a green arrow pointing straight down</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <marker id="vb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- sky and stands -->
  <rect width="800" height="450" fill="url(#sky)"/>
  <path d="M0,215 Q400,150 800,215 L800,262 L0,262 z" fill="#1e3a8a"/>
  <path d="M0,232 Q400,172 800,232 L800,262 L0,262 z" fill="#3b5bdb"/>
  <g fill="#f8fafc" opacity="0.55">
    <circle cx="90" cy="222" r="3"/><circle cx="170" cy="213" r="3"/><circle cx="260" cy="205" r="3"/>
    <circle cx="350" cy="199" r="3"/><circle cx="450" cy="199" r="3"/><circle cx="640" cy="210" r="3"/>
  </g>

  <!-- floodlight, left -->
  <rect x="36" y="70" width="8" height="150" fill="#64748b"/>
  <rect x="14" y="52" width="52" height="24" rx="3" fill="#334155"/>
  <g fill="#fef9c3"><circle cx="24" cy="64" r="5"/><circle cx="40" cy="64" r="5"/><circle cx="56" cy="64" r="5"/></g>

  <!-- striped grass -->
  <rect x="0" y="262" width="800" height="188" fill="#22c55e"/>
  <rect x="0" y="286" width="800" height="30" fill="#16a34a"/>
  <rect x="0" y="352" width="800" height="40" fill="#16a34a"/>
  <rect x="0" y="428" width="800" height="22" fill="#16a34a"/>

  <!-- centre circle in perspective -->
  <ellipse cx="330" cy="395" rx="140" ry="38" fill="none" stroke="#ffffff" stroke-width="3"/>
  <ellipse cx="330" cy="395" rx="4" ry="2" fill="#ffffff"/>

  <!-- goal, side view, at the right -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.85">
    <line x1="728" y1="300" x2="784" y2="392"/>
    <line x1="740" y1="300" x2="790" y2="370"/>
    <line x1="752" y1="300" x2="794" y2="350"/>
    <line x1="710" y1="330" x2="770" y2="330"/>
    <line x1="710" y1="360" x2="780" y2="360"/>
  </g>
  <path d="M710,392 L710,300 L760,300 L792,392" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the ball's arc: a parabola from the kicker's foot to the goal -->
  <path d="M150,385 Q440,-120 730,335" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="7 7" opacity="0.95"/>

  <!-- kicker (orange), follow-through -->
  <g stroke-linecap="round">
    <line x1="120" y1="342" x2="106" y2="392" stroke="#334155" stroke-width="14"/>
    <line x1="120" y1="342" x2="106" y2="392" stroke="#f8fafc" stroke-width="10"/>
    <line x1="120" y1="342" x2="156" y2="372" stroke="#334155" stroke-width="14"/>
    <line x1="120" y1="342" x2="156" y2="372" stroke="#f8fafc" stroke-width="10"/>
    <line x1="120" y1="344" x2="126" y2="298" stroke="#334155" stroke-width="22"/>
    <line x1="120" y1="344" x2="126" y2="298" stroke="#f97316" stroke-width="18"/>
    <line x1="124" y1="304" x2="96" y2="320" stroke="#334155" stroke-width="9"/>
    <line x1="124" y1="304" x2="96" y2="320" stroke="#a16207" stroke-width="5"/>
    <line x1="128" y1="304" x2="154" y2="296" stroke="#334155" stroke-width="9"/>
    <line x1="128" y1="304" x2="154" y2="296" stroke="#a16207" stroke-width="5"/>
  </g>
  <circle cx="130" cy="280" r="12" fill="#a16207" stroke="#334155" stroke-width="2"/>
  <rect x="98" y="390" width="16" height="7" rx="3" fill="#0f172a"/>
  <rect x="150" y="366" width="16" height="7" rx="3" fill="#0f172a" transform="rotate(35 158 369)"/>

  <!-- jogger (orange) on the front of the centre circle -->
  <g stroke-linecap="round">
    <line x1="330" y1="386" x2="316" y2="432" stroke="#334155" stroke-width="14"/>
    <line x1="330" y1="386" x2="316" y2="432" stroke="#f8fafc" stroke-width="10"/>
    <line x1="330" y1="386" x2="350" y2="428" stroke="#334155" stroke-width="14"/>
    <line x1="330" y1="386" x2="350" y2="428" stroke="#f8fafc" stroke-width="10"/>
    <line x1="330" y1="388" x2="336" y2="346" stroke="#334155" stroke-width="22"/>
    <line x1="330" y1="388" x2="336" y2="346" stroke="#f97316" stroke-width="18"/>
    <line x1="334" y1="352" x2="316" y2="370" stroke="#334155" stroke-width="9"/>
    <line x1="334" y1="352" x2="316" y2="370" stroke="#78350f" stroke-width="5"/>
    <line x1="338" y1="352" x2="356" y2="366" stroke="#334155" stroke-width="9"/>
    <line x1="338" y1="352" x2="356" y2="366" stroke="#78350f" stroke-width="5"/>
  </g>
  <circle cx="340" cy="328" r="12" fill="#78350f" stroke="#334155" stroke-width="2"/>
  <rect x="308" y="430" width="16" height="7" rx="3" fill="#0f172a"/>
  <rect x="346" y="426" width="16" height="7" rx="3" fill="#0f172a"/>

  <!-- jogger's velocity: along the tangent to the circle -->
  <rect x="292" y="292" width="112" height="24" rx="12" fill="#ffffff" opacity="0.9"/>
  <line x1="304" y1="304" x2="390" y2="304" stroke="#2563eb" stroke-width="5" marker-end="url(#vb)"/>

  <!-- goalkeeper (yellow), arms up, beaten by the lob -->
  <g stroke-linecap="round">
    <line x1="660" y1="344" x2="646" y2="390" stroke="#334155" stroke-width="14"/>
    <line x1="660" y1="344" x2="646" y2="390" stroke="#1e293b" stroke-width="10"/>
    <line x1="660" y1="344" x2="676" y2="390" stroke="#334155" stroke-width="14"/>
    <line x1="660" y1="344" x2="676" y2="390" stroke="#1e293b" stroke-width="10"/>
    <line x1="660" y1="346" x2="660" y2="302" stroke="#334155" stroke-width="22"/>
    <line x1="660" y1="346" x2="660" y2="302" stroke="#facc15" stroke-width="18"/>
    <line x1="654" y1="306" x2="640" y2="274" stroke="#334155" stroke-width="9"/>
    <line x1="654" y1="306" x2="640" y2="274" stroke="#facc15" stroke-width="5"/>
    <line x1="666" y1="306" x2="680" y2="274" stroke="#334155" stroke-width="9"/>
    <line x1="666" y1="306" x2="680" y2="274" stroke="#facc15" stroke-width="5"/>
  </g>
  <circle cx="640" cy="271" r="5" fill="#16a34a"/>
  <circle cx="680" cy="271" r="5" fill="#16a34a"/>
  <circle cx="660" cy="286" r="12" fill="#92400e" stroke="#334155" stroke-width="2"/>
  <rect x="638" y="388" width="16" height="7" rx="3" fill="#0f172a"/>
  <rect x="670" y="388" width="16" height="7" rx="3" fill="#0f172a"/>

  <!-- the ball in flight, with velocity (tangent) and acceleration (down) -->
  <rect x="566" y="170" width="24" height="56" rx="12" fill="#ffffff" opacity="0.9"/>
  <line x1="578" y1="176" x2="578" y2="220" stroke="#16a34a" stroke-width="5" marker-end="url(#ag)"/>
  <line x1="556" y1="148" x2="620" y2="185" stroke="#2563eb" stroke-width="5" marker-end="url(#vb)"/>
  <circle cx="556" cy="148" r="10" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <polygon points="556,144 560,147 558,152 554,152 552,147" fill="#0f172a"/>
</svg>
