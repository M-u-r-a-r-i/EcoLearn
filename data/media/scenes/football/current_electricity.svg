<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A floodlit football ground at night: two lit pylons, an electronic scoreboard on the stand, a fourth official holding a glowing LED substitution board, and a pitch-side distribution box with cables running out to the lights</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#27374d"/>
    </linearGradient>
    <linearGradient id="beamL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef9c3" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fef9c3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef9c3" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fef9c3" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#sky)"/>

  <!-- light beams -->
  <polygon points="70,86 300,286 40,286" fill="url(#beamL)"/>
  <polygon points="730,86 760,286 500,286" fill="url(#beamR)"/>

  <!-- left floodlight pylon -->
  <rect x="64" y="96" width="10" height="160" fill="#64748b"/>
  <rect x="52" y="256" width="34" height="8" rx="2" fill="#475569"/>
  <rect x="38" y="64" width="62" height="28" rx="3" fill="#334155" stroke="#1e293b" stroke-width="2"/>
  <g fill="#fef08a"><circle cx="52" cy="78" r="6"/><circle cx="69" cy="78" r="6"/><circle cx="86" cy="78" r="6"/></g>

  <!-- right floodlight pylon -->
  <rect x="726" y="96" width="10" height="160" fill="#64748b"/>
  <rect x="714" y="256" width="34" height="8" rx="2" fill="#475569"/>
  <rect x="700" y="64" width="62" height="28" rx="3" fill="#334155" stroke="#1e293b" stroke-width="2"/>
  <g fill="#fef08a"><circle cx="714" cy="78" r="6"/><circle cx="731" cy="78" r="6"/><circle cx="748" cy="78" r="6"/></g>

  <!-- scoreboard on stilts above the stand -->
  <rect x="352" y="196" width="10" height="46" fill="#475569"/>
  <rect x="440" y="196" width="10" height="46" fill="#475569"/>
  <rect x="300" y="104" width="204" height="94" rx="6" fill="#111827" stroke="#475569" stroke-width="3"/>
  <rect x="314" y="118" width="176" height="52" rx="3" fill="#0b1220"/>
  <g fill="#fbbf24" font-size="34" font-weight="bold" text-anchor="middle">
    <text x="360" y="156">2</text>
    <text x="402" y="156">-</text>
    <text x="444" y="156">1</text>
  </g>
  <text x="402" y="188" font-size="13" fill="#94a3b8" text-anchor="middle">67:42</text>

  <!-- stand -->
  <path d="M0,238 Q400,212 800,238 L800,276 L0,276 z" fill="#1e293b"/>
  <path d="M0,252 Q400,226 800,252 L800,276 L0,276 z" fill="#334155"/>
  <g fill="#e2e8f0" opacity="0.3">
    <circle cx="70" cy="246" r="3"/><circle cx="140" cy="242" r="3"/><circle cx="210" cy="238" r="3"/>
    <circle cx="560" cy="238" r="3"/><circle cx="630" cy="242" r="3"/><circle cx="700" cy="246" r="3"/>
  </g>

  <!-- pitch -->
  <rect x="0" y="276" width="800" height="174" fill="#15803d"/>
  <rect x="0" y="296" width="800" height="26" fill="#166534"/>
  <rect x="0" y="356" width="800" height="32" fill="#166534"/>
  <rect x="0" y="424" width="800" height="26" fill="#166534"/>
  <line x1="0" y1="288" x2="800" y2="288" stroke="#e2e8f0" stroke-width="2" opacity="0.45"/>

  <!-- goal, left, seen from the side -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.6">
    <line x1="96" y1="312" x2="44" y2="382"/>
    <line x1="76" y1="312" x2="28" y2="376"/>
    <line x1="34" y1="340" x2="108" y2="340"/>
    <line x1="26" y1="362" x2="108" y2="362"/>
  </g>
  <path d="M112,384 L112,308 L62,308 L26,384" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ball -->
  <circle cx="196" cy="396" r="11" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
  <polygon points="196,391 201,395 199,401 193,401 191,395" fill="#0f172a"/>

  <!-- cable from the distribution box along the touchline to the left pylon -->
  <path d="M624,372 C 460,392 300,384 90,372 L74,300" fill="none" stroke="#0f172a" stroke-width="4" opacity="0.8"/>
  <path d="M624,372 C 460,392 300,384 90,372 L74,300" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- pitch-side distribution box -->
  <rect x="628" y="318" width="112" height="76" rx="4" fill="#94a3b8" stroke="#475569" stroke-width="3"/>
  <rect x="640" y="330" width="88" height="34" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <g fill="#334155"><rect x="648" y="338" width="10" height="18" rx="2"/><rect x="666" y="338" width="10" height="18" rx="2"/><rect x="684" y="338" width="10" height="18" rx="2"/><rect x="702" y="338" width="10" height="18" rx="2"/></g>
  <circle cx="654" cy="378" r="6" fill="#16a34a"/>
  <circle cx="676" cy="378" r="6" fill="#dc2626"/>
  <rect x="694" y="372" width="34" height="12" rx="2" fill="#475569"/>
  <text x="684" y="412" font-size="13" fill="#e2e8f0" text-anchor="middle">distribution box</text>
  <text x="684" y="428" font-size="13" fill="#94a3b8" text-anchor="middle">one supply, many circuits</text>

  <!-- fourth official holding the LED substitution board -->
  <g stroke-linecap="round">
    <line x1="352" y1="374" x2="340" y2="424" stroke="#0f172a" stroke-width="14"/>
    <line x1="352" y1="374" x2="340" y2="424" stroke="#1e293b" stroke-width="10"/>
    <line x1="352" y1="374" x2="368" y2="424" stroke="#0f172a" stroke-width="14"/>
    <line x1="352" y1="374" x2="368" y2="424" stroke="#1e293b" stroke-width="10"/>
    <line x1="352" y1="376" x2="352" y2="330" stroke="#0f172a" stroke-width="23"/>
    <line x1="352" y1="376" x2="352" y2="330" stroke="#0f172a" stroke-width="19"/>
    <line x1="344" y1="334" x2="320" y2="294" stroke="#0f172a" stroke-width="10"/>
    <line x1="344" y1="334" x2="320" y2="294" stroke="#78350f" stroke-width="6"/>
    <line x1="360" y1="334" x2="384" y2="294" stroke="#0f172a" stroke-width="10"/>
    <line x1="360" y1="334" x2="384" y2="294" stroke="#78350f" stroke-width="6"/>
  </g>
  <circle cx="352" cy="312" r="12" fill="#78350f" stroke="#0f172a" stroke-width="2"/>
  <rect x="330" y="422" width="18" height="7" rx="3" fill="#0f172a"/>
  <rect x="360" y="422" width="18" height="7" rx="3" fill="#0f172a"/>
  <!-- the board itself, held up -->
  <rect x="300" y="238" width="104" height="52" rx="5" fill="#111827" stroke="#475569" stroke-width="3"/>
  <g fill="#fb923c" font-size="26" font-weight="bold" text-anchor="middle">
    <text x="330" y="274">7</text>
  </g>
  <g fill="#22c55e" font-size="26" font-weight="bold" text-anchor="middle">
    <text x="376" y="274">14</text>
  </g>

  <!-- battery pack for the board, on the grass -->
  <rect x="446" y="392" width="62" height="30" rx="4" fill="#1f2937" stroke="#0f172a" stroke-width="2"/>
  <rect x="452" y="386" width="12" height="7" rx="2" fill="#94a3b8"/>
  <rect x="490" y="386" width="12" height="7" rx="2" fill="#94a3b8"/>
  <text x="477" y="412" font-size="12" fill="#fbbf24" text-anchor="middle">12 V</text>
  <text x="477" y="438" font-size="13" fill="#e2e8f0" text-anchor="middle">battery pack</text>
</svg>
