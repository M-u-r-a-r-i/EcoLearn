<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Evening at a cricket ground: a walk-through metal-detector arch at the gate, LED bails resting on a wireless charging pad, and a bowling machine with a spinning flywheel</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#3b3a8f"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="soft" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#sky)"/>
  <path d="M0,232 Q400,176 800,232 L800,286 L0,286 z" fill="#0f172a"/>
  <rect x="0" y="286" width="800" height="164" fill="#15803d"/>
  <polygon points="150,336 660,336 720,384 90,384" fill="#d6c08f"/>

  <!-- metal-detector arch at the gate -->
  <g>
    <rect x="40" y="150" width="20" height="180" rx="4" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <rect x="170" y="150" width="20" height="180" rx="4" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <rect x="40" y="128" width="150" height="24" rx="6" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <!-- coil hint inside one pillar -->
    <g stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.95">
      <ellipse cx="50" cy="190" rx="9" ry="6"/>
      <ellipse cx="50" cy="208" rx="9" ry="6"/>
      <ellipse cx="50" cy="226" rx="9" ry="6"/>
      <ellipse cx="50" cy="244" rx="9" ry="6"/>
    </g>
    <circle cx="180" cy="140" r="6" fill="#34d399"/>
    <text x="24" y="412" font-size="14" fill="#fef9c3" font-weight="600">gate metal detector</text>
    <text x="24" y="430" font-size="12" fill="#cbd5e1">coils inside the pillars</text>
  </g>

  <!-- LED bails on a wireless charging pad -->
  <g>
    <circle cx="380" cy="292" r="56" fill="url(#soft)"/>
    <rect x="330" y="300" width="100" height="16" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <g stroke="#38bdf8" stroke-width="2.5" fill="none">
      <ellipse cx="380" cy="308" rx="30" ry="5"/>
      <ellipse cx="380" cy="308" rx="20" ry="3.5"/>
    </g>
    <g stroke="#fde047" stroke-width="7" stroke-linecap="round">
      <line x1="362" y1="262" x2="362" y2="300"/>
      <line x1="380" y1="262" x2="380" y2="300"/>
      <line x1="398" y1="262" x2="398" y2="300"/>
    </g>
    <g stroke="#fef08a" stroke-width="5" stroke-linecap="round">
      <line x1="356" y1="256" x2="374" y2="256"/>
      <line x1="386" y1="256" x2="404" y2="256"/>
    </g>
    <text x="300" y="412" font-size="14" fill="#fef9c3" font-weight="600">LED bails charging</text>
    <text x="300" y="430" font-size="12" fill="#cbd5e1">no plug, just two coils</text>
  </g>

  <!-- bowling machine with flywheel -->
  <g>
    <rect x="596" y="288" width="14" height="52" fill="#334155"/>
    <rect x="566" y="330" width="74" height="12" rx="4" fill="#1e293b"/>
    <rect x="560" y="236" width="86" height="56" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="583" cy="264" r="17" fill="#475569" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="623" cy="264" r="17" fill="#475569" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M 570 250 A 20 20 0 0 1 596 250" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <path d="M 610 250 A 20 20 0 0 1 636 250" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="676" cy="264" r="9" fill="#dc2626"/>
    <text x="556" y="412" font-size="14" fill="#fef9c3" font-weight="600">bowling machine</text>
    <text x="556" y="430" font-size="12" fill="#cbd5e1">motor coils, spinning wheels</text>
  </g>

  <text x="250" y="60" font-size="19" fill="#f8fafc" font-weight="700">Three machines at the ground</text>
  <text x="250" y="84" font-size="14" fill="#e2e8f0">each one runs on a changing magnetic field</text>
</svg>
