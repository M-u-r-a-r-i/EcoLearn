<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A cricket ground under a gathering storm: lightning in the distance, a floodlight tower with a rod on top, a curator testing the pitch with a moisture meter, a car by the boundary and a photographer's flash firing</title>
  <defs>
    <linearGradient id="storm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="0.7" stop-color="#64748b"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <radialGradient id="flash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fefce8" stop-opacity="1"/>
      <stop offset="1" stop-color="#fef08a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#storm)"/>

  <!-- storm cloud and lightning -->
  <g fill="#1e293b">
    <ellipse cx="170" cy="70" rx="120" ry="38"/>
    <ellipse cx="250" cy="52" rx="80" ry="34"/>
    <ellipse cx="100" cy="58" rx="70" ry="30"/>
    <ellipse cx="330" cy="72" rx="70" ry="26"/>
  </g>
  <polyline points="150,100 128,142 146,146 112,205" fill="none" stroke="#fde047" stroke-width="5" stroke-linejoin="round"/>

  <!-- stands -->
  <path d="M0,205 L800,205 L800,252 L0,252 z" fill="#0f172a"/>
  <g fill="#1e293b">
    <rect x="0" y="195" width="260" height="12"/>
    <rect x="300" y="190" width="200" height="16"/>
    <rect x="540" y="196" width="260" height="10"/>
  </g>

  <!-- floodlight tower with a lightning rod on top -->
  <rect x="684" y="80" width="12" height="172" fill="#475569"/>
  <rect x="654" y="50" width="72" height="34" rx="4" fill="#1e293b"/>
  <g fill="#e2e8f0">
    <circle cx="668" cy="61" r="5"/><circle cx="684" cy="61" r="5"/><circle cx="700" cy="61" r="5"/><circle cx="714" cy="61" r="5"/>
    <circle cx="668" cy="74" r="5"/><circle cx="684" cy="74" r="5"/><circle cx="700" cy="74" r="5"/><circle cx="714" cy="74" r="5"/>
  </g>
  <line x1="690" y1="50" x2="690" y2="16" stroke="#94a3b8" stroke-width="3"/>
  <text x="600" y="30" font-size="14" fill="#f8fafc" font-weight="600">lightning rod</text>

  <!-- grass and pitch -->
  <rect x="0" y="252" width="800" height="198" fill="#15803d"/>
  <polygon points="300,285 500,285 560,380 240,380" fill="#d6c08f"/>
  <line x1="286" y1="306" x2="514" y2="306" stroke="#f8fafc" stroke-width="2"/>

  <!-- stumps at the far end, with a stump microphone -->
  <g stroke="#f8fafc" stroke-width="4" stroke-linecap="round">
    <line x1="390" y1="262" x2="390" y2="296"/>
    <line x1="400" y1="262" x2="400" y2="296"/>
    <line x1="410" y1="262" x2="410" y2="296"/>
  </g>
  <line x1="386" y1="259" x2="414" y2="259" stroke="#fbbf24" stroke-width="3"/>
  <circle cx="400" cy="288" r="3" fill="#0f172a"/>
  <line x1="404" y1="288" x2="432" y2="276" stroke="#f8fafc" stroke-width="1.5"/>
  <text x="436" y="278" font-size="13" fill="#f8fafc" font-weight="600">stump mic</text>

  <!-- curator kneeling with a moisture meter -->
  <g stroke-linecap="round">
    <line x1="306" y1="352" x2="328" y2="372" stroke="#1e3a8a" stroke-width="10"/>
    <line x1="306" y1="352" x2="296" y2="376" stroke="#1e3a8a" stroke-width="10"/>
    <line x1="302" y1="316" x2="306" y2="352" stroke="#ea580c" stroke-width="20"/>
    <line x1="306" y1="326" x2="334" y2="338" stroke="#a16207" stroke-width="6"/>
  </g>
  <circle cx="300" cy="300" r="11" fill="#a16207"/>
  <rect x="330" y="326" width="18" height="24" rx="3" fill="#0f172a" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="333" y="330" width="12" height="7" fill="#34d399"/>
  <line x1="339" y1="350" x2="339" y2="372" stroke="#cbd5e1" stroke-width="3"/>
  <text x="352" y="344" font-size="13" fill="#0f172a" font-weight="700">moisture meter</text>

  <!-- boundary rope -->
  <path d="M0,408 Q400,380 800,408" fill="none" stroke="#f8fafc" stroke-width="3"/>

  <!-- car beyond the boundary -->
  <g>
    <path d="M40,420 L60,398 L150,398 L175,420 z" fill="#2563eb"/>
    <rect x="28" y="418" width="164" height="18" rx="6" fill="#1d4ed8"/>
    <path d="M68,402 L84,402 L84,418 L56,418 z" fill="#bfdbfe"/>
    <path d="M90,402 L144,402 L162,418 L90,418 z" fill="#bfdbfe"/>
    <circle cx="66" cy="438" r="10" fill="#0f172a"/>
    <circle cx="156" cy="438" r="10" fill="#0f172a"/>
  </g>
  <text x="200" y="438" font-size="13" fill="#f8fafc" font-weight="600">car</text>

  <!-- photographer with a flash firing -->
  <circle cx="634" cy="352" r="34" fill="url(#flash)"/>
  <g stroke-linecap="round">
    <line x1="660" y1="410" x2="652" y2="440" stroke="#0f172a" stroke-width="10"/>
    <line x1="664" y1="410" x2="674" y2="440" stroke="#0f172a" stroke-width="10"/>
    <line x1="662" y1="376" x2="662" y2="410" stroke="#7c3aed" stroke-width="20"/>
    <line x1="660" y1="382" x2="640" y2="372" stroke="#a16207" stroke-width="6"/>
  </g>
  <circle cx="664" cy="360" r="11" fill="#a16207"/>
  <rect x="628" y="362" width="22" height="16" rx="3" fill="#111827"/>
  <rect x="632" y="350" width="12" height="12" fill="#e5e7eb" stroke="#111827" stroke-width="1.5"/>
  <text x="688" y="380" font-size="13" fill="#f8fafc" font-weight="600">camera flash</text>
</svg>
