<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A cricket ground by day: a batter has hit a ball high into the air, a fielder waits under it, a player runs up the stadium steps and a groundsman pushes a heavy roller</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#sky)"/>
  <!-- clouds -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="640" cy="70" rx="60" ry="18"/><ellipse cx="610" cy="58" rx="30" ry="16"/><ellipse cx="668" cy="56" rx="26" ry="14"/>
    <ellipse cx="330" cy="46" rx="44" ry="13"/><ellipse cx="350" cy="36" rx="22" ry="11"/>
  </g>

  <!-- grass -->
  <rect x="0" y="240" width="800" height="210" fill="#16a34a"/>
  <g fill="#22c55e">
    <rect x="0" y="262" width="800" height="22"/><rect x="0" y="306" width="800" height="22"/>
    <rect x="0" y="350" width="800" height="22"/><rect x="0" y="394" width="800" height="22"/>
  </g>
  <!-- boundary rope -->
  <path d="M 0 262 Q 400 238 800 262" fill="none" stroke="#f8fafc" stroke-width="4"/>

  <!-- stands with steps -->
  <polygon points="0,90 50,90 50,124 100,124 100,158 150,158 150,192 200,192 200,226 250,226 250,250 0,250" fill="#64748b"/>
  <g stroke="#cbd5e1" stroke-width="3">
    <line x1="0" y1="90" x2="50" y2="90"/><line x1="50" y1="124" x2="100" y2="124"/><line x1="100" y1="158" x2="150" y2="158"/>
    <line x1="150" y1="192" x2="200" y2="192"/><line x1="200" y1="226" x2="250" y2="226"/>
  </g>
  <g fill="#94a3b8">
    <rect x="8" y="100" width="12" height="14" rx="2"/><rect x="28" y="100" width="12" height="14" rx="2"/>
    <rect x="58" y="134" width="12" height="14" rx="2"/><rect x="78" y="134" width="12" height="14" rx="2"/>
    <rect x="158" y="202" width="12" height="14" rx="2"/><rect x="178" y="202" width="12" height="14" rx="2"/>
    <rect x="208" y="234" width="12" height="12" rx="2"/><rect x="228" y="234" width="12" height="12" rx="2"/>
  </g>
  <!-- player running up the steps -->
  <g stroke-linecap="round">
    <line x1="126" y1="140" x2="114" y2="157" stroke="#1e3a8a" stroke-width="6"/>
    <line x1="128" y1="140" x2="142" y2="150" stroke="#1e3a8a" stroke-width="6"/>
    <line x1="126" y1="140" x2="120" y2="116" stroke="#2563eb" stroke-width="11"/>
    <line x1="121" y1="120" x2="108" y2="130" stroke="#8d5a3b" stroke-width="4"/>
    <line x1="121" y1="120" x2="134" y2="112" stroke="#8d5a3b" stroke-width="4"/>
  </g>
  <circle cx="119" cy="104" r="7" fill="#8d5a3b"/>

  <!-- pitch and stumps -->
  <polygon points="300,322 560,322 582,352 278,352" fill="#d6c08f"/>
  <g stroke="#fef3c7" stroke-width="4" stroke-linecap="round">
    <line x1="302" y1="298" x2="302" y2="332"/><line x1="310" y1="298" x2="310" y2="332"/><line x1="318" y1="298" x2="318" y2="332"/>
    <line x1="552" y1="298" x2="552" y2="332"/><line x1="560" y1="298" x2="560" y2="332"/><line x1="568" y1="298" x2="568" y2="332"/>
  </g>

  <!-- the skier: dashed flight path, ball near the top -->
  <path d="M 348 262 Q 470 -110 612 262" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-dasharray="7 7"/>
  <circle cx="480" cy="79" r="7" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1.5"/>

  <!-- batter, bat raised after the shot -->
  <g stroke-linecap="round">
    <line x1="340" y1="300" x2="332" y2="336" stroke="#f8fafc" stroke-width="9"/>
    <line x1="342" y1="300" x2="352" y2="336" stroke="#f8fafc" stroke-width="9"/>
    <line x1="341" y1="302" x2="341" y2="266" stroke="#f8fafc" stroke-width="18"/>
    <line x1="344" y1="272" x2="356" y2="250" stroke="#8d5a3b" stroke-width="5"/>
    <line x1="356" y1="250" x2="366" y2="214" stroke="#d6a86b" stroke-width="7"/>
  </g>
  <circle cx="341" cy="251" r="9" fill="#1e3a8a"/>

  <!-- fielder under the ball, hands cupped -->
  <g stroke-linecap="round">
    <line x1="620" y1="330" x2="612" y2="366" stroke="#f8fafc" stroke-width="9"/>
    <line x1="622" y1="330" x2="632" y2="366" stroke="#f8fafc" stroke-width="9"/>
    <line x1="621" y1="332" x2="621" y2="294" stroke="#f8fafc" stroke-width="18"/>
    <line x1="616" y1="298" x2="606" y2="272" stroke="#c08457" stroke-width="5"/>
    <line x1="626" y1="298" x2="636" y2="272" stroke="#c08457" stroke-width="5"/>
  </g>
  <circle cx="621" cy="280" r="9" fill="#c08457"/>
  <ellipse cx="621" cy="272" rx="13" ry="4" fill="#f8fafc"/>

  <!-- groundsman pushing a heavy roller -->
  <g transform="translate(-560,0)">
  <rect x="660" y="386" width="96" height="40" rx="20" fill="#475569" stroke="#1e293b" stroke-width="2"/>
  <ellipse cx="660" cy="406" rx="8" ry="20" fill="#334155"/>
  <rect x="664" y="374" width="88" height="12" rx="3" fill="#ea580c"/>
  <line x1="708" y1="380" x2="640" y2="352" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/>
  <g stroke-linecap="round">
    <line x1="624" y1="388" x2="614" y2="426" stroke="#1f2937" stroke-width="8"/>
    <line x1="626" y1="388" x2="640" y2="424" stroke="#1f2937" stroke-width="8"/>
    <line x1="625" y1="390" x2="630" y2="354" stroke="#f97316" stroke-width="16"/>
    <line x1="630" y1="360" x2="642" y2="354" stroke="#8d5a3b" stroke-width="5"/>
  </g>
  <circle cx="631" cy="340" r="9" fill="#8d5a3b"/>
  </g>
</svg>
