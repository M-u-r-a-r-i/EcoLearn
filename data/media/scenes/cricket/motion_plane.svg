<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A day match: a batter lofts the ball in a high arc towards the boundary while a fielder races along the curved rope, and a big screen shows a ball-tracking view of a swinging delivery</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <!-- sky, sun, stands -->
  <rect width="800" height="450" fill="url(#sky)"/>
  <circle cx="720" cy="60" r="28" fill="#fde047" opacity="0.9"/>
  <path d="M0,205 Q400,150 800,205 L800,262 L0,262 z" fill="#1e3a8a"/>
  <path d="M0,224 Q400,170 800,224 L800,262 L0,262 z" fill="#3b5bdb"/>
  <g fill="#f8fafc" opacity="0.55">
    <circle cx="60" cy="222" r="3"/><circle cx="110" cy="214" r="3"/><circle cx="160" cy="208" r="3"/>
    <circle cx="300" cy="194" r="3"/><circle cx="380" cy="190" r="3"/><circle cx="520" cy="194" r="3"/>
    <circle cx="600" cy="202" r="3"/><circle cx="660" cy="208" r="3"/><circle cx="740" cy="218" r="3"/>
  </g>

  <!-- big screen: ball-tracking top view of a swinging delivery -->
  <rect x="30" y="28" width="220" height="120" rx="8" fill="#020617" stroke="#475569" stroke-width="4"/>
  <text x="46" y="52" font-size="13" fill="#94a3b8" font-weight="600">BALL TRACKING · TOP VIEW</text>
  <rect x="50" y="78" width="180" height="40" fill="#a16207" opacity="0.55"/>
  <line x1="62" y1="78" x2="62" y2="118" stroke="#f8fafc" stroke-width="2"/>
  <line x1="218" y1="78" x2="218" y2="118" stroke="#f8fafc" stroke-width="2"/>
  <path d="M 62 108 Q 150 106 218 90" fill="none" stroke="#f87171" stroke-width="3"/>
  <circle cx="218" cy="90" r="4" fill="#f87171"/>
  <text x="46" y="138" font-size="12" fill="#fbbf24">the ball's path curves as it swings</text>
  <rect x="136" y="148" width="8" height="60" fill="#334155"/>

  <!-- ground -->
  <rect x="0" y="262" width="800" height="188" fill="url(#grass)"/>
  <!-- boundary rope: a curve -->
  <path d="M 470 450 Q 600 300 800 282" fill="none" stroke="#f8fafc" stroke-width="5"/>
  <!-- pitch -->
  <polygon points="40,352 400,352 420,384 20,384" fill="#e7d3a6"/>
  <line x1="120" y1="356" x2="110" y2="380" stroke="#ffffff" stroke-width="3"/>

  <!-- stumps behind the batter -->
  <g stroke="#fde68a" stroke-width="5" stroke-linecap="round">
    <line x1="78" y1="318" x2="78" y2="366"/>
    <line x1="86" y1="318" x2="86" y2="366"/>
    <line x1="94" y1="318" x2="94" y2="366"/>
  </g>
  <line x1="75" y1="316" x2="97" y2="316" stroke="#b45309" stroke-width="3"/>

  <!-- batter, bat swung high after a lofted drive -->
  <g stroke-linecap="round">
    <line x1="142" y1="320" x2="130" y2="370" stroke="#f8fafc" stroke-width="12"/>
    <line x1="146" y1="320" x2="162" y2="370" stroke="#f8fafc" stroke-width="12"/>
    <line x1="144" y1="322" x2="144" y2="276" stroke="#1d4ed8" stroke-width="24"/>
    <line x1="146" y1="282" x2="168" y2="258" stroke="#c08457" stroke-width="7"/>
    <line x1="168" y1="258" x2="200" y2="232" stroke="#d6b27c" stroke-width="10"/>
  </g>
  <circle cx="144" cy="256" r="14" fill="#1e3a8a"/>
  <rect x="134" y="250" width="20" height="4" fill="#94a3b8"/>

  <!-- the ball's arc -->
  <path d="M 205 228 Q 470 -120 720 292" fill="none" stroke="#f8fafc" stroke-width="3" stroke-dasharray="9 7"/>
  <circle cx="464" cy="61" r="9" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1.5"/>

  <!-- fielder racing along the rope -->
  <g stroke-linecap="round">
    <line x1="612" y1="340" x2="592" y2="378" stroke="#0f172a" stroke-width="10"/>
    <line x1="616" y1="340" x2="640" y2="372" stroke="#0f172a" stroke-width="10"/>
    <line x1="614" y1="342" x2="620" y2="300" stroke="#16a34a" stroke-width="20"/>
    <line x1="620" y1="306" x2="646" y2="290" stroke="#c08457" stroke-width="6"/>
    <line x1="616" y1="310" x2="592" y2="326" stroke="#c08457" stroke-width="6"/>
  </g>
  <circle cx="621" cy="282" r="12" fill="#c08457"/>
  <path d="M 575 348 Q 560 356 548 370" fill="none" stroke="#f8fafc" stroke-width="2" opacity="0.8"/>
  <path d="M 580 332 Q 566 338 556 348" fill="none" stroke="#f8fafc" stroke-width="2" opacity="0.8"/>
  <text x="660" y="420" font-size="14" fill="#f8fafc" font-weight="600">boundary rope</text>
</svg>
