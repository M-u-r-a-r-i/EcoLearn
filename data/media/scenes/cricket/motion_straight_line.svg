<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A cricket ground on a sunny afternoon: a batter running between the wickets on a 22-yard pitch, a fielder chasing the ball towards the boundary rope, and a speed display</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#sky)"/>
  <circle cx="90" cy="70" r="34" fill="#fde047"/>

  <!-- stands -->
  <path d="M0,200 L0,170 Q200,130 400,150 Q600,130 800,165 L800,200 z" fill="#475569"/>
  <g fill="#94a3b8">
    <rect x="30" y="172" width="740" height="4"/>
    <rect x="20" y="186" width="760" height="4"/>
  </g>

  <!-- speed display -->
  <rect x="560" y="40" width="200" height="86" rx="8" fill="#020617" stroke="#475569" stroke-width="4"/>
  <text x="580" y="68" font-size="15" fill="#94a3b8" font-weight="600">BALL SPEED</text>
  <text x="580" y="110" font-size="34" fill="#fbbf24" font-weight="700" font-family="Consolas, monospace">140 km/h</text>
  <rect x="654" y="126" width="12" height="74" fill="#334155"/>

  <!-- grass -->
  <rect x="0" y="200" width="800" height="250" fill="#16a34a"/>
  <rect x="0" y="200" width="800" height="250" fill="#15803d" opacity="0.35"/>

  <!-- pitch, side view -->
  <rect x="90" y="340" width="480" height="18" fill="#d6c08f"/>
  <line x1="130" y1="340" x2="130" y2="358" stroke="#f8fafc" stroke-width="3"/>
  <line x1="530" y1="340" x2="530" y2="358" stroke="#f8fafc" stroke-width="3"/>

  <!-- stumps: bowler's end (left) and striker's end (right) -->
  <g stroke="#fef3c7" stroke-width="5" stroke-linecap="round">
    <line x1="104" y1="290" x2="104" y2="342"/>
    <line x1="112" y1="290" x2="112" y2="342"/>
    <line x1="548" y1="290" x2="548" y2="342"/>
    <line x1="556" y1="290" x2="556" y2="342"/>
  </g>
  <g stroke="#b45309" stroke-width="4" stroke-linecap="round">
    <line x1="101" y1="287" x2="115" y2="287"/>
    <line x1="545" y1="287" x2="559" y2="287"/>
  </g>

  <!-- 22 yards bracket -->
  <g stroke="#f8fafc" stroke-width="2">
    <line x1="108" y1="380" x2="552" y2="380"/>
    <line x1="108" y1="372" x2="108" y2="388"/>
    <line x1="552" y1="372" x2="552" y2="388"/>
  </g>
  <text x="330" y="405" font-size="16" fill="#f8fafc" font-weight="700" text-anchor="middle">22 yards = 20.12 m, stumps to stumps</text>

  <!-- batter running from right to left, bat stretched ahead -->
  <g stroke-linecap="round">
    <line x1="330" y1="300" x2="306" y2="338" stroke="#f8fafc" stroke-width="12"/>
    <line x1="334" y1="300" x2="360" y2="334" stroke="#f8fafc" stroke-width="12"/>
    <line x1="332" y1="302" x2="324" y2="254" stroke="#f8fafc" stroke-width="24"/>
    <line x1="322" y1="266" x2="292" y2="282" stroke="#a16207" stroke-width="6"/>
    <line x1="292" y1="282" x2="252" y2="300" stroke="#d6a45c" stroke-width="10"/>
  </g>
  <circle cx="322" cy="228" r="13" fill="#7c2d12"/>
  <path d="M308,226 Q322,208 336,226 z" fill="#1e3a8a"/>
  <line x1="308" y1="226" x2="298" y2="228" stroke="#1e3a8a" stroke-width="4" stroke-linecap="round"/>
  <!-- motion lines -->
  <g stroke="#f8fafc" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="366" y1="250" x2="396" y2="250"/>
    <line x1="370" y1="268" x2="406" y2="268"/>
    <line x1="366" y1="286" x2="392" y2="286"/>
  </g>

  <!-- fielder chasing ball towards the rope -->
  <g stroke-linecap="round">
    <line x1="660" y1="306" x2="642" y2="344" stroke="#f8fafc" stroke-width="11"/>
    <line x1="664" y1="306" x2="690" y2="338" stroke="#f8fafc" stroke-width="11"/>
    <line x1="662" y1="308" x2="676" y2="262" stroke="#f8fafc" stroke-width="22"/>
    <line x1="676" y1="274" x2="704" y2="290" stroke="#92400e" stroke-width="6"/>
  </g>
  <circle cx="680" cy="240" r="12" fill="#92400e"/>
  <circle cx="738" cy="340" r="7" fill="#b91c1c"/>
  <g stroke="#f8fafc" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <line x1="712" y1="336" x2="726" y2="336"/>
    <line x1="708" y1="344" x2="724" y2="344"/>
  </g>
  <!-- boundary rope -->
  <path d="M770,230 Q782,330 770,440" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/>
  <text x="690" y="425" font-size="14" fill="#fef9c3" font-weight="600" text-anchor="middle">rope</text>
</svg>
