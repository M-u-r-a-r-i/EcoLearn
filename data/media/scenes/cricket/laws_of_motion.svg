<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t">
  <title id="t">A batter drives the ball back past the bowler in a floodlit stadium</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <!-- sky, stands, floodlights -->
  <rect width="800" height="450" fill="url(#sky)"/>
  <path d="M0,215 Q400,150 800,215 L800,262 L0,262 z" fill="#1e3a8a"/>
  <path d="M0,232 Q400,172 800,232 L800,262 L0,262 z" fill="#3b5bdb"/>
  <g fill="#f8fafc" opacity="0.55">
    <circle cx="90" cy="228" r="3"/><circle cx="130" cy="222" r="3"/><circle cx="170" cy="216" r="3"/>
    <circle cx="560" cy="206" r="3"/><circle cx="610" cy="211" r="3"/><circle cx="660" cy="217" r="3"/>
    <circle cx="700" cy="222" r="3"/><circle cx="330" cy="200" r="3"/><circle cx="470" cy="200" r="3"/>
  </g>
  <g>
    <rect x="58" y="70" width="8" height="150" fill="#64748b"/>
    <rect x="36" y="52" width="52" height="24" rx="3" fill="#334155"/>
    <g fill="#fef9c3"><circle cx="46" cy="64" r="5"/><circle cx="62" cy="64" r="5"/><circle cx="78" cy="64" r="5"/></g>
    <rect x="734" y="70" width="8" height="150" fill="#64748b"/>
    <rect x="712" y="52" width="52" height="24" rx="3" fill="#334155"/>
    <g fill="#fef9c3"><circle cx="722" cy="64" r="5"/><circle cx="738" cy="64" r="5"/><circle cx="754" cy="64" r="5"/></g>
  </g>

  <!-- ground and pitch -->
  <rect x="0" y="262" width="800" height="188" fill="url(#grass)"/>
  <polygon points="120,318 690,318 720,352 90,352" fill="#e7d3a6"/>
  <line x1="150" y1="322" x2="150" y2="348" stroke="#ffffff" stroke-width="3"/>
  <line x1="660" y1="322" x2="660" y2="348" stroke="#ffffff" stroke-width="3"/>

  <!-- stumps, batter's end -->
  <g stroke="#fde68a" stroke-width="5" stroke-linecap="round">
    <line x1="126" y1="282" x2="126" y2="332"/>
    <line x1="134" y1="282" x2="134" y2="332"/>
    <line x1="142" y1="282" x2="142" y2="332"/>
  </g>
  <line x1="123" y1="280" x2="145" y2="280" stroke="#b45309" stroke-width="3"/>

  <!-- stumps, bowler's end -->
  <g stroke="#fde68a" stroke-width="4" stroke-linecap="round">
    <line x1="668" y1="292" x2="668" y2="330"/>
    <line x1="675" y1="292" x2="675" y2="330"/>
    <line x1="682" y1="292" x2="682" y2="330"/>
  </g>

  <!-- batter (facing right), leaning into a drive -->
  <g stroke-linecap="round">
    <line x1="192" y1="262" x2="176" y2="334" stroke="#334155" stroke-width="18"/>
    <line x1="192" y1="262" x2="176" y2="334" stroke="#f8fafc" stroke-width="14"/>
    <line x1="196" y1="262" x2="232" y2="334" stroke="#334155" stroke-width="18"/>
    <line x1="196" y1="262" x2="232" y2="334" stroke="#f8fafc" stroke-width="14"/>
    <line x1="194" y1="262" x2="214" y2="206" stroke="#334155" stroke-width="30"/>
    <line x1="194" y1="262" x2="214" y2="206" stroke="#f8fafc" stroke-width="26"/>
    <line x1="214" y1="212" x2="250" y2="236" stroke="#334155" stroke-width="12"/>
    <line x1="214" y1="212" x2="250" y2="236" stroke="#f1c9a5" stroke-width="8"/>
    <!-- bat: handle in the hands, blade down through the ball -->
    <line x1="250" y1="236" x2="286" y2="286" stroke="#78350f" stroke-width="13"/>
    <line x1="250" y1="236" x2="286" y2="286" stroke="#e6c48a" stroke-width="9"/>
  </g>
  <circle cx="222" cy="190" r="15" fill="#1e3a8a"/>
  <path d="M 228 190 L 238 190 L 238 202" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <rect x="170" y="330" width="16" height="7" rx="3" fill="#0f172a"/>
  <rect x="226" y="330" width="16" height="7" rx="3" fill="#0f172a"/>

  <!-- the ball, just off the bat, flying back past the bowler -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="262" y1="286" x2="290" y2="280"/>
    <line x1="266" y1="296" x2="294" y2="290"/>
  </g>
  <circle cx="306" cy="280" r="7" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1.5"/>

  <!-- bowler in follow-through at the far end -->
  <g stroke-linecap="round">
    <line x1="612" y1="276" x2="598" y2="330" stroke="#334155" stroke-width="15"/>
    <line x1="612" y1="276" x2="598" y2="330" stroke="#f8fafc" stroke-width="11"/>
    <line x1="614" y1="276" x2="636" y2="328" stroke="#334155" stroke-width="15"/>
    <line x1="614" y1="276" x2="636" y2="328" stroke="#f8fafc" stroke-width="11"/>
    <line x1="613" y1="276" x2="604" y2="232" stroke="#334155" stroke-width="24"/>
    <line x1="613" y1="276" x2="604" y2="232" stroke="#f8fafc" stroke-width="20"/>
    <line x1="604" y1="238" x2="576" y2="262" stroke="#334155" stroke-width="10"/>
    <line x1="604" y1="238" x2="576" y2="262" stroke="#f1c9a5" stroke-width="6"/>
  </g>
  <circle cx="602" cy="218" r="12" fill="#f1c9a5" stroke="#334155" stroke-width="2"/>
  <path d="M 591 214 Q 602 202 613 214" fill="#1f2937"/>
</svg>
