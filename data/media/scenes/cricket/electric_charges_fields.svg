<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A storm rolls over a cricket ground: dark clouds and distant lightning, players walking off, groundstaff dragging a plastic cover over the pitch, and the team bus waiting</title>
  <defs>
    <linearGradient id="storm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="0.7" stop-color="#475569"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <radialGradient id="flash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef9c3" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fef9c3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#storm)"/>

  <!-- lightning far away, behind the clouds -->
  <circle cx="440" cy="140" r="70" fill="url(#flash)"/>
  <polyline points="448,90 430,136 448,136 424,186 440,186 418,226" fill="none" stroke="#fef08a" stroke-width="5" stroke-linejoin="round"/>

  <!-- storm clouds -->
  <g fill="#0f172a" opacity="0.92">
    <ellipse cx="160" cy="64" rx="150" ry="44"/>
    <ellipse cx="300" cy="50" rx="120" ry="40"/>
    <ellipse cx="470" cy="62" rx="150" ry="46"/>
    <ellipse cx="660" cy="56" rx="160" ry="44"/>
  </g>
  <g fill="#1e293b">
    <ellipse cx="230" cy="90" rx="110" ry="26"/>
    <ellipse cx="560" cy="94" rx="130" ry="28"/>
  </g>

  <!-- stands -->
  <path d="M0,238 Q400,196 800,238 L800,272 L0,272 z" fill="#0f172a"/>

  <!-- floodlight tower (off) -->
  <rect x="84" y="118" width="12" height="136" fill="#334155"/>
  <rect x="56" y="94" width="68" height="30" rx="4" fill="#1e293b"/>
  <g fill="#64748b">
    <circle cx="70" cy="104" r="5"/><circle cx="86" cy="104" r="5"/><circle cx="102" cy="104" r="5"/>
    <circle cx="70" cy="116" r="5"/><circle cx="86" cy="116" r="5"/><circle cx="102" cy="116" r="5"/>
  </g>

  <!-- team bus beyond the boundary -->
  <rect x="610" y="214" width="170" height="54" rx="8" fill="#e2e8f0"/>
  <g fill="#1e3a8a">
    <rect x="622" y="224" width="26" height="20" rx="2"/><rect x="654" y="224" width="26" height="20" rx="2"/>
    <rect x="686" y="224" width="26" height="20" rx="2"/><rect x="718" y="224" width="26" height="20" rx="2"/>
    <rect x="750" y="224" width="22" height="30" rx="2"/>
  </g>
  <circle cx="640" cy="268" r="9" fill="#111827"/><circle cx="752" cy="268" r="9" fill="#111827"/>
  <text x="695" y="206" font-size="13" fill="#e2e8f0" text-anchor="middle" font-weight="600">metal-bodied team bus</text>

  <!-- rain streaks -->
  <g stroke="#cbd5e1" stroke-width="1.5" opacity="0.5">
    <line x1="170" y1="120" x2="162" y2="146"/><line x1="250" y1="130" x2="242" y2="156"/>
    <line x1="330" y1="112" x2="322" y2="138"/><line x1="410" y1="134" x2="402" y2="160"/>
    <line x1="490" y1="116" x2="482" y2="142"/><line x1="570" y1="136" x2="562" y2="162"/>
    <line x1="210" y1="170" x2="202" y2="196"/><line x1="370" y1="176" x2="362" y2="202"/>
    <line x1="530" y1="172" x2="522" y2="198"/>
  </g>

  <!-- grass and pitch -->
  <rect x="0" y="272" width="800" height="178" fill="#166534"/>
  <polygon points="220,318 600,318 640,366 180,366" fill="#d6c08f"/>

  <!-- stumps at the far end -->
  <g stroke="#f8fafc" stroke-width="4" stroke-linecap="round">
    <line x1="228" y1="300" x2="228" y2="336"/><line x1="236" y1="300" x2="236" y2="336"/><line x1="244" y1="300" x2="244" y2="336"/>
  </g>

  <!-- groundstaff dragging a clear plastic cover -->
  <path d="M300,322 Q380,300 470,318 L520,364 Q400,344 330,366 z" fill="#bae6fd" opacity="0.7" stroke="#e0f2fe" stroke-width="2"/>
  <g stroke-linecap="round">
    <line x1="520" y1="364" x2="552" y2="340" stroke="#e0f2fe" stroke-width="2"/>
    <line x1="560" y1="360" x2="552" y2="400" stroke="#1f2937" stroke-width="10"/>
    <line x1="562" y1="360" x2="574" y2="400" stroke="#1f2937" stroke-width="10"/>
    <line x1="562" y1="362" x2="560" y2="322" stroke="#f97316" stroke-width="20"/>
    <line x1="558" y1="332" x2="540" y2="344" stroke="#8d5524" stroke-width="6"/>
  </g>
  <circle cx="562" cy="306" r="11" fill="#8d5524"/>
  <text x="592" y="392" font-size="14" fill="#f8fafc" font-weight="600">rubbing plastic</text>
  <text x="592" y="409" font-size="14" fill="#f8fafc" font-weight="600">over grass</text>

  <!-- two players walking off, bat and helmet -->
  <g stroke-linecap="round">
    <line x1="92" y1="360" x2="84" y2="404" stroke="#e5e7eb" stroke-width="11"/>
    <line x1="94" y1="360" x2="104" y2="404" stroke="#e5e7eb" stroke-width="11"/>
    <line x1="93" y1="362" x2="93" y2="318" stroke="#f8fafc" stroke-width="22"/>
    <line x1="100" y1="330" x2="118" y2="370" stroke="#b45309" stroke-width="7"/>
    <line x1="152" y1="362" x2="146" y2="404" stroke="#e5e7eb" stroke-width="11"/>
    <line x1="154" y1="362" x2="162" y2="404" stroke="#e5e7eb" stroke-width="11"/>
    <line x1="153" y1="364" x2="153" y2="322" stroke="#f8fafc" stroke-width="22"/>
  </g>
  <circle cx="93" cy="302" r="11" fill="#c08457"/>
  <path d="M81,300 A12,12 0 0 1 105,300 z" fill="#1e3a8a"/>
  <circle cx="153" cy="306" r="11" fill="#6b4226"/>
  <text x="40" y="430" font-size="14" fill="#f8fafc" font-weight="600">play stopped: lightning nearby</text>
</svg>
