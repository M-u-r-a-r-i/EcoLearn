<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A concert stage: a speaker cabinet with a big woofer and a small tweeter, a drum kit, and a roadie pushing a flight case</title>
  <defs>
    <linearGradient id="curtain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <radialGradient id="cone" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6b7280"/>
      <stop offset="0.35" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#111827"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#curtain)"/>
  <!-- spotlight beams -->
  <polygon points="240,0 290,0 470,360 330,360" fill="#fde68a" opacity="0.13"/>
  <polygon points="560,0 600,0 700,360 560,360" fill="#a5f3fc" opacity="0.10"/>
  <!-- stage floor -->
  <rect x="0" y="360" width="800" height="90" fill="#292524"/>
  <rect x="0" y="356" width="800" height="8" fill="#57534e"/>

  <!-- speaker cabinet: big woofer, tiny tweeter -->
  <rect x="70" y="150" width="190" height="210" rx="8" fill="#0f172a" stroke="#475569" stroke-width="3"/>
  <circle cx="165" cy="200" r="20" fill="url(#cone)" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="165" cy="200" r="6" fill="#cbd5e1"/>
  <circle cx="165" cy="292" r="56" fill="url(#cone)" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="165" cy="292" r="36" fill="none" stroke="#374151" stroke-width="2"/>
  <circle cx="165" cy="292" r="14" fill="#4b5563"/>
  <!-- labels -->
  <g font-size="15" fill="#f8fafc" font-weight="600">
    <line x1="187" y1="194" x2="300" y2="160" stroke="#f8fafc" stroke-width="1.5"/>
    <text x="304" y="158">tweeter — tiny, light: high notes</text>
    <line x1="165" y1="349" x2="165" y2="388" stroke="#f8fafc" stroke-width="1.5"/>
    <text x="72" y="406">woofer — big, heavy: bass</text>
  </g>

  <!-- drum kit, centre-right -->
  <line x1="470" y1="240" x2="470" y2="356" stroke="#9ca3af" stroke-width="4"/>
  <ellipse cx="470" cy="236" rx="46" ry="8" fill="#facc15" stroke="#a16207" stroke-width="2"/>
  <circle cx="420" cy="306" r="50" fill="#b91c1c" stroke="#fef2f2" stroke-width="4"/>
  <circle cx="420" cy="306" r="36" fill="#fef2f2" opacity="0.9"/>
  <ellipse cx="370" cy="262" rx="26" ry="9" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <rect x="344" y="262" width="52" height="20" fill="#dc2626"/>
  <!-- drummer behind the kit -->
  <line x1="420" y1="250" x2="420" y2="212" stroke="#111827" stroke-width="24" stroke-linecap="round"/>
  <circle cx="420" cy="192" r="15" fill="#c08457"/>
  <path d="M 405 188 Q 420 170 435 188" fill="#111827"/>
  <line x1="420" y1="222" x2="382" y2="246" stroke="#c08457" stroke-width="7" stroke-linecap="round"/>
  <line x1="382" y1="246" x2="372" y2="258" stroke="#fef3c7" stroke-width="4" stroke-linecap="round"/>

  <!-- roadie pushing a wheeled flight case -->
  <rect x="628" y="286" width="118" height="62" rx="5" fill="#44403c" stroke="#a8a29e" stroke-width="3"/>
  <rect x="640" y="298" width="94" height="10" fill="#78716c"/>
  <circle cx="648" cy="352" r="8" fill="#1c1917" stroke="#a8a29e" stroke-width="2"/>
  <circle cx="726" cy="352" r="8" fill="#1c1917" stroke="#a8a29e" stroke-width="2"/>
  <g stroke-linecap="round">
    <line x1="584" y1="300" x2="566" y2="356" stroke="#0f172a" stroke-width="14"/>
    <line x1="584" y1="300" x2="604" y2="356" stroke="#0f172a" stroke-width="14"/>
    <line x1="586" y1="302" x2="604" y2="258" stroke="#111827" stroke-width="24"/>
    <line x1="604" y1="266" x2="630" y2="296" stroke="#8d5524" stroke-width="7"/>
  </g>
  <circle cx="610" cy="244" r="13" fill="#8d5524"/>
  <rect x="598" y="232" width="24" height="7" rx="3" fill="#111827"/>
  <!-- push arrow -->
  <line x1="632" y1="274" x2="690" y2="274" stroke="#fde68a" stroke-width="4"/>
  <polygon points="690,266 704,274 690,282" fill="#fde68a"/>
  <text x="640" y="262" font-size="14" fill="#fde68a" font-weight="600">push</text>
</svg>
