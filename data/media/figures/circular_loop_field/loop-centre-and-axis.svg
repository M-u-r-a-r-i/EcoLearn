<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Left: a circular current loop seen face on, with the field at its centre pointing out of the page and the formula B equals mu-nought I over 2R. Right: the same loop seen edge on, with the field on the axis at distance x and its formula.</title>
  <defs>
    <marker id="c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>

  <!-- LEFT: face-on -->
  <text x="24" y="32" font-size="14.5" font-weight="700" fill="#111827">At the centre (loop seen face on)</text>
  <circle cx="160" cy="180" r="92" fill="none" stroke="#2563eb" stroke-width="5"/>
  <path d="M 252 180 l -9 14 l 18 0 z" fill="#2563eb"/>
  <text x="160" y="298" font-size="14" fill="#2563eb" font-weight="700" text-anchor="middle">I (anticlockwise)</text>
  <line x1="160" y1="180" x2="252" y2="180" stroke="#111827" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="206" y="172" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">R</text>
  <circle cx="160" cy="180" r="14" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <circle cx="160" cy="180" r="4.5" fill="#7c3aed"/>
  <text x="160" y="126" font-size="13.5" fill="#7c3aed" font-weight="700" text-anchor="middle">B out of the page</text>
  <text x="160" y="332" font-size="16" fill="#111827" font-weight="700" text-anchor="middle">B = μ₀I / 2R</text>
  <text x="160" y="356" font-size="12.5" fill="#475569" text-anchor="middle">N turns: multiply by N</text>

  <line x1="318" y1="24" x2="318" y2="376" stroke="#e2e8f0" stroke-width="2"/>

  <!-- RIGHT: edge-on -->
  <text x="344" y="32" font-size="14.5" font-weight="700" fill="#111827">On the axis (loop seen edge on)</text>
  <ellipse cx="400" cy="180" rx="18" ry="80" fill="none" stroke="#2563eb" stroke-width="5"/>
  <line x1="400" y1="180" x2="400" y2="100" stroke="#111827" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="386" y="140" font-size="14" fill="#111827" font-weight="700" text-anchor="end">R</text>
  <circle cx="400" cy="100" r="5" fill="#2563eb"/>
  <circle cx="400" cy="260" r="5" fill="#2563eb"/>
  <text x="378" y="96" font-size="13" fill="#2563eb" font-weight="700" text-anchor="end">I out</text>
  <text x="378" y="266" font-size="13" fill="#2563eb" font-weight="700" text-anchor="end">I in</text>

  <line x1="400" y1="180" x2="606" y2="180" stroke="#7c3aed" stroke-width="4" marker-end="url(#c2)"/>
  <circle cx="540" cy="180" r="5" fill="#111827"/>
  <text x="540" y="168" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">P</text>
  <line x1="400" y1="206" x2="540" y2="206" stroke="#111827" stroke-width="1.5"/>
  <line x1="400" y1="200" x2="400" y2="212" stroke="#111827" stroke-width="1.5"/>
  <line x1="540" y1="200" x2="540" y2="212" stroke="#111827" stroke-width="1.5"/>
  <text x="470" y="226" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">x</text>
  <text x="606" y="200" font-size="13.5" fill="#7c3aed" font-weight="700" text-anchor="end">B along the axis</text>

  <text x="480" y="300" font-size="16" fill="#111827" font-weight="700" text-anchor="middle">B = μ₀IR² / 2(R²+x²)^(3/2)</text>
  <text x="480" y="326" font-size="12.5" fill="#475569" text-anchor="middle">x = 0 gives the centre value again</text>
</svg>
