<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Three bars of the same material: a reference bar, a longer bar with more resistance, and a thicker bar with less resistance</title>
  <rect width="640" height="400" fill="#ffffff"/>

  <text x="320" y="32" font-size="17" text-anchor="middle" fill="#111827" font-weight="700">Same material, different shape &#8212; different resistance</text>

  <!-- reference bar -->
  <rect x="90" y="62" width="200" height="40" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="190" y="88" font-size="15" text-anchor="middle" fill="#7c2d12" font-weight="700">length L, area A</text>
  <text x="330" y="88" font-size="15" fill="#111827" font-weight="700">resistance R</text>

  <!-- longer bar -->
  <rect x="90" y="160" width="400" height="40" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="290" y="186" font-size="15" text-anchor="middle" fill="#7c2d12" font-weight="700">length 2L, same area A</text>
  <text x="520" y="186" font-size="15" fill="#dc2626" font-weight="700">2R</text>
  <text x="610" y="216" font-size="12" text-anchor="end" fill="#6b7280">twice as far to travel</text>

  <!-- thicker bar -->
  <rect x="90" y="252" width="200" height="80" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="190" y="298" font-size="15" text-anchor="middle" fill="#7c2d12" font-weight="700">length L, area 2A</text>
  <text x="330" y="292" font-size="15" fill="#16a34a" font-weight="700">R / 2</text>
  <text x="330" y="312" font-size="12" fill="#6b7280">twice as many paths side by side</text>

  <text x="320" y="370" font-size="17" text-anchor="middle" fill="#111827" font-weight="700">R = &#961; L / A &#160;&#160; &#8212; &#160;&#160; &#961; belongs to the material, R to the piece</text>
</svg>
