<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A cyclotron seen from above: two hollow D-shaped electrodes with a narrow gap between them, a uniform magnetic field out of the page, and an alternating voltage across the gap. A positive particle starts at the centre and spirals outwards in half-circles of growing radius, gaining energy only while crossing the gap, and leaves at the rim.</title>
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="700" fill="#111827">Cyclotron, seen from above (B points out of the page)</text>

  <!-- dees -->
  <path d="M 300 70 A 130 130 0 0 0 300 330 Z" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
  <path d="M 330 70 A 130 130 0 0 1 330 330 Z" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
  <text x="216" y="216" font-size="24" font-weight="700" fill="#0369a1">D₁</text>
  <text x="400" y="216" font-size="24" font-weight="700" fill="#0369a1">D₂</text>
  <text x="315" y="352" font-size="13" fill="#475569" text-anchor="middle">gap</text>

  <!-- the spiral: half-circles of growing radius, clockwise (positive charge, B out of page) -->
  <path d="M 315 200
           A 15 15 0 0 1 315 230
           A 25 25 0 0 1 315 180
           A 35 35 0 0 1 315 250
           A 45 45 0 0 1 315 160
           A 55 55 0 0 1 315 270
           A 65 65 0 0 1 315 140
           A 75 75 0 0 1 315 290
           A 85 85 0 0 1 315 120
           A 95 95 0 0 1 315 310"
        fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="315" y1="310" x2="170" y2="310" stroke="#dc2626" stroke-width="3"/>
  <path d="M 160 310 l 15 -6 l 0 12 z" fill="#dc2626"/>
  <text x="152" y="336" font-size="13.5" fill="#dc2626" font-weight="700" text-anchor="end">fast beam out</text>
  <circle cx="315" cy="200" r="5" fill="#111827"/>
  <text x="315" y="178" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">source</text>

  <!-- field symbols out of page -->
  <g stroke="#7c3aed" stroke-width="2" fill="none">
    <circle cx="570" cy="180" r="9"/><circle cx="570" cy="180" r="2.5" fill="#7c3aed"/>
    <circle cx="570" cy="230" r="9"/><circle cx="570" cy="230" r="2.5" fill="#7c3aed"/>
    <circle cx="570" cy="280" r="9"/><circle cx="570" cy="280" r="2.5" fill="#7c3aed"/>
  </g>
  <text x="570" y="316" font-size="13" fill="#7c3aed" font-weight="700" text-anchor="middle">B out of page</text>

  <!-- alternating supply -->
  <rect x="452" y="56" width="164" height="60" rx="8" fill="#f1f5f9" stroke="#111827" stroke-width="2"/>
  <text x="534" y="80" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">alternating voltage,</text>
  <text x="534" y="100" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">frequency f</text>
  <path d="M 452 86 L 340 62" stroke="#111827" stroke-width="2"/>
  <line x1="315" y1="70" x2="315" y2="48" stroke="#111827" stroke-width="2" stroke-dasharray="5 4"/>

  <text x="24" y="382" font-size="13" fill="#111827" font-weight="700">Inside a dee there is no electric field: the particle just turns. It speeds up only while crossing the gap.</text>
</svg>
