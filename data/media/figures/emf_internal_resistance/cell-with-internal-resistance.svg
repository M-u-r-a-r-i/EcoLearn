<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A real cell modelled as an ideal source of emf in series with an internal resistance, connected to an external resistor, with a voltmeter reading the terminal potential difference</title>
  <defs>
    <marker id="e-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>

  <text x="320" y="32" font-size="17" text-anchor="middle" fill="#111827" font-weight="700">A real cell = ideal emf + a resistance you cannot remove</text>

  <!-- dashed box around the cell -->
  <rect x="60" y="80" width="190" height="200" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="155" y="104" font-size="14" text-anchor="middle" fill="#b45309" font-weight="700">inside the cell</text>

  <!-- emf symbol -->
  <line x1="120" y1="150" x2="190" y2="150" stroke="#111827" stroke-width="3"/>
  <line x1="138" y1="166" x2="172" y2="166" stroke="#111827" stroke-width="7"/>
  <text x="200" y="152" font-size="15" fill="#111827" font-weight="700">+</text>
  <text x="96" y="162" font-size="15" fill="#111827" font-weight="700">&#949;</text>

  <!-- internal resistance -->
  <g stroke="#111827" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="155" y1="166" x2="155" y2="196"/>
    <polyline points="155,196 141,206 169,220 141,234 169,248 155,258 155,262"/>
  </g>
  <text x="196" y="230" font-size="15" fill="#dc2626" font-weight="700">r</text>

  <!-- wires out of the cell to the external resistor -->
  <g stroke="#111827" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="155" y1="150" x2="155" y2="120"/>
    <line x1="155" y1="120" x2="330" y2="120"/>
    <line x1="330" y1="120" x2="330" y2="160"/>
    <polyline points="330,160 316,172 344,186 316,200 344,214 330,226 330,260"/>
    <line x1="330" y1="260" x2="330" y2="300"/>
    <line x1="330" y1="300" x2="155" y2="300"/>
    <line x1="155" y1="300" x2="155" y2="262"/>
  </g>
  <text x="366" y="198" font-size="15" fill="#111827" font-weight="700">R</text>

  <!-- terminals -->
  <circle cx="330" cy="120" r="5" fill="#111827"/>
  <circle cx="330" cy="300" r="5" fill="#111827"/>
  <text x="346" y="116" font-size="13" fill="#6b7280">terminal</text>
  <text x="346" y="316" font-size="13" fill="#6b7280">terminal</text>

  <!-- voltmeter across the terminals -->
  <g stroke="#111827" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="330" y1="120" x2="470" y2="120"/>
    <line x1="470" y1="120" x2="470" y2="182"/>
    <line x1="470" y1="238" x2="470" y2="300"/>
    <line x1="470" y1="300" x2="330" y2="300"/>
  </g>
  <circle cx="470" cy="210" r="28" fill="#fef3c7" stroke="#111827" stroke-width="3"/>
  <text x="470" y="217" font-size="20" text-anchor="middle" fill="#111827" font-weight="700">V</text>
  <text x="512" y="206" font-size="14" fill="#92400e" font-weight="700">reads V, not &#949;</text>
  <text x="512" y="226" font-size="13" fill="#6b7280">(equal only when I = 0)</text>

  <!-- current -->
  <line x1="220" y1="120" x2="270" y2="120" stroke="#2563eb" stroke-width="3" marker-end="url(#e-blue)"/>
  <text x="245" y="110" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="700">I</text>

  <text x="320" y="352" font-size="17" text-anchor="middle" fill="#111827" font-weight="700">V = &#949; &#8722; I r &#160;&#160;&#160; and &#160;&#160;&#160; I = &#949; / (R + r)</text>
  <text x="320" y="378" font-size="13" text-anchor="middle" fill="#6b7280">the bigger the current, the more of the emf is lost inside the cell</text>
</svg>
