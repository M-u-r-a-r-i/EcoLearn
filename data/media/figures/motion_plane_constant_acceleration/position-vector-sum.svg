<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Position under constant acceleration: r equals r0 plus v0 t plus half a t squared, drawn head to tail with the curved path</title>
  <defs><marker id="hblue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="hred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="hgreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="horange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="hpurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="hteal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker><marker id="hgray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="hdark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker></defs>
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="20.0" y="30.0" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Constant acceleration: r = r₀ + v₀t + ½at²</text>
  <circle cx="300" cy="378" r="5" fill="#111827"/>
  <text x="230.0" y="384.0" font-size="13" fill="#111827" font-weight="400" text-anchor="end">origin O</text>
  <path d="M 100 260 Q 260.0 245.0 470 110" fill="none" stroke="#9ca3af" stroke-width="3" stroke-dasharray="3 6"/>
  <line x1="300.0" y1="378.0" x2="100.0" y2="260.0" stroke="#6b7280" stroke-width="3" marker-end="url(#hgray)"/>
  <text x="190.0" y="340.0" font-size="16" fill="#6b7280" font-weight="700" text-anchor="end">r₀</text>
  <line x1="100.0" y1="260.0" x2="420.0" y2="230.0" stroke="#2563eb" stroke-width="4" marker-end="url(#hblue)"/>
  <text x="260.0" y="270.0" font-size="16" fill="#2563eb" font-weight="700" text-anchor="middle">v₀t</text>
  <line x1="420.0" y1="230.0" x2="470.0" y2="110.0" stroke="#16a34a" stroke-width="4" marker-end="url(#hgreen)"/>
  <text x="466.0" y="190.0" font-size="16" fill="#16a34a" font-weight="700" text-anchor="start">½at²</text>
  <line x1="300.0" y1="378.0" x2="470.0" y2="110.0" stroke="#7c3aed" stroke-width="5" marker-end="url(#hpurple)"/>
  <text x="392.0" y="262.0" font-size="18" fill="#7c3aed" font-weight="700" text-anchor="start">r</text>
  <text x="490.0" y="112.0" font-size="13" fill="#111827" font-weight="400" text-anchor="start">position at time t</text>
  <text x="160.0" y="212.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">actual path (dotted)</text>
  <text x="40.0" y="70.0" font-size="13" fill="#111827" font-weight="400" text-anchor="start">Each piece is a vector; add them head to tail.</text>
  <text x="40.0" y="88.0" font-size="13" fill="#111827" font-weight="400" text-anchor="start">Velocity follows the same rule: v = v₀ + at.</text>
  <text x="400.0" y="330.0" font-size="13" fill="#111827" font-weight="600" text-anchor="start">In components, x and y separately:</text>
  <text x="420.0" y="352.0" font-size="13" fill="#111827" font-weight="400" text-anchor="start">x = x₀ + v₀ₓt + ½aₓt²</text>
  <text x="420.0" y="372.0" font-size="13" fill="#111827" font-weight="400" text-anchor="start">y = y₀ + v₀<tspan baseline-shift="sub" font-size="9">y</tspan> t + ½a<tspan baseline-shift="sub" font-size="9">y</tspan> t²</text>
</svg>
