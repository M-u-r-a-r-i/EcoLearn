<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A wire with a marked cross-section: electrons drift to the left while the conventional current arrow points to the right</title>
  <defs>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="ar-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="640" height="380" fill="#ffffff"/>

  <text x="320" y="34" font-size="17" text-anchor="middle" fill="#111827" font-weight="700">Current = charge passing one cross-section, per second</text>

  <!-- the wire -->
  <rect x="70" y="120" width="500" height="110" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>

  <!-- cross-section plane -->
  <line x1="320" y1="104" x2="320" y2="246" stroke="#dc2626" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="320" y="96" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="700">one cross-section, area A</text>

  <!-- electrons -->
  <g fill="#1d4ed8">
    <circle cx="140" cy="150" r="9"/><circle cx="215" cy="200" r="9"/><circle cx="265" cy="145" r="9"/>
    <circle cx="380" cy="195" r="9"/><circle cx="440" cy="148" r="9"/><circle cx="505" cy="200" r="9"/>
  </g>
  <g fill="#ffffff" font-size="12" text-anchor="middle" font-weight="700">
    <text x="140" y="155">&#8722;</text><text x="215" y="205">&#8722;</text><text x="265" y="150">&#8722;</text>
    <text x="380" y="200">&#8722;</text><text x="440" y="153">&#8722;</text><text x="505" y="205">&#8722;</text>
  </g>

  <!-- electron drift arrows (to the left) -->
  <g stroke="#2563eb" stroke-width="3" marker-end="url(#ar-blue)">
    <line x1="190" y1="150" x2="160" y2="150"/>
    <line x1="430" y1="195" x2="400" y2="195"/>
  </g>
  <text x="200" y="266" font-size="14" fill="#2563eb" font-weight="600">electrons actually drift this way &#8592;</text>

  <!-- conventional current arrow -->
  <text x="330" y="300" font-size="15" text-anchor="middle" fill="#374151" font-weight="700">conventional current I</text>
  <line x1="240" y1="316" x2="420" y2="316" stroke="#6b7280" stroke-width="5" marker-end="url(#ar-gray)"/>
  <text x="330" y="344" font-size="14" text-anchor="middle" fill="#374151">(the direction positive charge would move)</text>

  <text x="320" y="372" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">I = Q / t &#160; &#160; 1 ampere = 1 coulomb per second</text>
</svg>
