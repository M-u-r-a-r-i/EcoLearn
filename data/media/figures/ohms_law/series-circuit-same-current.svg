<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A 9.0 V cell, a 1.8 kilo-ohm resistor, and ammeters before and after it both reading 5.0 mA</title>
  <defs>
    <marker id="flow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="640" height="380" fill="#ffffff"/>

  <g stroke="#111827" stroke-width="3" fill="none" stroke-linecap="round">
    <!-- left side with the cell (long plate = +, at the top) -->
    <line x1="80" y1="110" x2="80" y2="192"/>
    <line x1="80" y1="208" x2="80" y2="310"/>
    <!-- top wire, broken by A1, the resistor and A2 -->
    <line x1="80" y1="110" x2="182" y2="110"/>
    <line x1="218" y1="110" x2="270" y2="110"/>
    <polyline points="270,110 280,96 295,124 310,96 325,124 340,96 355,124 365,110 370,110"/>
    <line x1="370" y1="110" x2="432" y2="110"/>
    <line x1="468" y1="110" x2="560" y2="110"/>
    <!-- right and bottom -->
    <line x1="560" y1="110" x2="560" y2="310"/>
    <line x1="560" y1="310" x2="80" y2="310"/>
    <!-- voltmeter across the resistor -->
    <line x1="270" y1="110" x2="270" y2="60"/>
    <line x1="270" y1="60" x2="302" y2="60"/>
    <line x1="338" y1="60" x2="370" y2="60"/>
    <line x1="370" y1="60" x2="370" y2="110"/>
  </g>

  <!-- cell -->
  <line x1="58" y1="192" x2="102" y2="192" stroke="#111827" stroke-width="3"/>
  <line x1="69" y1="208" x2="91" y2="208" stroke="#111827" stroke-width="6"/>
  <text x="44" y="190" font-size="15" fill="#111827" font-weight="700">+</text>
  <text x="46" y="218" font-size="15" fill="#111827" font-weight="700">−</text>
  <text x="108" y="206" font-size="15" fill="#111827" font-weight="600">9.0 V</text>

  <!-- ammeters -->
  <circle cx="200" cy="110" r="18" fill="#eff6ff" stroke="#111827" stroke-width="3"/>
  <text x="200" y="116" font-size="17" font-weight="700" text-anchor="middle" fill="#111827">A</text>
  <circle cx="450" cy="110" r="18" fill="#eff6ff" stroke="#111827" stroke-width="3"/>
  <text x="450" y="116" font-size="17" font-weight="700" text-anchor="middle" fill="#111827">A</text>
  <rect x="160" y="140" width="80" height="28" rx="6" fill="#dbeafe"/>
  <text x="200" y="159" font-size="15" text-anchor="middle" fill="#1e3a8a" font-weight="700">5.0 mA</text>
  <rect x="410" y="140" width="80" height="28" rx="6" fill="#dbeafe"/>
  <text x="450" y="159" font-size="15" text-anchor="middle" fill="#1e3a8a" font-weight="700">5.0 mA</text>
  <text x="200" y="186" font-size="13" text-anchor="middle" fill="#374151">going in</text>
  <text x="450" y="186" font-size="13" text-anchor="middle" fill="#374151">coming out</text>

  <!-- voltmeter -->
  <circle cx="320" cy="60" r="18" fill="#fef3c7" stroke="#111827" stroke-width="3"/>
  <text x="320" y="66" font-size="17" font-weight="700" text-anchor="middle" fill="#111827">V</text>
  <text x="320" y="30" font-size="14" text-anchor="middle" fill="#92400e" font-weight="700">9.0 V across the resistor</text>
  <text x="320" y="150" font-size="14" text-anchor="middle" fill="#111827">R = 1.8 kΩ</text>

  <!-- conventional current direction: + terminal, clockwise -->
  <line x1="120" y1="110" x2="150" y2="110" stroke="#2563eb" stroke-width="3" marker-end="url(#flow)"/>
  <line x1="500" y1="110" x2="530" y2="110" stroke="#2563eb" stroke-width="3" marker-end="url(#flow)"/>
  <line x1="560" y1="200" x2="560" y2="230" stroke="#2563eb" stroke-width="3" marker-end="url(#flow)"/>
  <line x1="330" y1="310" x2="300" y2="310" stroke="#2563eb" stroke-width="3" marker-end="url(#flow)"/>
  <text x="112" y="98" font-size="14" fill="#2563eb" font-weight="600">I</text>

  <text x="320" y="350" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">Same current in and out — the resistor takes energy, not charge.</text>
</svg>
