<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Left panel: a convex lens bends parallel rays together and has positive power; a concave lens spreads them and has negative power. Right panel: two thin lenses held in contact behave as one lens whose power is the sum of the two powers.</title>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>
  <line x1="320" y1="40" x2="320" y2="368" stroke="#e5e7eb" stroke-width="2"/>

  <!-- ===== left panel: the sign of the power ===== -->
  <text x="160" y="36" font-size="14.5" fill="#111827" text-anchor="middle" font-weight="700">Power tells you the sign and the strength</text>

  <!-- convex -->
  <line x1="40" y1="110" x2="290" y2="110" stroke="#374151" stroke-width="1.3" stroke-dasharray="7 4"/>
  <path d="M 150 62 Q 168 110 150 158 Q 132 110 150 62 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.2"/>
  <line x1="46" y1="80" x2="150" y2="80" stroke="#2563eb" stroke-width="2.2"/>
  <line x1="150" y1="80" x2="240" y2="110" stroke="#2563eb" stroke-width="2.2" marker-end="url(#b)"/>
  <line x1="46" y1="140" x2="150" y2="140" stroke="#2563eb" stroke-width="2.2"/>
  <line x1="150" y1="140" x2="240" y2="110" stroke="#2563eb" stroke-width="2.2" marker-end="url(#b)"/>
  <circle cx="240" cy="110" r="4" fill="#111827"/>
  <text x="246" y="132" font-size="13" fill="#111827" font-weight="700">F (real)</text>
  <text x="150" y="176" font-size="13.5" fill="#1e40af" text-anchor="middle" font-weight="700">convex: f &gt; 0, P &gt; 0</text>

  <!-- concave -->
  <line x1="40" y1="260" x2="290" y2="260" stroke="#374151" stroke-width="1.3" stroke-dasharray="7 4"/>
  <path d="M 138 212 Q 150 260 138 308 L 162 308 Q 150 260 162 212 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.2"/>
  <line x1="46" y1="230" x2="150" y2="230" stroke="#2563eb" stroke-width="2.2"/>
  <line x1="150" y1="230" x2="250" y2="200" stroke="#2563eb" stroke-width="2.2" marker-end="url(#b)"/>
  <line x1="46" y1="290" x2="150" y2="290" stroke="#2563eb" stroke-width="2.2"/>
  <line x1="150" y1="290" x2="250" y2="320" stroke="#2563eb" stroke-width="2.2" marker-end="url(#b)"/>
  <line x1="150" y1="230" x2="60" y2="260" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="150" y1="290" x2="60" y2="260" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="5 4"/>
  <circle cx="60" cy="260" r="4" fill="#6b7280"/>
  <text x="66" y="282" font-size="13" fill="#6b7280" font-weight="700">F (virtual)</text>
  <text x="150" y="330" font-size="13.5" fill="#1e40af" text-anchor="middle" font-weight="700">concave: f &lt; 0, P &lt; 0</text>

  <text x="160" y="364" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">P = 1/f, with f in metres; 1 D = 1 m⁻¹</text>

  <!-- ===== right panel: lenses in contact ===== -->
  <text x="480" y="36" font-size="14.5" fill="#111827" text-anchor="middle" font-weight="700">Two thin lenses in contact</text>
  <line x1="350" y1="190" x2="612" y2="190" stroke="#374151" stroke-width="1.3" stroke-dasharray="7 4"/>

  <path d="M 452 110 Q 470 190 452 270 Q 434 190 452 110 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.2"/>
  <path d="M 457 110 Q 465 190 457 270 L 477 270 Q 453 190 477 110 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.2"/>
  <text x="424" y="100" font-size="13.5" fill="#1e40af" text-anchor="middle" font-weight="700">P₁ &gt; 0</text>
  <text x="500" y="100" font-size="13.5" fill="#1e40af" text-anchor="middle" font-weight="700">P₂ &lt; 0</text>

  <line x1="356" y1="150" x2="448" y2="150" stroke="#2563eb" stroke-width="2.2"/>
  <line x1="476" y1="150" x2="590" y2="178" stroke="#2563eb" stroke-width="2.2" marker-end="url(#b)"/>
  <line x1="356" y1="230" x2="448" y2="230" stroke="#2563eb" stroke-width="2.2"/>
  <line x1="476" y1="230" x2="590" y2="202" stroke="#2563eb" stroke-width="2.2" marker-end="url(#b)"/>

  <text x="480" y="300" font-size="16" fill="#111827" text-anchor="middle" font-weight="700">P = P₁ + P₂</text>
  <text x="480" y="326" font-size="16" fill="#111827" text-anchor="middle" font-weight="700">1/F = 1/f₁ + 1/f₂</text>
  <text x="480" y="352" font-size="12.5" fill="#334155" text-anchor="middle">Powers add with their signs. Here a strong</text>
  <text x="480" y="368" font-size="12.5" fill="#334155" text-anchor="middle">convex plus a weak concave still converges.</text>
</svg>
