<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Energy flow in a refrigerator: heat Q2 taken from the cold inside, work W put in, heat Q1 = Q2 + W released to the hot surroundings</title>
  <defs>
    <marker id="ao" viewBox="0 0 10 10" refX="3" refY="5" markerWidth="1.9" markerHeight="1.9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="3" refY="5" markerWidth="1.9" markerHeight="1.9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="3" refY="5" markerWidth="1.9" markerHeight="1.9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>

  <rect x="140" y="20" width="360" height="60" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="320" y="48" font-size="17" font-weight="700" fill="#7f1d1d" text-anchor="middle">Hot surroundings, T₁</text>
  <text x="320" y="68" font-size="13" fill="#7f1d1d" text-anchor="middle">the room behind the fridge</text>

  <rect x="140" y="320" width="360" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="320" y="348" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="middle">Cold space, T₂</text>
  <text x="320" y="368" font-size="13" fill="#1e3a8a" text-anchor="middle">inside the fridge</text>

  <circle cx="320" cy="200" r="55" fill="#f3f4f6" stroke="#374151" stroke-width="3"/>
  <text x="320" y="196" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Refrigerator</text>
  <text x="320" y="216" font-size="13" fill="#374151" text-anchor="middle">(refrigerant</text>
  <text x="320" y="232" font-size="13" fill="#374151" text-anchor="middle">in a cycle)</text>

  <!-- Q2 up from cold -->
  <line x1="320" y1="318" x2="320" y2="272" stroke="#2563eb" stroke-width="18" marker-end="url(#ab)"/>
  <text x="352" y="300" font-size="16" font-weight="700" fill="#2563eb">Q₂ (taken from inside)</text>

  <!-- W in -->
  <line x1="120" y1="200" x2="252" y2="200" stroke="#16a34a" stroke-width="9" marker-end="url(#ag)"/>
  <text x="120" y="182" font-size="16" font-weight="700" fill="#16a34a">W</text>
  <text x="40" y="232" font-size="14" fill="#16a34a">electrical work put in</text>

  <!-- Q1 up to hot -->
  <line x1="320" y1="143" x2="320" y2="108" stroke="#ea580c" stroke-width="27" marker-end="url(#ao)"/>
  <text x="352" y="125" font-size="16" font-weight="700" fill="#ea580c">Q₁ = Q₂ + W (released)</text>

  <text x="440" y="200" font-size="15" font-weight="700" fill="#111827">α = Q₂ / W</text>
  <text x="440" y="222" font-size="12" fill="#6b7280">widths to scale for</text>
  <text x="440" y="238" font-size="12" fill="#6b7280">Q₂ = 600, W = 300, Q₁ = 900</text>
</svg>
