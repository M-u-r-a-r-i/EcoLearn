<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Schematic of a Cassegrain reflecting telescope. Parallel light from a distant object falls on a large concave primary mirror, which reflects it back towards a small convex secondary mirror. The secondary sends the converging beam back through a hole in the middle of the primary, where an eyepiece views the image. Mirrors replace the objective lens, so there is no chromatic aberration.</title>
  <defs>
    <marker id="rt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>

  <text x="320" y="26" font-size="13" fill="#6b7280" text-anchor="middle">Schematic, not to scale. The magnifying power is still f<tspan font-size="10" dy="3">o</tspan><tspan font-size="13" dy="-3">/f</tspan><tspan font-size="10" dy="3">e</tspan><tspan font-size="13" dy="-3">, with f</tspan><tspan font-size="10" dy="3">o</tspan><tspan font-size="13" dy="-3"> now belonging to the primary mirror.</tspan></text>

  <rect x="26" y="48" width="330" height="76" rx="8" fill="#ffffff" fill-opacity="0.95" stroke="#cbd5e1"/>
  <text x="191" y="72" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Why mirrors instead of a lens</text>
  <text x="191" y="94" font-size="12.5" fill="#334155" text-anchor="middle">Reflection does not depend on wavelength, so there is no</text>
  <text x="191" y="112" font-size="12.5" fill="#334155" text-anchor="middle">colour fringing — and a mirror can be supported from behind.</text>

  <line x1="20" y1="210" x2="600" y2="210" stroke="#374151" stroke-width="1.4" stroke-dasharray="9 5"/>

  <!-- primary mirror, in two pieces with a hole between them -->
  <path d="M 525 110 A 260 260 0 0 1 544.7 198" fill="none" stroke="#475569" stroke-width="7" stroke-linecap="round"/>
  <path d="M 544.7 222 A 260 260 0 0 1 525 310" fill="none" stroke="#475569" stroke-width="7" stroke-linecap="round"/>
  <text x="556" y="344" font-size="13.5" fill="#334155" text-anchor="middle" font-weight="700">concave</text>
  <text x="556" y="362" font-size="13.5" fill="#334155" text-anchor="middle" font-weight="700">primary mirror</text>
  <line x1="540" y1="316" x2="552" y2="330" stroke="#94a3b8" stroke-width="1.4"/>

  <!-- secondary mirror -->
  <path d="M 460 184 Q 446 210 460 236" fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <text x="330" y="344" font-size="13.5" fill="#334155" text-anchor="middle" font-weight="700">convex secondary</text>
  <line x1="444" y1="240" x2="360" y2="332" stroke="#94a3b8" stroke-width="1.4"/>

  <!-- incoming parallel light -->
  <line x1="60" y1="150" x2="538" y2="150" stroke="#2563eb" stroke-width="2.6" marker-end="url(#rt)"/>
  <line x1="60" y1="270" x2="538" y2="270" stroke="#2563eb" stroke-width="2.6" marker-end="url(#rt)"/>
  <text x="64" y="140" font-size="13.5" fill="#2563eb" font-weight="700">parallel light from a distant object</text>

  <!-- primary to secondary -->
  <line x1="538" y1="150" x2="460" y2="188" stroke="#2563eb" stroke-width="2.6" marker-end="url(#rt)"/>
  <line x1="538" y1="270" x2="460" y2="232" stroke="#2563eb" stroke-width="2.6" marker-end="url(#rt)"/>

  <!-- secondary back through the hole -->
  <line x1="460" y1="188" x2="586" y2="208" stroke="#2563eb" stroke-width="2.6"/>
  <line x1="460" y1="232" x2="586" y2="212" stroke="#2563eb" stroke-width="2.6"/>
  <circle cx="588" cy="210" r="4.5" fill="#dc2626"/>
  <text x="600" y="190" font-size="12.5" fill="#dc2626" text-anchor="end" font-weight="700">image</text>
  <text x="446" y="322" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="700">hole in the primary</text>
  <line x1="490" y1="314" x2="543" y2="228" stroke="#94a3b8" stroke-width="1.4"/>
  <path d="M 606 186 Q 618 210 606 234 Q 594 210 606 186 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="614" y="256" font-size="12" fill="#1e40af" text-anchor="end" font-weight="700">eyepiece</text>
</svg>
