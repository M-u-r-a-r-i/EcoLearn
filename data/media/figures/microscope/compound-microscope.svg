<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Ray diagram of a compound microscope. The object sits just outside the focal point of the short-focus objective lens, which forms a real, inverted, magnified image inside the tube. That image falls at the focal point of the eyepiece, so the rays leave the eyepiece parallel and the final image is seen at infinity by a relaxed eye.</title>
  <defs>
    <marker id="c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="co" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="ci" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="dm" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>

  <line x1="30" y1="200" x2="620" y2="200" stroke="#374151" stroke-width="1.5" stroke-dasharray="9 5"/>

  <!-- objective -->
  <path d="M 170 136 Q 186 200 170 264 Q 154 200 170 136 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.4"/>
  <text x="170" y="126" font-size="13.5" fill="#1e40af" text-anchor="middle" font-weight="700">objective (short f<tspan font-size="10" dy="4">o</tspan>)</text>
  <circle cx="130" cy="200" r="4" fill="#111827"/><text x="126" y="224" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">F<tspan font-size="10" dy="3">o</tspan></text>
  <circle cx="210" cy="200" r="4" fill="#111827"/><text x="216" y="224" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">F<tspan font-size="10" dy="3">o</tspan>′</text>

  <!-- eyepiece -->
  <path d="M 430 120 Q 450 200 430 280 Q 410 200 430 120 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.4"/>
  <text x="446" y="110" font-size="13.5" fill="#1e40af" text-anchor="middle" font-weight="700">eyepiece (f<tspan font-size="10" dy="4">e</tspan>)</text>
  <circle cx="370" cy="200" r="4" fill="#111827"/><text x="370" y="186" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">F<tspan font-size="10" dy="3">e</tspan></text>

  <!-- object -->
  <line x1="120" y1="200" x2="120" y2="188" stroke="#16a34a" stroke-width="3.5" marker-end="url(#co)"/>
  <text x="112" y="176" font-size="13" fill="#16a34a" text-anchor="end" font-weight="700">object</text>

  <!-- objective rays -->
  <line x1="120" y1="188" x2="170" y2="188" stroke="#2563eb" stroke-width="2.4"/>
  <line x1="170" y1="188" x2="370" y2="248" stroke="#2563eb" stroke-width="2.4"/>
  <line x1="120" y1="188" x2="370" y2="248" stroke="#2563eb" stroke-width="2.4"/>

  <!-- intermediate image -->
  <line x1="370" y1="200" x2="370" y2="248" stroke="#dc2626" stroke-width="3.5" marker-end="url(#ci)"/>
  <text x="356" y="272" font-size="13" fill="#dc2626" text-anchor="end" font-weight="700">real, inverted image</text>
  <text x="356" y="290" font-size="12.5" fill="#dc2626" text-anchor="end">— it lands at the eyepiece's focus</text>

  <!-- eyepiece rays: object at F_e, so they leave parallel -->
  <line x1="370" y1="248" x2="430" y2="200" stroke="#2563eb" stroke-width="2.4"/>
  <line x1="430" y1="200" x2="600" y2="64" stroke="#2563eb" stroke-width="2.4" marker-end="url(#c1)"/>
  <line x1="370" y1="248" x2="430" y2="248" stroke="#2563eb" stroke-width="2.4"/>
  <line x1="430" y1="248" x2="600" y2="112" stroke="#2563eb" stroke-width="2.4" marker-end="url(#c1)"/>
  <text x="614" y="246" font-size="13" fill="#2563eb" text-anchor="end" font-weight="700">parallel — to a relaxed eye</text>

  <!-- tube length -->
  <line x1="170" y1="332" x2="430" y2="332" stroke="#6b7280" stroke-width="1.5" marker-start="url(#dm)" marker-end="url(#dm)"/>
  <rect x="250" y="320" width="100" height="24" fill="#ffffff"/>
  <text x="300" y="338" font-size="13.5" fill="#6b7280" text-anchor="middle" font-weight="700">tube length</text>

  <rect x="26" y="306" width="132" height="62" rx="8" fill="#ffffff" fill-opacity="0.95" stroke="#cbd5e1"/>
  <text x="92" y="330" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="700">m = m<tspan font-size="10" dy="3">o</tspan><tspan font-size="13.5" dy="-3"> × m</tspan><tspan font-size="10" dy="3">e</tspan></text>
  <text x="92" y="354" font-size="12.5" fill="#334155" text-anchor="middle">two stages, multiplied</text>

  <rect x="442" y="306" width="184" height="62" rx="8" fill="#ffffff" fill-opacity="0.95" stroke="#cbd5e1"/>
  <text x="534" y="330" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">relaxed eye: m<tspan font-size="10" dy="3">e</tspan><tspan font-size="13" dy="-3"> = D/f</tspan><tspan font-size="10" dy="3">e</tspan></text>
  <text x="534" y="354" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">near point: m<tspan font-size="10" dy="3">e</tspan><tspan font-size="13" dy="-3"> = 1 + D/f</tspan><tspan font-size="10" dy="3">e</tspan></text>

  <text x="320" y="36" font-size="13" fill="#6b7280" text-anchor="middle">The objective magnifies once; the eyepiece magnifies that image again.</text>
</svg>
