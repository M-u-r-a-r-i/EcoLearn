<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">The triangle rule and the parallelogram rule for adding two vectors give the same resultant</title>
  <defs><marker id="hblue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="hred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="hgreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="horange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="hpurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="hteal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker><marker id="hgray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="hdark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker></defs>
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="20.0" y="30.0" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Adding vectors: two rules, one resultant</text>
  <line x1="320" y1="50" x2="320" y2="380" stroke="#e5e7eb" stroke-width="2"/>
  <text x="30.0" y="70.0" font-size="15" fill="#111827" font-weight="600" text-anchor="start">Triangle rule: head to tail</text>
  <line x1="50.0" y1="300.0" x2="218.0" y2="300.0" stroke="#2563eb" stroke-width="4" marker-end="url(#hblue)"/>
  <line x1="220.0" y1="300.0" x2="280.0" y2="196.1" stroke="#ea580c" stroke-width="4" marker-end="url(#horange)"/>
  <line x1="50.0" y1="300.0" x2="280.0" y2="196.1" stroke="#7c3aed" stroke-width="5" marker-end="url(#hpurple)"/>
  <text x="135.0" y="324.0" font-size="17" fill="#2563eb" font-weight="700" text-anchor="middle">A</text>
  <text x="262.0" y="260.0" font-size="17" fill="#ea580c" font-weight="700" text-anchor="start">B</text>
  <text x="157.0" y="236.0" font-size="16" fill="#7c3aed" font-weight="700" text-anchor="end">R = A + B</text>
  <text x="30.0" y="355.0" font-size="13" fill="#111827" font-weight="400" text-anchor="start">Put B's tail on A's head; R runs from</text>
  <text x="30.0" y="373.0" font-size="13" fill="#111827" font-weight="400" text-anchor="start">A's tail to B's head.</text>
  <text x="340.0" y="70.0" font-size="15" fill="#111827" font-weight="600" text-anchor="start">Parallelogram rule: tail to tail</text>
  <line x1="520" y1="300" x2="580.0" y2="196.1" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="410.0" y1="196.1" x2="580.0" y2="196.1" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="350.0" y1="300.0" x2="518.0" y2="300.0" stroke="#2563eb" stroke-width="4" marker-end="url(#hblue)"/>
  <line x1="350.0" y1="300.0" x2="410.0" y2="196.1" stroke="#ea580c" stroke-width="4" marker-end="url(#horange)"/>
  <line x1="350.0" y1="300.0" x2="580.0" y2="196.1" stroke="#7c3aed" stroke-width="5" marker-end="url(#hpurple)"/>
  <path d="M 390 300 A 40 40 0 0 0 370.0 265.4" fill="none" stroke="#111827" stroke-width="1.5"/>
  <text x="394.0" y="290.0" font-size="16" fill="#111827" font-weight="600" text-anchor="start">θ</text>
  <text x="455.0" y="324.0" font-size="17" fill="#2563eb" font-weight="700" text-anchor="middle">A</text>
  <text x="386.0" y="236.1" font-size="17" fill="#ea580c" font-weight="700" text-anchor="end">B</text>
  <text x="586.0" y="188.1" font-size="17" fill="#7c3aed" font-weight="700" text-anchor="start">R</text>
  <text x="340.0" y="355.0" font-size="13" fill="#111827" font-weight="400" text-anchor="start">Both vectors start at one point; R is</text>
  <text x="340.0" y="373.0" font-size="13" fill="#111827" font-weight="400" text-anchor="start">the diagonal from that point.</text>
</svg>
