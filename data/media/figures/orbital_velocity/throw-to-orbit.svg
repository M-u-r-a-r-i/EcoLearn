<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Left: faster horizontal launches from a tall tower land farther round the Earth until one never lands. Right: in a circular orbit gravity points to the centre and velocity along the orbit</title>
  <defs><marker id="hblue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="hred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="20" y="30" font-size="17" fill="#111827" font-weight="700">From a throw to an orbit</text>
  <!-- left: Newton-style launches (no air) -->
  <circle cx="160" cy="235" r="110" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="155" y="100" width="10" height="26" fill="#6b7280"/>
  <path d="M160,100 Q192,100 206.5,135.3" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="6 4"/>
  <path d="M160,100 C222,100 264,146 263.4,197.4" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="6 4"/>
  <circle cx="160" cy="235" r="135" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="195" y="160" font-size="12" fill="#ea580c" font-weight="600">slow</text>
  <text x="228" y="214" font-size="12" fill="#7c3aed" font-weight="600">faster</text>
  <text x="160" y="392" font-size="12" fill="#16a34a" font-weight="600" text-anchor="middle">fast enough: falls forever, never lands</text>
  <text x="160" y="72" font-size="12" fill="#6b7280" text-anchor="middle">launched level from a tower (no air)</text>
  <text x="160" y="240" font-size="14" fill="#1e3a8a" font-weight="600" text-anchor="middle">Earth</text>
  <line x1="330" y1="50" x2="330" y2="385" stroke="#e5e7eb" stroke-width="2"/>
  <!-- right: forces in circular orbit -->
  <circle cx="480" cy="235" r="60" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="480" cy="235" r="120" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="480" cy="235" r="3" fill="#111827"/>
  <text x="480" y="258" font-size="12" fill="#1e3a8a" text-anchor="middle">M</text>
  <rect x="472" y="107" width="16" height="16" fill="#374151"/>
  <rect x="452" y="111" width="18" height="8" fill="#60a5fa"/><rect x="490" y="111" width="18" height="8" fill="#60a5fa"/>
  <line x1="480" y1="123" x2="480" y2="176" stroke="#dc2626" stroke-width="3.5" marker-end="url(#hred)"/>
  <line x1="508" y1="115" x2="580" y2="115" stroke="#2563eb" stroke-width="3.5" marker-end="url(#hblue)"/>
  <text x="488" y="162" font-size="13" fill="#dc2626" font-weight="700">F = GMm/r²</text>
  <text x="540" y="104" font-size="14" fill="#2563eb" font-weight="700">v</text>
  <line x1="480" y1="235" x2="395" y2="320" stroke="#111827" stroke-width="1.5"/>
  <text x="425" y="292" font-size="13" fill="#111827" font-weight="600">r</text>
  <text x="480" y="378" font-size="13" fill="#111827" text-anchor="middle">gravity supplies the centripetal force:</text>
  <text x="480" y="395" font-size="13" fill="#111827" font-weight="700" text-anchor="middle">GMm/r² = mv²/r</text>
</svg>
