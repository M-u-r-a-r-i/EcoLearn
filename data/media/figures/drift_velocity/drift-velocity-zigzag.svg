<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">An electron's fast zigzag path between collisions inside a wire, with a small steady net drift opposite to the electric field</title>
  <defs>
    <marker id="d-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="d-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>

  <text x="320" y="32" font-size="17" text-anchor="middle" fill="#111827" font-weight="700">Fast random motion, very slow net drift</text>

  <!-- wire body -->
  <rect x="60" y="70" width="520" height="190" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>

  <!-- fixed ions -->
  <g fill="#d1d5db" stroke="#9ca3af" stroke-width="1.5">
    <circle cx="140" cy="110" r="11"/><circle cx="250" cy="110" r="11"/><circle cx="360" cy="110" r="11"/><circle cx="470" cy="110" r="11"/>
    <circle cx="140" cy="220" r="11"/><circle cx="250" cy="220" r="11"/><circle cx="360" cy="220" r="11"/><circle cx="470" cy="220" r="11"/>
    <circle cx="195" cy="165" r="11"/><circle cx="305" cy="165" r="11"/><circle cx="415" cy="165" r="11"/><circle cx="525" cy="165" r="11"/>
  </g>
  <text x="525" y="252" font-size="12" text-anchor="middle" fill="#6b7280">fixed metal ions</text>

  <!-- zigzag electron path, slowly progressing to the right -->
  <polyline points="90,180 130,120 165,200 205,130 240,205 285,135 320,200 365,140 400,198 445,145 480,192 520,150"
            fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#d-blue)"/>
  <circle cx="90" cy="180" r="8" fill="#1d4ed8"/>
  <text x="90" y="185" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="700">&#8722;</text>
  <text x="100" y="92" font-size="13" fill="#2563eb" font-weight="600">one electron, zigzagging between collisions</text>

  <!-- net drift arrow -->
  <line x1="90" y1="300" x2="200" y2="300" stroke="#16a34a" stroke-width="5" marker-end="url(#d-green)"/>
  <text x="215" y="305" font-size="15" fill="#16a34a" font-weight="700">net drift v_d &#8212; typically under a millimetre per second</text>

  <!-- field arrow -->
  <line x1="560" y1="340" x2="490" y2="340" stroke="#111827" stroke-width="4"/>
  <polygon points="490,340 504,333 504,347" fill="#111827"/>
  <text x="572" y="345" font-size="15" fill="#111827" font-weight="700">E</text>
  <text x="470" y="345" font-size="14" text-anchor="end" fill="#111827">the field pushes it the other way (it is negative)</text>

  <text x="320" y="382" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">I = n e A v_d</text>
</svg>
