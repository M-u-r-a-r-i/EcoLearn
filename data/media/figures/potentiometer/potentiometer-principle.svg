<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" font-family="Segoe UI, Arial, sans-serif">
  <rect width="640" height="440" fill="#ffffff"/>
  <defs>
    <marker id="cur" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="dimEnd" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="dimStart" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M9,0 L0,4 L9,8 Z" fill="#475569"/>
    </marker>
    <marker id="slide" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#334155"/>
    </marker>
  </defs>

  <g stroke="#334155" stroke-width="2.5" fill="none" stroke-linecap="round">
    <!-- driver loop, top branch -->
    <path d="M70 80 H200"/>
    <path d="M218 80 H306"/>
    <path d="M306 80 H334"/>
    <path d="M334 80 H420"/>
    <path d="M496 80 H570"/>
    <!-- rheostat zigzag -->
    <path d="M420 80 L428 68 L440 92 L452 68 L464 92 L476 68 L488 92 L496 80"/>
    <!-- sides down to the ends of the wire -->
    <path d="M70 80 V250"/>
    <path d="M570 80 V250"/>
    <!-- test branch -->
    <path d="M70 250 V395"/>
    <path d="M70 395 H156"/>
    <path d="M174 395 H282"/>
    <path d="M318 395 H370"/>
    <path d="M370 395 V268"/>
  </g>

  <!-- driver cell: long plate is the + terminal, nearer end A -->
  <line x1="200" y1="62" x2="200" y2="98" stroke="#334155" stroke-width="4"/>
  <line x1="218" y1="70" x2="218" y2="90" stroke="#334155" stroke-width="4"/>
  <text x="196" y="112" font-size="13" fill="#334155" text-anchor="middle">+</text>
  <text x="222" y="112" font-size="13" fill="#334155" text-anchor="middle">&#8722;</text>
  <text x="209" y="46" font-size="13" fill="#334155" text-anchor="middle">driver cell</text>

  <!-- key -->
  <circle cx="306" cy="80" r="3" fill="#334155"/>
  <circle cx="334" cy="80" r="3" fill="#334155"/>
  <line x1="334" y1="80" x2="344" y2="68" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <text x="320" y="56" font-size="13" fill="#334155" text-anchor="middle">key</text>

  <!-- rheostat slider -->
  <line x1="424" y1="110" x2="492" y2="62" stroke="#334155" stroke-width="2" marker-end="url(#slide)"/>
  <text x="458" y="46" font-size="13" fill="#334155" text-anchor="middle">rheostat</text>

  <!-- driver current, one steady loop -->
  <g stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#cur)">
    <path d="M150 80 H104"/>
    <path d="M286 80 H256"/>
    <path d="M400 80 H372"/>
    <path d="M556 80 H524"/>
    <path d="M70 150 V192"/>
    <path d="M570 192 V150"/>
    <path d="M104 266 H160"/>
  </g>
  <text x="176" y="271" font-size="13" fill="#2563eb">steady current</text>

  <!-- the potentiometer wire -->
  <line x1="70" y1="250" x2="570" y2="250" stroke="#475569" stroke-width="6" stroke-linecap="butt"/>
  <text x="56" y="246" font-size="15" font-weight="bold" fill="#334155" text-anchor="end">A</text>
  <text x="584" y="246" font-size="15" font-weight="bold" fill="#334155">B</text>

  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="70" y1="247" x2="70" y2="236"/>
    <line x1="170" y1="247" x2="170" y2="236"/>
    <line x1="270" y1="247" x2="270" y2="236"/>
    <line x1="370" y1="247" x2="370" y2="236"/>
    <line x1="470" y1="247" x2="470" y2="236"/>
    <line x1="570" y1="247" x2="570" y2="236"/>
  </g>
  <g font-size="11" fill="#64748b" text-anchor="middle">
    <text x="70" y="229">0</text>
    <text x="170" y="229">20</text>
    <text x="270" y="229">40</text>
    <text x="370" y="229">60</text>
    <text x="470" y="229">80</text>
    <text x="570" y="229">100</text>
  </g>
  <text x="320" y="205" font-size="13" fill="#475569" text-anchor="middle">uniform wire, length L (cm)</text>
  <text x="320" y="184" font-size="13" fill="#475569" text-anchor="middle">potential falls steadily from A to B: gradient k = V(AB) / L</text>

  <!-- jockey at the balance point -->
  <path d="M370 247 L361 269 L379 269 Z" fill="#64748b"/>
  <text x="388" y="266" font-size="13" fill="#334155">jockey</text>

  <!-- balance length -->
  <line x1="70" y1="308" x2="370" y2="308" stroke="#475569" stroke-width="1.5" marker-start="url(#dimStart)" marker-end="url(#dimEnd)"/>
  <text x="220" y="328" font-size="13" fill="#475569" text-anchor="middle">balance length l</text>

  <!-- cell under test: + terminal towards A -->
  <line x1="156" y1="377" x2="156" y2="413" stroke="#334155" stroke-width="4"/>
  <line x1="174" y1="385" x2="174" y2="405" stroke="#334155" stroke-width="4"/>
  <text x="152" y="370" font-size="13" fill="#334155" text-anchor="middle">+</text>
  <text x="178" y="370" font-size="13" fill="#334155" text-anchor="middle">&#8722;</text>
  <text x="165" y="434" font-size="13" fill="#334155" text-anchor="middle">cell under test, emf &#949;</text>

  <!-- galvanometer -->
  <circle cx="300" cy="395" r="18" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <text x="300" y="400" font-size="14" fill="#334155" text-anchor="middle">G</text>

  <text x="396" y="352" font-size="12" fill="#475569">At balance G reads zero:</text>
  <text x="396" y="370" font-size="12" fill="#475569">the cell drives no current, so &#949; = k l</text>
</svg>
