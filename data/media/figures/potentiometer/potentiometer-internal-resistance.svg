<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 490" width="640" height="490" font-family="Segoe UI, Arial, sans-serif">
  <rect width="640" height="490" fill="#ffffff"/>
  <defs>
    <marker id="cur2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="dimEnd2" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="dimStart2" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M9,0 L0,4 L9,8 Z" fill="#475569"/>
    </marker>
  </defs>

  <g stroke="#334155" stroke-width="2.5" fill="none" stroke-linecap="round">
    <!-- driver loop -->
    <path d="M70 70 H200"/>
    <path d="M218 70 H306"/>
    <path d="M306 70 H334"/>
    <path d="M334 70 H420"/>
    <path d="M420 70 L428 58 L440 82 L452 58 L464 82 L476 58 L488 82 L496 70"/>
    <path d="M496 70 H570"/>
    <path d="M70 70 V230"/>
    <path d="M570 70 V230"/>
    <!-- test branch -->
    <path d="M70 230 V400"/>
    <path d="M70 400 H120"/>
    <path d="M120 400 H175"/>
    <path d="M193 400 H250"/>
    <path d="M250 400 H282"/>
    <path d="M318 400 H370"/>
    <path d="M370 400 V248"/>
    <!-- parallel branch: known resistance and its key -->
    <path d="M120 400 V450 H150"/>
    <path d="M205 450 H215"/>
    <path d="M243 450 H250 V400"/>
  </g>

  <!-- driver cell -->
  <line x1="200" y1="52" x2="200" y2="88" stroke="#334155" stroke-width="4"/>
  <line x1="218" y1="60" x2="218" y2="80" stroke="#334155" stroke-width="4"/>
  <text x="196" y="102" font-size="13" fill="#334155" text-anchor="middle">+</text>
  <text x="222" y="102" font-size="13" fill="#334155" text-anchor="middle">&#8722;</text>
  <text x="209" y="36" font-size="13" fill="#334155" text-anchor="middle">driver cell</text>
  <line x1="424" y1="100" x2="492" y2="52" stroke="#334155" stroke-width="2" marker-end="url(#dimEnd2)"/>
  <circle cx="306" cy="70" r="3" fill="#334155"/>
  <circle cx="334" cy="70" r="3" fill="#334155"/>
  <line x1="334" y1="70" x2="344" y2="58" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <text x="320" y="46" font-size="13" fill="#334155" text-anchor="middle">key</text>
  <text x="458" y="36" font-size="13" fill="#334155" text-anchor="middle">rheostat</text>

  <g stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#cur2)">
    <path d="M150 70 H104"/>
    <path d="M400 70 H372"/>
    <path d="M70 140 V178"/>
    <path d="M570 178 V140"/>
  </g>

  <!-- potentiometer wire -->
  <line x1="70" y1="230" x2="570" y2="230" stroke="#475569" stroke-width="6" stroke-linecap="butt"/>
  <text x="56" y="226" font-size="15" font-weight="bold" fill="#334155" text-anchor="end">A</text>
  <text x="584" y="226" font-size="15" font-weight="bold" fill="#334155">B</text>
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="70" y1="227" x2="70" y2="216"/>
    <line x1="170" y1="227" x2="170" y2="216"/>
    <line x1="270" y1="227" x2="270" y2="216"/>
    <line x1="370" y1="227" x2="370" y2="216"/>
    <line x1="470" y1="227" x2="470" y2="216"/>
    <line x1="570" y1="227" x2="570" y2="216"/>
  </g>
  <g font-size="11" fill="#64748b" text-anchor="middle">
    <text x="70" y="209">0</text>
    <text x="170" y="209">20</text>
    <text x="270" y="209">40</text>
    <text x="370" y="209">60</text>
    <text x="470" y="209">80</text>
    <text x="570" y="209">100</text>
  </g>
  <text x="320" y="188" font-size="13" fill="#475569" text-anchor="middle">same driver circuit for both readings, so the gradient k is unchanged</text>

  <!-- two balance points -->
  <path d="M370 227 L361 249 L379 249 Z" fill="#64748b"/>
  <path d="M310 227 L301 249 L319 249 Z" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>

  <line x1="70" y1="292" x2="370" y2="292" stroke="#475569" stroke-width="1.5" marker-start="url(#dimStart2)" marker-end="url(#dimEnd2)"/>
  <text x="220" y="286" font-size="12" fill="#475569" text-anchor="middle">l&#8321;: key open, cell balances its emf</text>
  <line x1="70" y1="330" x2="310" y2="330" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 3" marker-start="url(#dimStart2)" marker-end="url(#dimEnd2)"/>
  <text x="212" y="324" font-size="12" fill="#475569" text-anchor="middle">l&#8322;: key closed, cell balances its terminal pd</text>

  <!-- cell under test -->
  <line x1="175" y1="382" x2="175" y2="418" stroke="#334155" stroke-width="4"/>
  <line x1="193" y1="390" x2="193" y2="410" stroke="#334155" stroke-width="4"/>
  <text x="171" y="378" font-size="13" fill="#334155" text-anchor="middle">+</text>
  <text x="197" y="378" font-size="13" fill="#334155" text-anchor="middle">&#8722;</text>
  <text x="184" y="358" font-size="13" fill="#334155" text-anchor="middle">cell under test</text>
  <circle cx="120" cy="400" r="4" fill="#334155"/>
  <circle cx="250" cy="400" r="4" fill="#334155"/>

  <!-- galvanometer -->
  <circle cx="300" cy="400" r="18" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <text x="300" y="405" font-size="14" fill="#334155" text-anchor="middle">G</text>

  <!-- known resistance and its key, across the cell -->
  <rect x="150" y="436" width="55" height="28" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <text x="177" y="455" font-size="14" fill="#334155" text-anchor="middle">R</text>
  <circle cx="215" cy="450" r="3" fill="#334155"/>
  <circle cx="243" cy="450" r="3" fill="#334155"/>
  <line x1="243" y1="450" x2="253" y2="438" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <text x="229" y="480" font-size="12" fill="#334155" text-anchor="middle">key</text>

  <text x="396" y="356" font-size="12" fill="#475569">Closing the key makes the cell deliver</text>
  <text x="396" y="374" font-size="12" fill="#475569">current, so the balance shortens:</text>
  <text x="396" y="396" font-size="13" fill="#334155">r = R (l&#8321; &#8722; l&#8322;) / l&#8322;</text>
</svg>
