<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Top: an elastic head-on collision of equal masses, where the velocities swap. Bottom: two bodies moving at right angles collide and stick; the total momentum is the vector sum</title>
  <defs>
    <marker id="hb" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="hp" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="640" height="440" fill="#ffffff"/>
  <line x1="320" y1="44" x2="320" y2="120" stroke="#d1d5db" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="20" y1="178" x2="620" y2="178" stroke="#d1d5db" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="320" y1="210" x2="320" y2="425" stroke="#d1d5db" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- 1D elastic, equal masses -->
  <text x="20" y="28" font-size="15" font-weight="600" fill="#111827">1D elastic collision, equal masses m</text>
  <text x="140" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Before</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">After</text>
  <line x1="30" y1="104" x2="300" y2="104" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="70" cy="92" r="12" fill="#b91c1c" stroke="#7f1d1d"/>
  <line x1="86" y1="72" x2="160" y2="72" stroke="#2563eb" stroke-width="3" marker-end="url(#hb)"/>
  <text x="120" y="64" font-size="13" fill="#2563eb" font-weight="600">u</text>
  <circle cx="240" cy="92" r="12" fill="#475569" stroke="#1e293b"/>
  <text x="222" y="70" font-size="12" fill="#374151">at rest</text>
  <line x1="340" y1="104" x2="620" y2="104" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="400" cy="92" r="12" fill="#b91c1c" stroke="#7f1d1d"/>
  <text x="382" y="70" font-size="12" fill="#374151">at rest</text>
  <circle cx="520" cy="92" r="12" fill="#475569" stroke="#1e293b"/>
  <line x1="536" y1="72" x2="610" y2="72" stroke="#2563eb" stroke-width="3" marker-end="url(#hb)"/>
  <text x="566" y="64" font-size="13" fill="#2563eb" font-weight="600">u</text>
  <text x="320" y="144" font-size="13" fill="#374151" text-anchor="middle">The velocities swap. Total momentum mu and total kinetic energy ½mu²</text>
  <text x="320" y="162" font-size="13" fill="#374151" text-anchor="middle">are the same before and after.</text>

  <!-- 2D perfectly inelastic -->
  <text x="20" y="204" font-size="15" font-weight="600" fill="#111827">2D collision: the bodies stick together</text>
  <text x="140" y="228" font-size="13" fill="#6b7280" text-anchor="middle">Before</text>
  <circle cx="60" cy="330" r="12" fill="#b91c1c" stroke="#7f1d1d"/>
  <line x1="76" y1="330" x2="186" y2="330" stroke="#7c3aed" stroke-width="3.5" marker-end="url(#hp)"/>
  <text x="96" y="318" font-size="13" fill="#7c3aed" font-weight="600">p₁ = m₁u₁</text>
  <circle cx="240" cy="410" r="12" fill="#475569" stroke="#1e293b"/>
  <line x1="240" y1="394" x2="240" y2="296" stroke="#7c3aed" stroke-width="3.5" marker-end="url(#hp)"/>
  <text x="248" y="360" font-size="13" fill="#7c3aed" font-weight="600">p₂ = m₂u₂</text>
  <text x="206" y="280" font-size="12" fill="#374151">meet here</text>

  <text x="480" y="228" font-size="13" fill="#6b7280" text-anchor="middle">Total momentum is conserved</text>
  <line x1="370" y1="400" x2="486" y2="400" stroke="#7c3aed" stroke-width="3" marker-end="url(#hp)"/>
  <text x="410" y="422" font-size="13" fill="#7c3aed" font-weight="600">p₁</text>
  <line x1="490" y1="400" x2="490" y2="296" stroke="#7c3aed" stroke-width="3" marker-end="url(#hp)"/>
  <text x="498" y="352" font-size="13" fill="#7c3aed" font-weight="600">p₂</text>
  <line x1="370" y1="400" x2="486" y2="296" stroke="#111827" stroke-width="4" marker-end="url(#hp)"/>
  <text x="340" y="296" font-size="13" fill="#111827" font-weight="600">(m₁ + m₂)V = p₁ + p₂</text>
  <path d="M 404 400 A 34 34 0 0 0 396 377" fill="none" stroke="#374151" stroke-width="1.8"/>
  <text x="410" y="388" font-size="13" fill="#374151">θ</text>
  <text x="520" y="330" font-size="12" fill="#4b5563">tan θ = p₂ / p₁</text>
  <text x="520" y="350" font-size="12" fill="#4b5563">Kinetic energy</text>
  <text x="520" y="366" font-size="12" fill="#4b5563">is NOT conserved.</text>
</svg>
