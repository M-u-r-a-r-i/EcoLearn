<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A vector A at angle theta to the x-axis, split into components A cos theta along x and A sin theta along y</title>
  <defs><marker id="hblue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="hred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="hgreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="horange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="hpurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="hteal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker><marker id="hgray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="hdark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker></defs>
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="20.0" y="30.0" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Resolving a vector into perpendicular components</text>
  <line x1="130.0" y1="330.0" x2="470.0" y2="330.0" stroke="#6b7280" stroke-width="2" marker-end="url(#hgray)"/>
  <line x1="150.0" y1="350.0" x2="150.0" y2="60.0" stroke="#6b7280" stroke-width="2" marker-end="url(#hgray)"/>
  <text x="478.0" y="335.0" font-size="15" fill="#6b7280" font-weight="600" text-anchor="start">x</text>
  <text x="142.0" y="66.0" font-size="15" fill="#6b7280" font-weight="600" text-anchor="end">y</text>
  <line x1="341.5" y1="169.3" x2="341.5" y2="330" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="341.5" y1="169.3" x2="150" y2="169.3" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="150.0" y1="330.0" x2="341.5" y2="330.0" stroke="#ea580c" stroke-width="5" marker-end="url(#horange)"/>
  <line x1="150.0" y1="330.0" x2="150.0" y2="169.3" stroke="#0891b2" stroke-width="5" marker-end="url(#hteal)"/>
  <line x1="150.0" y1="330.0" x2="341.5" y2="169.3" stroke="#7c3aed" stroke-width="5" marker-end="url(#hpurple)"/>
  <path d="M 205 330 A 55 55 0 0 0 192.1 294.6" fill="none" stroke="#111827" stroke-width="1.5"/>
  <text x="212.0" y="318.0" font-size="16" fill="#111827" font-weight="600" text-anchor="start">θ</text>
  <text x="245.8" y="358.0" font-size="16" fill="#ea580c" font-weight="700" text-anchor="middle">Aₓ = A cos θ</text>
  <text x="140.0" y="249.7" font-size="16" fill="#0891b2" font-weight="700" text-anchor="end">A<tspan baseline-shift="sub" font-size="11">y</tspan> = A sin θ</text>
  <text x="233.8" y="237.7" font-size="18" fill="#7c3aed" font-weight="700" text-anchor="end">A</text>
  <text x="440.0" y="110.0" font-size="15" fill="#111827" font-weight="600" text-anchor="start">Back again:</text>
  <text x="440.0" y="136.0" font-size="15" fill="#7c3aed" font-weight="600" text-anchor="start">A = √(Aₓ² + A<tspan baseline-shift="sub" font-size="10">y²</tspan>)</text>
  <text x="440.0" y="160.0" font-size="15" fill="#7c3aed" font-weight="600" text-anchor="start">tan θ = A<tspan baseline-shift="sub" font-size="10">y</tspan> / Aₓ</text>
  <text x="440.0" y="205.0" font-size="13" fill="#111827" font-weight="400" text-anchor="start">The two components,</text>
  <text x="440.0" y="223.0" font-size="13" fill="#111827" font-weight="400" text-anchor="start">added head to tail,</text>
  <text x="440.0" y="241.0" font-size="13" fill="#111827" font-weight="400" text-anchor="start">rebuild A exactly.</text>
</svg>
