<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Strobe picture: a ball launched horizontally and a dropped ball fall the same height in each time interval, while the launched ball moves equal horizontal steps</title>
  <defs><marker id="hblue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="hred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="hgreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="horange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="hpurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="hteal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker><marker id="hgray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="hdark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker></defs>
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="20.0" y="30.0" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Launched sideways vs simply dropped</text>
  <rect x="0" y="345" width="640" height="55" fill="#dcfce7"/><line x1="0" y1="345" x2="640" y2="345" stroke="#16a34a" stroke-width="2"/>
  <line x1="110" y1="70.0" x2="110" y2="70.0" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="110" cy="70.0" r="6" fill="#9ca3af"/>
  <circle cx="110" cy="70.0" r="6" fill="#b91c1c"/>
  <text x="94.0" y="75.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="end">t = 0</text>
  <line x1="110" y1="80.5" x2="198" y2="80.5" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="110" cy="80.5" r="6" fill="#9ca3af"/>
  <circle cx="198" cy="80.5" r="6" fill="#b91c1c"/>
  <line x1="110" y1="112.0" x2="286" y2="112.0" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="110" cy="112.0" r="6" fill="#9ca3af"/>
  <circle cx="286" cy="112.0" r="6" fill="#b91c1c"/>
  <text x="94.0" y="117.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="end">t = 2Δt</text>
  <line x1="110" y1="164.5" x2="374" y2="164.5" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="110" cy="164.5" r="6" fill="#9ca3af"/>
  <circle cx="374" cy="164.5" r="6" fill="#b91c1c"/>
  <text x="94.0" y="169.5" font-size="12" fill="#6b7280" font-weight="400" text-anchor="end">t = 3Δt</text>
  <line x1="110" y1="238.0" x2="462" y2="238.0" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="110" cy="238.0" r="6" fill="#9ca3af"/>
  <circle cx="462" cy="238.0" r="6" fill="#b91c1c"/>
  <text x="94.0" y="243.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="end">t = 4Δt</text>
  <line x1="110" y1="332.5" x2="550" y2="332.5" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="110" cy="332.5" r="6" fill="#9ca3af"/>
  <circle cx="550" cy="332.5" r="6" fill="#b91c1c"/>
  <text x="94.0" y="337.5" font-size="12" fill="#6b7280" font-weight="400" text-anchor="end">t = 5Δt</text>
  <line x1="295.0" y1="112.0" x2="355.0" y2="112.0" stroke="#2563eb" stroke-width="3" marker-end="url(#hblue)"/>
  <line x1="286.0" y1="121.0" x2="286.0" y2="149.6" stroke="#2563eb" stroke-width="3" marker-end="url(#hblue)"/>
  <line x1="471.0" y1="238.0" x2="531.0" y2="238.0" stroke="#2563eb" stroke-width="3" marker-end="url(#hblue)"/>
  <line x1="462.0" y1="247.0" x2="462.0" y2="304.3" stroke="#2563eb" stroke-width="3" marker-end="url(#hblue)"/>
  <text x="308.0" y="104.0" font-size="14" fill="#2563eb" font-weight="700" text-anchor="start">vₓ</text>
  <text x="482.0" y="228.0" font-size="14" fill="#2563eb" font-weight="700" text-anchor="start">vₓ (same)</text>
  <text x="454.0" y="282.0" font-size="13" fill="#2563eb" font-weight="700" text-anchor="end">v<tspan baseline-shift="sub" font-size="9">y</tspan> (bigger)</text>
  <text x="430.0" y="66.0" font-size="13" fill="#111827" font-weight="400" text-anchor="start">Red: launched horizontally.</text>
  <text x="430.0" y="84.0" font-size="13" fill="#111827" font-weight="400" text-anchor="start">Grey: dropped from rest.</text>
  <text x="430.0" y="102.0" font-size="13" fill="#111827" font-weight="400" text-anchor="start">Same height at every flash,</text>
  <text x="430.0" y="120.0" font-size="13" fill="#111827" font-weight="400" text-anchor="start">so they land together.</text>
  <text x="430.0" y="138.0" font-size="13" fill="#111827" font-weight="400" text-anchor="start">Red's sideways steps stay equal.</text>
</svg>
