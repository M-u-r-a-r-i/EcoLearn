<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A ray of light passes through a triangular glass prism. It enters the first face at angle i to the normal and bends towards the normal to angle r1, crosses the prism, meets the second face at r2, and leaves at angle e, bending away from the normal. The dashed extensions of the incoming and outgoing rays meet at the angle of deviation, delta. The drawing shows minimum deviation, where the ray inside runs parallel to the base and i equals e.</title>
  <defs>
    <marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>

  <!-- prism -->
  <path d="M 320 96.8 L 420 270 L 220 270 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- normals -->
  <line x1="218" y1="153.4" x2="330.6" y2="218.4" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 4"/>
  <line x1="309.4" y1="218.4" x2="422" y2="153.4" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 4"/>

  <!-- dashed extensions that define the deviation -->
  <line x1="270" y1="183.4" x2="410.3" y2="136.2" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="370" y1="183.4" x2="280" y2="153.1" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- the ray -->
  <line x1="127.8" y1="231.2" x2="270" y2="183.4" stroke="#2563eb" stroke-width="3" marker-end="url(#pr)"/>
  <line x1="270" y1="183.4" x2="370" y2="183.4" stroke="#2563eb" stroke-width="3" marker-end="url(#pr)"/>
  <line x1="370" y1="183.4" x2="521.6" y2="234.4" stroke="#2563eb" stroke-width="3" marker-end="url(#pr)"/>

  <!-- angles -->
  <path d="M 343 136.6 A 46 46 0 0 1 297 136.6" fill="none" stroke="#7c3aed" stroke-width="2.4"/>
  <text x="320" y="156" font-size="16" fill="#7c3aed" text-anchor="middle" font-weight="700">A</text>

  <path d="M 224.5 198.7 A 48 48 0 0 1 228.4 159.4" fill="none" stroke="#dc2626" stroke-width="2.4"/>
  <text x="208" y="180" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="700">i</text>

  <path d="M 308 183.4 A 38 38 0 0 1 302.9 202.4" fill="none" stroke="#059669" stroke-width="2.2"/>
  <text x="298" y="222" font-size="15" fill="#059669" text-anchor="middle" font-weight="700">r₁</text>

  <path d="M 337.1 202.4 A 38 38 0 0 1 332 183.4" fill="none" stroke="#059669" stroke-width="2.2"/>
  <text x="346" y="222" font-size="15" fill="#059669" text-anchor="middle" font-weight="700">r₂</text>

  <path d="M 411.6 159.4 A 48 48 0 0 1 415.5 198.7" fill="none" stroke="#dc2626" stroke-width="2.4"/>
  <text x="432" y="184" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="700">e</text>

  <path d="M 372.1 149.1 A 55 55 0 0 1 372.1 184.1" fill="none" stroke="#ea580c" stroke-width="2.6"/>
  <text x="396" y="146" font-size="16" fill="#ea580c" text-anchor="middle" font-weight="700">δ</text>

  <text x="112" y="222" font-size="13.5" fill="#2563eb" text-anchor="end" font-weight="700">incoming</text>
  <text x="528" y="252" font-size="13.5" fill="#2563eb" font-weight="700">emergent</text>

  <rect x="24" y="300" width="286" height="84" rx="8" fill="#ffffff" fill-opacity="0.95" stroke="#cbd5e1"/>
  <text x="167" y="326" font-size="15" fill="#111827" text-anchor="middle" font-weight="700">r₁ + r₂ = A</text>
  <text x="167" y="350" font-size="15" fill="#111827" text-anchor="middle" font-weight="700">δ = i + e − A</text>
  <text x="167" y="372" font-size="12.5" fill="#334155" text-anchor="middle">both follow from the geometry alone</text>

  <rect x="330" y="300" width="286" height="84" rx="8" fill="#ffffff" fill-opacity="0.95" stroke="#cbd5e1"/>
  <text x="473" y="328" font-size="14.5" fill="#111827" text-anchor="middle" font-weight="700">at minimum deviation: i = e, r₁ = r₂ = A/2</text>
  <text x="473" y="356" font-size="15" fill="#111827" text-anchor="middle" font-weight="700">n = sin((A + δ_min)/2) ÷ sin(A/2)</text>
  <text x="473" y="376" font-size="12.5" fill="#334155" text-anchor="middle">the ray inside then runs parallel to the base</text>

  <text x="320" y="36" font-size="13" fill="#6b7280" text-anchor="middle">The prism bends the ray twice, and both bends turn it the same way — towards the base.</text>
</svg>
