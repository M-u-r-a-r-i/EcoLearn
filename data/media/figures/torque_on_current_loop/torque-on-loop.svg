<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Left: a rectangular current loop seen edge on in a uniform field, with the force on the near side pointing up and the force on the far side pointing down, forming a couple that twists it. Right: the magnetic moment vector m at an angle theta to B, with the torque formula tau equals m B sine theta, and a note that the torque is zero when m lines up with B.</title>
  <defs>
    <marker id="t1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="t2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="t3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>

  <!-- LEFT: edge-on loop -->
  <text x="24" y="32" font-size="14.5" font-weight="700" fill="#111827">The loop, seen edge on</text>
  <g stroke="#7c3aed" stroke-width="2.5">
    <line x1="40" y1="90" x2="280" y2="90"/>
    <line x1="40" y1="150" x2="280" y2="150"/>
    <line x1="40" y1="210" x2="280" y2="210"/>
    <line x1="40" y1="270" x2="280" y2="270"/>
    <line x1="40" y1="330" x2="280" y2="330"/>
  </g>
  <g fill="#7c3aed">
    <path d="M 290 90 l -14 -6 l 0 12 z"/><path d="M 290 150 l -14 -6 l 0 12 z"/><path d="M 290 210 l -14 -6 l 0 12 z"/><path d="M 290 270 l -14 -6 l 0 12 z"/><path d="M 290 330 l -14 -6 l 0 12 z"/>
  </g>
  <text x="40" y="78" font-size="13.5" fill="#7c3aed" font-weight="700">B (uniform, to the right)</text>

  <!-- the loop edge: a tilted bar; near side current out, far side current in -->
  <line x1="110" y1="280" x2="210" y2="140" stroke="#111827" stroke-width="5"/>
  <circle cx="110" cy="280" r="12" fill="#fff" stroke="#2563eb" stroke-width="3"/>
  <circle cx="110" cy="280" r="4" fill="#2563eb"/>
  <text x="84" y="308" font-size="12.5" fill="#2563eb" font-weight="700" text-anchor="middle">I out</text>
  <circle cx="210" cy="140" r="12" fill="#fff" stroke="#2563eb" stroke-width="3"/>
  <g stroke="#2563eb" stroke-width="2.5">
    <line x1="202" y1="132" x2="218" y2="148"/><line x1="218" y1="132" x2="202" y2="148"/>
  </g>
  <text x="236" y="132" font-size="12.5" fill="#2563eb" font-weight="700">I in</text>

  <!-- forces: F on the "out" wire, F on the "in" wire -->
  <line x1="110" y1="266" x2="110" y2="196" stroke="#dc2626" stroke-width="4" marker-end="url(#t1)"/>
  <text x="92" y="206" font-size="13.5" fill="#dc2626" font-weight="700" text-anchor="end">F (up)</text>
  <line x1="210" y1="154" x2="210" y2="224" stroke="#dc2626" stroke-width="4" marker-end="url(#t1)"/>
  <text x="228" y="216" font-size="13.5" fill="#dc2626" font-weight="700">F (down)</text>
  <text x="160" y="372" font-size="12.5" fill="#111827" font-weight="700" text-anchor="middle">equal, opposite, not in line → a couple</text>

  <line x1="300" y1="24" x2="300" y2="380" stroke="#e2e8f0" stroke-width="2"/>

  <!-- RIGHT: m and B -->
  <text x="330" y="32" font-size="14.5" font-weight="700" fill="#111827">Magnetic moment m = NIA</text>
  <line x1="400" y1="220" x2="600" y2="220" stroke="#7c3aed" stroke-width="4" marker-end="url(#t3)"/>
  <text x="560" y="244" font-size="14" fill="#7c3aed" font-weight="700">B</text>
  <line x1="400" y1="220" x2="530" y2="120" stroke="#16a34a" stroke-width="4" marker-end="url(#t2)"/>
  <text x="540" y="112" font-size="14" fill="#16a34a" font-weight="700">m</text>
  <path d="M 460 220 A 60 60 0 0 0 447 184" fill="none" stroke="#111827" stroke-width="2"/>
  <text x="472" y="198" font-size="14" fill="#111827" font-weight="700">θ</text>

  <text x="470" y="300" font-size="17" fill="#111827" font-weight="700" text-anchor="middle">τ = m B sin θ = N I A B sin θ</text>
  <text x="470" y="328" font-size="12.5" fill="#475569" text-anchor="middle">θ = 90° → biggest twist</text>
  <text x="470" y="348" font-size="12.5" fill="#475569" text-anchor="middle">θ = 0° → no twist (m lined up with B)</text>
  <text x="470" y="374" font-size="12.5" fill="#475569" text-anchor="middle">In a uniform field the net force is zero — only a twist.</text>
</svg>
