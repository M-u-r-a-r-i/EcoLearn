<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Two masses pull each other with equal and opposite forces along the line joining their centres; doubling the distance quarters the force and tripling it gives one ninth</title>
  <defs><marker id="hred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="hdark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker></defs>
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="20" y="30" font-size="17" fill="#111827" font-weight="700">Gravity: an equal and opposite pull, weakening as 1/r²</text>
  <!-- the pair -->
  <circle cx="110" cy="120" r="46" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="400" cy="120" r="28" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="110" y="152" font-size="16" fill="#1e3a8a" font-weight="700" text-anchor="middle">m₁</text>
  <text x="400" y="143" font-size="14" fill="#1e3a8a" font-weight="700" text-anchor="middle">m₂</text>
  <line x1="110" y1="120" x2="210" y2="120" stroke="#dc2626" stroke-width="4" marker-end="url(#hred)"/>
  <line x1="400" y1="120" x2="300" y2="120" stroke="#dc2626" stroke-width="4" marker-end="url(#hred)"/>
  <text x="165" y="108" font-size="14" fill="#dc2626" font-weight="700">F (on m₁)</text>
  <text x="300" y="108" font-size="14" fill="#dc2626" font-weight="700">F (on m₂)</text>
  <line x1="110" y1="190" x2="400" y2="190" stroke="#111827" stroke-width="1.5" marker-start="url(#hdark)" marker-end="url(#hdark)"/>
  <line x1="110" y1="176" x2="110" y2="200" stroke="#111827" stroke-width="1"/>
  <line x1="400" y1="176" x2="400" y2="200" stroke="#111827" stroke-width="1"/>
  <text x="255" y="182" font-size="14" fill="#111827" text-anchor="middle">r (centre to centre)</text>
  <text x="440" y="118" font-size="13" fill="#111827">Same size on both,</text>
  <text x="440" y="136" font-size="13" fill="#111827">opposite directions:</text>
  <text x="440" y="154" font-size="13" fill="#111827">F = G m₁m₂ / r²</text>
  <line x1="20" y1="222" x2="620" y2="222" stroke="#e5e7eb" stroke-width="2"/>
  <!-- inverse square rows: bars proportional to force: 240, 60, 26.7 px -->
  <text x="20" y="250" font-size="14" fill="#111827" font-weight="600">Same two masses, moved apart:</text>
  <text x="270" y="250" font-size="14" fill="#111827" font-weight="600">size of the pull (to scale)</text>
  <circle cx="40" cy="285" r="8" fill="#1d4ed8"/><circle cx="100" cy="285" r="8" fill="#1d4ed8"/>
  <text x="112" y="290" font-size="13" fill="#111827">r</text>
  <rect x="270" y="275" width="240" height="20" fill="#dc2626"/>
  <text x="520" y="290" font-size="14" fill="#111827">F</text>
  <circle cx="40" cy="325" r="8" fill="#1d4ed8"/><circle cx="160" cy="325" r="8" fill="#1d4ed8"/>
  <text x="172" y="330" font-size="13" fill="#111827">2r</text>
  <rect x="270" y="315" width="60" height="20" fill="#dc2626"/>
  <text x="340" y="330" font-size="14" fill="#111827">F/4</text>
  <circle cx="40" cy="365" r="8" fill="#1d4ed8"/><circle cx="220" cy="365" r="8" fill="#1d4ed8"/>
  <text x="232" y="370" font-size="13" fill="#111827">3r</text>
  <rect x="270" y="355" width="26.7" height="20" fill="#dc2626"/>
  <text x="306" y="370" font-size="14" fill="#111827">F/9</text>
</svg>
