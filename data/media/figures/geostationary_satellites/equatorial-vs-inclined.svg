<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Earth with its spin axis, equator and a circle of latitude; a geostationary orbit lies in the equatorial plane, while an orbit tilted to the equator carries the satellite north and south</title>
  <defs><marker id="hdark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker></defs>
  <rect width="640" height="420" fill="#ffffff"/>
  <text x="20" y="30" font-size="17" fill="#111827" font-weight="700">Why a geostationary orbit must be over the equator</text>
  <!-- inclined orbit (behind) -->
  <ellipse cx="220" cy="230" rx="190" ry="40" transform="rotate(-22 220 230)" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 5"/>
  <!-- Earth -->
  <circle cx="220" cy="230" r="90" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="220" y1="100" x2="220" y2="355" stroke="#111827" stroke-width="2" stroke-dasharray="4 3"/>
  <path d="M244,98 A26,8 0 1,1 196,98" fill="none" stroke="#111827" stroke-width="1.5" marker-end="url(#hdark)"/>
  <text x="228" y="86" font-size="13" fill="#111827" font-weight="700">N</text>
  <text x="252" y="104" font-size="11" fill="#111827">spins west to east</text>
  <ellipse cx="220" cy="230" rx="90" ry="16" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <ellipse cx="220" cy="187" rx="79" ry="14" fill="none" stroke="#0891b2" stroke-width="2"/>
  <circle cx="220" cy="187" r="3" fill="#0891b2"/>
  <circle cx="220" cy="230" r="3" fill="#111827"/>
  <text x="20" y="120" font-size="11" fill="#0891b2" font-weight="600">28° N circle: its centre</text>
  <text x="20" y="134" font-size="11" fill="#0891b2">is on the axis, not at</text>
  <text x="20" y="148" font-size="11" fill="#0891b2">Earth's centre</text>
  <line x1="100" y1="152" x2="143" y2="183" stroke="#0891b2" stroke-width="1.2"/>
  <!-- geostationary orbit in the equatorial plane -->
  <ellipse cx="220" cy="230" rx="190" ry="36" fill="none" stroke="#ea580c" stroke-width="3"/>
  <circle cx="410" cy="230" r="7" fill="#ea580c"/>
  <circle cx="396" cy="159" r="7" fill="#7c3aed"/>
  <!-- legend -->
  <line x1="440" y1="80" x2="440" y2="400" stroke="#e5e7eb" stroke-width="2"/>
  <line x1="455" y1="100" x2="485" y2="100" stroke="#ea580c" stroke-width="3"/>
  <text x="492" y="96" font-size="12" fill="#111827" font-weight="600">geostationary orbit</text>
  <text x="492" y="111" font-size="12" fill="#111827">in the equator's plane,</text>
  <text x="492" y="126" font-size="12" fill="#111827">period = 1 sidereal day</text>
  <line x1="455" y1="160" x2="485" y2="160" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="492" y="156" font-size="12" fill="#111827" font-weight="600">tilted orbit, same</text>
  <text x="492" y="171" font-size="12" fill="#111827">period: drifts north</text>
  <text x="492" y="186" font-size="12" fill="#111827">and south every day</text>
  <text x="455" y="236" font-size="12" fill="#111827" font-weight="600">Every orbit's plane passes</text>
  <text x="455" y="252" font-size="12" fill="#111827" font-weight="600">through Earth's centre,</text>
  <text x="455" y="268" font-size="12" fill="#111827">because gravity points there.</text>
  <text x="455" y="296" font-size="12" fill="#111827">A spot at 28° N travels round</text>
  <text x="455" y="312" font-size="12" fill="#111827">a circle whose plane misses</text>
  <text x="455" y="328" font-size="12" fill="#111827">the centre, so no orbit can</text>
  <text x="455" y="344" font-size="12" fill="#111827">keep pace above it. Only the</text>
  <text x="455" y="360" font-size="12" fill="#111827">equator's circle is centred</text>
  <text x="455" y="376" font-size="12" fill="#111827">on Earth's centre.</text>
  <text x="220" y="400" font-size="12" fill="#6b7280" text-anchor="middle">(not to scale: the real orbit is about 6.6 Earth radii from the centre)</text>
</svg>
