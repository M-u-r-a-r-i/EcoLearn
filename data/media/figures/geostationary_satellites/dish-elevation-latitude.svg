<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Left: Earth and a geostationary satellite to scale, with lines of sight from latitudes 10 degrees north and 34 degrees north. Right: the dish at 10 degrees north points 78 degrees above the southern horizon, at 34 degrees north only 50 degrees</title>
  <rect width="640" height="400" fill="#ffffff"/>

  <!-- left panel: to scale, r = 6.6 R -->
  <text x="20" y="28" font-size="14" font-weight="600" fill="#0f172a">Seen from the side (to scale)</text>
  <line x1="80" y1="130" x2="80" y2="258" stroke="#64748b" stroke-width="1.5"/>
  <text x="80" y="124" font-size="12" text-anchor="middle" fill="#475569">N</text>
  <circle cx="80" cy="200" r="45" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.5"/>
  <line x1="35" y1="200" x2="377" y2="200" stroke="#64748b" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="240" y="216" font-size="12" text-anchor="middle" fill="#475569">equatorial plane</text>
  <text x="80" y="276" font-size="12" text-anchor="middle" fill="#1e3a8a">Earth</text>

  <line x1="124.3" y1="192.2" x2="377" y2="200" stroke="#ea580c" stroke-width="1.5"/>
  <line x1="117.3" y1="174.8" x2="377" y2="200" stroke="#7c3aed" stroke-width="1.5"/>
  <circle cx="124.3" cy="192.2" r="4" fill="#ea580c"/>
  <circle cx="117.3" cy="174.8" r="4" fill="#7c3aed"/>

  <rect x="370" y="194" width="14" height="12" rx="2" fill="#475569"/>
  <rect x="373" y="182" width="8" height="10" fill="#0f766e"/>
  <rect x="373" y="208" width="8" height="10" fill="#0f766e"/>
  <text x="410" y="240" font-size="12" text-anchor="end" fill="#0f172a">geostationary satellite</text>
  <text x="410" y="256" font-size="12" text-anchor="end" fill="#475569">r ≈ 6.6 R, above the equator</text>

  <text x="20" y="320" font-size="13" fill="#ea580c">● A: latitude 10° N</text>
  <text x="20" y="342" font-size="13" fill="#7c3aed">● B: latitude 34° N</text>
  <text x="20" y="372" font-size="12" fill="#475569">Both lines of sight end on the same point above the equator.</text>

  <!-- right panel: local views -->
  <line x1="430" y1="40" x2="430" y2="360" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="450" y="28" font-size="14" font-weight="600" fill="#0f172a">The dish on the ground</text>

  <!-- A: 10 deg N, elevation 78 deg -->
  <text x="450" y="58" font-size="13" fill="#ea580c">A: 10° N</text>
  <line x1="450" y1="170" x2="620" y2="170" stroke="#334155" stroke-width="2"/>
  <line x1="500" y1="170" x2="500" y2="158" stroke="#64748b" stroke-width="3"/>
  <line x1="500" y1="156" x2="600" y2="156" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="500" y1="156" x2="518.7" y2="68" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <path d="M532,156 A32,32 0 0,0 506.7,124.7" fill="none" stroke="#0f172a" stroke-width="1.2"/>
  <text x="538" y="134" font-size="13" fill="#0f172a">78°</text>
  <g transform="translate(500,156) rotate(12)">
    <path d="M-13,0 A13,7 0 0,0 13,0 z" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
  </g>
  <text x="620" y="188" font-size="12" text-anchor="end" fill="#475569">south →</text>

  <!-- B: 34 deg N, elevation 50 deg -->
  <text x="450" y="228" font-size="13" fill="#7c3aed">B: 34° N</text>
  <line x1="450" y1="340" x2="620" y2="340" stroke="#334155" stroke-width="2"/>
  <line x1="500" y1="340" x2="500" y2="328" stroke="#64748b" stroke-width="3"/>
  <line x1="500" y1="326" x2="600" y2="326" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="500" y1="326" x2="557.9" y2="257" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4"/>
  <path d="M532,326 A32,32 0 0,0 520.6,301.5" fill="none" stroke="#0f172a" stroke-width="1.2"/>
  <text x="540" y="312" font-size="13" fill="#0f172a">50°</text>
  <g transform="translate(500,326) rotate(40)">
    <path d="M-13,0 A13,7 0 0,0 13,0 z" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
  </g>
  <text x="620" y="358" font-size="12" text-anchor="end" fill="#475569">south →</text>
</svg>
