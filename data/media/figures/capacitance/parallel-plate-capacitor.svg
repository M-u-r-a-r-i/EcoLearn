<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A parallel-plate capacitor: two plates of area A a distance d apart, carrying plus Q and minus Q, with a uniform field between them and slight fringing at the edges</title>
  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="640" height="380" fill="#ffffff"/>

  <!-- fringing field at the edges -->
  <path d="M 222 74 Q 300 30 378 74" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M 222 306 Q 300 350 378 306" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- plates -->
  <rect x="206" y="70" width="14" height="240" fill="#dc2626"/>
  <rect x="380" y="70" width="14" height="240" fill="#2563eb"/>
  <g font-size="16" font-weight="700" text-anchor="middle">
    <text x="190" y="110" fill="#dc2626">+</text><text x="190" y="170" fill="#dc2626">+</text><text x="190" y="230" fill="#dc2626">+</text><text x="190" y="290" fill="#dc2626">+</text>
    <text x="410" y="110" fill="#2563eb">−</text><text x="410" y="170" fill="#2563eb">−</text><text x="410" y="230" fill="#2563eb">−</text><text x="410" y="290" fill="#2563eb">−</text>
  </g>
  <text x="170" y="60" font-size="16" fill="#dc2626" font-weight="700">+Q</text>
  <text x="400" y="60" font-size="16" fill="#2563eb" font-weight="700">−Q</text>

  <!-- uniform field -->
  <g stroke="#7c3aed" stroke-width="2.5" marker-end="url(#fa)">
    <line x1="226" y1="100" x2="370" y2="100"/>
    <line x1="226" y1="145" x2="370" y2="145"/>
    <line x1="226" y1="190" x2="370" y2="190"/>
    <line x1="226" y1="235" x2="370" y2="235"/>
    <line x1="226" y1="280" x2="370" y2="280"/>
  </g>
  <text x="300" y="175" font-size="16" text-anchor="middle" fill="#7c3aed" font-weight="700">E</text>

  <!-- gap marker -->
  <line x1="220" y1="336" x2="380" y2="336" stroke="#374151" stroke-width="1.5"/>
  <line x1="220" y1="330" x2="220" y2="342" stroke="#374151" stroke-width="1.5"/>
  <line x1="380" y1="330" x2="380" y2="342" stroke="#374151" stroke-width="1.5"/>
  <text x="300" y="360" font-size="15" text-anchor="middle" fill="#374151" font-weight="700">d</text>
  <text x="40" y="200" font-size="14" fill="#374151">each plate:</text>
  <text x="40" y="218" font-size="14" fill="#374151">area A</text>

  <!-- derivation box -->
  <rect x="440" y="110" width="185" height="160" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-size="15" fill="#111827">
    <text x="455" y="138">σ = Q / A</text>
    <text x="455" y="166">E = σ / ε₀</text>
    <text x="455" y="194">V = E d = Qd / (ε₀A)</text>
    <text x="455" y="228" font-weight="700">C = Q / V = ε₀A / d</text>
    <text x="455" y="254" font-size="12" fill="#374151">(ignoring the edge fringing)</text>
  </g>
</svg>
