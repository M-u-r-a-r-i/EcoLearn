<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Ray diagram for a convex lens with the object beyond twice the focal length. One ray travels parallel to the axis and leaves through the far focus; a second ray passes straight through the optical centre. They cross beyond the far focus, forming a real, inverted, smaller image between F and 2F.</title>
  <defs>
    <marker id="r1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="ob" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="im" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>

  <line x1="30" y1="220" x2="610" y2="220" stroke="#374151" stroke-width="1.6" stroke-dasharray="9 5"/>

  <!-- lens -->
  <path d="M 320 130 Q 342 220 320 310 Q 298 220 320 130 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>

  <!-- focal points -->
  <circle cx="240" cy="220" r="4.5" fill="#111827"/><text x="240" y="242" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">F</text>
  <circle cx="400" cy="220" r="4.5" fill="#111827"/><text x="400" y="242" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">F′</text>
  <circle cx="160" cy="220" r="4.5" fill="#6b7280"/><text x="160" y="242" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">2F</text>
  <circle cx="480" cy="220" r="4.5" fill="#6b7280"/><text x="480" y="242" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">2F′</text>

  <!-- object -->
  <line x1="140" y1="220" x2="140" y2="160" stroke="#16a34a" stroke-width="3.5" marker-end="url(#ob)"/>
  <text x="128" y="152" font-size="14" fill="#16a34a" text-anchor="end" font-weight="700">object</text>

  <!-- ray 1: parallel then through F' -->
  <line x1="140" y1="160" x2="320" y2="160" stroke="#2563eb" stroke-width="2.6" marker-end="url(#r1)"/>
  <line x1="320" y1="160" x2="560" y2="340" stroke="#2563eb" stroke-width="2.6" marker-end="url(#r1)"/>
  <!-- ray 2: through the optical centre -->
  <line x1="140" y1="160" x2="560" y2="300" stroke="#2563eb" stroke-width="2.6" marker-end="url(#r1)"/>

  <!-- image -->
  <line x1="464" y1="220" x2="464" y2="268" stroke="#dc2626" stroke-width="3.5" marker-end="url(#im)"/>
  <text x="480" y="262" font-size="13.5" fill="#dc2626" font-weight="700">real image</text>

  <rect x="36" y="40" width="300" height="86" rx="8" fill="#ffffff" fill-opacity="0.95" stroke="#cbd5e1"/>
  <text x="186" y="70" font-size="16.5" fill="#111827" text-anchor="middle" font-weight="700">1/v − 1/u = 1/f</text>
  <text x="186" y="94" font-size="16.5" fill="#111827" text-anchor="middle" font-weight="700">m = v/u</text>
  <text x="186" y="116" font-size="12" fill="#334155" text-anchor="middle">distances from the optical centre; negative m means inverted</text>

  <text x="320" y="382" font-size="13" fill="#6b7280" text-anchor="middle">Object beyond 2F: the image lands between F′ and 2F′, smaller and upside down.</text>
</svg>
