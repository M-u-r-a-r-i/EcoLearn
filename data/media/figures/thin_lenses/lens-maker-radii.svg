<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A biconvex lens on a principal axis. The centre of curvature of the first surface lies to the right of the lens, so its radius R1 is positive; the centre of curvature of the second surface lies to the left, so R2 is negative. The lens maker's formula is printed beside the lens.</title>
  <defs>
    <marker id="d1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="d2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>

  <line x1="30" y1="210" x2="610" y2="210" stroke="#374151" stroke-width="1.6" stroke-dasharray="9 5"/>

  <!-- the lens -->
  <path d="M 311.4 140 A 220 220 0 0 0 311.4 280 L 328.6 280 A 220 220 0 0 0 328.6 140 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="320" y="122" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="700">glass, index n</text>

  <!-- centre of curvature of the first (left) surface -->
  <line x1="300" y1="210" x2="520" y2="210" stroke="#7c3aed" stroke-width="2" marker-end="url(#d1)"/>
  <circle cx="520" cy="210" r="5" fill="#7c3aed"/>
  <text x="520" y="196" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="700">C₁</text>
  <text x="470" y="244" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="700">R₁ &gt; 0</text>

  <!-- centre of curvature of the second (right) surface -->
  <line x1="340" y1="210" x2="120" y2="210" stroke="#ea580c" stroke-width="2" marker-end="url(#d2)"/>
  <circle cx="120" cy="210" r="5" fill="#ea580c"/>
  <text x="120" y="196" font-size="15" fill="#ea580c" text-anchor="middle" font-weight="700">C₂</text>
  <text x="176" y="244" font-size="14" fill="#ea580c" text-anchor="middle" font-weight="700">R₂ &lt; 0</text>

  <text x="320" y="330" font-size="13.5" fill="#334155" text-anchor="middle">Light runs left to right. A radius measured in that direction is positive, against it negative.</text>

  <rect x="150" y="38" width="340" height="66" rx="8" fill="#ffffff" fill-opacity="0.95" stroke="#cbd5e1"/>
  <text x="320" y="70" font-size="17" fill="#111827" text-anchor="middle" font-weight="700">1/f = (n − 1)(1/R₁ − 1/R₂)</text>
  <text x="320" y="92" font-size="12.5" fill="#334155" text-anchor="middle">thin lens, same medium on both sides, near-axis rays</text>

  <text x="320" y="362" font-size="13" fill="#6b7280" text-anchor="middle">Both surfaces bulge outwards, so the two terms add and the lens converges.</text>
</svg>
