<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A conducting rod of length l sliding to the right along two rails in a magnetic field directed into the page, with the magnetic force pushing positive charges to the top of the rod and a current flowing round the circuit through a resistor</title>
  <defs>
    <marker id="mv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="mf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0ea5e9"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="320" y="26" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">A rod sliding across a magnetic field becomes a battery</text>

  <!-- field into the page -->
  <g stroke="#7c3aed" stroke-width="2">
    <g transform="translate(150,110)"><line x1="-6" y1="-6" x2="6" y2="6"/><line x1="-6" y1="6" x2="6" y2="-6"/></g>
    <g transform="translate(230,110)"><line x1="-6" y1="-6" x2="6" y2="6"/><line x1="-6" y1="6" x2="6" y2="-6"/></g>
    <g transform="translate(310,110)"><line x1="-6" y1="-6" x2="6" y2="6"/><line x1="-6" y1="6" x2="6" y2="-6"/></g>
    <g transform="translate(470,110)"><line x1="-6" y1="-6" x2="6" y2="6"/><line x1="-6" y1="6" x2="6" y2="-6"/></g>
    <g transform="translate(150,180)"><line x1="-6" y1="-6" x2="6" y2="6"/><line x1="-6" y1="6" x2="6" y2="-6"/></g>
    <g transform="translate(230,180)"><line x1="-6" y1="-6" x2="6" y2="6"/><line x1="-6" y1="6" x2="6" y2="-6"/></g>
    <g transform="translate(310,180)"><line x1="-6" y1="-6" x2="6" y2="6"/><line x1="-6" y1="6" x2="6" y2="-6"/></g>
    <g transform="translate(470,180)"><line x1="-6" y1="-6" x2="6" y2="6"/><line x1="-6" y1="6" x2="6" y2="-6"/></g>
    <g transform="translate(150,250)"><line x1="-6" y1="-6" x2="6" y2="6"/><line x1="-6" y1="6" x2="6" y2="-6"/></g>
    <g transform="translate(230,250)"><line x1="-6" y1="-6" x2="6" y2="6"/><line x1="-6" y1="6" x2="6" y2="-6"/></g>
    <g transform="translate(310,250)"><line x1="-6" y1="-6" x2="6" y2="6"/><line x1="-6" y1="6" x2="6" y2="-6"/></g>
    <g transform="translate(470,250)"><line x1="-6" y1="-6" x2="6" y2="6"/><line x1="-6" y1="6" x2="6" y2="-6"/></g>
  </g>
  <text x="520" y="186" font-size="14" fill="#7c3aed" font-weight="700">B into the page</text>

  <!-- rails -->
  <line x1="100" y1="80" x2="560" y2="80" stroke="#334155" stroke-width="5"/>
  <line x1="100" y1="290" x2="560" y2="290" stroke="#334155" stroke-width="5"/>
  <!-- resistor on the left end -->
  <path d="M 100 80 L 100 140 L 84 152 L 116 168 L 84 184 L 116 200 L 100 212 L 100 290" fill="none" stroke="#334155" stroke-width="5"/>
  <text x="46" y="180" font-size="14" fill="#334155" font-weight="600">R</text>

  <!-- rod -->
  <line x1="390" y1="74" x2="390" y2="296" stroke="#0f172a" stroke-width="9" stroke-linecap="round"/>
  <text x="404" y="70" font-size="14" fill="#0f172a" font-weight="700">+</text>
  <text x="404" y="312" font-size="16" fill="#0f172a" font-weight="700">&#8722;</text>
  <text x="352" y="330" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600">rod, length l</text>

  <!-- velocity -->
  <line x1="400" y1="185" x2="462" y2="185" stroke="#2563eb" stroke-width="5" marker-end="url(#mv)"/>
  <text x="432" y="168" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="700">v</text>

  <!-- force on positive charges: up the rod -->
  <line x1="366" y1="200" x2="366" y2="120" stroke="#dc2626" stroke-width="4" marker-end="url(#mf)"/>
  <text x="348" y="150" font-size="13" fill="#dc2626" font-weight="700" text-anchor="end">force qvB on</text>
  <text x="348" y="167" font-size="13" fill="#dc2626" font-weight="700" text-anchor="end">positive charges</text>

  <!-- current arrows round the circuit (anticlockwise as drawn) -->
  <g stroke="#0ea5e9" stroke-width="3.5">
    <line x1="300" y1="80" x2="220" y2="80" marker-end="url(#mi)"/>
    <line x1="200" y1="290" x2="290" y2="290" marker-end="url(#mi)"/>
  </g>
  <text x="250" y="70" font-size="13" fill="#0ea5e9" text-anchor="middle" font-weight="700">induced current I</text>

  <text x="320" y="366" font-size="15" fill="#15803d" text-anchor="middle" font-weight="700">emf = B l v   (B, l and v mutually perpendicular)</text>
  <text x="320" y="388" font-size="13" fill="#475569" text-anchor="middle">Stop the rod and the emf vanishes instantly.</text>
</svg>
