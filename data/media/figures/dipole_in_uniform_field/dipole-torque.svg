<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A dipole in a uniform field pointing right, tilted at angle theta to the field. The field pushes +q to the right with force qE and pulls −q to the left with force qE. The two forces cancel, but their lines of action are 2a sin theta apart, so they form a couple that turns p towards E.</title>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>

  <!-- uniform field lines -->
  <g stroke="#cbd5e1" stroke-width="2" marker-end="url(#g)">
    <line x1="20" y1="60" x2="620" y2="60"/><line x1="20" y1="110" x2="620" y2="110"/>
    <line x1="20" y1="310" x2="620" y2="310"/><line x1="20" y1="360" x2="620" y2="360"/>
  </g>
  <text x="600" y="48" font-size="16" fill="#64748b" font-weight="700" text-anchor="end">uniform field E →</text>

  <!-- dipole: centre (320,210), a = 100 px, theta = 30 deg; +q at (406.6,160), -q at (233.4,260) -->
  <line x1="233.4" y1="260" x2="406.6" y2="160" stroke="#475569" stroke-width="3"/>
  <line x1="320" y1="210" x2="380" y2="175.4" stroke="#7c3aed" stroke-width="4" marker-end="url(#p)"/>
  <text x="352" y="222" font-size="16" fill="#7c3aed" font-weight="700">p</text>
  <line x1="320" y1="210" x2="420" y2="210" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M 370 210 A 50 50 0 0 0 363.3 185" fill="none" stroke="#111827" stroke-width="2"/>
  <text x="378" y="202" font-size="15" fill="#111827" font-weight="600">θ</text>

  <!-- forces -->
  <line x1="422" y1="160" x2="512" y2="160" stroke="#dc2626" stroke-width="4" marker-end="url(#f)"/>
  <line x1="218" y1="260" x2="128" y2="260" stroke="#dc2626" stroke-width="4" marker-end="url(#f)"/>
  <text x="470" y="148" font-size="15" fill="#dc2626" font-weight="700">+qE</text>
  <text x="150" y="284" font-size="15" fill="#dc2626" font-weight="700">−qE</text>

  <circle cx="406.6" cy="160" r="15" fill="#dc2626"/><text x="406.6" y="167" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">+</text>
  <circle cx="233.4" cy="260" r="15" fill="#2563eb"/><text x="233.4" y="267" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">−</text>

  <!-- perpendicular distance between lines of action -->
  <line x1="560" y1="160" x2="560" y2="260" stroke="#111827" stroke-width="1.8"/>
  <line x1="552" y1="160" x2="568" y2="160" stroke="#111827" stroke-width="1.8"/>
  <line x1="552" y1="260" x2="568" y2="260" stroke="#111827" stroke-width="1.8"/>
  <line x1="240" y1="260" x2="552" y2="260" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="3 4"/>
  <line x1="520" y1="160" x2="552" y2="160" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="3 4"/>
  <text x="572" y="215" font-size="14" fill="#111827" font-weight="600">2a sin θ</text>

  <!-- rotation sense: clockwise, towards E -->
  <path d="M 300 140 A 80 80 0 0 1 390 148" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#r)"/>
  <text x="300" y="130" font-size="14" fill="#16a34a" font-weight="600" text-anchor="end">turns p towards E</text>

  <text x="320" y="395" font-size="14" fill="#111827" text-anchor="middle">Net force = qE − qE = 0.   Torque τ = qE × 2a sin θ = pE sin θ.</text>
</svg>
