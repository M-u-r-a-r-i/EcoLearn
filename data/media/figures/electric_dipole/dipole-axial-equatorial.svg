<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">An electric dipole: −q on the left and +q on the right, 2a apart, with the dipole moment p pointing from −q to +q. At a point on the axis, the field from +q is larger than the field from −q and the net field points along p. At a point on the equatorial line, the two fields are equal; their sideways parts cancel and the net field points opposite to p.</title>
  <defs>
    <marker id="e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
    <marker id="n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#ffffff"/>

  <!-- axis and equatorial line -->
  <line x1="150" y1="270" x2="620" y2="270" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="320" y1="60" x2="320" y2="390" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="612" y="296" font-size="13" fill="#6b7280" text-anchor="end">axis</text>
  <text x="326" y="384" font-size="13" fill="#6b7280">equatorial line</text>

  <!-- construction lines to equatorial point Q (320,120) -->
  <line x1="260" y1="270" x2="320" y2="120" stroke="#e5e7eb" stroke-width="1.5"/>
  <line x1="380" y1="270" x2="320" y2="120" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- charges -->
  <circle cx="260" cy="270" r="15" fill="#2563eb"/><text x="260" y="277" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">−</text>
  <circle cx="380" cy="270" r="15" fill="#dc2626"/><text x="380" y="277" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">+</text>
  <text x="260" y="306" font-size="14" fill="#111827" text-anchor="middle">−q</text>
  <text x="380" y="306" font-size="14" fill="#111827" text-anchor="middle">+q</text>
  <line x1="262" y1="330" x2="372" y2="330" stroke="#7c3aed" stroke-width="4" marker-end="url(#p)"/>
  <text x="320" y="352" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="700">p = q × 2a</text>
  <text x="296" y="262" font-size="13" fill="#374151" text-anchor="end">2a</text>

  <!-- axial point P (540,270): E+ long to the right, E- short to the left -->
  <circle cx="540" cy="270" r="4" fill="#111827"/>
  <text x="540" y="252" font-size="15" fill="#111827" text-anchor="middle" font-weight="700">P</text>
  <line x1="540" y1="228" x2="610" y2="228" stroke="#ea580c" stroke-width="3" marker-end="url(#e)"/>
  <line x1="540" y1="210" x2="515" y2="210" stroke="#ea580c" stroke-width="3" marker-end="url(#e)"/>
  <text x="575" y="220" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="600">E₊</text>
  <text x="506" y="206" font-size="13" fill="#ea580c" text-anchor="end" font-weight="600">E₋</text>
  <line x1="540" y1="270" x2="589" y2="270" stroke="#111827" stroke-width="4" marker-end="url(#n)"/>
  <text x="470" y="160" font-size="14" fill="#111827" font-weight="600">On the axis:</text>
  <text x="470" y="178" font-size="14" fill="#111827">net E along p</text>

  <!-- equatorial point Q (320,120) -->
  <circle cx="320" cy="120" r="4" fill="#111827"/>
  <text x="332" y="116" font-size="15" fill="#111827" font-weight="700">Q</text>
  <line x1="320" y1="120" x2="294" y2="55" stroke="#ea580c" stroke-width="3" marker-end="url(#e)"/>
  <line x1="320" y1="120" x2="294" y2="185" stroke="#ea580c" stroke-width="3" marker-end="url(#e)"/>
  <text x="282" y="60" font-size="13" fill="#ea580c" text-anchor="end" font-weight="600">E₊ (away from +q)</text>
  <text x="282" y="196" font-size="13" fill="#ea580c" text-anchor="end" font-weight="600">E₋ (towards −q)</text>
  <line x1="320" y1="120" x2="268" y2="120" stroke="#111827" stroke-width="4" marker-end="url(#n)"/>
  <text x="200" y="124" font-size="14" fill="#111827" font-weight="600" text-anchor="end">net E opposite to p</text>
</svg>
