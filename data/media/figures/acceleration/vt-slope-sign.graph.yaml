# Velocity-time graph in five phases. Slopes (accelerations):
# 0-2 s: +4 m/s^2; 2-3.5 s: 0; 3.5-4.5 s: -8 m/s^2; 4.5-5.5 s: -3 m/s^2; 5.5-6.5 s: 0.
title: "Acceleration is the slope of the velocity–time graph"
x: {label: "Time $t$ (s)", min: 0, max: 6.8}
y: {label: "Velocity $v$ (m/s)", min: -4.5, max: 10}
series:
  - label: "Velocity"
    points: [[0, 0], [2, 8], [3.5, 8], [4.5, 0], [5.5, -3], [6.5, -3]]
    color: blue
  - label: "v = 0"
    points: [[0, 0], [6.8, 0]]
    color: gray
    style: dotted
marks:
  - {x: 1, y: 4, text: "a = +4 m/s²", color: green, offset: [10, -4]}
  - {x: 2.75, y: 8, text: "a = 0", color: green, offset: [-18, 8]}
  - {x: 4, y: 4, text: "a = −8 m/s²", color: green, offset: [10, 0]}
  - {x: 5, y: -1.5, text: "a = −3 m/s² (speeding up)", color: green, offset: [-205, -10]}
legend: upper right
