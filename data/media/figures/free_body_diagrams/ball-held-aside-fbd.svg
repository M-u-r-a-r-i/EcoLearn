<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A hanging ball held 30 degrees from the vertical by a horizontal string, and its free-body diagram with tension, weight and the horizontal pull</title>
  <defs>
    <marker id="hr" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="150" y="30" font-size="16" font-weight="600" fill="#111827" text-anchor="middle">The set-up</text>
  <text x="480" y="30" font-size="16" font-weight="600" fill="#111827" text-anchor="middle">Free-body diagram of the ball</text>
  <line x1="320" y1="45" x2="320" y2="385" stroke="#d1d5db" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- set-up -->
  <rect x="50" y="50" width="160" height="12" fill="#92400e"/>
  <line x1="120" y1="62" x2="120" y2="240" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="120" y1="62" x2="210" y2="217" stroke="#374151" stroke-width="2"/>
  <path d="M 120 102 A 40 40 0 0 0 140 96.6" fill="none" stroke="#111827" stroke-width="1.5"/>
  <text x="124" y="124" font-size="13" fill="#111827">30°</text>
  <circle cx="210" cy="217" r="14" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1.5"/>
  <line x1="224" y1="217" x2="266" y2="217" stroke="#374151" stroke-width="2"/>
  <rect x="266" y="208" width="34" height="18" rx="3" fill="#e5e7eb" stroke="#374151"/>
  <text x="210" y="262" font-size="12" fill="#374151" text-anchor="middle">ball, m = 0.20 kg</text>
  <text x="283" y="246" font-size="12" fill="#374151" text-anchor="middle">spring</text>
  <text x="283" y="260" font-size="12" fill="#374151" text-anchor="middle">balance</text>
  <text x="30" y="320" font-size="13" fill="#4b5563">The ball is at rest, so the</text>
  <text x="30" y="338" font-size="13" fill="#4b5563">forces on it must add to zero.</text>

  <!-- FBD -->
  <line x1="470" y1="230" x2="412" y2="230" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="470" y1="230" x2="470" y2="130" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="412" y1="130" x2="412" y2="230" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="412" y1="130" x2="470" y2="130" stroke="#f3f4f6" stroke-width="1"/>
  <line x1="467" y1="225" x2="415" y2="135" stroke="#dc2626" stroke-width="4" marker-end="url(#hr)"/>
  <line x1="470" y1="236" x2="470" y2="330" stroke="#dc2626" stroke-width="4" marker-end="url(#hr)"/>
  <line x1="476" y1="230" x2="530" y2="230" stroke="#dc2626" stroke-width="4" marker-end="url(#hr)"/>
  <circle cx="470" cy="230" r="6" fill="#111827"/>
  <text x="418" y="178" font-size="15" fill="#dc2626" text-anchor="end">T</text>
  <text x="488" y="320" font-size="14" fill="#dc2626">W = mg</text>
  <text x="536" y="235" font-size="15" fill="#dc2626">F</text>
  <text x="478" y="150" font-size="12" fill="#6b7280">T cos 30°</text>
  <text x="400" y="250" font-size="12" fill="#6b7280">T sin 30°</text>
  <text x="480" y="362" font-size="13" fill="#111827" text-anchor="middle">Vertical: T cos 30° = W</text>
  <text x="480" y="380" font-size="13" fill="#111827" text-anchor="middle">Horizontal: T sin 30° = F</text>
</svg>
