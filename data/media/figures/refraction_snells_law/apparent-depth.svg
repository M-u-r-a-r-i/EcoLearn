<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">An object lying on the bottom of a tank of water. Two rays leave it and bend away from the normal as they leave the water. To an eye above, the rays seem to come from a point higher up, so the object looks less deep than it really is. The apparent depth is the real depth divided by the refractive index.</title>
  <defs>
    <marker id="ra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#ffffff"/>

  <rect x="120" y="150" width="400" height="200" fill="#dbeafe"/>
  <rect x="120" y="150" width="400" height="200" fill="none" stroke="#1d4ed8" stroke-width="3"/>
  <line x1="120" y1="150" x2="520" y2="150" stroke="#1d4ed8" stroke-width="4"/>
  <text x="140" y="140" font-size="14" fill="#334155" font-weight="700">air</text>
  <text x="140" y="176" font-size="14" fill="#1e40af" font-weight="700">water (n = 1.33)</text>

  <!-- normal at the exit point -->
  <line x1="360" y1="90" x2="360" y2="220" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="6 4"/>

  <!-- real object -->
  <ellipse cx="300" cy="350" rx="16" ry="5" fill="#111827"/>
  <text x="300" y="372" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="700">where the object really is</text>

  <!-- apparent object -->
  <ellipse cx="300" cy="300" rx="16" ry="5" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="290" y="292" font-size="13.5" fill="#7c3aed" text-anchor="end" font-weight="700">where it looks to be</text>

  <!-- ray 1: straight up, no bending -->
  <line x1="300" y1="350" x2="300" y2="80" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ra)"/>
  <!-- ray 2: bends away from the normal on leaving -->
  <line x1="300" y1="350" x2="360" y2="150" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="360" y1="150" x2="401.4" y2="50" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ra)"/>
  <!-- back-projection -->
  <line x1="360" y1="150" x2="298" y2="300" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5"/>

  <!-- depth markers -->
  <line x1="560" y1="150" x2="560" y2="350" stroke="#111827" stroke-width="2"/>
  <line x1="552" y1="150" x2="568" y2="150" stroke="#111827" stroke-width="2"/>
  <line x1="552" y1="350" x2="568" y2="350" stroke="#111827" stroke-width="2"/>
  <text x="576" y="256" font-size="13.5" fill="#111827" font-weight="700">real</text>
  <text x="576" y="274" font-size="13.5" fill="#111827" font-weight="700">depth</text>
  <line x1="530" y1="150" x2="530" y2="300" stroke="#7c3aed" stroke-width="2"/>
  <line x1="523" y1="300" x2="537" y2="300" stroke="#7c3aed" stroke-width="2"/>
  <text x="470" y="322" font-size="13.5" fill="#7c3aed" font-weight="700">apparent depth</text>

  <text x="420" y="96" font-size="14" fill="#2563eb" font-weight="700">to the eye above</text>

  <rect x="40" y="386" width="560" height="0.1" fill="#fff"/>
  <text x="320" y="404" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">apparent depth = real depth / n   (for a nearly vertical view)</text>
</svg>
