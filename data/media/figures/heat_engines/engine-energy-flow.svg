<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Energy flow in a heat engine: heat Q1 from a hot reservoir, work W out, heat Q2 rejected to a cold reservoir</title>
  <defs>
    <marker id="ao" viewBox="0 0 10 10" refX="3" refY="5" markerWidth="1.9" markerHeight="1.9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="3" refY="5" markerWidth="1.9" markerHeight="1.9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="3" refY="5" markerWidth="1.9" markerHeight="1.9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>

  <rect x="140" y="20" width="360" height="60" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="320" y="48" font-size="17" font-weight="700" fill="#7f1d1d" text-anchor="middle">Hot reservoir, temperature T₁</text>
  <text x="320" y="68" font-size="13" fill="#7f1d1d" text-anchor="middle">e.g. burning fuel</text>

  <rect x="140" y="320" width="360" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="320" y="348" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="middle">Cold reservoir, temperature T₂</text>
  <text x="320" y="368" font-size="13" fill="#1e3a8a" text-anchor="middle">e.g. the surrounding air</text>

  <circle cx="320" cy="200" r="55" fill="#f3f4f6" stroke="#374151" stroke-width="3"/>
  <text x="320" y="196" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Engine</text>
  <text x="320" y="216" font-size="12" fill="#374151" text-anchor="middle">working substance</text>
  <text x="320" y="232" font-size="12" fill="#374151" text-anchor="middle">in a cycle</text>

  <!-- Q1: widest arrow -->
  <line x1="320" y1="82" x2="320" y2="130" stroke="#ea580c" stroke-width="30" marker-end="url(#ao)"/>
  <text x="352" y="112" font-size="16" font-weight="700" fill="#ea580c">Q₁ (heat absorbed)</text>

  <!-- W out -->
  <line x1="377" y1="200" x2="530" y2="200" stroke="#16a34a" stroke-width="9" marker-end="url(#ag)"/>
  <text x="440" y="182" font-size="16" font-weight="700" fill="#16a34a">W</text>
  <text x="440" y="232" font-size="13" fill="#16a34a">useful work</text>

  <!-- Q2 -->
  <line x1="320" y1="257" x2="320" y2="290" stroke="#2563eb" stroke-width="21" marker-end="url(#ab)"/>
  <text x="352" y="288" font-size="16" font-weight="700" fill="#2563eb">Q₂ (heat rejected)</text>

  <text x="30" y="190" font-size="15" font-weight="700" fill="#111827">W = Q₁ − Q₂</text>
  <text x="30" y="216" font-size="15" font-weight="700" fill="#111827">η = W / Q₁</text>
  <text x="30" y="242" font-size="12" fill="#6b7280">arrow widths to scale</text>
  <text x="30" y="258" font-size="12" fill="#6b7280">for Q₁ = 50, W = 15, Q₂ = 35</text>
</svg>
