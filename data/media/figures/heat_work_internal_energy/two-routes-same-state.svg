<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Two routes from the same cool state to the same warm state, with different heat and work but the same change in internal energy</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>

  <!-- start state -->
  <rect x="250" y="20" width="140" height="70" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="320" y="50" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">State 1</text>
  <text x="320" y="72" font-size="11.5" fill="#1e3a8a" text-anchor="middle">cool, internal energy U₁</text>

  <!-- end state -->
  <rect x="250" y="300" width="140" height="70" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="320" y="330" font-size="15" font-weight="700" fill="#7f1d1d" text-anchor="middle">State 2</text>
  <text x="320" y="352" font-size="11.5" fill="#7f1d1d" text-anchor="middle">warm, internal energy U₂</text>

  <!-- route 1 -->
  <path d="M 250 70 Q 120 190 250 320" fill="none" stroke="#374151" stroke-width="3" marker-end="url(#ah)"/>
  <text x="30" y="150" font-size="15" font-weight="700" fill="#111827">Route 1: left in the sun</text>
  <text x="30" y="176" font-size="14" fill="#ea580c">heat in: Q = +60 J</text>
  <text x="30" y="198" font-size="14" fill="#374151">work: W = 0</text>
  <line x1="60" y1="225" x2="150" y2="225" stroke="#ea580c" stroke-width="4" marker-end="url(#aho)"/>
  <text x="60" y="246" font-size="12" fill="#ea580c">heat flows in</text>

  <!-- route 2 -->
  <path d="M 390 70 Q 520 190 390 320" fill="none" stroke="#374151" stroke-width="3" marker-end="url(#ah)"/>
  <text x="474" y="130" font-size="14" font-weight="700" fill="#111827">Route 2: rubbed hard</text>
  <text x="474" y="156" font-size="13" fill="#dc2626">work done on it: 80 J</text>
  <text x="474" y="178" font-size="13" fill="#ea580c">heat out to the air: 20 J</text>
  <line x1="470" y1="205" x2="540" y2="205" stroke="#dc2626" stroke-width="4" marker-end="url(#ahr)"/>
  <text x="548" y="210" font-size="12" fill="#dc2626">rubbing</text>
  <line x1="540" y1="235" x2="610" y2="235" stroke="#ea580c" stroke-width="4" marker-end="url(#aho)"/>
  <text x="470" y="240" font-size="12" fill="#ea580c">heat out</text>

  <!-- centre -->
  <text x="320" y="175" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Both routes:</text>
  <text x="320" y="200" font-size="16" font-weight="700" fill="#15803d" text-anchor="middle">ΔU = U₂ − U₁ = +60 J</text>
  <text x="320" y="224" font-size="13" fill="#374151" text-anchor="middle">heat and work differ;</text>
  <text x="320" y="242" font-size="13" fill="#374151" text-anchor="middle">the change in U does not</text>
</svg>
