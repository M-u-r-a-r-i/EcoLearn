<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A mass on a string moving in a vertical circle: forces at the top, side and bottom, and the minimum-speed conditions</title>
  <defs>
    <marker id="hr" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="hb" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  </defs>
  <rect width="640" height="440" fill="#ffffff"/>

  <circle cx="220" cy="220" r="140" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7 6"/>
  <circle cx="220" cy="220" r="4" fill="#111827"/>
  <text x="200" y="236" font-size="13" fill="#111827">O</text>
  <line x1="220" y1="220" x2="220" y2="92" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="220" y1="220" x2="348" y2="220" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="220" y1="220" x2="220" y2="348" stroke="#6b7280" stroke-width="1.5"/>
  <text x="258" y="212" font-size="13" fill="#4b5563">r</text>

  <!-- top -->
  <line x1="210" y1="88" x2="210" y2="146" stroke="#dc2626" stroke-width="3" marker-end="url(#hr)"/>
  <text x="180" y="130" font-size="13" fill="#dc2626" font-weight="600">T</text>
  <line x1="232" y1="88" x2="232" y2="130" stroke="#dc2626" stroke-width="3" marker-end="url(#hr)"/>
  <text x="240" y="130" font-size="13" fill="#dc2626" font-weight="600">mg</text>
  <line x1="208" y1="66" x2="146" y2="66" stroke="#2563eb" stroke-width="3" marker-end="url(#hb)"/>
  <text x="140" y="56" font-size="13" fill="#2563eb" font-weight="600">v (top)</text>
  <circle cx="220" cy="80" r="11" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1.5"/>

  <!-- side -->
  <line x1="350" y1="220" x2="296" y2="220" stroke="#dc2626" stroke-width="3" marker-end="url(#hr)"/>
  <text x="300" y="210" font-size="13" fill="#dc2626" font-weight="600">T</text>
  <line x1="360" y1="232" x2="360" y2="276" stroke="#dc2626" stroke-width="3" marker-end="url(#hr)"/>
  <text x="368" y="270" font-size="13" fill="#dc2626" font-weight="600">mg</text>
  <line x1="378" y1="214" x2="378" y2="164" stroke="#2563eb" stroke-width="3" marker-end="url(#hb)"/>
  <text x="386" y="180" font-size="13" fill="#2563eb" font-weight="600">v</text>
  <circle cx="360" cy="220" r="11" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1.5"/>

  <!-- bottom -->
  <line x1="220" y1="350" x2="220" y2="266" stroke="#dc2626" stroke-width="3" marker-end="url(#hr)"/>
  <text x="228" y="290" font-size="13" fill="#dc2626" font-weight="600">T (large)</text>
  <line x1="220" y1="370" x2="220" y2="412" stroke="#dc2626" stroke-width="3" marker-end="url(#hr)"/>
  <text x="228" y="408" font-size="13" fill="#dc2626" font-weight="600">mg</text>
  <line x1="236" y1="380" x2="316" y2="380" stroke="#2563eb" stroke-width="3" marker-end="url(#hb)"/>
  <text x="258" y="372" font-size="13" fill="#2563eb" font-weight="600">v (bottom)</text>
  <circle cx="220" cy="360" r="11" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1.5"/>

  <!-- conditions -->
  <rect x="420" y="40" width="205" height="360" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="434" y="68" font-size="14" fill="#111827" font-weight="700">At the top</text>
  <text x="434" y="92" font-size="14" fill="#111827">T + mg = mv²/r</text>
  <text x="434" y="116" font-size="13" fill="#4b5563">String stays taut if T ≥ 0:</text>
  <text x="434" y="140" font-size="14" fill="#111827" font-weight="600">v_top ≥ √(g r)</text>
  <text x="434" y="182" font-size="14" fill="#111827" font-weight="700">At the bottom</text>
  <text x="434" y="206" font-size="14" fill="#111827">T − mg = mv²/r</text>
  <text x="434" y="248" font-size="14" fill="#111827" font-weight="700">Energy, top to bottom</text>
  <text x="434" y="272" font-size="14" fill="#111827">v_b² = v_top² + 4g r</text>
  <text x="434" y="296" font-size="13" fill="#4b5563">(the drop is 2r)</text>
  <text x="434" y="330" font-size="14" fill="#111827" font-weight="600">So v_bottom ≥ √(5g r)</text>
  <text x="434" y="370" font-size="12" fill="#4b5563">Arrows are forces (red) and</text>
  <text x="434" y="386" font-size="12" fill="#4b5563">velocity (blue); motion is anticlockwise.</text>
</svg>
