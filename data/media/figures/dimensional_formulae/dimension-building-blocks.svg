<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A ladder of quantities: velocity, acceleration, force, energy and power, each built from the one before, with its dimensional formula in M, L and T</title>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="20" y="34" font-size="18" font-weight="700" fill="#111827">Building dimensions from M, L and T</text>
  <text x="20" y="58" font-size="14" fill="#374151">Each quantity is made from the one above it.</text>

  <g fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5">
    <rect x="16" y="74" width="608" height="50" rx="6"/>
    <rect x="16" y="134" width="608" height="50" rx="6"/>
    <rect x="16" y="194" width="608" height="50" rx="6"/>
    <rect x="16" y="254" width="608" height="50" rx="6"/>
    <rect x="16" y="314" width="608" height="50" rx="6"/>
  </g>
  <g stroke="#9ca3af" stroke-width="2" marker-end="url(#head)">
    <line x1="190" y1="118" x2="190" y2="140"/>
    <line x1="190" y1="178" x2="190" y2="200"/>
    <line x1="190" y1="238" x2="190" y2="260"/>
    <line x1="190" y1="298" x2="190" y2="320"/>
  </g>

  <g font-size="17" font-weight="700" fill="#111827">
    <text x="32" y="105">velocity</text>
    <text x="32" y="165">acceleration</text>
    <text x="32" y="225">force</text>
    <text x="32" y="285">work, energy</text>
    <text x="32" y="345">power</text>
  </g>
  <g font-size="15" fill="#374151">
    <text x="210" y="105">displacement ÷ time</text>
    <text x="210" y="165">velocity ÷ time</text>
    <text x="210" y="225">mass × acceleration</text>
    <text x="210" y="285">force × displacement</text>
    <text x="210" y="345">work ÷ time</text>
  </g>
  <g font-size="21" font-weight="700">
    <text x="460" y="106">[<tspan fill="#2563eb">L</tspan> <tspan fill="#16a34a">T⁻¹</tspan>]</text>
    <text x="460" y="166">[<tspan fill="#2563eb">L</tspan> <tspan fill="#16a34a">T⁻²</tspan>]</text>
    <text x="460" y="226">[<tspan fill="#ea580c">M</tspan> <tspan fill="#2563eb">L</tspan> <tspan fill="#16a34a">T⁻²</tspan>]</text>
    <text x="460" y="286">[<tspan fill="#ea580c">M</tspan> <tspan fill="#2563eb">L²</tspan> <tspan fill="#16a34a">T⁻²</tspan>]</text>
    <text x="460" y="346">[<tspan fill="#ea580c">M</tspan> <tspan fill="#2563eb">L²</tspan> <tspan fill="#16a34a">T⁻³</tspan>]</text>
  </g>
  <text x="20" y="390" font-size="13" fill="#374151"><tspan fill="#ea580c" font-weight="700">M</tspan> mass<tspan dx="14" fill="#2563eb" font-weight="700">L</tspan> length<tspan dx="14" fill="#16a34a" font-weight="700">T</tspan> time<tspan dx="18">Pure numbers such as ½ carry no dimensions.</tspan></text>
</svg>
