<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">The same two points P and Q described from two different origins and positive directions</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>

  <!-- Frame 1 -->
  <text x="20" y="34" font-size="16" font-weight="700" fill="#111827">Choice 1: origin O, positive to the right</text>
  <line x1="50" y1="120" x2="600" y2="120" stroke="#111827" stroke-width="2" marker-end="url(#ah)"/>
  <text x="604" y="112" font-size="15" font-weight="700" fill="#111827" text-anchor="end">+x</text>
  <g stroke="#111827" stroke-width="2">
    <line x1="70" y1="113" x2="70" y2="127"/><line x1="120" y1="113" x2="120" y2="127"/>
    <line x1="170" y1="113" x2="170" y2="127"/><line x1="220" y1="113" x2="220" y2="127"/>
    <line x1="270" y1="108" x2="270" y2="132"/><line x1="320" y1="113" x2="320" y2="127"/>
    <line x1="370" y1="113" x2="370" y2="127"/><line x1="420" y1="113" x2="420" y2="127"/>
    <line x1="470" y1="113" x2="470" y2="127"/><line x1="520" y1="113" x2="520" y2="127"/>
    <line x1="570" y1="113" x2="570" y2="127"/>
  </g>
  <g font-size="13" fill="#374151" text-anchor="middle">
    <text x="70" y="148">−4</text><text x="120" y="148">−3</text><text x="170" y="148">−2</text>
    <text x="220" y="148">−1</text><text x="270" y="148" font-weight="700" fill="#111827">0</text><text x="320" y="148">1</text>
    <text x="370" y="148">2</text><text x="420" y="148">3</text><text x="470" y="148">4</text>
    <text x="520" y="148">5</text><text x="570" y="148">6</text>
  </g>
  <text x="590" y="148" font-size="13" fill="#374151">m</text>
  <text x="270" y="96" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">O</text>
  <circle cx="470" cy="120" r="8" fill="#7c3aed"/>
  <circle cx="120" cy="120" r="8" fill="#ea580c"/>
  <text x="470" y="90" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="middle">P: x = +4 m</text>
  <text x="120" y="90" font-size="15" font-weight="700" fill="#ea580c" text-anchor="middle">Q: x = −3 m</text>

  <!-- Frame 2 -->
  <text x="20" y="214" font-size="16" font-weight="700" fill="#111827">Choice 2: origin O′, positive to the left</text>
  <line x1="600" y1="300" x2="40" y2="300" stroke="#111827" stroke-width="2" marker-end="url(#ah)"/>
  <text x="36" y="292" font-size="15" font-weight="700" fill="#111827">+x′</text>
  <g stroke="#111827" stroke-width="2">
    <line x1="570" y1="288" x2="570" y2="312"/><line x1="520" y1="293" x2="520" y2="307"/>
    <line x1="470" y1="293" x2="470" y2="307"/><line x1="420" y1="293" x2="420" y2="307"/>
    <line x1="370" y1="293" x2="370" y2="307"/><line x1="320" y1="293" x2="320" y2="307"/>
    <line x1="270" y1="293" x2="270" y2="307"/><line x1="220" y1="293" x2="220" y2="307"/>
    <line x1="170" y1="293" x2="170" y2="307"/><line x1="120" y1="293" x2="120" y2="307"/>
  </g>
  <g font-size="13" fill="#374151" text-anchor="middle">
    <text x="570" y="328" font-weight="700" fill="#111827">0</text><text x="520" y="328">1</text><text x="470" y="328">2</text>
    <text x="420" y="328">3</text><text x="370" y="328">4</text><text x="320" y="328">5</text>
    <text x="270" y="328">6</text><text x="220" y="328">7</text><text x="170" y="328">8</text>
    <text x="120" y="328">9</text>
  </g>
  <text x="570" y="276" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">O′</text>
  <circle cx="470" cy="300" r="8" fill="#7c3aed"/>
  <circle cx="120" cy="300" r="8" fill="#ea580c"/>
  <text x="440" y="270" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="middle">P: x′ = +2 m</text>
  <text x="120" y="270" font-size="15" font-weight="700" fill="#ea580c" text-anchor="middle">Q: x′ = +9 m</text>

  <text x="320" y="376" font-size="14" fill="#374151" text-anchor="middle">Same points, same places — different numbers, because the origin and the positive direction changed.</text>
</svg>
