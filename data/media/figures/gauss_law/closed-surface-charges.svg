<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A closed surface contains a +3.0 nC and a −1.0 nC charge; a +5.0 nC charge sits outside. A field line from the outside charge enters the surface and leaves it again, adding nothing to the net flux. The net flux equals the enclosed charge, +2.0 nC, divided by epsilon-nought.</title>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>

  <!-- closed surface -->
  <path d="M 120 190 C 110 90, 260 50, 340 80 C 420 110, 440 170, 420 240 C 400 310, 250 330, 180 300 C 130 280, 124 240, 120 190 z" fill="#ecfeff" stroke="#0e7490" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="100" y="345" font-size="14" fill="#0e7490" font-weight="700">closed (Gaussian) surface</text>

  <!-- field line from the outside charge passing through: enters on right, leaves on left-bottom -->
  <path d="M 500 150 C 440 170, 380 200, 300 230 C 240 252, 160 280, 90 300" fill="none" stroke="#475569" stroke-width="2"/>
  <path d="M 90 300 l 12 -9 l 1 10 z" fill="#475569"/>
  <text x="440" y="198" font-size="13" fill="#475569">in (−)</text>
  <text x="130" y="272" font-size="13" fill="#475569" text-anchor="end">out (+)</text>

  <!-- charges inside -->
  <circle cx="220" cy="150" r="16" fill="#dc2626"/><text x="220" y="157" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">+</text>
  <text x="220" y="186" font-size="14" fill="#111827" text-anchor="middle" font-weight="600">+3.0 nC</text>
  <circle cx="330" cy="140" r="16" fill="#2563eb"/><text x="330" y="147" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">−</text>
  <text x="330" y="176" font-size="14" fill="#111827" text-anchor="middle" font-weight="600">−1.0 nC</text>

  <!-- charge outside -->
  <circle cx="520" cy="140" r="16" fill="#dc2626"/><text x="520" y="147" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">+</text>
  <text x="520" y="118" font-size="14" fill="#111827" text-anchor="middle" font-weight="600">+5.0 nC (outside)</text>

  <rect x="310" y="330" width="310" height="54" rx="8" fill="#f1f5f9"/>
  <text x="465" y="352" font-size="14.5" fill="#111827" text-anchor="middle">Φ = q(enclosed) / ε₀</text>
  <text x="465" y="374" font-size="14.5" fill="#111827" text-anchor="middle" font-weight="700">= (+3.0 − 1.0) nC / ε₀ = 2.0 nC / ε₀</text>
</svg>
