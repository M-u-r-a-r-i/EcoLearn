<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Left: a concave mirror with the object beyond the centre of curvature. A ray parallel to the axis reflects through the focus and a ray through the focus reflects parallel; they cross between the focus and the centre of curvature, forming a real, inverted, smaller image. Right: a convex mirror. The reflected rays diverge and their dashed back-projections meet behind the mirror, forming a virtual, erect, smaller image.</title>
  <defs>
    <marker id="ob" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
    <marker id="im" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="700" height="420" fill="#ffffff"/>

  <text x="180" y="26" font-size="15.5" font-weight="700" fill="#111827" text-anchor="middle">Concave mirror, object beyond C</text>
  <text x="520" y="26" font-size="15.5" font-weight="700" fill="#111827" text-anchor="middle">Convex mirror, object anywhere</text>

  <!-- ============ concave ============ -->
  <line x1="60" y1="200" x2="360" y2="200" stroke="#9ca3af" stroke-width="2"/>
  <path d="M 318.3 140 A 160 160 0 0 1 318.3 260" fill="none" stroke="#111827" stroke-width="5"/>

  <!-- object -->
  <line x1="110" y1="200" x2="110" y2="142" stroke="#111827" stroke-width="3" marker-end="url(#ob)"/>
  <text x="110" y="218" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">object</text>

  <!-- ray 1: parallel then through F -->
  <line x1="110" y1="140" x2="318.3" y2="140" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="318.3" y1="140" x2="188" y2="247.5" stroke="#dc2626" stroke-width="2.5"/>
  <!-- ray 2: through F then parallel -->
  <line x1="110" y1="140" x2="326.3" y2="234.3" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="326.3" y1="234.3" x2="188" y2="234.3" stroke="#dc2626" stroke-width="2.5"/>

  <!-- image -->
  <line x1="204.3" y1="200" x2="204.3" y2="232" stroke="#7c3aed" stroke-width="3.5" marker-end="url(#im)"/>
  <text x="250" y="300" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">real, inverted, smaller</text>

  <circle cx="170" cy="200" r="4.5" fill="#111827"/>
  <text x="170" y="190" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">C</text>
  <circle cx="250" cy="200" r="4.5" fill="#111827"/>
  <text x="252" y="190" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">F</text>
  <circle cx="330" cy="200" r="4.5" fill="#111827"/>
  <text x="340" y="196" font-size="14" font-weight="700" fill="#111827">P</text>

  <text x="60" y="128" font-size="12.5" fill="#2563eb" font-weight="700">parallel in → through F</text>
  <text x="60" y="278" font-size="12.5" fill="#2563eb" font-weight="700">through F in → parallel out</text>

  <!-- ============ convex ============ -->
  <line x1="380" y1="200" x2="660" y2="200" stroke="#9ca3af" stroke-width="2"/>
  <path d="M 441.7 140 A 160 160 0 0 0 441.7 260" fill="none" stroke="#111827" stroke-width="5"/>

  <line x1="370" y1="200" x2="370" y2="152" stroke="#111827" stroke-width="3" marker-end="url(#ob)"/>
  <text x="370" y="218" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">object</text>

  <!-- ray 1 parallel, reflects as if from F -->
  <line x1="370" y1="150" x2="438" y2="150" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="438" y1="150" x2="384" y2="112.5" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="438" y1="150" x2="510" y2="200" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="7 5"/>
  <!-- ray 2 aimed at C, reflects straight back -->
  <line x1="370" y1="150" x2="434.2" y2="164.6" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="434.2" y1="164.6" x2="388" y2="154" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="434.2" y1="164.6" x2="590" y2="200" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="7 5"/>

  <line x1="464.3" y1="200" x2="464.3" y2="173" stroke="#7c3aed" stroke-width="3.5" marker-end="url(#im)"/>
  <text x="565" y="252" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">virtual, erect, smaller</text>
  <text x="565" y="270" font-size="12.5" fill="#6b7280" text-anchor="middle">(always, for a convex mirror)</text>

  <circle cx="430" cy="200" r="4.5" fill="#111827"/>
  <text x="418" y="192" font-size="14" font-weight="700" fill="#111827">P</text>
  <circle cx="510" cy="200" r="4.5" fill="#111827"/>
  <text x="510" y="190" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">F</text>
  <circle cx="590" cy="200" r="4.5" fill="#111827"/>
  <text x="590" y="190" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">C</text>
  

  <rect x="60" y="340" width="580" height="60" rx="8" fill="#f1f5f9"/>
  <text x="230" y="364" font-size="15" fill="#111827" text-anchor="middle" font-weight="700">1/v + 1/u = 1/f</text>
  <text x="470" y="364" font-size="15" fill="#111827" text-anchor="middle" font-weight="700">m = h′/h = −v/u</text>
  <text x="350" y="388" font-size="13.5" fill="#111827" text-anchor="middle">All distances from the pole, with signs. A negative m means an inverted, real image.</text>
</svg>
