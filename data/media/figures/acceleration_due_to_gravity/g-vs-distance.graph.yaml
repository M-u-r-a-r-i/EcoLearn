# g as a fraction of its surface value, against distance from Earth's centre in Earth radii.
# Inside (uniform-density model): g/g0 = r/R (straight line). Outside: g/g0 = (R/r)^2.
# Check: r = 2R -> 0.25; r = 3R -> 0.111; r = 4R -> 0.0625; r = 0.5R -> 0.5.
title: "How g changes with distance from Earth's centre"
x: {label: "Distance from Earth's centre, $r/R$", min: 0, max: 4.1}
y: {label: "$g$ / ($g$ at the surface)", min: 0, max: 1.15}
legend: below
series:
  - label: 'inside (uniform Earth): $g \propto r$'
    points: [[0, 0], [0.25, 0.25], [0.5, 0.5], [0.75, 0.75], [1.0, 1.0]]
    color: orange
  - label: 'outside: $g \propto 1/r^2$'
    points: [[1.0, 1.0], [1.1, 0.826], [1.2, 0.694], [1.3, 0.592], [1.4, 0.510], [1.5, 0.444],
             [1.6, 0.391], [1.8, 0.309], [2.0, 0.25], [2.2, 0.207], [2.5, 0.16], [2.8, 0.128],
             [3.0, 0.111], [3.3, 0.0918], [3.6, 0.0772], [4.0, 0.0625]]
    color: blue
marks:
  - {x: 1.0, y: 1.0, text: "surface: largest g", color: gray, offset: [10, 4]}
  - {x: 2.0, y: 0.25, text: "one radius up: g/4", color: blue, offset: [10, 8]}
  - {x: 0.5, y: 0.5, text: "halfway down: g/2", color: orange, offset: [14, -52]}
