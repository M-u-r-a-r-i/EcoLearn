<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Two panels comparing diffraction through the same opening. On the left the wavelength is far smaller than the gap and the wave passes straight through with a sharp shadow. On the right the wavelength is about the size of the gap and the wave fans out in circular arcs beyond it.</title>
  <rect width="720" height="400" fill="#ffffff"/>

  <text x="360" y="28" font-size="16" text-anchor="middle" fill="#111827" font-weight="700">The same opening. Only the wavelength is different.</text>

  <line x1="360" y1="48" x2="360" y2="392" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- LEFT: short wavelength -->
  <text x="180" y="64" font-size="14" text-anchor="middle" fill="#1e3a8a" font-weight="700">&#955; much smaller than the gap</text>
  <g stroke="#2563eb" stroke-width="2">
    <line x1="40" y1="100" x2="40" y2="340"/><line x1="48" y1="100" x2="48" y2="340"/>
    <line x1="56" y1="100" x2="56" y2="340"/><line x1="64" y1="100" x2="64" y2="340"/>
    <line x1="72" y1="100" x2="72" y2="340"/><line x1="80" y1="100" x2="80" y2="340"/>
    <line x1="88" y1="100" x2="88" y2="340"/><line x1="96" y1="100" x2="96" y2="340"/>
    <line x1="104" y1="100" x2="104" y2="340"/><line x1="112" y1="100" x2="112" y2="340"/>
    <line x1="120" y1="100" x2="120" y2="340"/><line x1="128" y1="100" x2="128" y2="340"/>
    <line x1="136" y1="100" x2="136" y2="340"/><line x1="144" y1="100" x2="144" y2="340"/>
    <line x1="152" y1="100" x2="152" y2="340"/><line x1="160" y1="100" x2="160" y2="340"/>
  </g>
  <rect x="172" y="95" width="12" height="95" fill="#374151"/>
  <rect x="172" y="250" width="12" height="95" fill="#374151"/>
  <g stroke="#2563eb" stroke-width="2">
    <line x1="196" y1="192" x2="196" y2="248"/><line x1="204" y1="192" x2="204" y2="248"/>
    <line x1="212" y1="192" x2="212" y2="248"/><line x1="220" y1="192" x2="220" y2="248"/>
    <line x1="228" y1="192" x2="228" y2="248"/><line x1="236" y1="192" x2="236" y2="248"/>
    <line x1="244" y1="192" x2="244" y2="248"/><line x1="252" y1="192" x2="252" y2="248"/>
    <line x1="260" y1="192" x2="260" y2="248"/><line x1="268" y1="192" x2="268" y2="248"/>
    <line x1="276" y1="192" x2="276" y2="248"/><line x1="284" y1="192" x2="284" y2="248"/>
    <line x1="292" y1="192" x2="292" y2="248"/><line x1="300" y1="192" x2="300" y2="248"/>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5">
    <line x1="190" y1="190" x2="330" y2="190"/>
    <line x1="190" y1="250" x2="330" y2="250"/>
  </g>
  <text x="180" y="368" font-size="13" text-anchor="middle" fill="#374151" font-weight="700">straight through, with a sharp shadow</text>
  <text x="180" y="386" font-size="12" text-anchor="middle" fill="#6b7280">you would never guess it was a wave</text>

  <!-- RIGHT: comparable wavelength -->
  <text x="540" y="64" font-size="14" text-anchor="middle" fill="#1e3a8a" font-weight="700">&#955; about the size of the gap</text>
  <g stroke="#2563eb" stroke-width="2.5">
    <line x1="390" y1="100" x2="390" y2="340"/>
    <line x1="440" y1="100" x2="440" y2="340"/>
    <line x1="490" y1="100" x2="490" y2="340"/>
  </g>
  <rect x="520" y="95" width="12" height="95" fill="#374151"/>
  <rect x="520" y="250" width="12" height="95" fill="#374151"/>
  <g fill="none" stroke="#2563eb" stroke-width="2.5">
    <path d="M554.5 181.0 A 45 45 0 0 1 554.5 259.0"/>
    <path d="M577.0 142.1 A 90 90 0 0 1 577.0 297.9"/>
    <path d="M599.5 103.1 A 135 135 0 0 1 599.5 336.9"/>
  </g>
  <text x="540" y="368" font-size="13" text-anchor="middle" fill="#374151" font-weight="700">the wave fans out behind the opening</text>
  <text x="540" y="386" font-size="12" text-anchor="middle" fill="#6b7280">now the wave nature is impossible to miss</text>
</svg>
