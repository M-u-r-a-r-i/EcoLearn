<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Relative velocity: an object A moving down and an observer B moving right; B sees A moving down and backwards, found by adding minus v_B to v_A</title>
  <defs><marker id="hblue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="hred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="hgreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="horange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="hpurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="hteal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker><marker id="hgray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="hdark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker></defs>
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="20.0" y="30.0" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Relative velocity: v<tspan baseline-shift="sub" font-size="12">AB</tspan> = v<tspan baseline-shift="sub" font-size="12">A</tspan> − v<tspan baseline-shift="sub" font-size="12">B</tspan></text>
  <line x1="300" y1="50" x2="300" y2="380" stroke="#e5e7eb" stroke-width="2"/>
  <text x="30.0" y="70.0" font-size="15" fill="#111827" font-weight="600" text-anchor="start">Seen from the ground</text>
  <circle cx="90" cy="120" r="7" fill="#111827"/>
  <line x1="90.0" y1="128.0" x2="90.0" y2="270.0" stroke="#2563eb" stroke-width="4" marker-end="url(#hblue)"/>
  <text x="102.0" y="200.0" font-size="16" fill="#2563eb" font-weight="700" text-anchor="start">v<tspan baseline-shift="sub" font-size="11">A</tspan></text>
  <text x="102.0" y="220.0" font-size="12" fill="#2563eb" font-weight="400" text-anchor="start">(A moves down)</text>
  <circle cx="60" cy="320" r="7" fill="#111827"/>
  <line x1="68.0" y1="320.0" x2="200.0" y2="320.0" stroke="#0891b2" stroke-width="4" marker-end="url(#hteal)"/>
  <text x="130.0" y="308.0" font-size="16" fill="#0891b2" font-weight="700" text-anchor="middle">v<tspan baseline-shift="sub" font-size="11">B</tspan></text>
  <text x="40.0" y="348.0" font-size="12" fill="#0891b2" font-weight="400" text-anchor="start">(observer B moves right)</text>
  <text x="320.0" y="70.0" font-size="15" fill="#111827" font-weight="600" text-anchor="start">Seen by B: v<tspan baseline-shift="sub" font-size="10">A</tspan> + (−v<tspan baseline-shift="sub" font-size="10">B</tspan>)</text>
  <line x1="520.0" y1="100.0" x2="520.0" y2="258.0" stroke="#2563eb" stroke-width="4" marker-end="url(#hblue)"/>
  <text x="530.0" y="190.0" font-size="16" fill="#2563eb" font-weight="700" text-anchor="start">v<tspan baseline-shift="sub" font-size="11">A</tspan></text>
  <line x1="520.0" y1="260.0" x2="402.0" y2="260.0" stroke="#0891b2" stroke-width="4" stroke-dasharray="8 5" marker-end="url(#hteal)"/>
  <text x="460.0" y="285.0" font-size="16" fill="#0891b2" font-weight="700" text-anchor="middle">−v<tspan baseline-shift="sub" font-size="11">B</tspan></text>
  <line x1="520.0" y1="100.0" x2="400.0" y2="260.0" stroke="#7c3aed" stroke-width="5" marker-end="url(#hpurple)"/>
  <text x="448.0" y="160.0" font-size="17" fill="#7c3aed" font-weight="700" text-anchor="end">v<tspan baseline-shift="sub" font-size="12">AB</tspan></text>
  <text x="320.0" y="330.0" font-size="13" fill="#111827" font-weight="400" text-anchor="start">B sees A slanting towards it from ahead,</text>
  <text x="320.0" y="348.0" font-size="13" fill="#111827" font-weight="400" text-anchor="start">and faster than A moves over the ground.</text>
  <text x="320.0" y="366.0" font-size="13" fill="#111827" font-weight="400" text-anchor="start">At 90°: |v<tspan baseline-shift="sub" font-size="9">AB</tspan>| = √(v<tspan baseline-shift="sub" font-size="9">A²</tspan> + v<tspan baseline-shift="sub" font-size="9">B²</tspan>).</text>
</svg>
