<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Reading a millimetre scale: 7.46 cm, where 7.4 is certain and the final 6 is estimated</title>
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="20" y="32" font-size="18" font-weight="700" fill="#111827">Reading a scale: certain digits + one estimated digit</text>

  <!-- the object being measured: its right edge sits at 7.46 cm -->
  <rect x="20" y="128" width="281" height="48" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
  <text x="40" y="158" font-size="15" fill="#334155">object</text>
  <line x1="301" y1="104" x2="301" y2="232" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="309" y="100" font-size="15" font-weight="700" fill="#dc2626">edge here</text>

  <!-- ruler: 7.0 cm at x=80, 8.0 cm at x=560, 48 px per mm -->
  <rect x="20" y="180" width="600" height="72" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <g stroke="#111827" stroke-width="2">
    <line x1="80" y1="180" x2="80" y2="222"/>
    <line x1="560" y1="180" x2="560" y2="222"/>
    <line x1="320" y1="180" x2="320" y2="210"/>
  </g>
  <g stroke="#111827" stroke-width="1.5">
    <line x1="32" y1="180" x2="32" y2="200"/>
    <line x1="128" y1="180" x2="128" y2="200"/><line x1="176" y1="180" x2="176" y2="200"/>
    <line x1="224" y1="180" x2="224" y2="200"/><line x1="272" y1="180" x2="272" y2="200"/>
    <line x1="368" y1="180" x2="368" y2="200"/><line x1="416" y1="180" x2="416" y2="200"/>
    <line x1="464" y1="180" x2="464" y2="200"/><line x1="512" y1="180" x2="512" y2="200"/>
    <line x1="608" y1="180" x2="608" y2="200"/>
  </g>
  <g font-size="18" font-weight="700" fill="#111827" text-anchor="middle">
    <text x="80" y="244">7</text>
    <text x="560" y="244">8</text>
  </g>
  <text x="600" y="244" font-size="13" fill="#374151" text-anchor="end">cm</text>
  <text x="320" y="244" font-size="12" fill="#6b7280" text-anchor="middle">1 small mark = 1 mm</text>

  <!-- the reading, colour coded -->
  <text x="320" y="318" font-size="40" font-weight="700" text-anchor="middle"><tspan fill="#16a34a">7.4</tspan><tspan fill="#ea580c">6</tspan><tspan fill="#111827"> cm</tspan></text>
  <text x="282" y="350" font-size="14" font-weight="700" fill="#16a34a" text-anchor="end">certain (from marks)</text>
  <text x="304" y="350" font-size="14" font-weight="700" fill="#ea580c">estimated (between marks)</text>

  <text x="320" y="386" font-size="14" fill="#374151" text-anchor="middle">Significant figures = all certain digits + the first uncertain digit: 3 here.</text>
</svg>
