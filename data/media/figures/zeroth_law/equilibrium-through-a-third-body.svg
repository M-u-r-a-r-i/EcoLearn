<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">The zeroth law in three steps: A with C, B with C, then A with B</title>
  <rect width="640" height="400" fill="#ffffff"/>

  <!-- step 1 -->
  <text x="110" y="40" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Step 1</text>
  <rect x="40" y="70" width="70" height="90" rx="8" fill="#fecaca" stroke="#991b1b" stroke-width="2"/>
  <text x="75" y="122" font-size="26" font-weight="700" fill="#7f1d1d" text-anchor="middle">A</text>
  <rect x="112" y="70" width="70" height="90" rx="8" fill="#e0e7ff" stroke="#3730a3" stroke-width="2"/>
  <text x="147" y="122" font-size="26" font-weight="700" fill="#312e81" text-anchor="middle">C</text>
  <text x="110" y="190" font-size="14" fill="#111827" text-anchor="middle">A and C in contact:</text>
  <text x="110" y="208" font-size="14" fill="#111827" text-anchor="middle">no net heat flow</text>

  <!-- step 2 -->
  <text x="320" y="40" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Step 2</text>
  <rect x="250" y="70" width="70" height="90" rx="8" fill="#bbf7d0" stroke="#166534" stroke-width="2"/>
  <text x="285" y="122" font-size="26" font-weight="700" fill="#14532d" text-anchor="middle">B</text>
  <rect x="322" y="70" width="70" height="90" rx="8" fill="#e0e7ff" stroke="#3730a3" stroke-width="2"/>
  <text x="357" y="122" font-size="26" font-weight="700" fill="#312e81" text-anchor="middle">C</text>
  <text x="320" y="190" font-size="14" fill="#111827" text-anchor="middle">B and C in contact:</text>
  <text x="320" y="208" font-size="14" fill="#111827" text-anchor="middle">no net heat flow</text>

  <!-- step 3 -->
  <text x="530" y="40" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Step 3</text>
  <rect x="460" y="70" width="70" height="90" rx="8" fill="#fecaca" stroke="#991b1b" stroke-width="2"/>
  <text x="495" y="122" font-size="26" font-weight="700" fill="#7f1d1d" text-anchor="middle">A</text>
  <rect x="532" y="70" width="70" height="90" rx="8" fill="#bbf7d0" stroke="#166534" stroke-width="2"/>
  <text x="567" y="122" font-size="26" font-weight="700" fill="#14532d" text-anchor="middle">B</text>
  <text x="530" y="190" font-size="14" fill="#111827" text-anchor="middle">Now put A and B together:</text>
  <text x="530" y="208" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">still no net heat flow</text>

  <!-- conclusion -->
  <rect x="40" y="250" width="562" height="116" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="321" y="282" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Zeroth law: A and B are each in equilibrium with C,</text>
  <text x="321" y="304" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">so they are in equilibrium with each other.</text>
  <text x="321" y="334" font-size="14" fill="#374151" text-anchor="middle">The property they all share is temperature. If C is a thermometer,</text>
  <text x="321" y="354" font-size="14" fill="#374151" text-anchor="middle">equal readings on A and B mean A and B are at the same temperature.</text>
</svg>
