<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A metre bridge: a one metre uniform wire with a metre scale, a known resistance in the left gap, an unknown in the right gap, a jockey touching the wire at the balance point and a galvanometer reading zero</title>
  <defs>
    <marker id="m-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#ffffff"/>

  <text x="320" y="30" font-size="17" text-anchor="middle" fill="#111827" font-weight="700">A metre bridge is a Wheatstone bridge with two arms made of wire</text>

  <!-- gaps: thick copper strips -->
  <rect x="60" y="80" width="80" height="26" rx="4" fill="#fed7aa" stroke="#b45309" stroke-width="2"/>
  <rect x="280" y="80" width="80" height="26" rx="4" fill="#fed7aa" stroke="#b45309" stroke-width="2"/>
  <rect x="500" y="80" width="80" height="26" rx="4" fill="#fed7aa" stroke="#b45309" stroke-width="2"/>

  <!-- resistance boxes in the gaps -->
  <rect x="150" y="70" width="120" height="46" rx="6" fill="#ffffff" stroke="#111827" stroke-width="3"/>
  <text x="210" y="100" font-size="17" text-anchor="middle" fill="#111827" font-weight="700">R (known)</text>
  <rect x="370" y="70" width="120" height="46" rx="6" fill="#ffffff" stroke="#111827" stroke-width="3"/>
  <text x="430" y="100" font-size="17" text-anchor="middle" fill="#111827" font-weight="700">S (unknown)</text>
  <text x="210" y="60" font-size="13" text-anchor="middle" fill="#6b7280">left gap</text>
  <text x="430" y="60" font-size="13" text-anchor="middle" fill="#6b7280">right gap</text>

  <!-- the one-metre wire -->
  <line x1="100" y1="240" x2="540" y2="240" stroke="#9a3412" stroke-width="5"/>
  <line x1="100" y1="106" x2="100" y2="240" stroke="#111827" stroke-width="3"/>
  <line x1="320" y1="106" x2="320" y2="150" stroke="#111827" stroke-width="3"/>
  <line x1="540" y1="106" x2="540" y2="240" stroke="#111827" stroke-width="3"/>

  <!-- scale -->
  <rect x="100" y="252" width="440" height="24" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <g stroke="#6b7280" stroke-width="1.5">
    <line x1="100" y1="252" x2="100" y2="276"/><line x1="188" y1="252" x2="188" y2="270"/>
    <line x1="276" y1="252" x2="276" y2="270"/><line x1="364" y1="252" x2="364" y2="270"/>
    <line x1="452" y1="252" x2="452" y2="270"/><line x1="540" y1="252" x2="540" y2="276"/>
  </g>
  <text x="100" y="292" font-size="12" text-anchor="middle" fill="#374151">0</text>
  <text x="188" y="292" font-size="12" text-anchor="middle" fill="#374151">20</text>
  <text x="276" y="292" font-size="12" text-anchor="middle" fill="#374151">40</text>
  <text x="364" y="292" font-size="12" text-anchor="middle" fill="#374151">60</text>
  <text x="452" y="292" font-size="12" text-anchor="middle" fill="#374151">80</text>
  <text x="540" y="292" font-size="12" text-anchor="middle" fill="#374151">100 cm</text>

  <!-- jockey at balance point -->
  <line x1="320" y1="196" x2="320" y2="240" stroke="#7c3aed" stroke-width="4"/>
  <polygon points="320,240 310,224 330,224" fill="#7c3aed"/>
  <text x="300" y="192" font-size="13" text-anchor="end" fill="#7c3aed" font-weight="700">jockey</text>

  <!-- galvanometer between the tap point and the middle strip -->
  <circle cx="320" cy="172" r="22" fill="#f5f3ff" stroke="#111827" stroke-width="3"/>
  <text x="320" y="179" font-size="17" text-anchor="middle" fill="#4c1d95" font-weight="700">G</text>
  <text x="348" y="168" font-size="14" fill="#7c3aed" font-weight="700">slide until G reads 0</text>

  <!-- balance lengths -->
  <line x1="100" y1="318" x2="320" y2="318" stroke="#2563eb" stroke-width="3" marker-end="url(#m-blue)"/>
  <line x1="540" y1="318" x2="320" y2="318" stroke="#16a34a" stroke-width="3" marker-end="url(#m-blue)"/>
  <text x="210" y="338" font-size="15" text-anchor="middle" fill="#2563eb" font-weight="700">length l</text>
  <text x="430" y="338" font-size="15" text-anchor="middle" fill="#16a34a" font-weight="700">length (100 &#8722; l) cm</text>

  <!-- cell and key across the ends of the wire -->
  <g stroke="#111827" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="100" y1="240" x2="70" y2="240"/>
    <line x1="70" y1="240" x2="70" y2="372"/>
    <line x1="70" y1="372" x2="296" y2="372"/>
    <line x1="324" y1="372" x2="570" y2="372"/>
    <line x1="570" y1="372" x2="570" y2="240"/>
    <line x1="570" y1="240" x2="540" y2="240"/>
  </g>
  <line x1="296" y1="360" x2="296" y2="384" stroke="#111827" stroke-width="7"/>
  <line x1="324" y1="350" x2="324" y2="394" stroke="#111827" stroke-width="3"/>
  <text x="332" y="346" font-size="14" fill="#111827" font-weight="700">+</text>

  <text x="320" y="412" font-size="17" text-anchor="middle" fill="#1e3a8a" font-weight="700">R / S = l / (100 &#8722; l) &#160;&#160;&#8594;&#160;&#160; S = R (100 &#8722; l) / l</text>
</svg>
