<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Cross-section of a vehicle on a road banked at angle theta, and its free-body diagram at the maximum safe speed: normal force, weight and friction down the slope, with acceleration towards the centre</title>
  <defs>
    <marker id="hr" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="hg" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="hk" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="180" y="30" font-size="16" font-weight="600" fill="#111827" text-anchor="middle">Road cross-section</text>
  <text x="515" y="30" font-size="16" font-weight="600" fill="#111827" text-anchor="middle">Forces at maximum speed</text>
  <line x1="380" y1="45" x2="380" y2="385" stroke="#d1d5db" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- centre direction -->
  <line x1="250" y1="120" x2="60" y2="120" stroke="#374151" stroke-width="2" marker-end="url(#hk)"/>
  <text x="60" y="108" font-size="13" fill="#374151">towards the centre of the curve</text>

  <!-- banked road, rising away from the centre at 15 degrees (drawn) -->
  <polygon points="30,330 350,244.3 350,370 30,370" fill="#d6d3d1" stroke="#57534e" stroke-width="2"/>
  <line x1="30" y1="330" x2="170" y2="330" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M 110 330 A 80 80 0 0 0 107.3 309.3" fill="none" stroke="#111827" stroke-width="1.5"/>
  <text x="118" y="324" font-size="14" fill="#111827">θ</text>
  <text x="300" y="232" font-size="12" fill="#4b5563" text-anchor="middle">outer edge higher</text>

  <!-- vehicle on slope -->
  <g transform="rotate(-15 200 293.8)">
    <rect x="150" y="241.8" width="100" height="44" rx="6" fill="#fbbf24" stroke="#92400e" stroke-width="1.5"/>
    <circle cx="170" cy="286" r="8" fill="#1f2937"/>
    <circle cx="230" cy="286" r="8" fill="#1f2937"/>
  </g>

  <!-- FBD -->
  <circle cx="510" cy="200" r="6" fill="#111827"/>
  <line x1="508.4" y1="194.2" x2="481.6" y2="94.2" stroke="#dc2626" stroke-width="4" marker-end="url(#hr)"/>
  <line x1="510" y1="206" x2="510" y2="300" stroke="#dc2626" stroke-width="4" marker-end="url(#hr)"/>
  <line x1="504.2" y1="201.6" x2="452" y2="215.5" stroke="#dc2626" stroke-width="4" marker-end="url(#hr)"/>
  <text x="462" y="110" font-size="14" fill="#dc2626">N</text>
  <text x="526" y="288" font-size="14" fill="#dc2626">mg</text>
  <text x="430" y="238" font-size="14" fill="#dc2626">f</text>
  <text x="522" y="118" font-size="12" fill="#374151">N is perpendicular</text>
  <text x="522" y="134" font-size="12" fill="#374151">to the road surface</text>
  <text x="500" y="256" font-size="12" fill="#374151" text-anchor="end">f acts down</text>
  <text x="500" y="271" font-size="12" fill="#374151" text-anchor="end">the slope</text>
  <line x1="590" y1="345" x2="470" y2="345" stroke="#16a34a" stroke-width="4" marker-end="url(#hg)"/>
  <text x="530" y="335" font-size="13" fill="#16a34a" text-anchor="middle">a = v²/r</text>
  <text x="515" y="375" font-size="12" fill="#374151" text-anchor="middle">Net force horizontal, towards the centre</text>
</svg>
