<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A flat surface, seen edge-on, in a uniform field pointing right. Facing the field (theta = 0), all six field lines pass through it and the flux is EA. Tilted so its normal is at 60 degrees to the field, only three lines pass through and the flux is EA cos 60 = EA/2. Edge-on to the field (theta = 90 degrees), no lines pass through and the flux is zero.</title>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="#ffffff"/>
  <g stroke="#e5e7eb" stroke-width="2"><line x1="320" y1="20" x2="320" y2="310"/><line x1="640" y1="20" x2="640" y2="310"/></g>

  <!-- field lines in each panel: y = 99..229 step 26 cross the surface region; 73 and 255 outside -->
  <g stroke="#94a3b8" stroke-width="1.8" marker-end="url(#g)">
    <line x1="20" y1="73" x2="300" y2="73"/><line x1="20" y1="99" x2="300" y2="99"/><line x1="20" y1="125" x2="300" y2="125"/><line x1="20" y1="151" x2="300" y2="151"/>
    <line x1="20" y1="177" x2="300" y2="177"/><line x1="20" y1="203" x2="300" y2="203"/><line x1="20" y1="229" x2="300" y2="229"/><line x1="20" y1="255" x2="300" y2="255"/>
    <line x1="340" y1="73" x2="620" y2="73"/><line x1="340" y1="99" x2="620" y2="99"/><line x1="340" y1="125" x2="620" y2="125"/><line x1="340" y1="151" x2="620" y2="151"/>
    <line x1="340" y1="177" x2="620" y2="177"/><line x1="340" y1="203" x2="620" y2="203"/><line x1="340" y1="229" x2="620" y2="229"/><line x1="340" y1="255" x2="620" y2="255"/>
    <line x1="660" y1="73" x2="940" y2="73"/><line x1="660" y1="99" x2="940" y2="99"/><line x1="660" y1="125" x2="940" y2="125"/><line x1="660" y1="151" x2="940" y2="151"/>
    <line x1="660" y1="177" x2="940" y2="177"/><line x1="660" y1="203" x2="940" y2="203"/><line x1="660" y1="229" x2="940" y2="229"/><line x1="660" y1="255" x2="940" y2="255"/>
  </g>
  <text x="300" y="46" font-size="14" fill="#64748b" font-weight="700" text-anchor="end">E →</text>
  <text x="620" y="46" font-size="14" fill="#64748b" font-weight="700" text-anchor="end">E →</text>
  <text x="940" y="46" font-size="14" fill="#64748b" font-weight="700" text-anchor="end">E →</text>

  <!-- (a) theta = 0: surface vertical at x=160, from y=92 to 248; normal to the right -->
  <line x1="160" y1="92" x2="160" y2="248" stroke="#0f766e" stroke-width="7" stroke-linecap="round"/>
  <line x1="160" y1="170" x2="225" y2="170" stroke="#7c3aed" stroke-width="3.5" marker-end="url(#n)"/>
  <text x="232" y="190" font-size="15" fill="#7c3aed" font-weight="700">n̂</text>

  <!-- (b) theta = 60: normal at 60 deg to E; surface is perpendicular to normal, half-length 78 -->
  <!-- normal direction (cos60, -sin60) = (0.5, -0.866); surface direction (0.866, 0.5) -->
  <line x1="412.4" y1="131" x2="547.6" y2="209" stroke="#0f766e" stroke-width="7" stroke-linecap="round"/>
  <line x1="480" y1="170" x2="512.5" y2="113.7" stroke="#7c3aed" stroke-width="3.5" marker-end="url(#n)"/>
  <text x="518" y="110" font-size="15" fill="#7c3aed" font-weight="700">n̂</text>
  <path d="M 520 170 A 40 40 0 0 0 500 135.4" fill="none" stroke="#111827" stroke-width="2"/>
  <text x="526" y="150" font-size="14" fill="#111827" font-weight="600">60°</text>

  <!-- (c) theta = 90: surface horizontal between field lines, normal up -->
  <line x1="722" y1="164" x2="878" y2="164" stroke="#0f766e" stroke-width="7" stroke-linecap="round"/>
  <line x1="800" y1="164" x2="800" y2="104" stroke="#7c3aed" stroke-width="3.5" marker-end="url(#n)"/>
  <text x="810" y="112" font-size="15" fill="#7c3aed" font-weight="700">n̂</text>

  <g font-size="16" font-weight="700" fill="#111827" text-anchor="middle">
    <text x="160" y="300">θ = 0°: Φ = EA</text>
    <text x="480" y="300">θ = 60°: Φ = EA cos 60° = EA/2</text>
    <text x="800" y="300">θ = 90°: Φ = 0</text>
  </g>
  <g font-size="13.5" fill="#374151" text-anchor="middle">
    <text x="160" y="324">all 6 lines pass through</text>
    <text x="480" y="324">only 3 of the lines pass through</text>
    <text x="800" y="324">lines slide past; none cross</text>
  </g>
  <text x="480" y="372" font-size="14" fill="#111827" text-anchor="middle">θ is the angle between E and the normal n̂ to the surface, not the surface itself.</text>
</svg>
