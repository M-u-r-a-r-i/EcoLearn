<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A simple pendulum: a small bob of mass m on a light string of length l, swinging under gravity g, with period T</title>
  <defs>
    <marker id="headGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>

  <!-- support -->
  <rect x="220" y="44" width="200" height="12" fill="#64748b"/>
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="230" y1="44" x2="240" y2="34"/><line x1="260" y1="44" x2="270" y2="34"/>
    <line x1="290" y1="44" x2="300" y2="34"/><line x1="320" y1="44" x2="330" y2="34"/>
    <line x1="350" y1="44" x2="360" y2="34"/><line x1="380" y1="44" x2="390" y2="34"/>
    <line x1="410" y1="44" x2="420" y2="34"/>
  </g>

  <!-- rest position and swing path (pivot at 320,56; string 240 px) -->
  <line x1="320" y1="56" x2="320" y2="310" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
  <path d="M 238 282 A 240 240 0 0 0 402 282" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 6"/>
  <circle cx="238" cy="282" r="14" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- string and bob, swung 20 degrees to the right -->
  <line x1="320" y1="56" x2="402" y2="282" stroke="#111827" stroke-width="2.5"/>
  <circle cx="320" cy="56" r="4" fill="#111827"/>
  <circle cx="402" cy="282" r="14" fill="#b91c1c" stroke="#7f1d1d" stroke-width="2"/>

  <!-- angle -->
  <path d="M 320 106 A 50 50 0 0 0 337 103" fill="none" stroke="#6b7280" stroke-width="2"/>
  <text x="326" y="128" font-size="15" fill="#6b7280">θ</text>

  <!-- labels -->
  <text x="372" y="160" font-size="17" font-weight="700" fill="#111827">length l</text>
  <text x="426" y="288" font-size="17" font-weight="700" fill="#111827">mass m</text>

  <!-- g: acceleration due to gravity, green, downward -->
  <line x1="402" y1="300" x2="402" y2="360" stroke="#16a34a" stroke-width="4" marker-end="url(#headGreen)"/>
  <text x="422" y="340" font-size="17" font-weight="700" fill="#16a34a">g</text>

  <!-- the question -->
  <rect x="460" y="70" width="164" height="96" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="474" y="96" font-size="14" font-weight="700" fill="#111827">Period T</text>
  <text x="474" y="118" font-size="13" fill="#374151">time for one full swing,</text>
  <text x="474" y="136" font-size="13" fill="#374151">there and back.</text>
  <text x="474" y="156" font-size="13" fill="#374151">Which of m, l, g set it?</text>

  <text x="20" y="388" font-size="13" fill="#374151">Small swings; light string; bob small compared with l.</text>
</svg>
