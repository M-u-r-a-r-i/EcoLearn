<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Two paths from A up to B: gravity does the same work on both, but friction does more negative work on the longer path</title>
  <defs>
    <marker id="hd" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>

  <line x1="30" y1="340" x2="330" y2="340" stroke="#6b7280" stroke-width="2"/>
  <line x1="30" y1="90" x2="330" y2="90" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5 5"/>
  <!-- path 1: short and direct -->
  <line x1="80" y1="340" x2="250" y2="90" stroke="#2563eb" stroke-width="4"/>
  <text x="178" y="238" font-size="14" fill="#2563eb" font-weight="600">path 1 (short)</text>
  <!-- path 2: long and winding -->
  <path d="M 80 340 C 20 300 40 250 140 260 S 300 240 250 180 S 40 150 120 110 S 230 80 250 90" fill="none" stroke="#ea580c" stroke-width="4" stroke-dasharray="10 6"/>
  <text x="36" y="200" font-size="14" fill="#ea580c" font-weight="600">path 2</text>
  <text x="36" y="216" font-size="14" fill="#ea580c" font-weight="600">(long)</text>
  <circle cx="80" cy="340" r="7" fill="#111827"/>
  <text x="60" y="366" font-size="16" fill="#111827" font-weight="700">A</text>
  <circle cx="250" cy="90" r="7" fill="#111827"/>
  <text x="244" y="72" font-size="16" fill="#111827" font-weight="700">B</text>
  <line x1="300" y1="336" x2="300" y2="94" stroke="#374151" stroke-width="2" marker-start="url(#hd)" marker-end="url(#hd)"/>
  <text x="308" y="220" font-size="16" fill="#374151" font-weight="600">h</text>

  <rect x="350" y="60" width="270" height="130" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="364" y="86" font-size="15" fill="#15803d" font-weight="700">Gravity (conservative)</text>
  <text x="364" y="112" font-size="14" fill="#111827">W = −mgh on path 1</text>
  <text x="364" y="134" font-size="14" fill="#111827">W = −mgh on path 2</text>
  <text x="364" y="160" font-size="13" fill="#4b5563">Only the height change matters,</text>
  <text x="364" y="178" font-size="13" fill="#4b5563">so U = mgh can be defined.</text>

  <rect x="350" y="210" width="270" height="130" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="364" y="236" font-size="15" fill="#b91c1c" font-weight="700">Friction (non-conservative)</text>
  <text x="364" y="262" font-size="14" fill="#111827">W = −f × (path length)</text>
  <text x="364" y="284" font-size="14" fill="#111827">more negative on path 2</text>
  <text x="364" y="310" font-size="13" fill="#4b5563">Depends on the route, so no</text>
  <text x="364" y="328" font-size="13" fill="#4b5563">potential energy for friction.</text>
</svg>
