<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Centripetal acceleration: velocity tangent to the circle, acceleration towards the centre, and the change in velocity pointing inward</title>
  <defs><marker id="hblue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="hred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="hgreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="horange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="hpurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="hteal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker><marker id="hgray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="hdark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker></defs>
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="20.0" y="30.0" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Centripetal acceleration points to the centre</text>
  <circle cx="180" cy="220" r="115" fill="none" stroke="#9ca3af" stroke-width="2.5"/>
  <circle cx="180" cy="220" r="4" fill="#111827"/>
  <text x="188.0" y="238.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">centre</text>
  <circle cx="180.0" cy="105.0" r="7" fill="#b91c1c"/>
  <line x1="180.0" y1="105.0" x2="245.0" y2="105.0" stroke="#2563eb" stroke-width="3.5" marker-end="url(#hblue)"/>
  <line x1="180.0" y1="105.0" x2="180.0" y2="160.0" stroke="#16a34a" stroke-width="3.5" marker-end="url(#hgreen)"/>
  <circle cx="279.6" cy="277.5" r="7" fill="#b91c1c"/>
  <line x1="279.6" y1="277.5" x2="247.1" y2="333.8" stroke="#2563eb" stroke-width="3.5" marker-end="url(#hblue)"/>
  <line x1="279.6" y1="277.5" x2="232.0" y2="250.0" stroke="#16a34a" stroke-width="3.5" marker-end="url(#hgreen)"/>
  <circle cx="80.4" cy="277.5" r="7" fill="#b91c1c"/>
  <line x1="80.4" y1="277.5" x2="47.9" y2="221.2" stroke="#2563eb" stroke-width="3.5" marker-end="url(#hblue)"/>
  <line x1="80.4" y1="277.5" x2="128.0" y2="250.0" stroke="#16a34a" stroke-width="3.5" marker-end="url(#hgreen)"/>
  <text x="216.0" y="93.0" font-size="16" fill="#2563eb" font-weight="700" text-anchor="start">v</text>
  <text x="190.0" y="155.0" font-size="16" fill="#16a34a" font-weight="700" text-anchor="start">a</text>
  <text x="180.0" y="375.0" font-size="13" fill="#6b7280" font-weight="400" text-anchor="middle">moving clockwise at constant speed v</text>
  <line x1="360" y1="50" x2="360" y2="380" stroke="#e5e7eb" stroke-width="2"/>
  <text x="375.0" y="70.0" font-size="14" fill="#111827" font-weight="600" text-anchor="start">Velocity at two nearby moments:</text>
  <line x1="400.0" y1="130.0" x2="560.0" y2="130.0" stroke="#2563eb" stroke-width="3.5" marker-end="url(#hblue)"/>
  <line x1="400.0" y1="130.0" x2="522.6" y2="232.8" stroke="#2563eb" stroke-width="3.5" stroke-dasharray="8 5" marker-end="url(#hblue)"/>
  <line x1="560.0" y1="130.0" x2="522.6" y2="232.8" stroke="#16a34a" stroke-width="4" marker-end="url(#hgreen)"/>
  <text x="480.0" y="120.0" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle">v (earlier)</text>
  <text x="451.3" y="195.4" font-size="13" fill="#2563eb" font-weight="700" text-anchor="end">v (later)</text>
  <text x="562.0" y="190.0" font-size="16" fill="#16a34a" font-weight="700" text-anchor="start">Δv</text>
  <text x="375.0" y="300.0" font-size="13" fill="#111827" font-weight="400" text-anchor="start">Δv points towards the centre</text>
  <text x="375.0" y="318.0" font-size="13" fill="#111827" font-weight="400" text-anchor="start">(for the middle of the interval),</text>
  <text x="375.0" y="336.0" font-size="13" fill="#111827" font-weight="400" text-anchor="start">so a = Δv/Δt does too.</text>
  <text x="375.0" y="366.0" font-size="15" fill="#16a34a" font-weight="700" text-anchor="start">Size: a = v²/r</text>
</svg>
