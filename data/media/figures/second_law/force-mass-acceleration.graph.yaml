# Newton's second law, a = F/m, seen two ways.
# Left: fixed mass 0.50 kg, so a = 2F (a straight line through the origin).
# Right: fixed force 2.0 N, so a = 2/m (a hyperbola).
title: "Newton's second law: $a = F_{net}/m$"
panels:
  - title: "Same mass (0.50 kg): $a \\propto F$"
    x: {label: "Net force $F$ (N)", min: 0, max: 4.2}
    y: {label: "Acceleration $a$ (m/s²)", min: 0, max: 9}
    series:
      - label: "$m = 0.50$ kg"
        points: [[0, 0], [1, 2], [2, 4], [3, 6], [4, 8]]
        color: blue
    marks:
      - {x: 1, y: 2, text: "1 N → 2 m/s²", color: blue, offset: [8, -14]}
      - {x: 2, y: 4, text: "double the force → double $a$", color: blue, offset: [8, -14]}
  - title: "Same force (2.0 N): $a \\propto 1/m$"
    x: {label: "Mass $m$ (kg)", min: 0, max: 2.1}
    y: {label: "Acceleration $a$ (m/s²)", min: 0, max: 9}
    series:
      - label: "$F = 2.0$ N"
        # a = 2.0 / m, sampled densely where the curve bends
        points: [[0.25, 8.0], [0.275, 7.273], [0.3, 6.667], [0.325, 6.154], [0.35, 5.714],
                 [0.4, 5.0], [0.45, 4.444], [0.5, 4.0], [0.55, 3.636], [0.6, 3.333],
                 [0.7, 2.857], [0.8, 2.5], [0.9, 2.222], [1.0, 2.0], [1.2, 1.667],
                 [1.4, 1.429], [1.6, 1.25], [1.8, 1.111], [2.0, 1.0]]
        color: red
    marks:
      - {x: 0.5, y: 4.0, text: "0.5 kg → 4 m/s²", color: red}
      - {x: 1.0, y: 2.0, text: "double the mass → half $a$", color: red}
