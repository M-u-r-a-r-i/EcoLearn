<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">NCERT sign convention for the first law: heat supplied to the gas is positive, work done by the gas is positive</title>
  <defs>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>

  <!-- cylinder -->
  <path d="M 420 70 L 180 70 L 180 230 L 420 230" fill="none" stroke="#1f2937" stroke-width="6"/>
  <rect x="183" y="73" width="207" height="154" fill="#dbeafe"/>
  <rect x="390" y="73" width="18" height="154" fill="#9ca3af" stroke="#374151" stroke-width="2"/>
  <rect x="408" y="140" width="80" height="18" fill="#9ca3af" stroke="#374151" stroke-width="2"/>
  <text x="286" y="140" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">gas</text>
  <text x="286" y="162" font-size="14" fill="#1e3a8a" text-anchor="middle">internal energy U</text>

  <!-- heat in -->
  <line x1="60" y1="150" x2="170" y2="150" stroke="#ea580c" stroke-width="6" marker-end="url(#ao)"/>
  <text x="40" y="130" font-size="15" font-weight="700" fill="#ea580c">ΔQ &gt; 0</text>
  <text x="30" y="182" font-size="13" fill="#ea580c">heat supplied</text>
  <text x="30" y="198" font-size="13" fill="#ea580c">TO the gas</text>

  <!-- work out -->
  <line x1="500" y1="149" x2="610" y2="149" stroke="#dc2626" stroke-width="6" marker-end="url(#ar)"/>
  <text x="505" y="130" font-size="15" font-weight="700" fill="#dc2626">ΔW &gt; 0</text>
  <text x="500" y="182" font-size="13" fill="#dc2626">work done BY</text>
  <text x="500" y="198" font-size="13" fill="#dc2626">the gas (it expands)</text>

  <!-- equation box -->
  <rect x="120" y="258" width="400" height="48" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="320" y="290" font-size="20" font-weight="700" fill="#14532d" text-anchor="middle">ΔQ = ΔU + ΔW</text>

  <text x="320" y="335" font-size="14" fill="#374151" text-anchor="middle">Heat given OUT by the gas: ΔQ is negative.</text>
  <text x="320" y="357" font-size="14" fill="#374151" text-anchor="middle">Work done ON the gas (it is compressed): ΔW is negative.</text>
  <text x="320" y="379" font-size="14" fill="#374151" text-anchor="middle">Temperature rises: ΔU is positive (for an ideal gas).</text>
</svg>
