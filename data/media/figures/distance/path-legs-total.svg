<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A trip along a line in three legs: 5 m forward, 5 m back, 3 m forward. Distance 13 m, displacement +3 m</title>
  <defs>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="20" y="32" font-size="16" font-weight="700" fill="#111827">The path, leg by leg</text>

  <!-- legs, stacked so none hides another -->
  <line x1="120" y1="80" x2="470" y2="80" stroke="#ea580c" stroke-width="4" marker-end="url(#ao)"/>
  <text x="295" y="70" font-size="14" fill="#ea580c" font-weight="600" text-anchor="middle">leg 1: 5 m forward</text>
  <line x1="470" y1="130" x2="120" y2="130" stroke="#ea580c" stroke-width="4" marker-end="url(#ao)"/>
  <text x="295" y="120" font-size="14" fill="#ea580c" font-weight="600" text-anchor="middle">leg 2: 5 m back</text>
  <line x1="120" y1="180" x2="330" y2="180" stroke="#ea580c" stroke-width="4" marker-end="url(#ao)"/>
  <text x="225" y="170" font-size="14" fill="#ea580c" font-weight="600" text-anchor="middle">leg 3: 3 m forward</text>

  <!-- number line -->
  <line x1="90" y1="240" x2="580" y2="240" stroke="#111827" stroke-width="2" marker-end="url(#ak)"/>
  <text x="584" y="232" font-size="15" font-weight="700" fill="#111827" text-anchor="end">+x</text>
  <g stroke="#111827" stroke-width="2">
    <line x1="120" y1="230" x2="120" y2="250"/><line x1="190" y1="233" x2="190" y2="247"/>
    <line x1="260" y1="233" x2="260" y2="247"/><line x1="330" y1="233" x2="330" y2="247"/>
    <line x1="400" y1="233" x2="400" y2="247"/><line x1="470" y1="233" x2="470" y2="247"/>
    <line x1="540" y1="233" x2="540" y2="247"/>
  </g>
  <g font-size="13" fill="#374151" text-anchor="middle">
    <text x="120" y="268" font-weight="700" fill="#111827">0</text><text x="190" y="268">1</text><text x="260" y="268">2</text>
    <text x="330" y="268">3</text><text x="400" y="268">4</text><text x="470" y="268">5</text><text x="540" y="268">6 m</text>
  </g>
  <circle cx="120" cy="240" r="7" fill="#111827"/>
  <circle cx="330" cy="240" r="7" fill="#7c3aed"/>
  <text x="120" y="222" font-size="13" fill="#111827" text-anchor="middle">start</text>
  <text x="330" y="222" font-size="13" fill="#7c3aed" text-anchor="middle">end</text>

  <!-- displacement -->
  <line x1="120" y1="296" x2="326" y2="296" stroke="#7c3aed" stroke-width="4" stroke-dasharray="10 6" marker-end="url(#ap)"/>
  <text x="345" y="301" font-size="14" fill="#7c3aed" font-weight="600">start → end</text>

  <rect x="40" y="322" width="560" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="348" font-size="15" fill="#ea580c" font-weight="700">distance = 5 + 5 + 3 = 13 m  (every leg counts, direction ignored)</text>
  <text x="60" y="372" font-size="15" fill="#7c3aed" font-weight="700">displacement = 3 m − 0 m = +3 m  (only start and end matter)</text>
</svg>
