<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">The newton, joule and watt written as products of kilogram, metre and second</title>
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="24" y="36" font-size="19" font-weight="700" fill="#111827">Derived units are built from base units</text>

  <!-- row 1: newton -->
  <text x="28" y="118" font-size="24" font-weight="700" fill="#111827">1 N</text>
  <text x="92" y="118" font-size="24" fill="#111827">=</text>
  <rect x="124" y="94" width="56" height="34" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="152" y="117" font-size="17" font-weight="700" fill="#c2410c" text-anchor="middle">kg</text>
  <rect x="188" y="94" width="56" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="216" y="117" font-size="17" font-weight="700" fill="#1d4ed8" text-anchor="middle">m</text>
  <rect x="252" y="94" width="56" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="280" y="117" font-size="17" font-weight="700" fill="#15803d" text-anchor="middle">s⁻²</text>
  <text x="334" y="110" font-size="14" fill="#374151">force = mass × acceleration</text>
  <text x="334" y="128" font-size="14" fill="#6b7280">kg × m/s²</text>

  <!-- row 2: joule -->
  <text x="28" y="208" font-size="24" font-weight="700" fill="#111827">1 J</text>
  <text x="92" y="208" font-size="24" fill="#111827">=</text>
  <rect x="124" y="184" width="56" height="34" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="152" y="207" font-size="17" font-weight="700" fill="#c2410c" text-anchor="middle">kg</text>
  <rect x="188" y="184" width="56" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="216" y="207" font-size="17" font-weight="700" fill="#1d4ed8" text-anchor="middle">m²</text>
  <rect x="252" y="184" width="56" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="280" y="207" font-size="17" font-weight="700" fill="#15803d" text-anchor="middle">s⁻²</text>
  <text x="334" y="200" font-size="14" fill="#374151">work = force × distance</text>
  <text x="334" y="218" font-size="14" fill="#6b7280">N × m</text>

  <!-- row 3: watt -->
  <text x="28" y="298" font-size="24" font-weight="700" fill="#111827">1 W</text>
  <text x="92" y="298" font-size="24" fill="#111827">=</text>
  <rect x="124" y="274" width="56" height="34" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="152" y="297" font-size="17" font-weight="700" fill="#c2410c" text-anchor="middle">kg</text>
  <rect x="188" y="274" width="56" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="216" y="297" font-size="17" font-weight="700" fill="#1d4ed8" text-anchor="middle">m²</text>
  <rect x="252" y="274" width="56" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="280" y="297" font-size="17" font-weight="700" fill="#15803d" text-anchor="middle">s⁻³</text>
  <text x="334" y="290" font-size="14" fill="#374151">power = work ÷ time</text>
  <text x="334" y="308" font-size="14" fill="#6b7280">J ÷ s</text>

  <!-- key -->
  <rect x="28" y="352" width="14" height="14" rx="3" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="48" y="364" font-size="13" fill="#374151">mass (kg)</text>
  <rect x="140" y="352" width="14" height="14" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="364" font-size="13" fill="#374151">length (m)</text>
  <rect x="256" y="352" width="14" height="14" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="276" y="364" font-size="13" fill="#374151">time (s)</text>
  <text x="360" y="364" font-size="13" fill="#6b7280">A named unit is shorthand.</text>
</svg>
