<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Three capacitors in series share the same charge and split the voltage, so 1 over C equals the sum of 1 over each C; three capacitors in parallel share the same voltage and add their charges, so C equals the sum</title>
  <rect width="640" height="360" fill="#ffffff"/>

  <rect x="10" y="10" width="300" height="340" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="330" y="10" width="300" height="340" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="160" y="38" font-size="18" text-anchor="middle" fill="#111827" font-weight="700">Series</text>
  <text x="480" y="38" font-size="18" text-anchor="middle" fill="#111827" font-weight="700">Parallel</text>

  <!-- series chain -->
  <g stroke="#111827" stroke-width="3" fill="none">
    <line x1="30" y1="130" x2="80" y2="130"/>
    <line x1="80" y1="100" x2="80" y2="160"/><line x1="94" y1="100" x2="94" y2="160"/>
    <line x1="94" y1="130" x2="146" y2="130"/>
    <line x1="146" y1="100" x2="146" y2="160"/><line x1="160" y1="100" x2="160" y2="160"/>
    <line x1="160" y1="130" x2="212" y2="130"/>
    <line x1="212" y1="100" x2="212" y2="160"/><line x1="226" y1="100" x2="226" y2="160"/>
    <line x1="226" y1="130" x2="290" y2="130"/>
  </g>
  <circle cx="30" cy="130" r="4" fill="#111827"/><circle cx="290" cy="130" r="4" fill="#111827"/>
  <g font-size="14" text-anchor="middle" fill="#111827" font-weight="700">
    <text x="87" y="90">C₁</text><text x="153" y="90">C₂</text><text x="219" y="90">C₃</text>
  </g>
  <g font-size="13" text-anchor="middle" font-weight="700">
    <text x="74" y="180" fill="#dc2626">+Q</text><text x="102" y="180" fill="#2563eb">−Q</text>
    <text x="140" y="180" fill="#dc2626">+Q</text><text x="168" y="180" fill="#2563eb">−Q</text>
    <text x="206" y="180" fill="#dc2626">+Q</text><text x="234" y="180" fill="#2563eb">−Q</text>
  </g>
  <g font-size="14" text-anchor="middle" fill="#111827">
    <text x="160" y="226">same charge Q on each</text>
    <text x="160" y="252">V = V₁ + V₂ + V₃</text>
    <text x="160" y="290" font-size="16" font-weight="700">1/C = 1/C₁ + 1/C₂ + 1/C₃</text>
    <text x="160" y="318" fill="#374151">smaller than the smallest</text>
  </g>

  <!-- parallel ladder -->
  <g stroke="#111827" stroke-width="3" fill="none">
    <line x1="400" y1="80" x2="400" y2="200"/>
    <line x1="560" y1="80" x2="560" y2="200"/>
    <line x1="360" y1="140" x2="400" y2="140"/>
    <line x1="560" y1="140" x2="600" y2="140"/>
    <line x1="400" y1="80" x2="473" y2="80"/><line x1="487" y1="80" x2="560" y2="80"/>
    <line x1="473" y1="62" x2="473" y2="98"/><line x1="487" y1="62" x2="487" y2="98"/>
    <line x1="400" y1="140" x2="473" y2="140"/><line x1="487" y1="140" x2="560" y2="140"/>
    <line x1="473" y1="122" x2="473" y2="158"/><line x1="487" y1="122" x2="487" y2="158"/>
    <line x1="400" y1="200" x2="473" y2="200"/><line x1="487" y1="200" x2="560" y2="200"/>
    <line x1="473" y1="182" x2="473" y2="218"/><line x1="487" y1="182" x2="487" y2="218"/>
  </g>
  <circle cx="360" cy="140" r="4" fill="#111827"/><circle cx="600" cy="140" r="4" fill="#111827"/>
  <g font-size="14" fill="#111827" font-weight="700">
    <text x="496" y="68">C₁</text><text x="496" y="128">C₂</text><text x="496" y="188">C₃</text>
  </g>
  <g font-size="14" text-anchor="middle" fill="#111827">
    <text x="480" y="252">same V across each</text>
    <text x="480" y="276">Q = Q₁ + Q₂ + Q₃</text>
    <text x="480" y="306" font-size="16" font-weight="700">C = C₁ + C₂ + C₃</text>
    <text x="480" y="332" fill="#374151">larger than the largest</text>
  </g>
</svg>
