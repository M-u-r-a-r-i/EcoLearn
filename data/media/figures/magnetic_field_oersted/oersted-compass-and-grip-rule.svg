<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Left: a compass under a straight wire points north when the switch is open, and swings sideways when current flows. Right: the right-hand grip rule, with the thumb along the current and the fingers curling the way the field circles the wire.</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>

  <!-- LEFT PANEL -->
  <text x="30" y="34" font-size="15" font-weight="700" fill="#111827">Oersted's experiment</text>

  <text x="30" y="62" font-size="13" fill="#475569">switch open: no current</text>
  <line x1="30" y1="100" x2="270" y2="100" stroke="#111827" stroke-width="4"/>
  <circle cx="150" cy="140" r="26" fill="#f8fafc" stroke="#111827" stroke-width="3"/>
  <polygon points="150,118 144,140 156,140" fill="#dc2626"/>
  <polygon points="150,162 144,140 156,140" fill="#1e293b"/>
  <text x="150" y="182" font-size="12" fill="#475569" text-anchor="middle">needle points north</text>

  <text x="30" y="224" font-size="13" fill="#475569">switch closed: current I flows</text>
  <line x1="30" y1="262" x2="270" y2="262" stroke="#2563eb" stroke-width="4" marker-end="url(#ar)"/>
  <text x="250" y="252" font-size="14" fill="#2563eb" font-weight="700">I</text>
  <circle cx="150" cy="302" r="26" fill="#f8fafc" stroke="#111827" stroke-width="3"/>
  <polygon points="128,306 150,298 150,310" fill="#dc2626"/>
  <polygon points="172,298 150,298 150,310" fill="#1e293b"/>
  <text x="150" y="344" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">needle swings sideways</text>
  <text x="150" y="362" font-size="12" fill="#475569" text-anchor="middle">a current makes a magnetic field</text>

  <line x1="310" y1="30" x2="310" y2="370" stroke="#e2e8f0" stroke-width="2"/>

  <!-- RIGHT PANEL: grip rule, wire vertical, current up -->
  <text x="350" y="34" font-size="15" font-weight="700" fill="#111827">Right-hand grip rule</text>

  <line x1="470" y1="340" x2="470" y2="70" stroke="#2563eb" stroke-width="5" marker-end="url(#ar)"/>
  <text x="484" y="80" font-size="14" fill="#2563eb" font-weight="700">I (thumb)</text>

  <!-- field circles seen edge-on as ellipses -->
  <ellipse cx="470" cy="130" rx="86" ry="22" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <ellipse cx="470" cy="210" rx="62" ry="16" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <ellipse cx="470" cy="282" rx="40" ry="11" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <path d="M 556 130 l -10 -9 l 2 13 z" fill="#7c3aed"/>
  <path d="M 532 210 l -10 -8 l 2 12 z" fill="#7c3aed"/>
  <path d="M 510 282 l -10 -7 l 2 11 z" fill="#7c3aed"/>
  <text x="356" y="248" font-size="13" fill="#7c3aed" font-weight="700">B (fingers curl)</text>

  <text x="340" y="360" font-size="12.5" fill="#475569">Point the right thumb along I;</text>
  <text x="340" y="378" font-size="12.5" fill="#475569">the curled fingers give the direction of B.</text>
</svg>
