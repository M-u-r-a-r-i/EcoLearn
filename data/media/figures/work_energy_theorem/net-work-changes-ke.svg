<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A body slows from A to B as a resistive force does negative work; its kinetic energy falls by exactly the net work done</title>
  <defs>
    <marker id="hr" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="hb" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="hd" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>

  <line x1="30" y1="150" x2="610" y2="150" stroke="#6b7280" stroke-width="2"/>
  <circle cx="100" cy="136" r="14" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="94" y="176" font-size="15" fill="#111827" font-weight="700">A</text>
  <line x1="118" y1="100" x2="238" y2="100" stroke="#2563eb" stroke-width="3.5" marker-end="url(#hb)"/>
  <text x="130" y="88" font-size="14" fill="#2563eb" font-weight="600">u (faster)</text>

  <circle cx="330" cy="136" r="14" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1.5" opacity="0.55"/>
  <line x1="314" y1="136" x2="254" y2="136" stroke="#dc2626" stroke-width="3" marker-end="url(#hr)"/>
  <text x="222" y="130" font-size="14" fill="#dc2626" font-weight="600">f</text>
  <text x="274" y="88" font-size="12" fill="#dc2626">resistive force, opposite</text>
  <text x="274" y="103" font-size="12" fill="#dc2626">to the motion all the way</text>

  <circle cx="520" cy="136" r="14" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="514" y="176" font-size="15" fill="#111827" font-weight="700">B</text>
  <line x1="538" y1="100" x2="588" y2="100" stroke="#2563eb" stroke-width="3.5" marker-end="url(#hb)"/>
  <text x="530" y="88" font-size="14" fill="#2563eb" font-weight="600">v (slower)</text>

  <line x1="104" y1="196" x2="516" y2="196" stroke="#374151" stroke-width="2" marker-start="url(#hd)" marker-end="url(#hd)"/>
  <text x="290" y="216" font-size="14" fill="#374151">displacement d</text>

  <!-- kinetic energy bars -->
  <line x1="60" y1="370" x2="600" y2="370" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="80" y="250" width="44" height="120" fill="#2563eb"/>
  <text x="70" y="390" font-size="14" fill="#111827">K at A</text>
  <rect x="500" y="325" width="44" height="45" fill="#2563eb"/>
  <text x="490" y="390" font-size="14" fill="#111827">K at B</text>
  <line x1="124" y1="250" x2="560" y2="250" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="566" y1="252" x2="566" y2="323" stroke="#dc2626" stroke-width="2.5" marker-start="url(#hd)" marker-end="url(#hd)"/>
  <text x="170" y="286" font-size="16" fill="#111827" font-weight="600">W_net = K_B − K_A</text>
  <text x="170" y="312" font-size="14" fill="#dc2626">Here W_net = −f d, so K falls by f d</text>
</svg>
