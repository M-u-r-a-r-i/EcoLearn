<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Three charges of plus 2, plus 2 and minus 2 microcoulombs at the corners of an equilateral triangle of side 10 cm; each of the three pairs is labelled with its potential energy, and the total is minus 0.36 joule</title>
  <rect width="640" height="360" fill="#ffffff"/>

  <!-- pair lines -->
  <line x1="250" y1="60" x2="150" y2="233" stroke="#dc2626" stroke-width="3"/>
  <line x1="250" y1="60" x2="350" y2="233" stroke="#2563eb" stroke-width="3"/>
  <line x1="150" y1="233" x2="350" y2="233" stroke="#2563eb" stroke-width="3"/>

  <!-- charges -->
  <circle cx="250" cy="60" r="18" fill="#dc2626"/>
  <text x="250" y="67" font-size="20" text-anchor="middle" fill="#fff" font-weight="700">+</text>
  <text x="276" y="50" font-size="14" fill="#111827" font-weight="700">q₁ = +2.0 μC</text>
  <circle cx="150" cy="233" r="18" fill="#dc2626"/>
  <text x="150" y="240" font-size="20" text-anchor="middle" fill="#fff" font-weight="700">+</text>
  <text x="150" y="274" font-size="14" text-anchor="middle" fill="#111827" font-weight="700">q₂ = +2.0 μC</text>
  <circle cx="350" cy="233" r="18" fill="#2563eb"/>
  <text x="350" y="240" font-size="20" text-anchor="middle" fill="#fff" font-weight="700">−</text>
  <text x="350" y="274" font-size="14" text-anchor="middle" fill="#111827" font-weight="700">q₃ = −2.0 μC</text>

  <!-- pair energies -->
  <text x="186" y="140" font-size="14" text-anchor="end" fill="#dc2626" font-weight="700">U₁₂ = +0.36 J</text>
  <text x="314" y="140" font-size="14" fill="#2563eb" font-weight="700">U₁₃ = −0.36 J</text>
  <text x="250" y="224" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="700">U₂₃ = −0.36 J</text>
  <text x="250" y="300" font-size="13" text-anchor="middle" fill="#374151">every side: r = 10 cm = 0.10 m</text>

  <!-- summary -->
  <rect x="420" y="100" width="200" height="130" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="520" y="126" font-size="14" text-anchor="middle" fill="#111827" font-weight="700">One term per pair:</text>
  <text x="520" y="150" font-size="14" text-anchor="middle" fill="#111827">U = k q₁q₂ / r₁₂ + …</text>
  <text x="520" y="178" font-size="14" text-anchor="middle" fill="#111827">+0.36 − 0.36 − 0.36</text>
  <text x="520" y="206" font-size="16" text-anchor="middle" fill="#111827" font-weight="700">U = −0.36 J</text>
  <text x="320" y="340" font-size="14" text-anchor="middle" fill="#374151">Like charges: positive pair energy. Unlike charges: negative.</text>
</svg>
