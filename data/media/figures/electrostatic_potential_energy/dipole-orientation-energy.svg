<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A dipole in a uniform field pointing right, in three orientations: aligned with the field, energy minus pE and stable; at right angles, energy zero; opposite to the field, energy plus pE and unstable</title>
  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="pa" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="640" height="320" fill="#ffffff"/>

  <!-- uniform field across the top -->
  <line x1="40" y1="30" x2="600" y2="30" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#fa)"/>
  <text x="40" y="22" font-size="14" fill="#7c3aed" font-weight="700">uniform field E</text>

  <g font-size="14" text-anchor="middle">
    <!-- panel 1: theta = 0 -->
    <rect x="20" y="50" width="190" height="250" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="115" y="76" fill="#111827" font-weight="700">θ = 0°</text>
    <circle cx="80" cy="150" r="12" fill="#2563eb"/>
    <text x="80" y="156" font-size="17" fill="#fff" font-weight="700">−</text>
    <circle cx="150" cy="150" r="12" fill="#dc2626"/>
    <text x="150" y="156" font-size="17" fill="#fff" font-weight="700">+</text>
    <line x1="80" y1="118" x2="146" y2="118" stroke="#16a34a" stroke-width="3" marker-end="url(#pa)"/>
    <text x="115" y="110" fill="#16a34a" font-weight="700">p</text>
    <text x="115" y="226" fill="#111827" font-weight="700">U = −pE</text>
    <text x="115" y="250" fill="#374151">lowest energy</text>
    <text x="115" y="270" fill="#374151">stable</text>

    <!-- panel 2: theta = 90 -->
    <rect x="225" y="50" width="190" height="250" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="320" y="76" fill="#111827" font-weight="700">θ = 90°</text>
    <circle cx="320" cy="185" r="12" fill="#2563eb"/>
    <text x="320" y="191" font-size="17" fill="#fff" font-weight="700">−</text>
    <circle cx="320" cy="115" r="12" fill="#dc2626"/>
    <text x="320" y="121" font-size="17" fill="#fff" font-weight="700">+</text>
    <line x1="352" y1="185" x2="352" y2="119" stroke="#16a34a" stroke-width="3" marker-end="url(#pa)"/>
    <text x="366" y="156" fill="#16a34a" font-weight="700">p</text>
    <text x="320" y="226" fill="#111827" font-weight="700">U = 0</text>
    <text x="320" y="250" fill="#374151">torque turns it</text>
    <text x="320" y="270" fill="#374151">towards the field</text>

    <!-- panel 3: theta = 180 -->
    <rect x="430" y="50" width="190" height="250" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="525" y="76" fill="#111827" font-weight="700">θ = 180°</text>
    <circle cx="490" cy="150" r="12" fill="#dc2626"/>
    <text x="490" y="156" font-size="17" fill="#fff" font-weight="700">+</text>
    <circle cx="560" cy="150" r="12" fill="#2563eb"/>
    <text x="560" y="156" font-size="17" fill="#fff" font-weight="700">−</text>
    <line x1="560" y1="118" x2="494" y2="118" stroke="#16a34a" stroke-width="3" marker-end="url(#pa)"/>
    <text x="525" y="110" fill="#16a34a" font-weight="700">p</text>
    <text x="525" y="226" fill="#111827" font-weight="700">U = +pE</text>
    <text x="525" y="250" fill="#374151">highest energy</text>
    <text x="525" y="270" fill="#374151">unstable</text>
  </g>
</svg>
