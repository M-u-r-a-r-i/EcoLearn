# A 65 kg runner speeds up uniformly from rest at 4.0 m/s^2 for 2.0 s (constant net force 260 N).
# Work done W = K = 0.5*65*(4t)^2 = 520 t^2: t = 0.5 -> 130 J, 1 -> 520 J, 1.5 -> 1170 J, 2 -> 2080 J.
# Average power over 2 s = chord slope = 2080/2 = 1040 W.
# Instantaneous power at 2 s = tangent slope = F v = 260*8 = 2080 W; tangent W = 2080 + 2080 (t - 2),
# drawn from t = 1.5 (1040 J) to t = 2 (2080 J).
title: "Power is the slope of the work-time graph"
x: {label: "Time $t$ (s)", min: 0, max: 2.2}
y: {label: "Work done $W$ (J)", min: 0, max: 2300}
series:
  - label: "Work done, $W = 520\\,t^2$"
    points: [[0, 0], [0.25, 32.5], [0.5, 130], [0.75, 292.5], [1.0, 520], [1.25, 812.5], [1.5, 1170],
             [1.75, 1592.5], [2.0, 2080]]
    color: blue
  - label: "Chord: average power 1040 W"
    points: [[0, 0], [2.0, 2080]]
    color: gray
    style: dashed
  - label: "Tangent at 2.0 s: power 2080 W"
    points: [[1.5, 1040], [2.0, 2080]]
    color: red
marks:
  - {x: 2.0, y: 2080, text: "2080 J at 2.0 s", color: blue, offset: [-110, 6]}
legend: upper left
