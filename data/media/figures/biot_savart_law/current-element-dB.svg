<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A short current element of length dl on a curved wire, the vector r from the element to a point P, the angle theta between them, and the tiny field dB at P pointing into the page. The Biot-Savart formula is written alongside.</title>
  <defs>
    <marker id="b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="700" fill="#111827">One small piece of a current-carrying wire</text>

  <!-- curved wire -->
  <path d="M 50 330 C 130 300, 170 230, 250 210 C 320 193, 400 205, 470 170" fill="none" stroke="#2563eb" stroke-width="5"/>
  <path d="M 470 170 l -16 2 l 6 11 z" fill="#2563eb"/>
  <text x="70" y="362" font-size="14" fill="#2563eb" font-weight="700">current I</text>

  <!-- the element dl, highlighted -->
  <line x1="236" y1="213" x2="286" y2="203" stroke="#dc2626" stroke-width="9" stroke-linecap="round"/>
  <text x="248" y="240" font-size="15" fill="#dc2626" font-weight="700">d𝑙</text>
  <path d="M 236 213 L 330 193" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M 330 193 l -14 -3 l 3 11 z" fill="#dc2626"/>
  <text x="340" y="192" font-size="13" fill="#dc2626" font-weight="700">direction of I</text>

  <!-- r to P -->
  <line x1="261" y1="208" x2="470" y2="308" stroke="#111827" stroke-width="3" marker-end="url(#b2)"/>
  <text x="372" y="244" font-size="15" fill="#111827" font-weight="700">r</text>
  <circle cx="478" cy="312" r="6" fill="#111827"/>
  <text x="492" y="318" font-size="15" fill="#111827" font-weight="700">P</text>

  <!-- angle theta between dl direction and r -->
  <path d="M 300 197 A 44 44 0 0 0 292 226" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <text x="308" y="228" font-size="14" fill="#7c3aed" font-weight="700">θ</text>

  <!-- dB into the page at P -->
  <circle cx="530" cy="312" r="13" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <line x1="521" y1="303" x2="539" y2="321" stroke="#7c3aed" stroke-width="3"/>
  <line x1="539" y1="303" x2="521" y2="321" stroke="#7c3aed" stroke-width="3"/>
  <text x="530" y="348" font-size="14" fill="#7c3aed" font-weight="700" text-anchor="middle">dB into the page</text>

  <rect x="24" y="52" width="300" height="88" rx="8" fill="#f1f5f9"/>
  <text x="174" y="82" font-size="17" fill="#111827" text-anchor="middle" font-weight="700">dB = (μ₀/4π) · I d𝑙 sin θ / r²</text>
  <text x="174" y="108" font-size="13" fill="#475569" text-anchor="middle">direction: d𝑙 × r (right-hand rule)</text>
  <text x="174" y="128" font-size="13" fill="#475569" text-anchor="middle">add up every element to get the whole field</text>
</svg>
