<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Two identical cells in series, giving twice the emf and twice the internal resistance, and the same two in parallel, giving the same emf and half the internal resistance</title>
  <rect width="640" height="420" fill="#ffffff"/>

  <!-- SERIES -->
  <text x="160" y="32" font-size="17" text-anchor="middle" fill="#111827" font-weight="700">In series (nose to tail)</text>
  <g stroke="#111827" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="40" y1="90" x2="70" y2="90"/>
    <line x1="110" y1="90" x2="170" y2="90"/>
    <line x1="210" y1="90" x2="280" y2="90"/>
  </g>
  <!-- cell 1: long plate (+) on the right -->
  <line x1="78" y1="68" x2="78" y2="112" stroke="#111827" stroke-width="6"/>
  <line x1="100" y1="58" x2="100" y2="122" stroke="#111827" stroke-width="3"/>
  <text x="108" y="52" font-size="14" fill="#111827" font-weight="700">+</text>
  <text x="89" y="142" font-size="14" text-anchor="middle" fill="#111827">&#949;, r</text>
  <!-- cell 2 -->
  <line x1="178" y1="68" x2="178" y2="112" stroke="#111827" stroke-width="6"/>
  <line x1="200" y1="58" x2="200" y2="122" stroke="#111827" stroke-width="3"/>
  <text x="208" y="52" font-size="14" fill="#111827" font-weight="700">+</text>
  <text x="189" y="142" font-size="14" text-anchor="middle" fill="#111827">&#949;, r</text>

  <text x="160" y="178" font-size="14" text-anchor="middle" fill="#374151">the same current passes through both</text>
  <rect x="35" y="192" width="250" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="215" font-size="16" text-anchor="middle" fill="#1e3a8a" font-weight="700">&#949;&#8331;&#8342; = &#949;&#8321; + &#949;&#8322;</text>
  <text x="160" y="238" font-size="16" text-anchor="middle" fill="#1e3a8a" font-weight="700">r&#8331;&#8342; = r&#8321; + r&#8322;</text>
  <text x="160" y="274" font-size="13" text-anchor="middle" fill="#6b7280">more voltage, but more resistance too</text>
  <text x="160" y="296" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="600">reverse one cell and the emfs subtract</text>

  <!-- PARALLEL -->
  <text x="470" y="32" font-size="17" text-anchor="middle" fill="#111827" font-weight="700">In parallel (like to like)</text>
  <g stroke="#111827" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="350" y1="70" x2="410" y2="70"/>
    <line x1="450" y1="70" x2="580" y2="70"/>
    <line x1="350" y1="130" x2="410" y2="130"/>
    <line x1="450" y1="130" x2="580" y2="130"/>
    <line x1="350" y1="70" x2="350" y2="130"/>
    <line x1="580" y1="70" x2="580" y2="130"/>
  </g>
  <!-- top cell -->
  <line x1="418" y1="48" x2="418" y2="92" stroke="#111827" stroke-width="6"/>
  <line x1="440" y1="38" x2="440" y2="102" stroke="#111827" stroke-width="3"/>
  <text x="448" y="34" font-size="14" fill="#111827" font-weight="700">+</text>
  <!-- bottom cell -->
  <line x1="418" y1="108" x2="418" y2="152" stroke="#111827" stroke-width="6"/>
  <line x1="440" y1="98" x2="440" y2="162" stroke="#111827" stroke-width="3"/>
  <text x="448" y="178" font-size="14" fill="#111827" font-weight="700">+</text>
  <text x="330" y="104" font-size="14" text-anchor="end" fill="#111827">&#8722;</text>
  <text x="600" y="104" font-size="14" fill="#111827">+</text>

  <text x="470" y="178" font-size="14" text-anchor="middle" fill="#374151">the current splits between them</text>
  <rect x="345" y="192" width="250" height="56" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="470" y="215" font-size="16" text-anchor="middle" fill="#14532d" font-weight="700">&#949;&#8331;&#8344; = &#949; (identical cells)</text>
  <text x="470" y="238" font-size="16" text-anchor="middle" fill="#14532d" font-weight="700">r&#8331;&#8344; = r / 2</text>
  <text x="470" y="274" font-size="13" text-anchor="middle" fill="#6b7280">same voltage, but far less internal resistance</text>
  <text x="470" y="296" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="600">never join + to &#8722; here: the cells would drive each other</text>

  <text x="320" y="346" font-size="15" text-anchor="middle" fill="#111827" font-weight="700">Series when the load resistance R is large compared with r.</text>
  <text x="320" y="370" font-size="15" text-anchor="middle" fill="#111827" font-weight="700">Parallel when R is small compared with r.</text>
  <text x="320" y="400" font-size="13" text-anchor="middle" fill="#6b7280">For two unequal cells in parallel: &#949;&#8331;&#8344; = (&#949;&#8321;r&#8322; + &#949;&#8322;r&#8321;)/(r&#8321; + r&#8322;), r&#8331;&#8344; = r&#8321;r&#8322;/(r&#8321; + r&#8322;)</text>
</svg>
