<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Left: a concave mirror reflects two rays parallel to the principal axis so that they cross at the focus F, halfway between the pole P and the centre of curvature C. Right: a convex mirror reflects the same two rays outwards, and they appear to come from a focus F behind the mirror.</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="720" height="380" fill="#ffffff"/>

  <text x="180" y="28" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Concave mirror (converging)</text>
  <text x="540" y="28" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Convex mirror (diverging)</text>

  <!-- ================= concave ================= -->
  <line x1="30" y1="170" x2="350" y2="170" stroke="#9ca3af" stroke-width="2"/>
  <path d="M 298.6 90 A 160 160 0 0 1 298.6 250" fill="none" stroke="#111827" stroke-width="5"/>

  <!-- incoming parallel rays -->
  <g stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#ar)">
    <line x1="60" y1="110" x2="240" y2="110"/>
    <line x1="60" y1="230" x2="240" y2="230"/>
  </g>
  <g stroke="#2563eb" stroke-width="2.5">
    <line x1="240" y1="110" x2="308.3" y2="110"/>
    <line x1="240" y1="230" x2="308.3" y2="230"/>
  </g>
  <!-- reflected rays through F -->
  <g stroke="#dc2626" stroke-width="2.5">
    <line x1="308.3" y1="110" x2="190" y2="213.9"/>
    <line x1="308.3" y1="230" x2="190" y2="126.1"/>
  </g>

  <!-- points -->
  <circle cx="160" cy="170" r="4.5" fill="#111827"/>
  <text x="160" y="194" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">C</text>
  <circle cx="240" cy="170" r="4.5" fill="#111827"/>
  <text x="240" y="194" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">F</text>
  <circle cx="320" cy="170" r="4.5" fill="#111827"/>
  <text x="330" y="190" font-size="15" font-weight="700" fill="#111827">P</text>

  <line x1="240" y1="290" x2="320" y2="290" stroke="#059669" stroke-width="2"/>
  <line x1="240" y1="284" x2="240" y2="296" stroke="#059669" stroke-width="2"/>
  <line x1="320" y1="284" x2="320" y2="296" stroke="#059669" stroke-width="2"/>
  <text x="280" y="312" font-size="14" fill="#059669" text-anchor="middle" font-weight="700">f = R/2</text>
  <line x1="160" y1="330" x2="320" y2="330" stroke="#7c3aed" stroke-width="2"/>
  <line x1="160" y1="324" x2="160" y2="336" stroke="#7c3aed" stroke-width="2"/>
  <line x1="320" y1="324" x2="320" y2="336" stroke="#7c3aed" stroke-width="2"/>
  <text x="240" y="352" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="700">R</text>
  <text x="40" y="92" font-size="13" fill="#2563eb" font-weight="700">rays parallel to the axis</text>
  <text x="140" y="258" font-size="13" fill="#dc2626" font-weight="700">really cross at F</text>

  <!-- ================= convex ================= -->
  <line x1="370" y1="170" x2="700" y2="170" stroke="#9ca3af" stroke-width="2"/>
  <path d="M 441.4 90 A 160 160 0 0 0 441.4 250" fill="none" stroke="#111827" stroke-width="5"/>

  <g stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#ar)">
    <line x1="380" y1="110" x2="410" y2="110"/>
    <line x1="380" y1="230" x2="410" y2="230"/>
  </g>
  <g stroke="#2563eb" stroke-width="2.5">
    <line x1="410" y1="110" x2="431.7" y2="110"/>
    <line x1="410" y1="230" x2="431.7" y2="230"/>
  </g>
  <!-- reflected rays diverge, back-projections dashed to F behind -->
  <g stroke="#dc2626" stroke-width="2.5">
    <line x1="431.7" y1="110" x2="392" y2="75"/>
    <line x1="431.7" y1="230" x2="392" y2="265"/>
  </g>
  <g stroke="#dc2626" stroke-width="2" stroke-dasharray="7 5">
    <line x1="431.7" y1="110" x2="500" y2="170"/>
    <line x1="431.7" y1="230" x2="500" y2="170"/>
  </g>

  <circle cx="420" cy="170" r="4.5" fill="#111827"/>
  <text x="404" y="192" font-size="15" font-weight="700" fill="#111827">P</text>
  <circle cx="500" cy="170" r="4.5" fill="#111827"/>
  <text x="500" y="194" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">F</text>
  <circle cx="580" cy="170" r="4.5" fill="#111827"/>
  <text x="580" y="194" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">C</text>
  <text x="700" y="300" font-size="13" fill="#dc2626" font-weight="700" text-anchor="end">only seem to come from F</text>
  <text x="700" y="320" font-size="13" fill="#6b7280" text-anchor="end">(F and C are behind the mirror)</text>

  <rect x="30" y="360" width="660" height="0.5" fill="#fff"/>
  <text x="360" y="372" font-size="13" fill="#6b7280" text-anchor="middle">Paraxial rays only: rays close to the axis and nearly parallel to it.</text>
</svg>
