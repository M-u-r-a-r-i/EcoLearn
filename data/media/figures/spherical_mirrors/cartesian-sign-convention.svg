<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">The Cartesian sign convention: distances are measured from the pole of the mirror, light is always drawn travelling from left to right, distances to the left of the pole are negative and to the right positive, heights above the principal axis are positive and heights below are negative.</title>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#ffffff"/>

  <text x="380" y="30" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Cartesian sign convention — everything is measured from the pole P</text>

  <line x1="40" y1="190" x2="720" y2="190" stroke="#9ca3af" stroke-width="2"/>
  <line x1="360" y1="100" x2="360" y2="320" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5"/>

  <path d="M 342 110 A 140 140 0 0 1 342 270" fill="none" stroke="#111827" stroke-width="5"/>
  <circle cx="360" cy="190" r="5" fill="#111827"/>
  <text x="300" y="212" font-size="15" font-weight="700" fill="#111827" text-anchor="end">P (origin)</text>

  <line x1="60" y1="80" x2="200" y2="80" stroke="#2563eb" stroke-width="3" marker-end="url(#b)"/>
  <text x="60" y="66" font-size="14" fill="#2563eb" font-weight="700">incident light is always drawn travelling this way</text>

  <text x="180" y="244" font-size="15" font-weight="700" fill="#dc2626" text-anchor="middle">distances to the</text>
  <text x="180" y="266" font-size="15" font-weight="700" fill="#dc2626" text-anchor="middle">left of P are</text>
  <text x="180" y="290" font-size="19" font-weight="700" fill="#dc2626" text-anchor="middle">NEGATIVE</text>

  <text x="430" y="244" font-size="15" font-weight="700" fill="#059669" text-anchor="middle">to the right of P</text>
  <text x="430" y="266" font-size="15" font-weight="700" fill="#059669" text-anchor="middle">they are</text>
  <text x="430" y="290" font-size="19" font-weight="700" fill="#059669" text-anchor="middle">POSITIVE</text>

  <line x1="660" y1="190" x2="660" y2="132" stroke="#059669" stroke-width="3" marker-end="url(#g)"/>
  <text x="660" y="118" font-size="14" fill="#059669" font-weight="700" text-anchor="middle">height up: +</text>
  <line x1="660" y1="190" x2="660" y2="248" stroke="#dc2626" stroke-width="3" marker-end="url(#r)"/>
  <text x="660" y="268" font-size="14" fill="#dc2626" font-weight="700" text-anchor="middle">height down: −</text>

  <rect x="60" y="346" width="640" height="56" rx="8" fill="#f1f5f9"/>
  <text x="380" y="370" font-size="14.5" fill="#111827" text-anchor="middle" font-weight="700">A real object in front of a mirror always has u negative.</text>
  <text x="380" y="392" font-size="14.5" fill="#111827" text-anchor="middle">Concave mirror: f is negative. Convex mirror: f is positive.</text>
</svg>
