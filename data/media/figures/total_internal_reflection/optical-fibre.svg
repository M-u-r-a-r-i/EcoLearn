<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A length of optical fibre in cross-section. A ray entering the core strikes the boundary with the cladding at an angle larger than the critical angle, so it is totally internally reflected again and again and travels the whole length of the fibre without leaking out.</title>
  <defs>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="720" height="340" fill="#ffffff"/>

  <text x="360" y="30" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Inside an optical fibre</text>

  <!-- cladding -->
  <rect x="80" y="140" width="540" height="30" fill="#c7d2fe"/>
  <rect x="80" y="230" width="540" height="30" fill="#c7d2fe"/>
  <!-- core -->
  <rect x="80" y="170" width="540" height="60" fill="#e0f2fe"/>
  <line x1="80" y1="170" x2="620" y2="170" stroke="#1d4ed8" stroke-width="2.5"/>
  <line x1="80" y1="230" x2="620" y2="230" stroke="#1d4ed8" stroke-width="2.5"/>
  <rect x="80" y="140" width="540" height="120" fill="none" stroke="#6b7280" stroke-width="1.5"/>

  <rect x="303" y="176" width="128" height="26" rx="5" fill="#e0f2fe"/>
  <text x="367" y="195" font-size="13.5" fill="#1e3a8a" text-anchor="middle" font-weight="700">core (higher n)</text>
  <text x="350" y="160" font-size="13.5" fill="#3730a3" text-anchor="middle" font-weight="700">cladding — lower n</text>
  <text x="350" y="250" font-size="13.5" fill="#3730a3" text-anchor="middle" font-weight="700">cladding — lower n</text>

  <!-- the zig-zag ray -->
  <polyline points="44,244 80,230 224,170 368,230 512,170 620,215" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="620" y1="215" x2="676" y2="238" stroke="#dc2626" stroke-width="2.5" marker-end="url(#af)"/>

  <!-- normals at two bounce points -->
  <g stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="5 4">
    <line x1="224" y1="140" x2="224" y2="200"/>
    <line x1="368" y1="200" x2="368" y2="260"/>
  </g>
  <text x="232" y="136" font-size="12.5" fill="#6b7280" font-weight="700">normal</text>

  <text x="30" y="232" font-size="13" fill="#dc2626" font-weight="700">light in</text>
  <text x="636" y="268" font-size="13" fill="#dc2626" font-weight="700">light out</text>

  <text x="360" y="292" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Every bounce meets the wall beyond the critical angle, so every bounce reflects completely.</text>
  <text x="360" y="314" font-size="13.5" fill="#6b7280" text-anchor="middle">The fibre can be bent — as long as no bend is so sharp that a ray meets the wall inside the critical angle.</text>
</svg>
