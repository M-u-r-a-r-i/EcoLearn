<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A straight wire of length L carrying a current I sits in a uniform magnetic field into the page; the force on it is upward, of size B I L. Below, the wire is tilted at an angle theta to the field, and only the component of length perpendicular to B counts, giving B I L sin theta.</title>
  <defs>
    <marker id="i3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>

  <!-- top: perpendicular case, B into page -->
  <rect x="24" y="44" width="592" height="170" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="24" y="36" font-size="13.5" fill="#7c3aed" font-weight="700">B into the page (×)</text>
  <g fill="#7c3aed" font-size="15" text-anchor="middle" opacity="0.85">
    <text x="70" y="72">×</text><text x="170" y="72">×</text><text x="270" y="72">×</text><text x="370" y="72">×</text><text x="470" y="72">×</text><text x="570" y="72">×</text>
    <text x="70" y="196">×</text><text x="170" y="196">×</text><text x="270" y="196">×</text><text x="370" y="196">×</text><text x="470" y="196">×</text><text x="570" y="196">×</text>
  </g>

  <line x1="90" y1="150" x2="470" y2="150" stroke="#2563eb" stroke-width="6" marker-end="url(#i3)"/>
  <text x="500" y="156" font-size="15" fill="#2563eb" font-weight="700">I</text>
  <line x1="90" y1="150" x2="90" y2="168" stroke="#111827" stroke-width="2"/>
  <line x1="450" y1="150" x2="450" y2="168" stroke="#111827" stroke-width="2"/>
  <line x1="90" y1="164" x2="450" y2="164" stroke="#111827" stroke-width="1.5"/>
  <text x="270" y="182" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">L</text>

  <line x1="270" y1="142" x2="270" y2="86" stroke="#dc2626" stroke-width="5" marker-end="url(#f3)"/>
  <text x="288" y="106" font-size="15" fill="#dc2626" font-weight="700">F = BIL</text>

  <!-- bottom: angled case, B in the plane, to the right -->
  <rect x="24" y="238" width="592" height="150" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="40" y="262" font-size="13.5" fill="#111827" font-weight="700">Wire at an angle θ to B</text>

  <g stroke="#7c3aed" stroke-width="3">
    <line x1="60" y1="300" x2="170" y2="300"/>
    <line x1="60" y1="340" x2="170" y2="340"/>
    <line x1="60" y1="380" x2="170" y2="380"/>
  </g>
  <g fill="#7c3aed">
    <path d="M 170 300 l -12 -6 l 0 12 z"/><path d="M 170 340 l -12 -6 l 0 12 z"/><path d="M 170 380 l -12 -6 l 0 12 z"/>
  </g>
  <text x="112" y="292" font-size="13" fill="#7c3aed" font-weight="700">B</text>

  <line x1="220" y1="370" x2="400" y2="286" stroke="#2563eb" stroke-width="6" marker-end="url(#i3)"/>
  <line x1="220" y1="370" x2="400" y2="370" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M 262 370 A 42 42 0 0 0 258 352" fill="none" stroke="#111827" stroke-width="2"/>
  <text x="276" y="362" font-size="14" fill="#111827" font-weight="700">θ</text>
  <text x="246" y="306" font-size="14" fill="#2563eb" font-weight="700">I, length L</text>

  <text x="430" y="330" font-size="16" fill="#111827" font-weight="700">F = BIL sin θ</text>
  <text x="430" y="356" font-size="13" fill="#475569">θ = 90° → maximum</text>
  <text x="430" y="376" font-size="13" fill="#475569">θ = 0° → no force</text>
</svg>
