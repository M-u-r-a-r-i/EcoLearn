# x = t^2 (m, s). At t = 1 s the tangent slope is 2 m/s.
# Secants from t = 1 s: to 3 s slope 4, to 2 s slope 3.
title: "Secant slopes approach the tangent slope"
x: {label: "Time $t$ (s)", min: 0, max: 3.3}
y: {label: "Position $x$ (m)", min: 0, max: 10.5}
series:
  - label: "$x = t^2$"
    points: [[0, 0], [0.25, 0.0625], [0.5, 0.25], [0.75, 0.5625], [1, 1], [1.25, 1.5625],
             [1.5, 2.25], [1.75, 3.0625], [2, 4], [2.25, 5.0625], [2.5, 6.25],
             [2.75, 7.5625], [3, 9], [3.2, 10.24]]
    color: purple
  - label: "average, 1 s to 3 s: 4 m/s"
    points: [[1, 1], [3, 9]]
    color: orange
    style: dotted
  - label: "average, 1 s to 2 s: 3 m/s"
    points: [[1, 1], [2, 4]]
    color: orange
    style: dashed
  - label: "tangent at 1 s: 2 m/s (instantaneous)"
    points: [[0.5, 0], [3, 5]]
    color: blue
marks:
  - {x: 1, y: 1, text: "t = 1 s", color: gray, offset: [-50, 6]}
legend: upper left
