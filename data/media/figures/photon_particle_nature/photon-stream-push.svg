<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A stream of photons from a lamp striking a black absorbing plate; each photon delivers momentum h over lambda, and the many arrivals each second add up to a steady force equal to the absorbed power divided by c</title>
  <defs>
    <marker id="ph" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="700" height="380" fill="#ffffff"/>

  <text x="350" y="30" font-size="16" text-anchor="middle" fill="#111827" font-weight="700">Each photon delivers a kick. Enough of them make a steady push.</text>

  <!-- lamp -->
  <rect x="40" y="140" width="52" height="80" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="2.5"/>
  <text x="66" y="238" font-size="13" text-anchor="middle" fill="#92400e" font-weight="700">lamp</text>
  <text x="66" y="256" font-size="13" text-anchor="middle" fill="#92400e">power P</text>

  <!-- photon stream: three rows of wave packets with arrows -->
  <g stroke="#b45309" stroke-width="2.5" fill="none">
    <path d="M110 120 q 9 -18 18 0 t 18 0"/>
    <path d="M190 120 q 9 -18 18 0 t 18 0"/>
    <path d="M270 120 q 9 -18 18 0 t 18 0"/>
    <path d="M350 120 q 9 -18 18 0 t 18 0"/>
    <path d="M110 180 q 9 -18 18 0 t 18 0"/>
    <path d="M190 180 q 9 -18 18 0 t 18 0"/>
    <path d="M270 180 q 9 -18 18 0 t 18 0"/>
    <path d="M350 180 q 9 -18 18 0 t 18 0"/>
    <path d="M110 240 q 9 -18 18 0 t 18 0"/>
    <path d="M190 240 q 9 -18 18 0 t 18 0"/>
    <path d="M270 240 q 9 -18 18 0 t 18 0"/>
    <path d="M350 240 q 9 -18 18 0 t 18 0"/>
  </g>
  <g stroke="#b45309" stroke-width="2.5">
    <line x1="400" y1="120" x2="470" y2="120" marker-end="url(#ph)"/>
    <line x1="400" y1="180" x2="470" y2="180" marker-end="url(#ph)"/>
    <line x1="400" y1="240" x2="470" y2="240" marker-end="url(#ph)"/>
  </g>
  <text x="240" y="92" font-size="14" text-anchor="middle" fill="#92400e" font-weight="700">N photons every second, each carrying p = h/&#955;</text>

  <!-- absorbing plate -->
  <rect x="478" y="90" width="26" height="190" fill="#374151" stroke="#111827" stroke-width="2"/>
  <text x="491" y="302" font-size="13" text-anchor="middle" fill="#374151" font-weight="700">plate</text>
  <text x="491" y="320" font-size="13" text-anchor="middle" fill="#374151">absorbs every photon</text>

  <!-- resulting force -->
  <line x1="512" y1="180" x2="600" y2="180" stroke="#dc2626" stroke-width="4" marker-end="url(#fr)"/>
  <text x="608" y="174" font-size="16" fill="#dc2626" font-weight="700">F = Np</text>
  <text x="608" y="198" font-size="16" fill="#dc2626" font-weight="700">&#160;&#160;&#160;= P/c</text>

  <text x="350" y="356" font-size="13" text-anchor="middle" fill="#6b7280">Dividing by c is what makes this force tiny: a watt of light pushes with only a few nanonewtons.</text>
</svg>
