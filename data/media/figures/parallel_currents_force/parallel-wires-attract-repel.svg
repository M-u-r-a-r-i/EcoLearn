<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Left: two parallel wires a distance d apart carrying currents in the same direction, pulled towards each other. Right: the same wires with currents in opposite directions, pushed apart. The force per unit length is mu-nought I one I two over two pi d.</title>
  <defs>
    <marker id="p1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="p2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>

  <!-- LEFT: same direction -->
  <text x="24" y="34" font-size="14.5" font-weight="700" fill="#111827">Same direction → attract</text>
  <line x1="70" y1="320" x2="70" y2="80" stroke="#2563eb" stroke-width="6" marker-end="url(#p1)"/>
  <line x1="220" y1="320" x2="220" y2="80" stroke="#2563eb" stroke-width="6" marker-end="url(#p1)"/>
  <text x="70" y="346" font-size="14" fill="#2563eb" font-weight="700" text-anchor="middle">I₁</text>
  <text x="220" y="346" font-size="14" fill="#2563eb" font-weight="700" text-anchor="middle">I₂</text>

  <line x1="70" y1="200" x2="136" y2="200" stroke="#dc2626" stroke-width="4" marker-end="url(#p2)"/>
  <line x1="220" y1="200" x2="154" y2="200" stroke="#dc2626" stroke-width="4" marker-end="url(#p2)"/>
  <text x="145" y="182" font-size="13.5" fill="#dc2626" font-weight="700" text-anchor="middle">F</text>

  <line x1="70" y1="270" x2="220" y2="270" stroke="#111827" stroke-width="1.5"/>
  <line x1="70" y1="264" x2="70" y2="276" stroke="#111827" stroke-width="1.5"/>
  <line x1="220" y1="264" x2="220" y2="276" stroke="#111827" stroke-width="1.5"/>
  <text x="145" y="292" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">d</text>

  <line x1="320" y1="24" x2="320" y2="330" stroke="#e2e8f0" stroke-width="2"/>

  <!-- RIGHT: opposite -->
  <text x="352" y="34" font-size="14.5" font-weight="700" fill="#111827">Opposite directions → repel</text>
  <line x1="400" y1="320" x2="400" y2="80" stroke="#2563eb" stroke-width="6" marker-end="url(#p1)"/>
  <line x1="550" y1="80" x2="550" y2="320" stroke="#2563eb" stroke-width="6" marker-end="url(#p1)"/>
  <text x="400" y="346" font-size="14" fill="#2563eb" font-weight="700" text-anchor="middle">I₁</text>
  <text x="550" y="346" font-size="14" fill="#2563eb" font-weight="700" text-anchor="middle">I₂</text>

  <line x1="400" y1="200" x2="330" y2="200" stroke="#dc2626" stroke-width="4" marker-end="url(#p2)"/>
  <line x1="550" y1="200" x2="620" y2="200" stroke="#dc2626" stroke-width="4" marker-end="url(#p2)"/>
  <text x="366" y="186" font-size="13.5" fill="#dc2626" font-weight="700" text-anchor="middle">F</text>
  <text x="586" y="186" font-size="13.5" fill="#dc2626" font-weight="700" text-anchor="middle">F</text>

  <text x="320" y="376" font-size="17" fill="#111827" font-weight="700" text-anchor="middle">F / L = μ₀ I₁ I₂ / 2π d</text>
</svg>
