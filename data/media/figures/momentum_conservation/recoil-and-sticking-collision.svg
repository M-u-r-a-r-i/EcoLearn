<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Momentum before and after a recoil and a sticking collision: the total is the same before and after</title>
  <defs>
    <marker id="hp" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>
  <line x1="320" y1="50" x2="320" y2="365" stroke="#d1d5db" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="160" y="30" font-size="16" font-weight="600" fill="#111827" text-anchor="middle">Before</text>
  <text x="480" y="30" font-size="16" font-weight="600" fill="#111827" text-anchor="middle">After</text>

  <!-- Recoil -->
  <text x="20" y="66" font-size="14" font-weight="600" fill="#374151">Recoil: starts at rest</text>
  <line x1="20" y1="150" x2="300" y2="150" stroke="#6b7280" stroke-width="2"/>
  <line x1="340" y1="150" x2="620" y2="150" stroke="#6b7280" stroke-width="2"/>
  <rect x="110" y="100" width="80" height="50" rx="4" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <text x="150" y="130" font-size="14" fill="#111827" text-anchor="middle">M</text>
  <circle cx="200" cy="140" r="10" fill="#b91c1c" stroke="#7f1d1d"/>
  <text x="212" y="126" font-size="13" fill="#111827">m</text>
  <text x="160" y="178" font-size="13" fill="#7c3aed" text-anchor="middle">total p = 0</text>

  <rect x="390" y="100" width="80" height="50" rx="4" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <text x="430" y="130" font-size="14" fill="#111827" text-anchor="middle">M</text>
  <line x1="410" y1="88" x2="366" y2="88" stroke="#7c3aed" stroke-width="4" marker-end="url(#hp)"/>
  <text x="352" y="72" font-size="12" fill="#7c3aed">MV (backwards)</text>
  <circle cx="545" cy="140" r="10" fill="#b91c1c" stroke="#7f1d1d"/>
  <line x1="545" y1="118" x2="589" y2="118" stroke="#7c3aed" stroke-width="4" marker-end="url(#hp)"/>
  <text x="530" y="106" font-size="12" fill="#7c3aed">mv</text>
  <text x="480" y="178" font-size="13" fill="#7c3aed" text-anchor="middle">MV + mv = 0  (equal and opposite)</text>

  <!-- Sticking collision -->
  <text x="20" y="232" font-size="14" font-weight="600" fill="#374151">Collision: they stick together</text>
  <line x1="20" y1="320" x2="300" y2="320" stroke="#6b7280" stroke-width="2"/>
  <line x1="340" y1="320" x2="620" y2="320" stroke="#6b7280" stroke-width="2"/>
  <circle cx="60" cy="310" r="10" fill="#b91c1c" stroke="#7f1d1d"/>
  <text x="54" y="296" font-size="13" fill="#111827">m</text>
  <line x1="42" y1="276" x2="130" y2="276" stroke="#7c3aed" stroke-width="4" marker-end="url(#hp)"/>
  <text x="60" y="262" font-size="12" fill="#7c3aed">mu</text>
  <rect x="190" y="270" width="80" height="50" rx="4" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <text x="230" y="300" font-size="14" fill="#111827" text-anchor="middle">M at rest</text>
  <text x="160" y="352" font-size="13" fill="#7c3aed" text-anchor="middle">total p = mu</text>

  <rect x="420" y="270" width="80" height="50" rx="4" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <circle cx="490" cy="310" r="10" fill="#b91c1c" stroke="#7f1d1d"/>
  <text x="452" y="300" font-size="14" fill="#111827" text-anchor="middle">M + m</text>
  <line x1="420" y1="256" x2="508" y2="256" stroke="#7c3aed" stroke-width="4" marker-end="url(#hp)"/>
  <text x="430" y="242" font-size="12" fill="#7c3aed">(M + m)V</text>
  <text x="480" y="352" font-size="13" fill="#7c3aed" text-anchor="middle">(M + m)V = mu, so V is small</text>
  <text x="320" y="386" font-size="12" fill="#4b5563" text-anchor="middle">Purple arrows are momenta. Arrow lengths show that each total is unchanged.</text>
</svg>
