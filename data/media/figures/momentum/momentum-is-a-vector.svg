<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A 0.16 kg ball arriving at 25 m/s and leaving at 25 m/s: equal speeds, opposite momenta, change of 8.0 kg m/s</title>
  <defs>
    <marker id="hb" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="hp" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="hg" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="30" y="36" font-size="17" font-weight="600" fill="#111827">Momentum p = mv is a vector (m = 0.16 kg)</text>
  <line x1="470" y1="30" x2="600" y2="30" stroke="#374151" stroke-width="2" marker-end="url(#hg)"/>
  <text x="470" y="52" font-size="12" fill="#374151">positive direction</text>

  <!-- before -->
  <text x="30" y="92" font-size="14" font-weight="600" fill="#111827">Before: arriving at 25 m/s</text>
  <circle cx="320" cy="120" r="12" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1.5"/>
  <line x1="300" y1="120" x2="220" y2="120" stroke="#2563eb" stroke-width="3" marker-end="url(#hb)"/>
  <text x="228" y="106" font-size="13" fill="#2563eb">v = −25 m/s</text>
  <line x1="420" y1="140" x2="320" y2="140" stroke="#7c3aed" stroke-width="5" marker-end="url(#hp)"/>
  <text x="430" y="145" font-size="14" fill="#7c3aed">p = −4.0 kg m/s</text>

  <!-- after -->
  <text x="30" y="200" font-size="14" font-weight="600" fill="#111827">After: driven back at 25 m/s</text>
  <circle cx="320" cy="228" r="12" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1.5"/>
  <line x1="340" y1="228" x2="420" y2="228" stroke="#2563eb" stroke-width="3" marker-end="url(#hb)"/>
  <text x="352" y="212" font-size="13" fill="#2563eb">v = +25 m/s</text>
  <line x1="320" y1="250" x2="420" y2="250" stroke="#7c3aed" stroke-width="5" marker-end="url(#hp)"/>
  <text x="430" y="255" font-size="14" fill="#7c3aed">p = +4.0 kg m/s</text>
  <text x="30" y="228" font-size="12" fill="#4b5563">same speed,</text>
  <text x="30" y="244" font-size="12" fill="#4b5563">opposite momentum</text>

  <!-- change -->
  <text x="30" y="310" font-size="14" font-weight="600" fill="#111827">Change: Δp = (+4.0) − (−4.0)</text>
  <line x1="220" y1="340" x2="420" y2="340" stroke="#7c3aed" stroke-width="5" marker-end="url(#hp)"/>
  <text x="430" y="345" font-size="14" fill="#7c3aed">Δp = +8.0 kg m/s</text>
  <text x="30" y="380" font-size="12" fill="#4b5563">Ignoring direction (4.0 − 4.0) would wrongly give a change of zero.</text>
</svg>
