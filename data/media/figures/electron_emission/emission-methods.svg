<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Four ways electrons are freed from a metal: thermionic emission by heating, photoelectric emission by light, field emission by a strong electric field, and secondary emission by fast particles striking the surface</title>
  <defs>
    <marker id="e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e3a8a"/>
    </marker>
    <marker id="e2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="e3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/>
    </marker>
    <marker id="e4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>
  <rect width="800" height="400" fill="#ffffff"/>
  <text x="400" y="28" font-size="16" text-anchor="middle" fill="#111827" font-weight="700">Four ways to pay the work function</text>

  <!-- panel 1: thermionic -->
  <g>
    <rect x="16" y="46" width="184" height="216" rx="8" fill="#fff7ed" stroke="#9a3412" stroke-width="2"/>
    <text x="108" y="70" font-size="14" text-anchor="middle" fill="#9a3412" font-weight="700">Thermionic</text>
    <g fill="#1e3a8a">
      <circle cx="66" cy="120" r="6"/><circle cx="108" cy="104" r="6"/><circle cx="150" cy="128" r="6"/>
    </g>
    <g stroke="#1e3a8a" stroke-width="2" marker-end="url(#e1)">
      <line x1="66" y1="176" x2="66" y2="132"/>
      <line x1="108" y1="176" x2="108" y2="116"/>
      <line x1="150" y1="176" x2="150" y2="140"/>
    </g>
    <rect x="40" y="180" width="136" height="26" fill="#94a3b8"/>
    <text x="108" y="199" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="700">metal</text>
    <g stroke="#dc2626" stroke-width="2.5" fill="none">
      <path d="M50,222 q6,-10 12,0 q6,10 12,0"/>
      <path d="M96,222 q6,-10 12,0 q6,10 12,0"/>
      <path d="M142,222 q6,-10 12,0 q6,10 12,0"/>
    </g>
    <text x="108" y="250" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="700">the filament is heated</text>
    <text x="108" y="288" font-size="12.5" text-anchor="middle" fill="#374151">Thermal energy alone</text>
    <text x="108" y="306" font-size="12.5" text-anchor="middle" fill="#374151">lifts a few electrons out.</text>
  </g>

  <!-- panel 2: photoelectric -->
  <g>
    <rect x="208" y="46" width="184" height="216" rx="8" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
    <text x="300" y="70" font-size="14" text-anchor="middle" fill="#a16207" font-weight="700">Photoelectric</text>
    <circle cx="322" cy="110" r="6" fill="#1e3a8a"/>
    <line x1="322" y1="176" x2="322" y2="122" stroke="#1e3a8a" stroke-width="2" marker-end="url(#e1)"/>
    <line x1="238" y1="122" x2="312" y2="172" stroke="#ca8a04" stroke-width="2.5" marker-end="url(#e3)"/>
    <g fill="#ca8a04">
      <circle cx="244" cy="126" r="4"/><circle cx="266" cy="141" r="4"/><circle cx="288" cy="156" r="4"/>
    </g>
    <text x="226" y="98" font-size="12" fill="#a16207" font-weight="700">one photon, h&#957;</text>
    <rect x="232" y="180" width="136" height="26" fill="#94a3b8"/>
    <text x="300" y="199" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="700">metal</text>
    <text x="300" y="250" font-size="13" text-anchor="middle" fill="#a16207" font-weight="700">light shines on it</text>
    <text x="300" y="288" font-size="12.5" text-anchor="middle" fill="#374151">One packet of light gives</text>
    <text x="300" y="306" font-size="12.5" text-anchor="middle" fill="#374151">all its energy to one electron.</text>
  </g>

  <!-- panel 3: field emission -->
  <g>
    <rect x="400" y="46" width="184" height="216" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="492" y="70" font-size="14" text-anchor="middle" fill="#1d4ed8" font-weight="700">Field</text>
    <g stroke="#dc2626" stroke-width="2" marker-end="url(#e2)">
      <line x1="430" y1="104" x2="470" y2="132"/>
      <line x1="554" y1="104" x2="514" y2="132"/>
      <line x1="492" y1="92" x2="492" y2="126"/>
    </g>
    <polygon points="462,206 522,206 500,140 484,140" fill="#94a3b8"/>
    <rect x="428" y="180" width="128" height="26" fill="#94a3b8"/>
    <text x="492" y="199" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="700">metal</text>
    <circle cx="546" cy="160" r="6" fill="#1e3a8a"/>
    <line x1="508" y1="146" x2="538" y2="157" stroke="#1e3a8a" stroke-width="2" marker-end="url(#e1)"/>
    <text x="492" y="250" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="700">a very strong field pulls</text>
    <text x="492" y="288" font-size="12.5" text-anchor="middle" fill="#374151">At a sharp tip the field is</text>
    <text x="492" y="306" font-size="12.5" text-anchor="middle" fill="#374151">huge, so electrons are torn off.</text>
  </g>

  <!-- panel 4: secondary -->
  <g>
    <rect x="592" y="46" width="184" height="216" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
    <text x="684" y="70" font-size="14" text-anchor="middle" fill="#6d28d9" font-weight="700">Secondary</text>
    <line x1="616" y1="106" x2="666" y2="174" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#e4)"/>
    <text x="606" y="96" font-size="12" fill="#6d28d9" font-weight="700">a fast particle hits</text>
    <g fill="#1e3a8a">
      <circle cx="706" cy="128" r="6"/><circle cx="744" cy="148" r="6"/>
    </g>
    <g stroke="#1e3a8a" stroke-width="2" marker-end="url(#e1)">
      <line x1="678" y1="176" x2="700" y2="140"/>
      <line x1="692" y1="176" x2="736" y2="155"/>
    </g>
    <rect x="616" y="180" width="136" height="26" fill="#94a3b8"/>
    <text x="684" y="199" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="700">metal</text>
    <text x="684" y="250" font-size="12.5" text-anchor="middle" fill="#6d28d9" font-weight="700">an impact knocks them out</text>
    <text x="684" y="288" font-size="12.5" text-anchor="middle" fill="#374151">The incoming particle's energy</text>
    <text x="684" y="306" font-size="12.5" text-anchor="middle" fill="#374151">frees several more electrons.</text>
  </g>

  <circle cx="200" cy="344" r="6" fill="#1e3a8a"/>
  <text x="216" y="350" font-size="13" fill="#374151">= a freed electron, in every panel</text>
  <text x="400" y="384" font-size="14" text-anchor="middle" fill="#111827" font-weight="700">The energy comes from a different source each time; the amount needed is the same &#966;.</text>
</svg>
