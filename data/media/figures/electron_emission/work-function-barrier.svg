<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">An energy diagram of a metal surface: free electrons sit below the surface in an energy well, and the work function is the energy gap from the highest filled level up to the vacuum level outside</title>
  <defs>
    <marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="gd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="700" height="420" fill="#ffffff"/>

  <text x="350" y="30" font-size="16" text-anchor="middle" fill="#111827" font-weight="700">No electron leaves until it is given at least &#966;.</text>

  <!-- energy axis -->
  <line x1="56" y1="370" x2="56" y2="80" stroke="#374151" stroke-width="2.5" marker-end="url(#up)"/>
  <text x="66" y="76" font-size="14" fill="#374151" font-weight="600">energy</text>

  <!-- the metal block -->
  <rect x="90" y="250" width="250" height="120" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2.5"/>
  <text x="215" y="394" font-size="15" text-anchor="middle" fill="#1e3a8a" font-weight="700">inside the metal</text>

  <!-- filled levels -->
  <g stroke="#1e3a8a" stroke-width="2">
    <line x1="102" y1="360" x2="328" y2="360"/>
    <line x1="102" y1="338" x2="328" y2="338"/>
    <line x1="102" y1="316" x2="328" y2="316"/>
    <line x1="102" y1="294" x2="328" y2="294"/>
  </g>
  <line x1="102" y1="270" x2="328" y2="270" stroke="#1e3a8a" stroke-width="3.5"/>
  <text x="215" y="240" font-size="13" text-anchor="middle" fill="#1e3a8a" font-weight="700">highest filled level</text>
  <g fill="#1e3a8a">
    <circle cx="140" cy="360" r="5"/><circle cx="220" cy="360" r="5"/><circle cx="300" cy="360" r="5"/>
    <circle cx="170" cy="338" r="5"/><circle cx="270" cy="338" r="5"/>
    <circle cx="200" cy="316" r="5"/><circle cx="310" cy="316" r="5"/>
    <circle cx="160" cy="294" r="5"/><circle cx="250" cy="294" r="5"/>
    <circle cx="210" cy="270" r="5"/><circle cx="290" cy="270" r="5"/>
  </g>

  <!-- vacuum level -->
  <line x1="90" y1="160" x2="520" y2="160" stroke="#111827" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="90" y="150" font-size="14" fill="#111827" font-weight="700">vacuum level &#8212; free outside, at rest</text>

  <!-- work function gap -->
  <line x1="380" y1="270" x2="380" y2="162" stroke="#16a34a" stroke-width="3" marker-end="url(#gr)"/>
  <text x="394" y="206" font-size="20" fill="#16a34a" font-weight="700">&#966;</text>
  <text x="412" y="206" font-size="14" fill="#16a34a" font-weight="700">= work function</text>
  <text x="394" y="228" font-size="13" fill="#16a34a">the least energy that</text>
  <text x="394" y="245" font-size="13" fill="#16a34a">frees an electron</text>

  <!-- an electron given more than phi -->
  <line x1="520" y1="200" x2="520" y2="110" stroke="#111827" stroke-width="2.5" marker-end="url(#gd)"/>
  <circle cx="520" cy="92" r="7" fill="#1e3a8a"/>
  <text x="536" y="86" font-size="13" fill="#111827" font-weight="600">given more than &#966;,</text>
  <text x="536" y="104" font-size="13" fill="#111827">it escapes and keeps the</text>
  <text x="536" y="122" font-size="13" fill="#111827">rest as kinetic energy</text>
  <text x="520" y="222" font-size="13" text-anchor="middle" fill="#6b7280">surface</text>
</svg>
