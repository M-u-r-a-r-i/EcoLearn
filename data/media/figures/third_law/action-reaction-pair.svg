<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">While in contact, body A pushes body B one way and B pushes A the other way with an equal force; each force acts on a different body</title>
  <defs>
    <marker id="hr" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="30" y="40" font-size="17" font-weight="600" fill="#111827">A third-law pair: equal, opposite, on different bodies</text>
  <text x="30" y="62" font-size="13" fill="#4b5563">Bodies drawn slightly apart so each force can be seen on its own body</text>

  <!-- bat (side view of blade) -->
  <rect x="236" y="120" width="34" height="170" rx="6" fill="#e8c890" stroke="#92400e" stroke-width="2"/>
  <rect x="244" y="80" width="18" height="44" rx="4" fill="#374151"/>
  <text x="253" y="315" font-size="14" fill="#111827" text-anchor="middle">body A</text>

  <!-- ball -->
  <circle cx="318" cy="220" r="20" fill="#b91c1c" stroke="#7f1d1d" stroke-width="2"/>
  <text x="318" y="270" font-size="14" fill="#111827" text-anchor="middle">body B</text>

  <!-- force on B by A -->
  <line x1="340" y1="220" x2="470" y2="220" stroke="#dc2626" stroke-width="5" marker-end="url(#hr)"/>
  <text x="350" y="198" font-size="14" fill="#dc2626">force on B by A</text>
  <text x="350" y="245" font-size="13" fill="#dc2626">F</text>

  <!-- force on A by B -->
  <line x1="234" y1="220" x2="104" y2="220" stroke="#dc2626" stroke-width="5" marker-end="url(#hr)"/>
  <text x="95" y="198" font-size="14" fill="#dc2626">force on A by B</text>
  <text x="200" y="245" font-size="13" fill="#dc2626">−F</text>

  <rect x="30" y="335" width="580" height="46" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="320" y="355" font-size="13" fill="#111827" text-anchor="middle">Same size, opposite direction, acting at the same instant.</text>
  <text x="320" y="372" font-size="13" fill="#111827" text-anchor="middle">They act on different bodies, so they never cancel each other.</text>
</svg>
