<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A uniform field between two charged plates at 300 V and 0 V, with dashed lines at 200 V and 100 V one centimetre apart; a positive test charge is moved from B at 100 V up to A at 200 V, against the field</title>
  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="da" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>

  <!-- plates -->
  <rect x="110" y="52" width="300" height="10" fill="#dc2626"/>
  <rect x="110" y="328" width="300" height="10" fill="#2563eb"/>
  <text x="260" y="44" font-size="15" text-anchor="middle" fill="#dc2626" font-weight="700">+ + + + + + + + + +</text>
  <text x="260" y="360" font-size="15" text-anchor="middle" fill="#2563eb" font-weight="700">− − − − − − − − − −</text>

  <!-- equipotentials -->
  <line x1="110" y1="150" x2="410" y2="150" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="110" y1="240" x2="410" y2="240" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 4"/>
  <g font-size="14" font-weight="700" fill="#ea580c" text-anchor="end">
    <text x="100" y="62">300 V</text>
    <text x="100" y="155">200 V</text>
    <text x="100" y="245">100 V</text>
    <text x="100" y="338">0 V</text>
  </g>

  <!-- uniform field, pointing from high to low potential -->
  <g stroke="#7c3aed" stroke-width="2.5" marker-end="url(#fa)">
    <line x1="150" y1="70" x2="150" y2="318"/>
    <line x1="220" y1="70" x2="220" y2="318"/>
    <line x1="380" y1="70" x2="380" y2="318"/>
  </g>
  <text x="160" y="110" font-size="16" fill="#7c3aed" font-weight="700">E</text>

  <!-- spacing marker -->
  <line x1="425" y1="150" x2="425" y2="240" stroke="#374151" stroke-width="1.5"/>
  <line x1="419" y1="150" x2="431" y2="150" stroke="#374151" stroke-width="1.5"/>
  <line x1="419" y1="240" x2="431" y2="240" stroke="#374151" stroke-width="1.5"/>
  <text x="434" y="200" font-size="14" fill="#374151">1.0 cm</text>

  <!-- test charge moved from B to A -->
  <line x1="300" y1="232" x2="300" y2="166" stroke="#111827" stroke-width="2.5" marker-end="url(#da)"/>
  <circle cx="300" cy="240" r="9" fill="#dc2626"/>
  <text x="300" y="245" font-size="13" text-anchor="middle" fill="#fff" font-weight="700">+</text>
  <text x="314" y="262" font-size="15" fill="#111827" font-weight="700">B</text>
  <circle cx="300" cy="150" r="5" fill="#111827"/>
  <text x="312" y="140" font-size="15" fill="#111827" font-weight="700">A</text>

  <!-- notes -->
  <g font-size="14" fill="#111827">
    <text x="440" y="96" font-weight="700">Push +q from B to A,</text>
    <text x="440" y="114" font-weight="700">against the field:</text>
    <text x="440" y="136">W = q(V<tspan font-size="10" dy="4">A</tspan><tspan dy="-4"> − V</tspan><tspan font-size="10" dy="4">B</tspan><tspan dy="-4">)</tspan></text>
    <text x="440" y="154">= q × 100 V</text>
    <text x="440" y="270" font-weight="700">Field strength:</text>
    <text x="440" y="290">E = 100 V ÷ 0.010 m</text>
    <text x="440" y="308">= 1.0 × 10⁴ V/m</text>
  </g>
  <text x="320" y="388" font-size="14" text-anchor="middle" fill="#374151">Potential falls steadily in the direction of the field.</text>
</svg>
