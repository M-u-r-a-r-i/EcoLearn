<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Left: the inside of a moving coil galvanometer, with a coil wound on a soft iron cylinder between two concave pole pieces, N on the left and S on the right, a spiral spring above, and field arrows pointing straight across the gap from N to S. Right: the pointer and scale the user sees from outside.</title>
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="700" fill="#111827">Inside a moving coil galvanometer</text>

  <!-- spiral spring above the core -->
  <path d="M 230 128 A 14 14 0 1 1 216 114 A 22 22 0 1 0 238 92" fill="none" stroke="#a16207" stroke-width="2.5"/>
  <text x="256" y="106" font-size="12.5" fill="#a16207" font-weight="700">spiral spring: restoring torque = kφ</text>

  <!-- pole pieces with concave faces -->
  <path d="M 60 130 H 196 A 78 78 0 0 0 196 270 H 60 Z" fill="#cbd5e1" stroke="#475569" stroke-width="3"/>
  <path d="M 400 130 H 264 A 78 78 0 0 1 264 270 H 400 Z" fill="#cbd5e1" stroke="#475569" stroke-width="3"/>
  <text x="104" y="210" font-size="26" fill="#111827" font-weight="700">N</text>
  <text x="348" y="210" font-size="26" fill="#111827" font-weight="700">S</text>

  <!-- soft iron core -->
  <circle cx="230" cy="200" r="44" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
  <text x="230" y="205" font-size="12.5" fill="#475569" font-weight="700" text-anchor="middle">soft iron</text>

  <!-- radial field arrows: N face -> core, core -> S face -->
  <g stroke="#7c3aed" stroke-width="2.5">
    <line x1="163" y1="160" x2="199" y2="181"/>
    <line x1="152" y1="200" x2="194" y2="200"/>
    <line x1="163" y1="240" x2="199" y2="219"/>
    <line x1="261" y1="181" x2="297" y2="160"/>
    <line x1="266" y1="200" x2="308" y2="200"/>
    <line x1="261" y1="219" x2="297" y2="240"/>
  </g>
  <g fill="#7c3aed">
    <path d="M 202 183 l -12 -3 l 2 10 z"/>
    <path d="M 197 200 l -11 -5 l 0 10 z"/>
    <path d="M 202 217 l -12 3 l 2 -10 z"/>
    <path d="M 300 158 l -12 -3 l 2 10 z"/>
    <path d="M 311 200 l -11 -5 l 0 10 z"/>
    <path d="M 300 242 l -12 3 l 2 -10 z"/>
  </g>

  <!-- coil sides in the gap -->
  <rect x="162" y="176" width="13" height="48" fill="#2563eb"/>
  <rect x="285" y="176" width="13" height="48" fill="#2563eb"/>
  <text x="160" y="124" font-size="12" fill="#2563eb" font-weight="700" text-anchor="middle">coil</text>
  <text x="300" y="124" font-size="12" fill="#2563eb" font-weight="700" text-anchor="middle">coil</text>

  <text x="320" y="296" font-size="12.5" fill="#7c3aed" font-weight="700" text-anchor="middle">Radial field: B always lies along the coil's plane, so the torque is NIAB at any angle.</text>

  <!-- right panel: pointer and scale -->
  <line x1="424" y1="48" x2="424" y2="288" stroke="#e2e8f0" stroke-width="2"/>
  <text x="440" y="70" font-size="13.5" font-weight="700" fill="#111827">What you see outside</text>
  <path d="M 452 210 A 84 84 0 0 1 620 210" fill="none" stroke="#111827" stroke-width="2.5"/>
  <g stroke="#111827" stroke-width="2">
    <line x1="452" y1="210" x2="440" y2="210"/>
    <line x1="536" y1="126" x2="536" y2="114"/>
    <line x1="620" y1="210" x2="632" y2="210"/>
  </g>
  <text x="536" y="106" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">0</text>
  <line x1="536" y1="210" x2="596" y2="151" stroke="#dc2626" stroke-width="3"/>
  <circle cx="536" cy="210" r="6" fill="#111827"/>
  <text x="536" y="234" font-size="12.5" fill="#dc2626" font-weight="700" text-anchor="middle">pointer turns with the coil</text>

  <rect x="24" y="310" width="592" height="56" rx="8" fill="#f1f5f9"/>
  <text x="320" y="334" font-size="16" fill="#111827" text-anchor="middle" font-weight="700">N I A B = k φ   →   φ = (NAB / k) I</text>
  <text x="320" y="356" font-size="12.5" fill="#475569" text-anchor="middle">the deflection φ is directly proportional to the current I</text>
  <text x="320" y="386" font-size="12.5" fill="#475569" text-anchor="middle">Current sensitivity = φ/I = NAB/k; voltage sensitivity = φ/V = NAB/(kG), where G is the coil's resistance.</text>
</svg>
