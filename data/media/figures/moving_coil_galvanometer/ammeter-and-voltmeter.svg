<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Left: a galvanometer with a small shunt resistance connected in parallel becomes an ammeter, and is joined in series with the circuit. Right: the same galvanometer with a large resistance in series becomes a voltmeter, and is joined across the component.</title>
  <rect width="640" height="400" fill="#ffffff"/>

  <!-- LEFT: ammeter -->
  <text x="24" y="32" font-size="14.5" font-weight="700" fill="#111827">Ammeter: small shunt in parallel</text>
  <circle cx="150" cy="120" r="26" fill="#fff" stroke="#111827" stroke-width="3"/>
  <text x="150" y="127" font-size="17" font-weight="700" text-anchor="middle" fill="#111827">G</text>
  <line x1="60" y1="120" x2="124" y2="120" stroke="#2563eb" stroke-width="3"/>
  <line x1="176" y1="120" x2="250" y2="120" stroke="#2563eb" stroke-width="3"/>
  <path d="M 90 120 L 90 200 L 210 200 L 210 120" fill="none" stroke="#2563eb" stroke-width="3"/>
  <path d="M 130 200 l 0 -12 l 12 24 l 12 -24 l 12 24 l 12 -24 l 6 12" fill="none" stroke="#111827" stroke-width="3"/>
  <text x="150" y="232" font-size="13" fill="#111827" font-weight="700" text-anchor="middle">shunt S (small)</text>
  <text x="150" y="252" font-size="12.5" fill="#475569" text-anchor="middle">most of the current goes this way</text>

  <text x="24" y="292" font-size="13" fill="#111827" font-weight="700">Connected in series with the circuit:</text>
  <line x1="40" y1="330" x2="100" y2="330" stroke="#2563eb" stroke-width="3"/>
  <circle cx="126" cy="330" r="20" fill="#fff" stroke="#111827" stroke-width="3"/>
  <text x="126" y="336" font-size="15" font-weight="700" text-anchor="middle" fill="#111827">A</text>
  <line x1="146" y1="330" x2="190" y2="330" stroke="#2563eb" stroke-width="3"/>
  <path d="M 190 330 l 0 -12 l 12 24 l 12 -24 l 12 24 l 12 -24 l 6 12" fill="none" stroke="#111827" stroke-width="3"/>
  <line x1="244" y1="330" x2="280" y2="330" stroke="#2563eb" stroke-width="3"/>
  <text x="40" y="368" font-size="12.5" fill="#475569">an ideal ammeter has almost no resistance</text>

  <line x1="310" y1="20" x2="310" y2="380" stroke="#e2e8f0" stroke-width="2"/>

  <!-- RIGHT: voltmeter -->
  <text x="340" y="32" font-size="14.5" font-weight="700" fill="#111827">Voltmeter: large R in series</text>
  <circle cx="420" cy="120" r="26" fill="#fff" stroke="#111827" stroke-width="3"/>
  <text x="420" y="127" font-size="17" font-weight="700" text-anchor="middle" fill="#111827">G</text>
  <line x1="350" y1="120" x2="394" y2="120" stroke="#2563eb" stroke-width="3"/>
  <line x1="446" y1="120" x2="470" y2="120" stroke="#2563eb" stroke-width="3"/>
  <path d="M 470 120 l 0 -12 l 12 24 l 12 -24 l 12 24 l 12 -24 l 6 12" fill="none" stroke="#111827" stroke-width="3"/>
  <line x1="524" y1="120" x2="600" y2="120" stroke="#2563eb" stroke-width="3"/>
  <text x="500" y="164" font-size="13" fill="#111827" font-weight="700" text-anchor="middle">R (large)</text>

  <text x="340" y="212" font-size="13" fill="#111827" font-weight="700">Connected across the component:</text>
  <line x1="352" y1="290" x2="600" y2="290" stroke="#2563eb" stroke-width="3"/>
  <path d="M 430 290 l 0 -12 l 12 24 l 12 -24 l 12 24 l 12 -24 l 6 12" fill="none" stroke="#111827" stroke-width="3"/>
  <path d="M 380 290 L 380 348 L 560 348 L 560 290" fill="none" stroke="#2563eb" stroke-width="3"/>
  <circle cx="470" cy="348" r="20" fill="#fff" stroke="#111827" stroke-width="3"/>
  <text x="470" y="354" font-size="15" font-weight="700" text-anchor="middle" fill="#111827">V</text>
  <text x="476" y="386" font-size="12.5" fill="#475569" text-anchor="middle">an ideal voltmeter has infinite resistance</text>
</svg>
