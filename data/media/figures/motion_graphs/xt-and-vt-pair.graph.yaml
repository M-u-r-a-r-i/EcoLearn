# One run: speed up 0 -> 7 m/s in 2 s (a = 3.5), steady 7 m/s for 1 s, slow to 0 in 1 s (a = -7).
# x(t): 0-2 s: 1.75 t^2; 2-3 s: 7 + 7(t-2); 3-4 s: 14 + 7(t-3) - 3.5(t-3)^2. Ends at 17.5 m.
# Area under v-t: 7 + 7 + 3.5 = 17.5 m.
title: "One motion, two graphs"
panels:
  - title: "Position–time: slope = velocity"
    x: {label: "Time $t$ (s)", min: 0, max: 4.3}
    y: {label: "Position $x$ (m)", min: 0, max: 20}
    series:
      - label: "$x$"
        points: [[0, 0], [0.25, 0.109], [0.5, 0.4375], [0.75, 0.984], [1, 1.75], [1.25, 2.734],
                 [1.5, 3.9375], [1.75, 5.359], [2, 7], [2.5, 10.5], [3, 14], [3.25, 15.531],
                 [3.5, 16.625], [3.75, 17.281], [4, 17.5]]
        color: purple
    marks:
      - {x: 2.5, y: 10.5, text: "straight part: slope 7 m/s", color: blue, offset: [-175, 4]}
      - {x: 4, y: 17.5, text: "flat: v = 0", color: blue, offset: [-70, 8]}
  - title: "Velocity–time: slope = a, area = displacement"
    x: {label: "Time $t$ (s)", min: 0, max: 4.3}
    y: {label: "Velocity $v$ (m/s)", min: 0, max: 9}
    series:
      - label: "$v$"
        points: [[0, 0], [2, 7], [3, 7], [4, 0]]
        color: blue
      - label: "phase boundaries"
        points: [[2, 0], [2, 7], [3, 7], [3, 0]]
        color: gray
        style: dotted
    marks:
      - {x: 1.4, y: 2, text: "7 m", color: purple, offset: [8, -4]}
      - {x: 2.4, y: 3.5, text: "7 m", color: purple, offset: [8, -4]}
      - {x: 3.25, y: 2, text: "3.5 m", color: purple, offset: [8, -4]}
      - {x: 1, y: 3.5, text: "slope +3.5 m/s²", color: green, offset: [-66, 14]}
      - {x: 3.5, y: 3.5, text: "slope −7 m/s²", color: green, offset: [6, 10]}
