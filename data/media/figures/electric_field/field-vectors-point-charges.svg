<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Electric field vectors around a positive and a negative point charge. Around the positive charge they point outward; around the negative charge they point inward. Vectors at twice the distance are a quarter as long.</title>
  <defs>
    <marker id="v" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#ffffff"/>
  <line x1="320" y1="20" x2="320" y2="300" stroke="#e5e7eb" stroke-width="2"/>

  <g stroke="#ea580c" marker-end="url(#v)">
    <line x1="196.0" y1="160.0" x2="244.0" y2="160.0" stroke-width="3"/>
    <line x1="185.5" y1="185.5" x2="219.4" y2="219.4" stroke-width="3"/>
    <line x1="160.0" y1="196.0" x2="160.0" y2="244.0" stroke-width="3"/>
    <line x1="134.5" y1="185.5" x2="100.6" y2="219.4" stroke-width="3"/>
    <line x1="124.0" y1="160.0" x2="76.0" y2="160.0" stroke-width="3"/>
    <line x1="134.5" y1="134.5" x2="100.6" y2="100.6" stroke-width="3"/>
    <line x1="160.0" y1="124.0" x2="160.0" y2="76.0" stroke-width="3"/>
    <line x1="185.5" y1="134.5" x2="219.4" y2="100.6" stroke-width="3"/>
    <line x1="265.3" y1="203.6" x2="276.4" y2="208.2" stroke-width="2.5"/>
    <line x1="203.6" y1="265.3" x2="208.2" y2="276.4" stroke-width="2.5"/>
    <line x1="116.4" y1="265.3" x2="111.8" y2="276.4" stroke-width="2.5"/>
    <line x1="54.7" y1="203.6" x2="43.6" y2="208.2" stroke-width="2.5"/>
    <line x1="54.7" y1="116.4" x2="43.6" y2="111.8" stroke-width="2.5"/>
    <line x1="116.4" y1="54.7" x2="111.8" y2="43.6" stroke-width="2.5"/>
    <line x1="203.6" y1="54.7" x2="208.2" y2="43.6" stroke-width="2.5"/>
    <line x1="265.3" y1="116.4" x2="276.4" y2="111.8" stroke-width="2.5"/>
  </g>
  <circle cx="160" cy="160" r="16" fill="#dc2626"/><text x="160" y="167" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">+</text>
  <g stroke="#ea580c" marker-end="url(#v)">
    <line x1="564.0" y1="160.0" x2="516.0" y2="160.0" stroke-width="3"/>
    <line x1="539.4" y1="219.4" x2="505.5" y2="185.5" stroke-width="3"/>
    <line x1="480.0" y1="244.0" x2="480.0" y2="196.0" stroke-width="3"/>
    <line x1="420.6" y1="219.4" x2="454.5" y2="185.5" stroke-width="3"/>
    <line x1="396.0" y1="160.0" x2="444.0" y2="160.0" stroke-width="3"/>
    <line x1="420.6" y1="100.6" x2="454.5" y2="134.5" stroke-width="3"/>
    <line x1="480.0" y1="76.0" x2="480.0" y2="124.0" stroke-width="3"/>
    <line x1="539.4" y1="100.6" x2="505.5" y2="134.5" stroke-width="3"/>
    <line x1="596.4" y1="208.2" x2="585.3" y2="203.6" stroke-width="2.5"/>
    <line x1="528.2" y1="276.4" x2="523.6" y2="265.3" stroke-width="2.5"/>
    <line x1="431.8" y1="276.4" x2="436.4" y2="265.3" stroke-width="2.5"/>
    <line x1="363.6" y1="208.2" x2="374.7" y2="203.6" stroke-width="2.5"/>
    <line x1="363.6" y1="111.8" x2="374.7" y2="116.4" stroke-width="2.5"/>
    <line x1="431.8" y1="43.6" x2="436.4" y2="54.7" stroke-width="2.5"/>
    <line x1="528.2" y1="43.6" x2="523.6" y2="54.7" stroke-width="2.5"/>
    <line x1="596.4" y1="111.8" x2="585.3" y2="116.4" stroke-width="2.5"/>
  </g>
  <circle cx="480" cy="160" r="16" fill="#2563eb"/><text x="480" y="167" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">−</text>
  <g fill="none" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 4">
    <circle cx="160" cy="160" r="60"/><circle cx="160" cy="160" r="120"/><circle cx="480" cy="160" r="60"/><circle cx="480" cy="160" r="120"/>
  </g>
  <text x="222" y="120" font-size="13" fill="#6b7280">r</text>
  <text x="262" y="60" font-size="13" fill="#6b7280">2r</text>

  <text x="160" y="312" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">+Q: E points away</text>
  <text x="480" y="312" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">−Q: E points towards</text>
  <text x="320" y="344" font-size="13.5" fill="#374151" text-anchor="middle">Each arrow is centred on the point where E is drawn. At 2r the arrow is a quarter as long: E ∝ 1/r².</text>
</svg>
