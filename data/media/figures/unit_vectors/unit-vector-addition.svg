<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A grid with unit vectors i-hat and j-hat; A = 3i + 1j and B = 1i + 2j add head to tail to give 4i + 3j of length 5</title>
  <defs><marker id="hblue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="hred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="hgreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="horange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="hpurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="hteal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker><marker id="hgray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="hdark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker></defs>
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="20.0" y="30.0" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Unit vectors: adding by components</text>
  <line x1="90" y1="340" x2="90" y2="90" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="140" y1="340" x2="140" y2="90" stroke="#e5e7eb" stroke-width="1"/>
  <text x="140.0" y="360.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle">1</text>
  <line x1="190" y1="340" x2="190" y2="90" stroke="#e5e7eb" stroke-width="1"/>
  <text x="190.0" y="360.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle">2</text>
  <line x1="240" y1="340" x2="240" y2="90" stroke="#e5e7eb" stroke-width="1"/>
  <text x="240.0" y="360.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle">3</text>
  <line x1="290" y1="340" x2="290" y2="90" stroke="#e5e7eb" stroke-width="1"/>
  <text x="290.0" y="360.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle">4</text>
  <line x1="340" y1="340" x2="340" y2="90" stroke="#e5e7eb" stroke-width="1"/>
  <text x="340.0" y="360.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle">5</text>
  <line x1="390" y1="340" x2="390" y2="90" stroke="#e5e7eb" stroke-width="1"/>
  <text x="390.0" y="360.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle">6</text>
  <line x1="90" y1="340" x2="390" y2="340" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="90" y1="290" x2="390" y2="290" stroke="#e5e7eb" stroke-width="1"/>
  <text x="80.0" y="294.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="end">1</text>
  <line x1="90" y1="240" x2="390" y2="240" stroke="#e5e7eb" stroke-width="1"/>
  <text x="80.0" y="244.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="end">2</text>
  <line x1="90" y1="190" x2="390" y2="190" stroke="#e5e7eb" stroke-width="1"/>
  <text x="80.0" y="194.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="end">3</text>
  <line x1="90" y1="140" x2="390" y2="140" stroke="#e5e7eb" stroke-width="1"/>
  <text x="80.0" y="144.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="end">4</text>
  <line x1="90" y1="90" x2="390" y2="90" stroke="#e5e7eb" stroke-width="1"/>
  <text x="80.0" y="94.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="end">5</text>
  <line x1="90.0" y1="340.0" x2="410.0" y2="340.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#hgray)"/>
  <line x1="90.0" y1="340.0" x2="90.0" y2="70.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#hgray)"/>
  <text x="416.0" y="345.0" font-size="14" fill="#6b7280" font-weight="600" text-anchor="start">x</text>
  <text x="98.0" y="72.0" font-size="14" fill="#6b7280" font-weight="600" text-anchor="start">y</text>
  <line x1="90.0" y1="340.0" x2="140.0" y2="340.0" stroke="#111827" stroke-width="5" marker-end="url(#hdark)"/>
  <line x1="90.0" y1="340.0" x2="90.0" y2="290.0" stroke="#111827" stroke-width="5" marker-end="url(#hdark)"/>
  <text x="115.0" y="380.0" font-size="15" fill="#111827" font-weight="700" text-anchor="middle">î</text>
  <text x="64.0" y="319.0" font-size="15" fill="#111827" font-weight="700" text-anchor="end">ĵ</text>
  <line x1="90.0" y1="340.0" x2="240.0" y2="290.0" stroke="#2563eb" stroke-width="4" marker-end="url(#hblue)"/>
  <line x1="240.0" y1="290.0" x2="290.0" y2="190.0" stroke="#ea580c" stroke-width="4" marker-end="url(#horange)"/>
  <line x1="90.0" y1="340.0" x2="290.0" y2="190.0" stroke="#7c3aed" stroke-width="5" marker-end="url(#hpurple)"/>
  <text x="248.0" y="322.0" font-size="14" fill="#2563eb" font-weight="700" text-anchor="start">A = 3î + 1ĵ</text>
  <text x="274.0" y="250.0" font-size="14" fill="#ea580c" font-weight="700" text-anchor="start">B = 1î + 2ĵ</text>
  <text x="100.0" y="225.0" font-size="14" fill="#7c3aed" font-weight="700" text-anchor="start">A + B = 4î + 3ĵ</text>
  <text x="420.0" y="110.0" font-size="14" fill="#111827" font-weight="400" text-anchor="start">Add x-parts: 3 + 1 = 4</text>
  <text x="420.0" y="134.0" font-size="14" fill="#111827" font-weight="400" text-anchor="start">Add y-parts: 1 + 2 = 3</text>
  <text x="420.0" y="170.0" font-size="14" fill="#7c3aed" font-weight="600" text-anchor="start">|A + B| = √(4² + 3²) = 5</text>
  <text x="420.0" y="214.0" font-size="13" fill="#111827" font-weight="400" text-anchor="start">î and ĵ each have length 1</text>
  <text x="420.0" y="232.0" font-size="13" fill="#111827" font-weight="400" text-anchor="start">and no unit: they only</text>
  <text x="420.0" y="250.0" font-size="13" fill="#111827" font-weight="400" text-anchor="start">point a direction.</text>
</svg>
