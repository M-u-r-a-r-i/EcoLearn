<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Left: a positive charge entering a field that points into the page at right angles travels in a circle of radius r equals mv over qB, with the magnetic force always pointing to the centre. Right: when the velocity also has a component along the field, the path becomes a helix.</title>
  <defs>
    <marker id="v2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>

  <!-- LEFT: circle -->
  <rect x="20" y="52" width="290" height="300" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="20" y="44" font-size="13.5" fill="#7c3aed" font-weight="700">B into the page (×)</text>
  <g fill="#7c3aed" font-size="14" text-anchor="middle" opacity="0.8">
    <text x="50" y="84">×</text><text x="120" y="84">×</text><text x="190" y="84">×</text><text x="260" y="84">×</text>
    <text x="50" y="200">×</text><text x="280" y="200">×</text>
    <text x="50" y="330">×</text><text x="120" y="330">×</text><text x="190" y="330">×</text><text x="260" y="330">×</text>
  </g>

  <circle cx="165" cy="202" r="82" fill="none" stroke="#111827" stroke-width="3" stroke-dasharray="1 0"/>
  <circle cx="165" cy="202" r="3" fill="#111827"/>
  <line x1="165" y1="202" x2="247" y2="202" stroke="#111827" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="206" y="194" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">r</text>

  <!-- charge at top of circle, moving right, force toward centre (down) -->
  <circle cx="165" cy="120" r="13" fill="#dc2626"/>
  <text x="165" y="126" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">+</text>
  <line x1="149" y1="120" x2="76" y2="120" stroke="#2563eb" stroke-width="4" marker-end="url(#v2)"/>
  <text x="112" y="110" font-size="13.5" fill="#2563eb" font-weight="700">v</text>
  <line x1="165" y1="136" x2="165" y2="186" stroke="#dc2626" stroke-width="4" marker-end="url(#f2)"/>
  <text x="152" y="166" font-size="13.5" fill="#dc2626" font-weight="700" text-anchor="end">F</text>

  <!-- charge at bottom -->
  <circle cx="165" cy="284" r="13" fill="#dc2626"/>
  <text x="165" y="290" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">+</text>
  <line x1="181" y1="284" x2="254" y2="284" stroke="#2563eb" stroke-width="4" marker-end="url(#v2)"/>
  <line x1="165" y1="268" x2="165" y2="220" stroke="#dc2626" stroke-width="4" marker-end="url(#f2)"/>

  <text x="165" y="374" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">F is always ⟂ to v: speed never changes</text>

  <!-- RIGHT: helix -->
  <rect x="330" y="52" width="290" height="300" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="330" y="44" font-size="13.5" fill="#111827" font-weight="700">v at an angle to B → a helix</text>

  <line x1="360" y1="300" x2="600" y2="140" stroke="#7c3aed" stroke-width="3"/>
  <path d="M 596 143 l -14 0 l 6 12 z" fill="#7c3aed"/>
  <text x="566" y="176" font-size="13.5" fill="#7c3aed" font-weight="700">B</text>

  <path d="M 372 292 c 18 -34 44 -40 44 -12 c 0 26 -30 36 -30 8 c 0 -28 30 -44 48 -66
           c 18 -22 44 -28 44 -2 c 0 26 -30 36 -30 8 c 0 -28 30 -44 48 -66
           c 18 -22 44 -26 44 -2 c 0 26 -30 34 -30 8 c 0 -26 26 -38 44 -56"
        fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="475" y="330" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">circle around B, steady drift along B</text>
</svg>
