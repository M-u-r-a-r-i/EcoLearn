<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Converting 144 kilometres per hour to 40 metres per second, one unit at a time, and the same step written with the dimensional formula</title>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="20" y="34" font-size="18" font-weight="700" fill="#111827">Converting a speed: km/h to m/s</text>

  <!-- boxes -->
  <rect x="20" y="80" width="120" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="180" y="80" width="120" height="84" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <rect x="340" y="80" width="120" height="84" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <rect x="500" y="80" width="120" height="84" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <g stroke="#2563eb" stroke-width="3" marker-end="url(#head)">
    <line x1="144" y1="122" x2="176" y2="122"/>
    <line x1="304" y1="122" x2="336" y2="122"/>
    <line x1="464" y1="122" x2="496" y2="122"/>
  </g>
  <g text-anchor="middle">
    <text x="80" y="122" font-size="24" font-weight="700" fill="#1d4ed8">144</text>
    <text x="80" y="148" font-size="15" fill="#374151">km/h</text>
    <text x="240" y="122" font-size="24" font-weight="700" fill="#111827">× 1000</text>
    <text x="240" y="148" font-size="14" fill="#374151">1 km = 1000 m</text>
    <text x="400" y="122" font-size="24" font-weight="700" fill="#111827">÷ 3600</text>
    <text x="400" y="148" font-size="14" fill="#374151">1 h = 3600 s</text>
    <text x="560" y="122" font-size="24" font-weight="700" fill="#15803d">40</text>
    <text x="560" y="148" font-size="15" fill="#374151">m/s</text>
  </g>

  <!-- the dimensional method -->
  <rect x="20" y="196" width="600" height="150" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="38" y="226" font-size="15" font-weight="700" fill="#111827">Same step, using the dimensional formula of speed [L T⁻¹]</text>
  <text x="38" y="262" font-size="19" fill="#111827">n₂ = n₁ × (L₁ / L₂)¹ × (T₁ / T₂)⁻¹</text>
  <text x="38" y="300" font-size="19" fill="#111827">n₂ = 144 × (1000 m / 1 m)¹ × (3600 s / 1 s)⁻¹</text>
  <text x="38" y="332" font-size="19" font-weight="700" fill="#15803d">n₂ = 144 × 1000 ÷ 3600 = 40</text>

  <text x="20" y="384" font-size="14" fill="#374151">Shortcut: km/h → m/s, divide by 3.6.<tspan dx="16">m/s</tspan> → km/h, <tspan>multiply by 3.6.</tspan></text>
</svg>
