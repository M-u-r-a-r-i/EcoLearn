<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">The junction rule, with currents in equalling currents out, and the loop rule, with the sign convention for crossing a resistor and a cell</title>
  <defs>
    <marker id="k-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="k-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#ffffff"/>

  <!-- JUNCTION RULE -->
  <text x="160" y="32" font-size="17" text-anchor="middle" fill="#111827" font-weight="700">Junction rule</text>
  <text x="160" y="54" font-size="13" text-anchor="middle" fill="#6b7280">charge cannot pile up at a point</text>

  <g stroke="#111827" stroke-width="3" stroke-linecap="round">
    <line x1="40" y1="140" x2="160" y2="140"/>
    <line x1="160" y1="140" x2="280" y2="90"/>
    <line x1="160" y1="140" x2="280" y2="190"/>
  </g>
  <circle cx="160" cy="140" r="7" fill="#111827"/>

  <line x1="70" y1="140" x2="120" y2="140" stroke="#2563eb" stroke-width="3" marker-end="url(#k-blue)"/>
  <line x1="200" y1="123" x2="250" y2="102" stroke="#2563eb" stroke-width="3" marker-end="url(#k-blue)"/>
  <line x1="200" y1="157" x2="250" y2="178" stroke="#2563eb" stroke-width="3" marker-end="url(#k-blue)"/>
  <text x="95" y="128" font-size="15" text-anchor="middle" fill="#2563eb" font-weight="700">I&#8321;</text>
  <text x="228" y="96" font-size="15" text-anchor="middle" fill="#2563eb" font-weight="700">I&#8322;</text>
  <text x="228" y="200" font-size="15" text-anchor="middle" fill="#2563eb" font-weight="700">I&#8323;</text>

  <rect x="35" y="228" width="250" height="40" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="254" font-size="17" text-anchor="middle" fill="#1e3a8a" font-weight="700">I&#8321; = I&#8322; + I&#8323;</text>
  <text x="160" y="292" font-size="13" text-anchor="middle" fill="#374151">current in = current out, at every junction</text>
  <text x="160" y="314" font-size="13" text-anchor="middle" fill="#6b7280">(conservation of charge)</text>

  <!-- LOOP RULE -->
  <text x="470" y="32" font-size="17" text-anchor="middle" fill="#111827" font-weight="700">Loop rule</text>
  <text x="470" y="54" font-size="13" text-anchor="middle" fill="#6b7280">back where you started, back to the same potential</text>

  <g stroke="#111827" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="360" y1="90" x2="420" y2="90"/>
    <polyline points="420,90 428,78 440,102 452,78 464,102 476,78 488,102 496,90 504,90"/>
    <line x1="504" y1="90" x2="580" y2="90"/>
    <line x1="580" y1="90" x2="580" y2="190"/>
    <line x1="580" y1="190" x2="474" y2="190"/>
    <line x1="446" y1="190" x2="360" y2="190"/>
    <line x1="360" y1="190" x2="360" y2="90"/>
  </g>
  <line x1="446" y1="178" x2="446" y2="202" stroke="#111827" stroke-width="7"/>
  <line x1="474" y1="168" x2="474" y2="212" stroke="#111827" stroke-width="3"/>
  <text x="482" y="164" font-size="14" fill="#111827" font-weight="700">+</text>
  <text x="460" y="236" font-size="14" text-anchor="middle" fill="#111827">&#949;</text>
  <text x="460" y="128" font-size="14" text-anchor="middle" fill="#111827">R</text>

  <!-- walking direction -->
  <path d="M 395 130 A 40 40 0 0 1 430 118" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#k-purple)"/>
  <text x="392" y="152" font-size="13" fill="#7c3aed" font-weight="700">walk this way</text>

  <rect x="345" y="258" width="250" height="40" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="470" y="284" font-size="17" text-anchor="middle" fill="#4c1d95" font-weight="700">&#931; &#916;V = 0 round the loop</text>
  <text x="470" y="322" font-size="13" text-anchor="middle" fill="#374151">(conservation of energy)</text>

  <!-- sign rules -->
  <text x="320" y="356" font-size="14" text-anchor="middle" fill="#111827" font-weight="700">Signs, walking round the loop in a chosen direction:</text>
  <text x="320" y="378" font-size="13" text-anchor="middle" fill="#374151">across a resistor, with the current: &#8722;IR &#160;&#8226;&#160; against the current: +IR</text>
  <text x="320" y="398" font-size="13" text-anchor="middle" fill="#374151">through a cell from &#8722; to +: +&#949; &#160;&#8226;&#160; from + to &#8722;: &#8722;&#949;</text>
</svg>
