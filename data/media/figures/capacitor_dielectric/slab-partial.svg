<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A parallel-plate capacitor with plates 4.0 mm apart and a dielectric slab 2.0 mm thick, K equal to 4, filling the middle; the field is E-nought in the two air gaps and a quarter of that inside the slab</title>
  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="640" height="380" fill="#ffffff"/>

  <!-- plates: 4.0 mm = 280 px -->
  <rect x="166" y="60" width="14" height="230" fill="#dc2626"/>
  <rect x="460" y="60" width="14" height="230" fill="#2563eb"/>
  <text x="160" y="50" font-size="16" fill="#dc2626" font-weight="700">+Q</text>
  <text x="456" y="50" font-size="16" fill="#2563eb" font-weight="700">−Q</text>

  <!-- slab: 2.0 mm = 140 px, centred -->
  <rect x="250" y="60" width="140" height="230" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
  <text x="320" y="84" font-size="15" text-anchor="middle" fill="#a16207" font-weight="700">K = 4</text>

  <!-- field in air gaps (full length) and in slab (quarter length) -->
  <g stroke="#7c3aed" stroke-width="2.5" marker-end="url(#fa)">
    <line x1="186" y1="130" x2="240" y2="130"/>
    <line x1="186" y1="190" x2="240" y2="190"/>
    <line x1="186" y1="250" x2="240" y2="250"/>
    <line x1="396" y1="130" x2="450" y2="130"/>
    <line x1="396" y1="190" x2="450" y2="190"/>
    <line x1="396" y1="250" x2="450" y2="250"/>
    <line x1="306" y1="130" x2="320" y2="130"/>
    <line x1="306" y1="190" x2="320" y2="190"/>
    <line x1="306" y1="250" x2="320" y2="250"/>
  </g>
  <text x="213" y="115" font-size="15" text-anchor="middle" fill="#7c3aed" font-weight="700">E₀</text>
  <text x="423" y="115" font-size="15" text-anchor="middle" fill="#7c3aed" font-weight="700">E₀</text>
  <text x="320" y="115" font-size="15" text-anchor="middle" fill="#7c3aed" font-weight="700">E₀/K</text>

  <!-- dimensions -->
  <line x1="180" y1="312" x2="460" y2="312" stroke="#374151" stroke-width="1.5"/>
  <line x1="180" y1="306" x2="180" y2="318" stroke="#374151" stroke-width="1.5"/>
  <line x1="460" y1="306" x2="460" y2="318" stroke="#374151" stroke-width="1.5"/>
  <text x="320" y="332" font-size="14" text-anchor="middle" fill="#374151" font-weight="700">d = 4.0 mm</text>
  <line x1="250" y1="298" x2="390" y2="298" stroke="#a16207" stroke-width="1.5"/>
  <text x="320" y="280" font-size="13" text-anchor="middle" fill="#a16207" font-weight="700">t = 2.0 mm</text>

  <!-- formula -->
  <text x="320" y="362" font-size="16" text-anchor="middle" fill="#111827" font-weight="700">C = ε₀A / (d − t + t/K)</text>
  <g font-size="13" fill="#374151">
    <text x="490" y="140">air: 1.0 mm + 1.0 mm</text>
    <text x="490" y="160">slab acts like</text>
    <text x="490" y="178">t/K = 0.5 mm of air</text>
    <text x="490" y="210" font-weight="700" fill="#111827">effective gap</text>
    <text x="490" y="228" font-weight="700" fill="#111827">= 2.5 mm</text>
  </g>
</svg>
