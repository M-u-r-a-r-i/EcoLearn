<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Three rules for combining errors: absolute errors add for sums and differences, relative errors add for products and quotients, and a power multiplies the relative error</title>
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="20" y="36" font-size="18" font-weight="700" fill="#111827">Combining errors (largest possible error)</text>

  <!-- sum / difference -->
  <rect x="16" y="56" width="608" height="96" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="34" y="88" font-size="16" font-weight="700" fill="#1d4ed8">Sum or difference</text>
  <text x="34" y="118" font-size="18" fill="#111827">Z = A + B  or  Z = A − B</text>
  <text x="330" y="100" font-size="22" font-weight="700" fill="#111827">ΔZ = ΔA + ΔB</text>
  <text x="330" y="128" font-size="14" fill="#374151">absolute errors add (even for A − B)</text>

  <!-- product / quotient -->
  <rect x="16" y="168" width="608" height="96" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="34" y="200" font-size="16" font-weight="700" fill="#c2410c">Product or quotient</text>
  <text x="34" y="230" font-size="18" fill="#111827">Z = A × B  or  Z = A / B</text>
  <text x="330" y="212" font-size="22" font-weight="700" fill="#111827">ΔZ/Z = ΔA/A + ΔB/B</text>
  <text x="330" y="240" font-size="14" fill="#374151">relative errors add</text>

  <!-- power -->
  <rect x="16" y="280" width="608" height="96" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="34" y="312" font-size="16" font-weight="700" fill="#15803d">Power</text>
  <text x="34" y="342" font-size="18" fill="#111827">Z = Aⁿ</text>
  <text x="330" y="324" font-size="22" font-weight="700" fill="#111827">ΔZ/Z = n × ΔA/A</text>
  <text x="330" y="352" font-size="14" fill="#374151">relative error times the power</text>
</svg>
