# Five caliper readings of the same object's thickness: 7.92, 7.88, 7.96, 7.90, 7.94 mm.
# Mean = 39.60 / 5 = 7.920 mm. Deviations 0.00, 0.04, 0.04, 0.02, 0.02 -> sum 0.12 -> mean absolute error 0.024 mm.
# The readings are plotted as marks (not a joined line: they are separate trials).
title: "Five readings of one thickness"
x: {label: "Reading number", min: 0.5, max: 5.5}
y: {label: "Thickness measured $d$ (mm)", min: 7.84, max: 8.0}
legend: below
series:
  - label: "mean = 7.920 mm"
    points: [[0.5, 7.92], [5.5, 7.92]]
    color: gray
    style: dashed
  - label: "mean ± mean absolute error (± 0.024 mm)"
    points: [[0.5, 7.944], [5.5, 7.944]]
    color: orange
    style: dotted
  - points: [[0.5, 7.896], [5.5, 7.896]]
    color: orange
    style: dotted
marks:
  - {x: 1, y: 7.92, text: "7.92", color: blue, offset: [8, -14]}
  - {x: 2, y: 7.88, text: "7.88", color: blue, offset: [8, -4]}
  - {x: 3, y: 7.96, text: "7.96", color: blue, offset: [8, 5]}
  - {x: 4, y: 7.90, text: "7.90", color: blue, offset: [8, 5]}
  - {x: 5, y: 7.94, text: "7.94", color: blue, offset: [-36, -14]}
