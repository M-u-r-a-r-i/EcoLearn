<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Two parallel waves scattering from atoms in successive crystal planes a distance d apart. The wave reflected from the deeper plane travels an extra distance of two d sine theta, and the scattered waves add up only when that extra path is a whole number of wavelengths.</title>
  <defs>
    <marker id="bw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="rd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="rs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="700" height="400" fill="#ffffff"/>

  <text x="350" y="28" font-size="16" text-anchor="middle" fill="#111827" font-weight="700">The second wave travels further. How much further decides everything.</text>

  <!-- crystal planes -->
  <g stroke="#cbd5e1" stroke-width="1.5">
    <line x1="80" y1="220" x2="620" y2="220"/>
    <line x1="80" y1="270" x2="620" y2="270"/>
    <line x1="80" y1="320" x2="620" y2="320"/>
  </g>
  <g fill="#94a3b8">
    <circle cx="100" cy="220" r="7"/><circle cx="150" cy="220" r="7"/><circle cx="200" cy="220" r="7"/>
    <circle cx="250" cy="220" r="7"/><circle cx="350" cy="220" r="7"/><circle cx="400" cy="220" r="7"/>
    <circle cx="450" cy="220" r="7"/><circle cx="500" cy="220" r="7"/><circle cx="550" cy="220" r="7"/>
    <circle cx="100" cy="270" r="7"/><circle cx="150" cy="270" r="7"/><circle cx="200" cy="270" r="7"/>
    <circle cx="250" cy="270" r="7"/><circle cx="300" cy="270" r="7"/><circle cx="400" cy="270" r="7"/>
    <circle cx="450" cy="270" r="7"/><circle cx="500" cy="270" r="7"/><circle cx="550" cy="270" r="7"/>
    <circle cx="100" cy="320" r="7"/><circle cx="150" cy="320" r="7"/><circle cx="200" cy="320" r="7"/>
    <circle cx="250" cy="320" r="7"/><circle cx="300" cy="320" r="7"/><circle cx="350" cy="320" r="7"/>
    <circle cx="400" cy="320" r="7"/><circle cx="450" cy="320" r="7"/><circle cx="500" cy="320" r="7"/>
  </g>
  <circle cx="300" cy="220" r="8" fill="#1e3a8a"/>
  <circle cx="350" cy="270" r="8" fill="#1e3a8a"/>

  <!-- ray A: hits the top plane -->
  <line x1="147" y1="91" x2="294" y2="215" stroke="#2563eb" stroke-width="3" marker-end="url(#bw)"/>
  <line x1="306" y1="215" x2="453" y2="91" stroke="#2563eb" stroke-width="3" marker-end="url(#bw)"/>
  <!-- ray B: hits the second plane -->
  <line x1="197" y1="141" x2="344" y2="265" stroke="#2563eb" stroke-width="3" marker-end="url(#bw)"/>
  <line x1="356" y1="265" x2="503" y2="141" stroke="#2563eb" stroke-width="3" marker-end="url(#bw)"/>

  <!-- the extra path, in red -->
  <line x1="325.4" y1="249.3" x2="350" y2="270" stroke="#dc2626" stroke-width="5"/>
  <line x1="350" y1="270" x2="374.6" y2="249.3" stroke="#dc2626" stroke-width="5"/>
  <!-- wavefronts through the upper atom -->
  <g stroke="#374151" stroke-width="1.8" stroke-dasharray="6 5">
    <line x1="300" y1="220" x2="325.4" y2="249.3"/>
    <line x1="300" y1="220" x2="374.6" y2="249.3"/>
  </g>
  <text x="350" y="300" font-size="15" text-anchor="middle" fill="#dc2626" font-weight="700">extra path = 2d sin &#952;</text>

  <!-- glancing angle -->
  <path d="M260 220 A 40 40 0 0 1 269.4 194.3" fill="none" stroke="#b45309" stroke-width="2.5"/>
  <text x="248" y="206" font-size="15" text-anchor="end" fill="#b45309" font-weight="700">&#952;</text>
  <text x="80" y="346" font-size="12" fill="#6b7280">&#952; is measured from the plane, not from the normal</text>

  <!-- spacing d -->
  <line x1="612" y1="220" x2="612" y2="270" stroke="#374151" stroke-width="2" marker-start="url(#rs)" marker-end="url(#rd)"/>
  <text x="624" y="250" font-size="15" fill="#374151" font-weight="700">d</text>
  <text x="694" y="290" font-size="12" text-anchor="end" fill="#6b7280">plane spacing</text>

  <text x="350" y="372" font-size="15" text-anchor="middle" fill="#111827" font-weight="700">A strong beam comes out only when 2d sin &#952; = n&#955;.</text>
  <text x="350" y="392" font-size="12" text-anchor="middle" fill="#6b7280">Measure the angle of the peak, know d, and you have measured &#955;.</text>
</svg>
