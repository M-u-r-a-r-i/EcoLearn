<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">The Davisson-Germer apparatus: an electron gun fires a beam of electrons accelerated through a voltage V straight down onto a nickel crystal, and a detector that can be swung round a circular arc counts the electrons scattered at an angle phi from the incident beam direction</title>
  <defs>
    <marker id="eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="gy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="720" height="420" fill="#ffffff"/>

  <text x="360" y="28" font-size="16" text-anchor="middle" fill="#111827" font-weight="700">Fire electrons at a crystal and count what comes back.</text>

  <!-- electron gun -->
  <rect x="292" y="48" width="136" height="56" rx="6" fill="#e0e7ff" stroke="#1e3a8a" stroke-width="2.5"/>
  <text x="360" y="72" font-size="13" text-anchor="middle" fill="#1e3a8a" font-weight="700">electron gun</text>
  <text x="360" y="92" font-size="12" text-anchor="middle" fill="#1e3a8a">hot filament + anode</text>

  <!-- accelerating voltage -->
  <line x1="234" y1="76" x2="288" y2="76" stroke="#6b7280" stroke-width="2" marker-end="url(#gy)"/>
  <text x="228" y="72" font-size="13" text-anchor="end" fill="#374151" font-weight="700">accelerating</text>
  <text x="228" y="90" font-size="13" text-anchor="end" fill="#374151" font-weight="700">voltage V</text>

  <!-- incident beam, straight down onto the crystal -->
  <line x1="360" y1="106" x2="360" y2="286" stroke="#2563eb" stroke-width="3" marker-end="url(#eb)"/>
  <text x="350" y="180" font-size="13" text-anchor="end" fill="#2563eb" font-weight="700">the electron beam,</text>
  <text x="350" y="198" font-size="13" text-anchor="end" fill="#2563eb">straight at the surface</text>

  <!-- detector track -->
  <path d="M360 100 A 190 190 0 0 1 550 290" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="714" y="312" font-size="12" text-anchor="end" fill="#94a3b8">the detector swings along this arc</text>

  <!-- scattered beam to the detector -->
  <line x1="360" y1="290" x2="500" y2="172" stroke="#16a34a" stroke-width="3" marker-end="url(#eb)"/>
  <rect x="498" y="140" width="56" height="34" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" transform="rotate(40 526 157)"/>
  <text x="566" y="132" font-size="13" fill="#16a34a" font-weight="700">detector</text>
  <text x="566" y="150" font-size="12" fill="#166534">counts electrons</text>
  <text x="566" y="167" font-size="12" fill="#166534">arriving each second</text>

  <!-- angle phi -->
  <path d="M360 230 A 60 60 0 0 1 406 251" fill="none" stroke="#b45309" stroke-width="2.5"/>
  <text x="396" y="222" font-size="16" fill="#b45309" font-weight="700">&#966;</text>

  <!-- crystal -->
  <rect x="280" y="290" width="160" height="46" fill="#cbd5e1" stroke="#334155" stroke-width="2.5"/>
  <g fill="#334155">
    <circle cx="296" cy="304" r="4"/><circle cx="324" cy="304" r="4"/><circle cx="352" cy="304" r="4"/>
    <circle cx="380" cy="304" r="4"/><circle cx="408" cy="304" r="4"/><circle cx="424" cy="304" r="4"/>
    <circle cx="296" cy="322" r="4"/><circle cx="324" cy="322" r="4"/><circle cx="352" cy="322" r="4"/>
    <circle cx="380" cy="322" r="4"/><circle cx="408" cy="322" r="4"/><circle cx="424" cy="322" r="4"/>
  </g>
  <text x="360" y="358" font-size="13" text-anchor="middle" fill="#334155" font-weight="700">nickel crystal &#8212; atoms in regular planes</text>
  <text x="360" y="376" font-size="12" text-anchor="middle" fill="#6b7280">the whole apparatus sits in a vacuum</text>

  <text x="360" y="404" font-size="13" text-anchor="middle" fill="#111827" font-weight="700">A sharp peak in the count appeared at &#966; = 50&#176; when V was 54 V.</text>
</svg>
