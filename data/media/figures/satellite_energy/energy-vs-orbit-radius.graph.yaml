# Circular orbit of radius r, energies in units of GMm/R (R = planet radius), x = r/R.
# K = GMm/(2r) -> 1/(2x);  U = -GMm/r -> -1/x;  E = K + U = -GMm/(2r) -> -1/(2x).
# Check at x = 2: K = 0.25, U = -0.5, E = -0.25 (K = -E, U = 2E).
title: "Energies of a satellite in a circular orbit"
x: {label: "Orbit radius, $r/R$", min: 1, max: 6}
y: {label: "Energy / ($GMm/R$)", min: -1.05, max: 0.6}
legend: below
series:
  - label: 'kinetic $K = GMm/2r$'
    points: [[1.0, 0.5], [1.25, 0.4], [1.5, 0.333], [2.0, 0.25], [2.5, 0.2], [3.0, 0.167],
             [4.0, 0.125], [5.0, 0.1], [6.0, 0.0833]]
    color: blue
  - label: 'potential $U = -GMm/r$'
    points: [[1.0, -1.0], [1.25, -0.8], [1.5, -0.667], [2.0, -0.5], [2.5, -0.4], [3.0, -0.333],
             [4.0, -0.25], [5.0, -0.2], [6.0, -0.167]]
    color: red
  - label: 'total $E = -GMm/2r$'
    points: [[1.0, -0.5], [1.25, -0.4], [1.5, -0.333], [2.0, -0.25], [2.5, -0.2], [3.0, -0.167],
             [4.0, -0.125], [5.0, -0.1], [6.0, -0.0833]]
    color: green
    style: dashed
marks:
  - {x: 2.0, y: 0.25, text: "K = 0.25", color: blue, offset: [8, 6]}
  - {x: 2.0, y: -0.25, text: "E = -0.25", color: green, offset: [-64, 10]}
  - {x: 2.0, y: -0.5, text: "U = -0.5", color: red, offset: [8, -14]}
