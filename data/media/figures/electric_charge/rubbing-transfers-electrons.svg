<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Before rubbing, cotton and polyester each hold six positive and six negative charges. After rubbing, three electrons have moved from the cotton to the polyester: cotton is +3e, polyester is −3e, and the total is still zero.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="640" height="380" fill="#ffffff"/>

  <text x="160" y="32" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">Before rubbing</text>
  <text x="480" y="32" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">After rubbing</text>
  <line x1="320" y1="20" x2="320" y2="300" stroke="#e5e7eb" stroke-width="2"/>

  <!-- BEFORE -->
  <rect x="30" y="56" width="120" height="150" rx="10" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <rect x="170" y="56" width="120" height="150" rx="10" fill="#e0e7ff" stroke="#3730a3" stroke-width="2"/>
  <g font-size="22" font-weight="700" text-anchor="middle">
    <g fill="#dc2626"><text x="58" y="94">+</text><text x="90" y="94">+</text><text x="122" y="94">+</text><text x="58" y="144">+</text><text x="90" y="144">+</text><text x="122" y="144">+</text></g>
    <g fill="#2563eb"><text x="58" y="119">−</text><text x="90" y="119">−</text><text x="122" y="119">−</text><text x="58" y="169">−</text><text x="90" y="169">−</text><text x="122" y="169">−</text></g>
    <g fill="#dc2626"><text x="198" y="94">+</text><text x="230" y="94">+</text><text x="262" y="94">+</text><text x="198" y="144">+</text><text x="230" y="144">+</text><text x="262" y="144">+</text></g>
    <g fill="#2563eb"><text x="198" y="119">−</text><text x="230" y="119">−</text><text x="262" y="119">−</text><text x="198" y="169">−</text><text x="230" y="169">−</text><text x="262" y="169">−</text></g>
  </g>
  <text x="90" y="230" font-size="15" fill="#111827" text-anchor="middle" font-weight="600">cotton</text>
  <text x="230" y="230" font-size="15" fill="#111827" text-anchor="middle" font-weight="600">polyester</text>
  <text x="90" y="252" font-size="15" fill="#374151" text-anchor="middle">net 0</text>
  <text x="230" y="252" font-size="15" fill="#374151" text-anchor="middle">net 0</text>

  <!-- AFTER -->
  <rect x="350" y="56" width="120" height="150" rx="10" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <rect x="490" y="56" width="120" height="150" rx="10" fill="#e0e7ff" stroke="#3730a3" stroke-width="2"/>
  <g font-size="22" font-weight="700" text-anchor="middle">
    <g fill="#dc2626"><text x="378" y="94">+</text><text x="410" y="94">+</text><text x="442" y="94">+</text><text x="378" y="144">+</text><text x="410" y="144">+</text><text x="442" y="144">+</text></g>
    <g fill="#2563eb"><text x="378" y="119">−</text><text x="410" y="119">−</text><text x="442" y="119">−</text></g>
    <g fill="#dc2626"><text x="518" y="94">+</text><text x="550" y="94">+</text><text x="582" y="94">+</text><text x="518" y="144">+</text><text x="550" y="144">+</text><text x="582" y="144">+</text></g>
    <g fill="#2563eb"><text x="518" y="119">−</text><text x="550" y="119">−</text><text x="582" y="119">−</text><text x="518" y="169">−</text><text x="550" y="169">−</text><text x="582" y="169">−</text>
      <text x="518" y="194">−</text><text x="550" y="194">−</text><text x="582" y="194">−</text></g>
  </g>
  <line x1="444" y1="218" x2="512" y2="218" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/>
  <text x="478" y="240" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="600">3 electrons move</text>
  <text x="410" y="266" font-size="15" fill="#111827" text-anchor="middle" font-weight="600">cotton: +3e</text>
  <text x="550" y="266" font-size="15" fill="#111827" text-anchor="middle" font-weight="600">polyester: −3e</text>

  <rect x="60" y="292" width="520" height="70" rx="8" fill="#f1f5f9"/>
  <text x="320" y="318" font-size="15" fill="#111827" text-anchor="middle">Only electrons move; the protons stay put in the nuclei.</text>
  <text x="320" y="344" font-size="15" fill="#111827" text-anchor="middle" font-weight="700">Total charge: 0 before, (+3e) + (−3e) = 0 after</text>
</svg>
