<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">The scalar product: A dot B equals A times the projection of B on A, and its sign depends on the angle between them</title>
  <defs>
    <marker id="hk" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
    <marker id="hp" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>
  <line x1="330" y1="30" x2="330" y2="370" stroke="#d1d5db" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- Left: projection -->
  <text x="20" y="36" font-size="15" font-weight="600" fill="#111827">Projection of B on A</text>
  <line x1="190" y1="141" x2="190" y2="250" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="60" y1="262" x2="190" y2="262" stroke="#ea580c" stroke-width="6"/>
  <text x="84" y="286" font-size="14" fill="#ea580c" font-weight="600">B cos θ</text>
  <line x1="60" y1="250" x2="296" y2="250" stroke="#111827" stroke-width="3.5" marker-end="url(#hk)"/>
  <text x="300" y="244" font-size="16" fill="#111827" font-weight="700">A</text>
  <line x1="60" y1="250" x2="186" y2="144" stroke="#7c3aed" stroke-width="3.5" marker-end="url(#hp)"/>
  <text x="170" y="130" font-size="16" fill="#7c3aed" font-weight="700">B</text>
  <path d="M 100 250 A 40 40 0 0 0 91 225" fill="none" stroke="#374151" stroke-width="2"/>
  <text x="104" y="236" font-size="15" fill="#374151">θ</text>
  <rect x="180" y="240" width="10" height="10" fill="none" stroke="#6b7280" stroke-width="1.2"/>
  <text x="20" y="325" font-size="15" fill="#111827">A · B = A B cos θ</text>
  <text x="20" y="348" font-size="15" fill="#111827">= A × (projection of B on A)</text>
  <text x="20" y="376" font-size="13" fill="#4b5563">In components: A<tspan font-size="10" dy="4">x</tspan><tspan dy="-4">B</tspan><tspan font-size="10" dy="4">x</tspan><tspan dy="-4"> + A</tspan><tspan font-size="10" dy="4">y</tspan><tspan dy="-4">B</tspan><tspan font-size="10" dy="4">y</tspan><tspan dy="-4"> + A</tspan><tspan font-size="10" dy="4">z</tspan><tspan dy="-4">B</tspan><tspan font-size="10" dy="4">z</tspan></text>

  <!-- Right: sign cases -->
  <text x="350" y="36" font-size="15" font-weight="600" fill="#111827">The sign depends on θ</text>
  <line x1="380" y1="120" x2="466" y2="120" stroke="#111827" stroke-width="3" marker-end="url(#hk)"/>
  <line x1="380" y1="120" x2="423" y2="69" stroke="#7c3aed" stroke-width="3" marker-end="url(#hp)"/>
  <text x="500" y="92" font-size="14" fill="#111827" font-weight="600">θ &lt; 90°</text>
  <text x="500" y="114" font-size="14" fill="#16a34a" font-weight="600">A · B &gt; 0</text>

  <line x1="380" y1="230" x2="466" y2="230" stroke="#111827" stroke-width="3" marker-end="url(#hk)"/>
  <line x1="380" y1="230" x2="380" y2="164" stroke="#7c3aed" stroke-width="3" marker-end="url(#hp)"/>
  <rect x="380" y="220" width="10" height="10" fill="none" stroke="#6b7280" stroke-width="1.2"/>
  <text x="500" y="202" font-size="14" fill="#111827" font-weight="600">θ = 90°</text>
  <text x="500" y="224" font-size="14" fill="#4b5563" font-weight="600">A · B = 0</text>

  <line x1="440" y1="340" x2="526" y2="340" stroke="#111827" stroke-width="3" marker-end="url(#hk)"/>
  <line x1="440" y1="340" x2="389" y2="297" stroke="#7c3aed" stroke-width="3" marker-end="url(#hp)"/>
  <text x="540" y="304" font-size="14" fill="#111827" font-weight="600">θ &gt; 90°</text>
  <text x="540" y="326" font-size="14" fill="#dc2626" font-weight="600">A · B &lt; 0</text>
</svg>
