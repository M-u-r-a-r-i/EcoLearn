# EcoLearn — curriculum spine for CBSE/ISC Physics, Class 11 and Class 12.
#
# This file is the source of truth for what the platform teaches and in what
# order: Subject -> Unit -> Chapter -> Concept. The loader fills in the parent
# ids (subject_id, unit_id, chapter_id) and stamps each unit's `grade` onto its
# chapters and concepts, so authors don't repeat them on every concept.
#
# Structure follows the NCERT rationalised textbooks / CBSE 2025-26
# syllabus: 14 chapters per class, plus the ISC-only Communication Systems
# chapter (29 in total). Verified against the official
# CBSE 2025-26 syllabus. Each concept lists the exam `boards` that teach it
# (default: cbse + isc). ISC-only concepts say `boards: [isc]`; enrichment
# beyond both syllabuses says `boards: []` and explains why in `syllabus_note`.
#
# RULES (the loader enforces the first three and fails loudly):
#   1. Ids are unique across the WHOLE subject, per kind — lessons are stored
#      as files keyed on concept id, so a duplicate would overwrite on disk.
#   2. `order` is GLOBAL across the subject, not per chapter. Convention:
#      chapter_seq * 1000 + position * 10  (2030 = chapter 2, 3rd concept).
#      The gaps leave room to insert concepts without renumbering.
#   3. A concept's prerequisites must all have a smaller `order`.
#   4. NEVER rename an existing id. Lesson filenames, student progress rows and
#      tests are keyed on them; a rename silently orphans all three.
#   5. Unknown keys are rejected, so a typo like `prerequisite:` fails loudly.

subject:
  id: physics
  name: Physics
  description: >-
    CBSE/ISC Physics for Class 11 and Class 12 — 28 chapters from Units and
    Measurement to Semiconductor Electronics, aligned to the NCERT rationalised
    textbooks.
  units:

    # ======================================================================
    # CLASS 11
    # ======================================================================

    - id: measurement
      name: Physical World and Measurement
      grade: 11
      chapters:
        - id: units_measurement
          name: Units and Measurement
          domain: general
          concepts:
            - id: si_units
              name: SI base and derived units
              prerequisites: []
              learning_objective: "Identify the seven SI base units and express a derived unit such as the newton or joule in terms of base units."
              bloom_target: understand
              order: 1010
            - id: significant_figures
              name: Significant figures
              prerequisites: [si_units]
              learning_objective: "Count the significant figures in a measured value and explain what they say about the precision of the measurement."
              bloom_target: understand
              order: 1020
            - id: significant_figures_arithmetic
              name: Rounding and arithmetic with significant figures
              prerequisites: [significant_figures]
              learning_objective: "Round results and report sums, differences, products and quotients to the correct number of significant figures."
              bloom_target: apply
              order: 1030
            - id: measurement_uncertainty
              name: Errors and uncertainty in measurement
              prerequisites: [significant_figures]
              learning_objective: "Estimate the absolute, relative and percentage error in a measurement and combine errors when results are added, multiplied or raised to a power."
              bloom_target: apply
              order: 1035
            - id: dimensional_formulae
              name: Dimensions and dimensional formulae
              prerequisites: [si_units]
              learning_objective: "Write the dimensional formula of a physical quantity such as velocity, force or energy in terms of M, L and T."
              bloom_target: understand
              order: 1040
            - id: dimensional_consistency
              name: Checking equations with dimensions
              prerequisites: [dimensional_formulae]
              learning_objective: "Use the principle of homogeneity to test whether a physical equation is dimensionally consistent."
              bloom_target: apply
              order: 1050
            - id: unit_conversion
              name: Converting units using dimensions
              prerequisites: [dimensional_formulae]
              learning_objective: "Convert a physical quantity from one system of units to another using its dimensional formula."
              bloom_target: apply
              order: 1060
            - id: dimensional_derivation
              name: Deriving relations with dimensional analysis
              prerequisites: [dimensional_consistency]
              learning_objective: "Derive the form of a physical relation (such as the period of a pendulum) by dimensional analysis and state the method's limitations."
              bloom_target: analyze
              order: 1070

    - id: kinematics
      name: Kinematics
      grade: 11
      chapters:
        - id: motion_straight_line
          name: Motion in a Straight Line
          domain: mechanics
          concepts:

            - id: position
              name: Position
              prerequisites: []
              learning_objective: >-
                Describe the location of an object along a line using a chosen
                origin and a chosen positive direction.
              bloom_target: understand
              order: 2010

            - id: distance
              name: Distance
              prerequisites: [position]
              learning_objective: >-
                Recognise distance as a non-negative scalar equal to the total
                length of the path travelled, independent of direction.
              bloom_target: understand
              order: 2020

            - id: displacement
              name: Displacement
              prerequisites: [position]
              learning_objective: >-
                Distinguish displacement as a vector pointing from the initial
                position to the final position, with sign in one dimension.
              bloom_target: understand
              order: 2030

            - id: speed
              name: Speed
              prerequisites: [distance]
              learning_objective: >-
                Compute average speed as total distance over total time and
                explain why speed cannot be negative.
              bloom_target: understand
              order: 2040

            - id: velocity
              name: Velocity
              prerequisites: [displacement, speed]
              learning_objective: >-
                Define velocity as the rate of change of displacement and
                contrast it with speed using a concrete example.
              bloom_target: understand
              order: 2050

            - id: average_vs_instantaneous
              name: Average vs instantaneous velocity
              prerequisites: [velocity]
              learning_objective: >-
                Compute average velocity from two endpoints and approximate
                instantaneous velocity as the limit over a vanishingly small
                time interval.
              bloom_target: apply
              order: 2060

            - id: acceleration
              name: Acceleration
              prerequisites: [velocity]
              learning_objective: >-
                Define acceleration as the rate of change of velocity and read
                its sign and magnitude off a velocity-time graph.
              bloom_target: understand
              order: 2070

            - id: motion_graphs
              name: Position-time and velocity-time graphs
              prerequisites: [velocity, acceleration]
              learning_objective: "Read velocity from the slope of a position-time graph, and acceleration and displacement from the slope and area of a velocity-time graph."
              bloom_target: apply
              order: 2073

            - id: calculus_for_motion
              name: Differentiation and integration for describing motion
              prerequisites: [average_vs_instantaneous, acceleration]
              learning_objective: "Use derivatives to get velocity and acceleration from position as a function of time, and integrals to recover displacement from velocity."
              bloom_target: apply
              order: 2076

            - id: equations_of_motion
              name: Equations of motion (uniform acceleration)
              prerequisites: [displacement, velocity, acceleration]
              learning_objective: >-
                Apply v = u + at, s = ut + (1/2) a t^2, and v^2 = u^2 + 2 a s to
                solve one-dimensional uniformly accelerated motion problems.
              bloom_target: apply
              order: 2080

            - id: relative_velocity_1d
              name: Relative velocity (one dimension)
              prerequisites: [velocity]
              learning_objective: >-
                Compute the velocity of one object as observed from another's
                frame in one dimension using v_AB = v_A - v_B with signed values.
              bloom_target: apply
              order: 2090

        # Several prerequisites point back into Motion in a Straight Line — the
        # loader resolves prerequisites subject-wide, so cross-chapter links work.
        - id: motion_plane
          name: Motion in a Plane
          domain: mechanics
          concepts:

            - id: scalars_and_vectors
              name: Scalars and vectors
              prerequisites: [distance, displacement]
              learning_objective: >-
                Classify physical quantities as scalars or vectors, using
                distance (scalar) and displacement (vector) as the anchoring
                contrast.
              bloom_target: understand
              order: 3010

            - id: vector_addition
              name: Vector addition
              prerequisites: [scalars_and_vectors]
              learning_objective: >-
                Add two vectors using the triangle and parallelogram rules and
                explain why the resultant depends on their directions.
              bloom_target: apply
              order: 3020

            - id: vector_components
              name: Resolving vectors into components
              prerequisites: [vector_addition]
              learning_objective: >-
                Resolve a vector into perpendicular x and y components and
                reconstruct the vector from its components.
              bloom_target: apply
              order: 3030

            - id: unit_vectors
              name: Unit vectors and vector notation
              prerequisites: [vector_components]
              learning_objective: "Write a vector as a_x i-hat + a_y j-hat and use that notation to add, subtract and scale vectors."
              bloom_target: apply
              order: 3035

            - id: relative_velocity_2d
              name: Relative velocity (two dimensions)
              prerequisites: [vector_addition, relative_velocity_1d]
              learning_objective: >-
                Compute the relative velocity of one object with respect to
                another in a plane by subtracting velocity vectors.
              bloom_target: apply
              order: 3040

            - id: motion_plane_constant_acceleration
              name: Motion in a plane with constant acceleration
              prerequisites: [unit_vectors, equations_of_motion]
              learning_objective: "Apply r = r0 + v0 t + (1/2) a t^2 and v = v0 + a t in vector form, treating the x and y motions independently."
              bloom_target: apply
              order: 3045

            - id: projectile_motion
              name: Projectile motion
              prerequisites: [vector_components, equations_of_motion]
              learning_objective: >-
                Treat projectile motion as independent horizontal (constant
                velocity) and vertical (uniform acceleration) motions.
              bloom_target: apply
              order: 3050

            - id: projectile_trajectory
              name: Range, height and trajectory
              prerequisites: [projectile_motion]
              learning_objective: >-
                Derive time of flight, maximum height and horizontal range for a
                projectile and identify the launch angle for maximum range.
              bloom_target: analyze
              order: 3060

            - id: uniform_circular_motion
              name: Uniform circular motion
              prerequisites: [vector_components, acceleration]
              learning_objective: >-
                Describe uniform circular motion and explain why velocity changes
                direction even when speed is constant.
              bloom_target: understand
              order: 3070

            - id: centripetal_acceleration
              name: Centripetal acceleration
              prerequisites: [uniform_circular_motion]
              learning_objective: >-
                Apply a = v^2 / r to compute the centripetal acceleration of an
                object in uniform circular motion and state its direction.
              bloom_target: apply
              order: 3080

    - id: dynamics
      name: Laws of Motion
      grade: 11
      chapters:
        - id: laws_of_motion
          name: Laws of Motion
          domain: mechanics
          concepts:
            - id: inertia_first_law
              name: Inertia and Newton's first law
              prerequisites: [velocity]
              learning_objective: "Explain inertia and use Newton's first law to predict the motion of an object when the net force on it is zero."
              bloom_target: understand
              order: 4010
            - id: momentum
              name: Linear momentum
              prerequisites: [velocity]
              learning_objective: "Calculate linear momentum as p = mv and explain why it is a vector quantity."
              bloom_target: understand
              order: 4020
            - id: second_law
              name: Newton's second law
              prerequisites: [momentum, acceleration]
              learning_objective: "Apply F = dp/dt, and F = ma for constant mass, to relate the net force on a body to its acceleration."
              bloom_target: apply
              order: 4030
            - id: impulse
              name: Impulse
              prerequisites: [second_law]
              learning_objective: "Calculate impulse as force times time, or change in momentum, and explain why extending the collision time reduces the force."
              bloom_target: apply
              order: 4040
            - id: third_law
              name: Newton's third law
              prerequisites: [second_law]
              learning_objective: "Identify action-reaction pairs and explain why they act on different bodies and never cancel each other."
              bloom_target: understand
              order: 4050
            - id: momentum_conservation
              name: Conservation of linear momentum
              prerequisites: [third_law, impulse]
              learning_objective: "Apply conservation of linear momentum to recoil, explosions and collisions of an isolated system."
              bloom_target: apply
              order: 4060
            - id: free_body_diagrams
              name: Free-body diagrams and equilibrium
              prerequisites: [third_law, vector_components]
              learning_objective: "Draw a free-body diagram for a body and use the equilibrium of concurrent forces to find unknown forces."
              bloom_target: apply
              order: 4070
            - id: connected_bodies
              name: Connected bodies and pulleys
              prerequisites: [free_body_diagrams]
              learning_objective: "Solve for the acceleration and tensions in a system of bodies connected by strings and pulleys."
              bloom_target: apply
              order: 4080
            - id: friction
              name: Friction
              prerequisites: [free_body_diagrams]
              learning_objective: "Distinguish static, kinetic and rolling friction, apply f = mu N to decide whether a body slides, and explain how lubrication reduces friction."
              bloom_target: apply
              order: 4090
            - id: circular_motion_dynamics
              name: Dynamics of circular motion
              prerequisites: [friction, centripetal_acceleration]
              learning_objective: "Identify the force that supplies the centripetal force and find the maximum safe speed of a vehicle on a level or banked road."
              bloom_target: analyze
              order: 4100

    - id: work_energy
      name: Work, Energy and Power
      grade: 11
      chapters:
        - id: work_energy_power
          name: Work, Energy and Power
          domain: mechanics
          concepts:
            - id: dot_product
              name: Scalar (dot) product
              prerequisites: [vector_components]
              learning_objective: "Compute the scalar product of two vectors from their magnitudes and angle, or from their components."
              bloom_target: apply
              order: 5010
            - id: work_constant_force
              name: Work done by a constant force
              prerequisites: [dot_product, second_law]
              learning_objective: "Calculate the work done by a constant force as W = F.d and explain when work is positive, negative or zero."
              bloom_target: apply
              order: 5020
            - id: work_variable_force
              name: Work done by a variable force
              prerequisites: [work_constant_force]
              learning_objective: "Find the work done by a variable force as the area under its force-displacement graph."
              bloom_target: apply
              order: 5030
            - id: kinetic_energy
              name: Kinetic energy
              prerequisites: [work_constant_force]
              learning_objective: "Calculate kinetic energy as (1/2) m v^2 and relate it to the work needed to bring a body to that speed."
              bloom_target: understand
              order: 5040
            - id: work_energy_theorem
              name: Work-energy theorem
              prerequisites: [kinetic_energy, work_variable_force]
              learning_objective: "Apply the work-energy theorem to find a body's change in speed from the net work done on it."
              bloom_target: apply
              order: 5050
            - id: potential_energy_conservative_forces
              name: Potential energy and conservative forces
              prerequisites: [work_energy_theorem]
              learning_objective: "Distinguish conservative from non-conservative forces and calculate gravitational potential energy near the Earth as mgh."
              bloom_target: understand
              order: 5060
            - id: spring_potential_energy
              name: Potential energy of a spring
              prerequisites: [potential_energy_conservative_forces, work_variable_force]
              learning_objective: "Calculate the potential energy stored in a spring as (1/2) k x^2 and use it in energy problems."
              bloom_target: apply
              order: 5070
            - id: mechanical_energy_conservation
              name: Conservation of mechanical energy
              prerequisites: [potential_energy_conservative_forces]
              learning_objective: "Apply conservation of mechanical energy to find speeds and heights when only conservative forces do work."
              bloom_target: apply
              order: 5080
            - id: vertical_circle_motion
              name: Motion in a vertical circle
              prerequisites: [mechanical_energy_conservation, circular_motion_dynamics]
              learning_objective: "Use energy conservation and the centripetal force condition to find the minimum speeds needed at the top and bottom of a vertical circle."
              bloom_target: analyze
              order: 5085
            - id: power
              name: Power
              prerequisites: [work_constant_force]
              learning_objective: "Calculate average and instantaneous power, including P = F.v, and convert between watts and horsepower."
              bloom_target: apply
              order: 5090
            - id: collisions
              name: Elastic and inelastic collisions
              prerequisites: [momentum_conservation, mechanical_energy_conservation]
              learning_objective: "Classify collisions as elastic or inelastic, find final velocities in one dimension, and apply momentum conservation to collisions in two dimensions."
              bloom_target: analyze
              order: 5100

    - id: rigid_body
      name: Motion of System of Particles and Rigid Body
      grade: 11
      chapters:
        - id: rotational_motion
          name: System of Particles and Rotational Motion
          domain: mechanics
          concepts:
            - id: centre_of_mass
              name: Centre of mass
              prerequisites: [vector_components]
              learning_objective: "Locate the centre of mass of a two-particle system and of symmetric bodies such as a uniform rod."
              bloom_target: apply
              order: 6010
            - id: motion_of_centre_of_mass
              name: Motion of the centre of mass
              prerequisites: [centre_of_mass, momentum_conservation]
              learning_objective: "Explain why the centre of mass of a system moves as if all external forces acted on a single particle of the total mass."
              bloom_target: understand
              order: 6020
            - id: cross_product
              name: Vector (cross) product
              prerequisites: [vector_components]
              learning_objective: "Compute the magnitude and direction of a vector product using the right-hand rule."
              bloom_target: apply
              order: 6030
            - id: rotational_kinematics
              name: Angular velocity and angular acceleration
              prerequisites: [uniform_circular_motion]
              learning_objective: "Relate angular displacement, velocity and acceleration to linear motion and apply the equations of uniformly accelerated rotation."
              bloom_target: apply
              order: 6040
            - id: torque
              name: Torque
              prerequisites: [cross_product, second_law]
              learning_objective: "Calculate torque as r x F and explain why the same force can produce different turning effects."
              bloom_target: apply
              order: 6050
            - id: angular_momentum
              name: Angular momentum
              prerequisites: [torque, momentum]
              learning_objective: "Calculate the angular momentum of a particle as r x p and relate its rate of change to torque."
              bloom_target: understand
              order: 6060
            - id: rigid_body_equilibrium
              name: Equilibrium of a rigid body
              prerequisites: [torque, free_body_diagrams]
              learning_objective: "Apply the conditions of zero net force and zero net torque to solve rigid-body equilibrium problems such as levers and beams."
              bloom_target: apply
              order: 6070
            - id: moment_of_inertia
              name: Moment of inertia and radius of gyration
              prerequisites: [centre_of_mass, rotational_kinematics]
              learning_objective: "Explain moment of inertia as rotational inertia, use standard values for simple bodies, and calculate the radius of gyration."
              bloom_target: understand
              order: 6080
            - id: axis_theorems
              name: Parallel and perpendicular axes theorems
              prerequisites: [moment_of_inertia]
              learning_objective: "Apply the parallel and perpendicular axes theorems to find moments of inertia about new axes."
              bloom_target: apply
              order: 6085
              boards: [isc]
              syllabus_note: "ISC only — not in CBSE 2025-26. Verify against the official CISCE syllabus."
            - id: rotational_dynamics
              name: Dynamics of rotation
              prerequisites: [moment_of_inertia, torque, kinetic_energy]
              learning_objective: "Apply torque = I alpha, rotational kinetic energy and rotational power, comparing each with its linear counterpart."
              bloom_target: apply
              order: 6090
            - id: angular_momentum_conservation
              name: Conservation of angular momentum
              prerequisites: [angular_momentum, rotational_dynamics]
              learning_objective: "Apply conservation of angular momentum to explain why a spinning body speeds up when its moment of inertia decreases."
              bloom_target: apply
              order: 6100

    - id: gravity
      name: Gravitation
      grade: 11
      chapters:
        - id: gravitation
          name: Gravitation
          domain: mechanics
          concepts:
            - id: kepler_laws
              name: Kepler's laws of planetary motion
              prerequisites: [angular_momentum_conservation]
              learning_objective: "State Kepler's three laws and connect the law of areas to conservation of angular momentum."
              bloom_target: understand
              order: 7010
            - id: universal_gravitation
              name: Newton's law of universal gravitation
              prerequisites: [second_law]
              learning_objective: "Apply F = G m1 m2 / r^2 to calculate the gravitational force between two masses."
              bloom_target: apply
              order: 7020
            - id: acceleration_due_to_gravity
              name: Acceleration due to gravity and its variation
              prerequisites: [universal_gravitation]
              learning_objective: "Derive g from the law of gravitation and calculate how it changes with height above and depth below the Earth's surface."
              bloom_target: apply
              order: 7030
            - id: gravitational_potential_energy
              name: Gravitational potential energy and potential
              prerequisites: [universal_gravitation, potential_energy_conservative_forces]
              learning_objective: "Calculate gravitational potential energy as -G M m / r and explain why mgh is only a near-surface approximation."
              bloom_target: apply
              order: 7040
            - id: escape_speed
              name: Escape speed
              prerequisites: [gravitational_potential_energy, mechanical_energy_conservation]
              learning_objective: "Derive and calculate the escape speed from a planet using conservation of energy."
              bloom_target: apply
              order: 7050
            - id: orbital_velocity
              name: Orbital velocity of a satellite
              prerequisites: [universal_gravitation, circular_motion_dynamics]
              learning_objective: "Calculate the orbital speed and period of a satellite in a circular orbit."
              bloom_target: apply
              order: 7060
            - id: geostationary_satellites
              name: Geostationary satellites
              prerequisites: [orbital_velocity]
              learning_objective: "Calculate the orbital radius of a geostationary satellite and explain why it must orbit above the equator."
              bloom_target: apply
              order: 7065
              boards: [isc]
              syllabus_note: "ISC only — not in CBSE 2025-26. Verify against the official CISCE syllabus."
            - id: satellite_energy
              name: Energy of an orbiting satellite
              prerequisites: [orbital_velocity, gravitational_potential_energy]
              learning_objective: "Calculate the kinetic, potential and total energy of a satellite and explain why the total energy is negative."
              bloom_target: analyze
              order: 7070

    - id: bulk_matter
      name: Properties of Bulk Matter
      grade: 11
      chapters:
        - id: solids_mechanical
          name: Mechanical Properties of Solids
          domain: mechanics
          concepts:
            - id: stress_strain
              name: Stress and strain
              prerequisites: [second_law]
              learning_objective: "Define stress and strain and distinguish tensile, compressive, shearing and hydraulic (volume) stress."
              bloom_target: understand
              order: 8010
            - id: hookes_law
              name: Hooke's law and the stress-strain curve
              prerequisites: [stress_strain]
              learning_objective: "State Hooke's law and identify the proportional limit, elastic limit, yield point and fracture point on a stress-strain curve."
              bloom_target: understand
              order: 8020
            - id: youngs_modulus
              name: Young's modulus
              prerequisites: [hookes_law]
              learning_objective: "Calculate Young's modulus and use it to find the extension of a wire under load."
              bloom_target: apply
              order: 8030
            - id: shear_modulus
              name: Shear modulus
              prerequisites: [youngs_modulus]
              learning_objective: "Explain shear modulus (modulus of rigidity) qualitatively and compare it with Young's modulus for the same material."
              bloom_target: understand
              order: 8040
            - id: bulk_modulus
              name: Bulk modulus and compressibility
              prerequisites: [youngs_modulus]
              learning_objective: "Calculate bulk modulus and compressibility and explain why liquids are far less compressible than gases."
              bloom_target: apply
              order: 8050
            - id: poissons_ratio
              name: Poisson's ratio
              prerequisites: [youngs_modulus]
              learning_objective: "Define Poisson's ratio as lateral strain over longitudinal strain and interpret its value for common materials."
              bloom_target: understand
              order: 8060
            - id: elastic_potential_energy
              name: Elastic potential energy in a stretched wire
              prerequisites: [youngs_modulus, work_variable_force]
              learning_objective: "Calculate the elastic energy stored per unit volume of a stretched wire as (1/2) stress x strain."
              bloom_target: apply
              order: 8065
            - id: elasticity_applications
              name: Applications of elasticity
              prerequisites: [youngs_modulus]
              learning_objective: "Use elastic properties to explain design choices such as crane rope thickness and I-shaped beams."
              bloom_target: apply
              order: 8070
        - id: fluids_mechanical
          name: Mechanical Properties of Fluids
          domain: mechanics
          concepts:
            - id: fluid_pressure
              name: Pressure in a fluid
              prerequisites: [second_law]
              learning_objective: "Calculate the pressure at a depth in a fluid using P = P0 + rho g h."
              bloom_target: apply
              order: 9010
            - id: pascals_law
              name: Pascal's law and hydraulic machines
              prerequisites: [fluid_pressure]
              learning_objective: "Apply Pascal's law to explain and calculate force multiplication in a hydraulic lift or brake."
              bloom_target: apply
              order: 9020
            - id: atmospheric_gauge_pressure
              name: Atmospheric and gauge pressure
              prerequisites: [fluid_pressure]
              learning_objective: "Distinguish absolute, atmospheric and gauge pressure and explain how a barometer and a manometer work."
              bloom_target: understand
              order: 9030
            - id: streamline_flow
              name: Streamline flow and the equation of continuity
              prerequisites: [fluid_pressure, velocity]
              learning_objective: "Distinguish streamline from turbulent flow and apply A1 v1 = A2 v2 to find fluid speeds in a pipe."
              bloom_target: apply
              order: 9040
            - id: bernoullis_principle
              name: Bernoulli's principle
              prerequisites: [streamline_flow, mechanical_energy_conservation]
              learning_objective: "Apply Bernoulli's equation to explain lift, the Venturi meter and the speed of efflux from a tank."
              bloom_target: apply
              order: 9050
            - id: viscosity
              name: Viscosity
              prerequisites: [streamline_flow]
              learning_objective: "Explain viscosity as internal friction between fluid layers and describe how it depends on temperature."
              bloom_target: understand
              order: 9060
            - id: stokes_law_terminal_velocity
              name: Stokes' law and terminal velocity
              prerequisites: [viscosity, free_body_diagrams]
              learning_objective: "Apply Stokes' law to find the terminal velocity of a small sphere falling through a viscous fluid."
              bloom_target: apply
              order: 9070
            - id: surface_tension
              name: Surface tension and surface energy
              prerequisites: [work_constant_force]
